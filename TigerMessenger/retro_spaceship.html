<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mœbius 复古玻璃飞艇 · Retro Spaceship</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b14; }
  #app { width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 16px; bottom: 14px;
    font: 13px/1.5 "Courier New", monospace; color: #f4d08b;
    opacity: 0.75; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · Mœbius 风格半透明玻璃飞艇</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- 渲染器 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("app").appendChild(renderer.domElement);

// ---------- 场景 / 相机 ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14111f);
scene.fog = new THREE.FogExp2(0x14111f, 0.012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9, 4, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.5, 0);
controls.minDistance = 6;
controls.maxDistance = 40;

// ---------- 光照（强环境光保证半透明外壳通透 + 方向光玻璃高光） ----------
scene.add(new THREE.AmbientLight(0xfff2d6, 1.4));

const keyLight = new THREE.DirectionalLight(0xffe6b0, 2.2);
keyLight.position.set(6, 9, 8);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9fd8ff, 0.9);
rimLight.position.set(-7, 3, -6);
scene.add(rimLight);

// 暖色补光，强化琥珀外壳的复古氛围
const fillLight = new THREE.PointLight(0xffb066, 0.8, 60, 2);
fillLight.position.set(0, -4, 6);
scene.add(fillLight);

// 背景星点（淡淡的复古氛围）
(function addStars() {
  const g = new THREE.BufferGeometry();
  const n = 600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 60 + Math.random() * 60;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(p) * Math.cos(t);
    pos[i * 3 + 1] = r * Math.cos(p);
    pos[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
  }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0x9c8fb5, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.6 });
  scene.add(new THREE.Points(g, m));
})();

// ============================================================
//  createRetroSpaceship() — 墨比斯风格半透明玻璃飞艇
//  本地坐标约定：机身沿 +X 轴（机头朝 +X），整体以原点居中
// ============================================================
function createRetroSpaceship() {
  const ship = new THREE.Group();

  // ---------- 1. 外层玻璃外壳 (LatheGeometry 流线旋转体) ----------
  // 剖面：前端尖细 -> 中段膨胀 -> 尾部收窄（像拉长玻璃灯泡/飞艇）
  const profile = [];
  const LEN = 7.0;       // 外壳总长
  const MIDR = 1.35;     // 中段最大半径
  const seg = 28;
  for (let i = 0; i <= seg; i++) {
    const u = i / seg;             // 0..1 从尾(0)到头(1)
    const x = (u - 0.5) * LEN;     // -3.5 .. 3.5
    // 钟形轮廓：尾窄、中鼓、头尖
    const body =
      Math.sin(Math.PI * (u * 0.92 + 0.04)) * MIDR *  // 主体鼓肚
      (0.55 + 0.45 * Math.sin(Math.PI * u));          // 头尾额外收窄
    profile.push(new THREE.Vector2(Math.max(body, 0.02), x));
  }
  // LatheGeometry 以 Y 为旋转轴，这里旋转后把轴转到 X 方向
  const hullGeo = new THREE.LatheGeometry(profile, 48);
  hullGeo.rotateZ(-Math.PI / 2); // 旋转轴 Y -> X，机头朝 +X

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xf4d08b,        // 淡琥珀黄/浅金黄
    transparent: true,
    opacity: 0.35,
    roughness: 0.1,
    metalness: 0.1,
    transmission: 0.8,      // 物理透光
    ior: 1.4,               // 玻璃折射率
    thickness: 0.6,         // 折射厚度感
    side: THREE.DoubleSide,
    depthWrite: false,
    clearcoat: 0.6,
    clearcoatRoughness: 0.2,
  });
  const hull = new THREE.Mesh(hullGeo, glassMat);
  ship.add(hull);

  // ---------- 2. 机身结构环 (3-4 个黑色细圆环，沿外壳穿插) ----------
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.55, metalness: 0.7 });
  const ringXs = [-2.4, -0.6, 1.2, 2.6];
  ringXs.forEach((rx) => {
    // 用剖面函数在对应 u 处取半径
    const u = rx / LEN + 0.5;
    const bodyR = Math.sin(Math.PI * (u * 0.92 + 0.04)) * MIDR * (0.55 + 0.45 * Math.sin(Math.PI * u));
    const r = Math.max(bodyR, 0.12) + 0.05;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.06, 12, 40), ringMat);
    ring.rotation.y = Math.PI / 2; // 环面法线朝 X
    ring.position.x = rx;
    ship.add(ring);
  });

  // ---------- 3. 内部核心引擎与能量管 ----------
  // 3a. 前段：发光橘红能量球
  const coreMat = new THREE.MeshStandardMaterial({
    color: 0xff7a2a,
    emissive: 0xff6600,
    emissiveIntensity: 2.0,
    roughness: 0.4,
    metalness: 0.0,
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 24), coreMat);
  core.scale.set(1.2, 1.0, 1.0);
  core.position.x = 1.3;
  ship.add(core);

  // 核心点光源（让内核真正"点亮"外壳）
  const coreLight = new THREE.PointLight(0xff7a2a, 2.2, 9, 2);
  coreLight.position.set(1.3, 0, 0);
  ship.add(coreLight);

  // 3b. 中后段：拧麻花状能量管（TubeGeometry 沿一条扭曲曲线）
  const tubePts = [];
  const tubeLen = 4.2;
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    const x = 1.2 - t * tubeLen;              // 从核心向后
    const ang = t * Math.PI * 5.0;            // 螺旋扭转
    const rad = 0.18 * (1 - t * 0.55);        // 向后收窄
    tubePts.push(new THREE.Vector3(x, Math.sin(ang) * rad, Math.cos(ang) * rad));
  }
  const tubeCurve = new THREE.CatmullRomCurve3(tubePts);
  // 渐变色：橘黄 -> 浅绿/浅黄
  const tubeMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    emissive: 0x88ff99,
    emissiveIntensity: 0.5,
    roughness: 0.5,
    metalness: 0.1,
  });
  const tubeGeo = new THREE.TubeGeometry(tubeCurve, 80, 0.16, 12, false);
  // 写入顶点色渐变
  {
    const pos = tubeGeo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cFront = new THREE.Color(0xffd24a);
    const cBack = new THREE.Color(0xa8ff9a);
    for (let i = 0; i < pos.count; i++) {
      const t = i / (pos.count - 1);
      const c = cFront.clone().lerp(cBack, t);
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    tubeGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  }
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  ship.add(tube);

  // 3c. 尾部喷口：灰黑机械喷罩
  const nozzleMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.45, metalness: 0.85 });
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.32, 0.9, 24, 1, true), nozzleMat);
  nozzle.rotation.z = Math.PI / 2;
  nozzle.position.x = -3.2;
  ship.add(nozzle);
  const nozzleRing = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.07, 10, 24), nozzleMat);
  nozzleRing.rotation.y = Math.PI / 2;
  nozzleRing.position.x = -2.75;
  ship.add(nozzleRing);

  // ---------- 4. 头部鼻锥 (灰白锥 + 黑色圈纹 + 金属探针) ----------
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xd9d4c8, roughness: 0.6, metalness: 0.2 });
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.6, 28), noseMat);
  nose.rotation.z = -Math.PI / 2;  // 尖朝 +X
  nose.position.x = 3.9;
  ship.add(nose);
  // 黑色圈纹
  const noseBandMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.4 });
  [3.5, 3.9, 4.3].forEach((bx) => {
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.40, 0.035, 8, 24), noseBandMat);
    band.rotation.y = Math.PI / 2;
    band.position.x = bx;
    ship.add(band);
  });
  // 金属探针
  const probe = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.05, 0.7, 8),
    new THREE.MeshStandardMaterial({ color: 0xbfc4cc, roughness: 0.3, metalness: 0.9 })
  );
  probe.rotation.z = -Math.PI / 2;
  probe.position.x = 5.2;
  ship.add(probe);

  // ---------- 5. 尾翼 (3-4 片鱼鳍/飞艇尾翼，浅灰+棕相间条纹) ----------
  const finCount = 4;
  const finGray = new THREE.MeshStandardMaterial({ color: 0xcabfa8, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide });
  const finBrown = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.75, metalness: 0.1, side: THREE.DoubleSide });
  for (let i = 0; i < finCount; i++) {
    const a = (i / finCount) * Math.PI * 2;
    const fin = new THREE.Group();
    // 鳍片：用一个扁平 Box 沿 Y 拉伸并后掠
    const finShape = new THREE.Shape();
    finShape.moveTo(0, 0);
    finShape.lineTo(0.9, 0.1);
    finShape.lineTo(0.7, 1.5);
    finShape.lineTo(0.15, 1.6);
    finShape.lineTo(0, 0.9);
    finShape.closePath();
    const finGeo = new THREE.ShapeGeometry(finShape);
    // 灰底鳍
    const finMesh = new THREE.Mesh(finGeo, finGray);
    finMesh.rotation.x = -Math.PI / 2; // 立起来
    fin.add(finMesh);
    // 棕色条纹（小条覆盖）
    const stripeShape = new THREE.Shape();
    stripeShape.moveTo(0.1, 0.2);
    stripeShape.lineTo(0.7, 0.3);
    stripeShape.lineTo(0.55, 0.9);
    stripeShape.lineTo(0.12, 0.85);
    stripeShape.closePath();
    const stripe = new THREE.Mesh(new THREE.ShapeGeometry(stripeShape), finBrown);
    stripe.rotation.x = -Math.PI / 2;
    stripe.position.y = 0.002;
    fin.add(stripe);

    fin.scale.set(1, 1, 0.12);
    // 放置到尾部、绕 X 轴均布
    fin.position.set(-2.6, 0, 0);
    fin.rotation.x = a;          // 绕机身轴均布
    fin.rotation.z = Math.PI / 2; // 让鳍平面朝外
    fin.translateY(0.5);
    ship.add(fin);
  }

  // 让整船机头略抬，更有"飞行姿态"
  ship.rotation.z = 0.05;
  return ship;
}

// ---------- 放入场景 + 缓慢自转 ----------
const spaceship = createRetroSpaceship();
scene.add(spaceship);

// 地面参考圆盘（淡琥珀，衬托飞行感）
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0x1c1830, roughness: 0.9, metalness: 0.0 })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -4;
scene.add(disc);

// ---------- 动画循环 ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  spaceship.rotation.y = t * 0.25;          // 缓慢自旋展示外形
  spaceship.position.y = Math.sin(t * 0.8) * 0.25; // 轻微上下浮动
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------- 窗口自适应 ----------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
