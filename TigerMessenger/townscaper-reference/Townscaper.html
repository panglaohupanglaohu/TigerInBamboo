<!--
  Townscaper-like town builder — reconstruction from the WebGL build.
  Structure mirrors the shipped game's architecture (see README):
    Placemaker.GridGenerator  ->  src/grid.js   (hex lattice -> relaxed quads)
    Placemaker.Graphs.Graph   ->  src/town.js   (voxel columns, corner values, module choice)
    Placemaker.BigMeshMaster  ->  src/mesh.js   (one merged mesh, batched rebuild)
    Placemaker.AoBaker        ->  src/mesh.js   (baked vertex occlusion)
    Placemaker.TextSaveSystem ->  src/save.js   (bit-array -> char alphabet)
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Townscaper — REACode (standalone)</title>
<style>
:root {
  --ink: #12232e;
  --panel: rgba(255, 255, 255, 0.82);
  --panel-line: rgba(18, 35, 46, 0.09);
  --shadow: 0 6px 22px rgba(18, 35, 46, 0.16), 0 1px 2px rgba(18, 35, 46, 0.12);
  --accent: #e4573d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #7fb3c8;
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#view {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  touch-action: none;
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.panel {
  pointer-events: auto;
  background: var(--panel);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  box-shadow: var(--shadow);
}

/* ---------- palette ---------- */
#palette {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  padding: 8px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.swatch {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 2px solid rgba(255, 255, 255, 0.75);
  box-shadow: 0 1px 3px rgba(18, 35, 46, 0.22);
  cursor: pointer;
  padding: 0;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.swatch:hover { transform: scale(1.08); }

.swatch.active {
  border-color: var(--ink);
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(18, 35, 46, 0.18), 0 2px 6px rgba(18, 35, 46, 0.3);
}

/* ---------- tools ---------- */
#tools {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px;
}

.tool {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.12s ease, color 0.12s ease;
}

.tool:hover { background: rgba(18, 35, 46, 0.07); }
.tool.active { background: var(--ink); color: #fff; }
.tool:disabled { opacity: 0.32; cursor: default; background: transparent; }

.sep {
  width: 1px;
  height: 20px;
  background: var(--panel-line);
  margin: 0 3px;
}

/* ---------- top right ---------- */
#topright {
  position: absolute;
  right: 16px;
  top: 16px;
  display: flex;
  gap: 2px;
  padding: 6px;
}

#topright button {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  cursor: pointer;
}

#topright button:hover { background: rgba(18, 35, 46, 0.07); }

/* ---------- toast ---------- */
#toast {
  position: absolute;
  left: 50%;
  bottom: 34px;
  transform: translate(-50%, 12px);
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(18, 35, 46, 0.88);
  color: #fff;
  font-size: 12px;
  letter-spacing: 0.02em;
  opacity: 0;
  transition: opacity 0.22s ease, transform 0.22s ease;
}

#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- help ---------- */
#helpcard {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(430px, calc(100vw - 48px));
  padding: 22px 24px 20px;
  background: rgba(255, 255, 255, 0.94);
}

#helpcard.hidden { display: none; }

#helpcard h1 {
  margin: 0 0 14px;
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

#helpcard h1 span {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  vertical-align: middle;
  margin-left: 6px;
}

#helpcard p { margin: 0 0 10px; color: rgba(18, 35, 46, 0.76); }

#helpcard kbd {
  display: inline-block;
  min-width: 17px;
  padding: 1px 5px;
  border-radius: 5px;
  border: 1px solid rgba(18, 35, 46, 0.16);
  border-bottom-width: 2px;
  background: #fff;
  font: inherit;
  font-size: 11px;
  text-align: center;
}

#helpclose {
  margin-top: 6px;
  width: 100%;
  padding: 9px;
  border: 0;
  border-radius: 10px;
  background: var(--ink);
  color: #fff;
  font: inherit;
  cursor: pointer;
}

@media (max-width: 640px) {
  #palette { grid-template-columns: 1fr 1fr 1fr; }
  .swatch { width: 24px; height: 24px; }
}

</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="palette" class="panel" aria-label="palette"></div>

  <div id="tools" class="panel">
    <button class="tool" data-tool="build" title="建造 / Build (B)">▲</button>
    <button class="tool" data-tool="erase" title="拆除 / Erase (E)">▼</button>
    <button class="tool" data-tool="paint" title="刷色 / Paint (P)">■</button>
    <span class="sep"></span>
    <button class="tool" id="undo" title="撤销 / Undo (Z)">↶</button>
    <button class="tool" id="redo" title="重做 / Redo (Y)">↷</button>
  </div>

  <div id="topright" class="panel">
    <button id="palettestyle" title="切换配色 / Palette">◐</button>
    <button id="demo" title="生成示例城镇 / Demo town">◎</button>
    <button id="clear" title="清空 / Clear">✕</button>
    <button id="share" title="复制分享链接 / Copy link">⧉</button>
    <button id="help" title="帮助 / Help">?</button>
  </div>

  <div id="toast"></div>

  <div id="helpcard" class="panel hidden">
    <h1>Townscaper <span>REACode</span></h1>
    <p>左键拖动 = 建造，<b>右键点击 = 拆除单块</b>（掏空底部会自动长出木构支撑），右键拖动 = 旋转，中键拖动 = 平移，滚轮 = 缩放。</p>
    <p>快捷键：<kbd>B</kbd> 建造　<kbd>E</kbd> 拆除　<kbd>P</kbd> 刷色　<kbd>1</kbd>–<kbd>9</kbd> 选色　<kbd>Z</kbd> 撤销　<kbd>Y</kbd> 重做　<kbd>R</kbd> 示例　<kbd>C</kbd> 清空</p>
    <p>拖动同一处会连续升高；掏掉下方的方块，上面的建筑会由立柱、系梁和斜撑托住——塔楼就是这么吊起来的。</p>
    <button id="helpclose">知道了</button>
  </div>
</div>
