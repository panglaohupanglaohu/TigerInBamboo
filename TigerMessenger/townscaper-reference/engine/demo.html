<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REA Engine — 岛屿生成 / Island generator</title>
<style>
  :root { --ink:#12232e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#8fc0d0;
    font:13px/1.5 -apple-system, "PingFang SC", sans-serif; color:var(--ink); }
  #view { display:block; width:100%; height:100%; }
  .panel { position:fixed; background:rgba(255,255,255,.84); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.6); border-radius:12px; box-shadow:0 6px 22px rgba(18,35,46,.18); }
  #hud { left:16px; top:16px; padding:12px 14px; width:250px; }
  #hud h1 { margin:0 0 8px; font-size:14px; letter-spacing:.01em; }
  #hud p { margin:0 0 8px; color:rgba(18,35,46,.7); font-size:12px; }
  #hud button { width:100%; padding:8px; border:0; border-radius:8px; background:var(--ink);
    color:#fff; font:inherit; cursor:pointer; margin-top:4px; }
  #stats { margin-top:10px; font-size:11px; line-height:1.7; color:rgba(18,35,46,.75); }
  #stats b { color:var(--ink); }
  kbd { padding:1px 5px; border:1px solid rgba(18,35,46,.18); border-bottom-width:2px;
    border-radius:4px; background:#fff; font-size:11px; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="panel">
  <h1>岛屿引擎 <span style="font-size:10px;color:#c2452f;letter-spacing:.08em">ENGINE</span></h1>
  <p>噪声高度场 → 台地量化 → 材质分类 → 导航网格。<kbd>R</kbd> 换一座岛。</p>
  <button id="regen">重新生成</button>
  <div id="stats"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { buildIsland, buildIslandGeometry, findPath } from './islands.js';

const canvas = document.getElementById('view');
const statsEl = document.getElementById('stats');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 500);

scene.add(new THREE.AmbientLight(0xfffdf6, 0.95));
const hemi = new THREE.HemisphereLight(0xf4fbff, 0xd8ccb8, 1.35);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff6e8, 2.1);
sun.position.set(14, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const S = 14;
Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 1, far: 80 });
sun.shadow.bias = -0.0015;
scene.add(sun);

// water
const waterGeo = new THREE.PlaneGeometry(200, 200);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({
  color: new THREE.Color('#58a2b6').convertSRGBToLinear(), roughness: 0.35, metalness: 0.0,
  transparent: true, opacity: 0.9,
}));
water.position.y = 0;
scene.add(water);

let mesh = null;
let seed = 7;

function build(nextSeed) {
  seed = nextSeed;
  const field = buildIsland({ size: 96, seed, terraces: 7, roughness: 0.22, coast: 0.72 });
  const { pos, col } = buildIslandGeometry(field, { cell: 0.3, heightScale: 0.95 });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true,
  }));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  // navigation check: find a long path across the island to prove the grid works
  const { n, walkable, h } = field;
  const walkables = [];
  for (let k = 0; k < n * n; k++) if (walkable[k]) walkables.push([k % n, (k / n) | 0]);
  let best = { len: 0, from: null, to: null };
  if (walkables.length > 20) {
    const a = walkables[(Math.random() * walkables.length) | 0];
    const b = walkables[(Math.random() * walkables.length) | 0];
    const path = findPath(field, a, b);
    if (path.length > best.len) best = { len: path.length, from: a, to: b };
  }

  let land = 0;
  for (let k = 0; k < n * n; k++) if (h[k] > 0.02) land++;

  statsEl.innerHTML =
    `种子 <b>${seed}</b>　网格 <b>${n}×${n}</b><br>` +
    `陆地 <b>${land}</b> 格　可走 <b>${field.stats.walkableCount}</b> 格 ` +
    `(${(field.stats.walkableCount / Math.max(1, land) * 100).toFixed(0)}%)<br>` +
    `A\* 实测路径 <b>${best.len}</b> 步<br>` +
    `三角形 <b>${(pos.length / 9) | 0}</b>`;
}

build(seed);

// camera
const target = new THREE.Vector3(0, 1.2, 0);
let yaw = 0.72, pitch = 0.46, dist = 21;
function syncCamera() {
  const cp = Math.cos(pitch);
  camera.position.set(
    target.x + Math.sin(yaw) * cp * dist,
    target.y + Math.sin(pitch) * dist,
    target.z + Math.cos(yaw) * cp * dist,
  );
  camera.lookAt(target);
  sun.position.set(target.x + 14, 22, target.z + 12);
  sun.target.position.copy(target);
}
syncCamera();

let drag = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', (e) => { drag = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('pointerup', () => { drag = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  yaw -= (e.clientX - lastX) * 0.006;
  pitch = Math.min(1.45, Math.max(0.12, pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  syncCamera();
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.min(80, Math.max(8, dist * Math.exp(e.deltaY * 0.0011)));
  syncCamera();
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'r') build((Math.random() * 1e6) | 0);
});
document.getElementById('regen').addEventListener('click', () => build((Math.random() * 1e6) | 0));

function resize() {
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.reaEngine = { build, buildIsland, findPath };
</script>
</body>
</html>
