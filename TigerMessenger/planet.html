<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TigerMessenger · 星球实验页</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05080f;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #e8eef8;
      user-select: none;
    }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      font-size: 13px;
      white-space: nowrap;
      background: rgba(8, 12, 22, 0.72);
      border: 1px solid rgba(140, 180, 255, 0.22);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #hint kbd {
      display: inline-block;
      min-width: 1.4em;
      padding: 1px 6px;
      margin: 0 1px;
      border-radius: 5px;
      border: 1px solid rgba(180, 200, 255, 0.35);
      background: rgba(30, 40, 70, 0.85);
      font-size: 12px;
      text-align: center;
    }
    #back {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 5;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(140, 180, 255, 0.28);
      background: rgba(8, 12, 22, 0.75);
      color: #cfe0ff;
      text-decoration: none;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }
    #back:hover { filter: brightness(1.08); }
    /* NPC 对话提示（屏幕中央） */
    #npc-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 28px;
      font-size: 17px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      background: rgba(8, 12, 22, 0.82);
      border: 1px solid rgba(255, 224, 138, 0.45);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #npc-hint.show { opacity: 1; }
    /* 对话框（极简，盖在 3D 场景之上） */
    #dialog {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 280px;
      max-width: min(520px, 88vw);
      padding: 14px 22px;
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
      background: rgba(10, 14, 24, 0.9);
      border: 1px solid rgba(140, 180, 255, 0.35);
      border-radius: 12px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #dialog.show { opacity: 1; }
    /* 计分徽标 */
    #score-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      font-size: 13px;
      background: rgba(8, 12, 22, 0.75);
      border: 1px solid rgba(140, 180, 255, 0.28);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #score-badge strong { color: #ffe08a; }
    #npc-hint kbd {
      display: inline-block;
      min-width: 1.4em;
      padding: 1px 8px;
      margin: 0 2px;
      border-radius: 5px;
      border: 1px solid rgba(255, 224, 138, 0.6);
      background: rgba(70, 55, 20, 0.85);
      font-size: 15px;
      text-align: center;
      color: #ffe08a;
    }
    /* 开发者菜单（隐藏面板，右上角智能体图标呼出） */
    #dev-toggle {
      position: fixed;
      top: 52px;
      right: 16px;
      z-index: 30;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(140, 180, 255, 0.35);
      background: rgba(8, 12, 22, 0.8);
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    #dev-toggle:hover { filter: brightness(1.2); }
    #dev-panel {
      position: fixed;
      top: 96px;
      right: 16px;
      z-index: 30;
      width: 280px;
      max-height: min(70vh, 560px);
      overflow-y: auto;
      padding: 12px 14px;
      font-size: 12px;
      background: rgba(8, 12, 22, 0.92);
      border: 1px solid rgba(140, 180, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .dev-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      color: #9ec5ff;
    }
    .dev-fps { opacity: 0.75; font-variant-numeric: tabular-nums; }
    .dev-hint {
      margin: 0 0 8px;
      font-size: 10px;
      opacity: 0.65;
      color: #a8c4ff;
    }
    .dev-group {
      margin: 8px 0 4px;
      font-weight: 600;
      color: #ffe08a;
      letter-spacing: 0.06em;
    }
    .dev-row {
      display: grid;
      grid-template-columns: 76px 1fr 34px;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }
    .dev-row input[type="range"] { width: 100%; accent-color: #7eb0ff; }
    .dev-row em { font-style: normal; text-align: right; opacity: 0.8; font-variant-numeric: tabular-nums; }
    #dev-reset {
      margin-top: 10px;
      width: 100%;
      padding: 6px 0;
      border: 1px solid rgba(140, 180, 255, 0.35);
      border-radius: 8px;
      background: rgba(30, 40, 70, 0.85);
      color: #cfe0ff;
      cursor: pointer;
    }
    #dev-reset:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <a id="back" href="./">← 主游戏</a>
  <div id="npc-hint">[<kbd>E</kbd>] 与居民交谈</div>
  <div id="dialog"></div>
  <div id="score-badge">投递成功 <strong id="score-num">0</strong></div>
  <div id="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 滑行
    · <kbd>Space</kbd> 跳
    · <kbd>Shift</kbd> 疾跑
    · 滚轮/中键 缩放环绕
    · <kbd>E</kbd> 对话/接送
    · 树石房可挡路
  </div>

  <!-- CDN 优先，失败回退 vendor（与主游戏一致） -->
  <script type="module">
    const CDN_THREE = "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js";
    const CDN_ADDONS = "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/";
    const LOCAL_THREE = "./vendor/three.module.js";
    const LOCAL_ADDONS = "./vendor/jsm/";
    const forceLocal =
      /[?&]local=1\b/.test(location.search) ||
      sessionStorage.getItem("tm_use_local") === "1";

    function injectImportMap(threeUrl, addonsUrl) {
      const el = document.createElement("script");
      el.type = "importmap";
      el.textContent = JSON.stringify({
        imports: { three: threeUrl, "three/addons/": addonsUrl },
      });
      document.head.appendChild(el);
    }

    async function boot(source) {
      injectImportMap(
        source === "cdn" ? CDN_THREE : LOCAL_THREE,
        source === "cdn" ? CDN_ADDONS : LOCAL_ADDONS
      );
      console.info("[planet lab] three.js source:", source);
      await import("./src/planet/main.js");
    }

    try {
      if (forceLocal) await boot("local");
      else {
        try {
          await boot("cdn");
        } catch (e) {
          console.warn("[planet lab] CDN 失败，回退 vendor", e);
          sessionStorage.setItem("tm_use_local", "1");
          const u = new URL(location.href);
          u.searchParams.set("local", "1");
          location.replace(u.toString());
        }
      }
    } catch (err) {
      console.error(err);
      document.body.insertAdjacentHTML(
        "beforeend",
        `<p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffb0b0">星球实验页加载失败</p>`
      );
    }
  </script>
</body>
</html>
