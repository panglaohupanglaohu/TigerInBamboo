<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣城蓝夜 · 第四轮环境检视</title><style>body{margin:24px;background:#101e30;color:#e5eaf0;font:16px/1.65 system-ui}h1{margin-bottom:8px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,a{color:#f1c48a}button{background:#243950;border:1px solid #52627a;padding:10px 16px;border-radius:5px;cursor:pointer;font:inherit}img{width:100%;max-width:1280px;display:block}p{max-width:1000px}small{color:#bac7d5}</style><h1>圣城蓝夜 · 第四轮环境检视</h1><p>原街灯与树木资产已接入。植物贴地、墙体阴影、原曲面水反射及波纹已做候选；仍未达到目标图的精细度，尚未替换正式游戏。</p><nav><button data-image="plants-blender.png">Blender植物模型</button><button data-image="batched.png">整体</button><button data-image="shore-reflection.png">水岸</button><button data-image="side.png">侧面</button><button data-image="shore-no-shadow.png">诊断：关闭街灯阴影</button><button data-image="shore-no-reflection.png">诊断：关闭反射</button><button data-image="shore-wave.png">波纹另一时刻</button><button data-image="unbatched.png">整理前同镜头</button></nav><img id="view" src="batched.png"><p id="caption">第四轮 · 总览</p><p>6盏原街灯、4处新阔叶树／柏树组合、12组原山坡树根重新贴地，并接入新阔叶／柏树模型。Blender中620个树冠/草实例按山体高度差调整，5个无射线交点的实例保留并待复核。原圣塔和978格布局保持。</p><small>水反射使用实际场景探针＋屏幕空间反射，曲面和岸线未改；屏幕外动态对象仍需刷新探针。水边接缝、全路线通行、长时间性能未完成。<br><a href="README.md">工程说明与问题清单</a> · <a href="../round-01/index.html">第一轮</a> · <a href="../round-02/index.html">第二轮</a> · <a href="../round-03/index.html">第三轮</a></small><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{document.querySelector('#view').src=button.dataset.image;document.querySelector('#caption').textContent=button.textContent};</script></html>
