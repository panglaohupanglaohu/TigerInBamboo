<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣城层次 · 两轮迭代</title><style>body{background:#101d2c;color:#e5edf6;font:16px system-ui;margin:24px}p{line-height:1.7;max-width:1100px}button,a{color:#a5d9ff}button{background:#243c55;border:1px solid #597890;padding:10px 16px;cursor:pointer;margin:5px}img{width:100%;display:block}section{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0}figcaption{padding:10px}#hero{max-width:1280px} @media(max-width:800px){section{grid-template-columns:1fr}}</style><h1>圣城层次 · 两轮实景迭代</h1><p>第一轮：四级台地、六处庭院、城堡游船。第二轮：统一建筑切分边界，调整树冠／柏树组合与庭院位置，补齐水岸镜头。以下均为 Godot 实际渲染。</p><nav><button onclick="hero.src='waterfront.png'">城市与游船</button><button onclick="hero.src='boat.png'">游船近景</button><button onclick="hero.src='side.png'">侧面</button><button onclick="hero.src='shore-reflection.png'">水岸建筑</button></nav><img id="hero" src="waterfront.png"><h2>同镜头比较</h2><section><figure><img src="../shoreline-fix/batched.png"><figcaption>迭代前：主要集中在同一基座</figcaption></figure><figure><img src="../layering-01/batched.png"><figcaption>第一轮：抬升分层，但建筑接缝和庭院重复明显</figcaption></figure><figure><img src="batched.png"><figcaption>第二轮：统一切分边界、减少庭院重复</figcaption></figure></section><h2>尚未通过的项目</h2><p>仍是独立视觉候选：台地过于规整、内部庭院不足，建筑切分边界仍需逐处处理；山体、水面外边缘与岸墙细节未达目标。未完成碰撞、导航、上下船或巡游逻辑，也没有重新运行 WFC 求解。未替换正式游戏。</p><p><a href="city-tiered.blend">建筑 Blender 文件</a> · <a href="castle-tour-boat.blend">游船 Blender 文件</a> · <a href="godot-report.json">Godot 测量</a></p></html>
