<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高山之门 · 30轮实景对照</title><style>body{margin:0;background:#edf0ed;color:#26343a;font:16px/1.7 system-ui}header,main{max-width:1550px;margin:auto;padding:24px}h1{margin:0;font-size:28px}a{color:#255d88}nav{display:flex;gap:24px;flex-wrap:wrap}.pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}figure{margin:0;background:white;padding:10px;border-radius:10px}img{width:100%;display:block}figcaption{padding:8px}select{font:inherit;padding:5px}p{max-width:1000px}.note{background:#fff5d9;padding:12px;border-radius:8px}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style><header><h1>高山之门 · 30轮实景对照</h1><p>已接入高山圣城铁路，保留厚重双塔与三重纵深门。下图实景来自8931，仍是简化模型，未达到目标图的自然岩壁与光照精度。</p><nav><a href="../../../?autostart=1&highlandReview=1">进入真实游戏 · 高山之门</a><a href="PROGRESS.md">逐轮改动与验证记录</a><a href="../../../assets/models/optimized/highland-gate/highland-gate-r30.blend">Blender模型</a></nav></header><main><div class="pair"><figure><img src="../../../assets/concepts/highland-gate/target-v1.png"><figcaption>已认可目标 V1 · 传统圣城文明</figcaption></figure><figure><img id="actual" src="r30-near.png"><figcaption>实际游戏　<select id="round"></select>　<select id="view"><option value="near">固定近景</option><option value="front">门前视角（12轮起）</option><option value="context">周边关系</option></select></figcaption></figure></div><p class="note">最终：1944条双线车体射线0阻挡；195个步道点、81个台阶点均有支撑且无阻挡；真实移动解算器通过门内和台阶路线。电车实际更新逻辑跨过门区。Godot仅验证模型导入，尚未迁移原生玩法。</p><figure><img src="r30-gameplay.png"><figcaption>真实角色入口与游戏UI。此处可以继续操作游戏；不是渲染背景板。</figcaption></figure><p>剩余：岩壁和植被仍偏多边形，光照与目标图有明显差距；局部步道通过不等于全城路网贯通，球面世界透视也不同于目标图。莫比斯水晶城与纤细叹息之门属于另一个文明，未用本模型替换。</p></main><script>const round=document.getElementById('round'),view=document.getElementById('view'),actual=document.getElementById('actual');for(let i=30;i>=1;i--){const o=document.createElement('option');o.value=i;o.textContent='第 '+i+' 轮';round.append(o)}function update(){let v=view.value;if(v==='front'&&+round.value<12)v='near';actual.src='r'+String(round.value).padStart(2,'0')+'-'+v+'.png'}round.onchange=view.onchange=update;</script></html>
