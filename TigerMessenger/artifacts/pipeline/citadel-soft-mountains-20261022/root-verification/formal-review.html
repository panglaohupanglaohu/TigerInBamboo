<!doctype html><meta charset="utf-8"><title>高山圣城 · 正式山体核查</title><style>body{margin:0}iframe{width:100vw;height:100vh;border:0}aside{position:fixed;right:12px;top:12px;background:#fffffff0;padding:12px;max-width:400px;font:12px system-ui;z-index:20}pre{max-height:110px;overflow:auto;white-space:pre-wrap}button{margin:4px}</style>
<iframe id="game" src="../../../../?autostart=1"></iframe><aside>正式场景观察／只读山体导出<button id="export">导出最终山体</button><button id="observe">查看山体</button><button id="normal">恢复镜头</button><pre id="status">等待正式构建</pre><pre id="export-status"></pre></aside><script>
const game=document.querySelector('#game'),status=document.querySelector('#status');let active=false,hooked;
function handles(){const t=game.contentWindow.__tm,m=t?.scene?.getObjectByName('citadel-oskar-grid-mountain-surface');if(!m)return{};let c=m;while(c&&!c.userData.eastCliffStartupTerrain)c=c.parent;return{t,m,c};}
function pose(t,m){const T=t.THREE,b=new T.Box3().setFromObject(m),c=b.getCenter(new T.Vector3()),u=c.clone().normalize(),s=new T.Vector3(0,1,0).cross(u).normalize(),f=u.clone().cross(s).normalize(),d=b.getSize(new T.Vector3()).length()*.8;t.camera.up.copy(u);t.camera.position.copy(c).addScaledVector(u,d*.55).addScaledVector(f,d).addScaledVector(s,d*.2);t.camera.lookAt(c);t.camera.updateMatrixWorld(true);}
document.querySelector('#observe').onclick=()=>active=true;document.querySelector('#normal').onclick=()=>{active=false;hooked?.cameraRig.snapToPlayer()};
document.querySelector('#export').onclick=()=>{try{const {t,m,c}=handles();if(!c)throw Error('Final castle surface unavailable');t.scene.updateMatrixWorld(true);const toChart=c.matrixWorld.clone().invert().multiply(m.matrixWorld),data={entry:game.contentWindow.location.pathname,sourceName:m.name,sourceUUID:m.uuid,castleName:c.name,geometry:m.geometry.toJSON(),toChart:toChart.toArray(),meshMatrixWorld:m.matrixWorld.toArray(),castleMatrixWorld:c.matrixWorld.toArray(),report:c.userData.eastCliffStartupTerrain.report,sourceNote:'Actual final normal-game geometry, after startup artifact and final mountain finish. Full attributes/index captured, no generated substitute.'};let el=document.querySelector('#mountain-export');if(!el){el=document.createElement('script');el.type='application/json';el.id='mountain-export';document.body.append(el)}el.textContent=JSON.stringify(data);document.querySelector('#export-status').textContent=JSON.stringify({mesh:m.name,triangles:(m.geometry.index?.count??m.geometry.attributes.position.count)/3,toChart:data.toChart,bytes:el.textContent.length});}catch(e){document.querySelector('#export-status').textContent=String(e)}};
function update(){try{const {t,m,c}=handles();if(t?.renderer&&m&&c){if(hooked!==t){hooked=t;const original=t.renderer.render;t.renderer.render=function(s,cam){if(active&&s===t.scene&&cam===t.camera)pose(t,m);return original.call(this,s,cam)}}status.textContent=JSON.stringify({entry:game.contentWindow.location.pathname,mode:active?'fixed-observer':'normal',mesh:m.name,triangles:(m.geometry.index?.count??m.geometry.attributes.position.count)/3,finish:m.geometry.userData.finalMountainFinish,installed:c.userData.eastCliffStartupTerrain.report.installed});}}catch(e){status.textContent=String(e)}requestAnimationFrame(update)}update();</script>
