<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>圣城圆台与区域音乐</title><style>body{background:#152331;color:#edf1ef;font:17px/1.7 system-ui;margin:0}main{max-width:1200px;margin:auto;padding:28px}img{max-width:100%;display:block}a{color:#9ed3ff}figure{margin:24px 0}</style><main><h1>圆台底座 · 新城 200 米音乐范围</h1><p><a href="/TigerMessenger/">进入 8931 原游戏</a>。圆台已由 Blender 回接，雕像人物保留原模型。</p><figure><img src="web-after.png"><figcaption>实际游戏：同心圆台与六圈地砖。</figcaption></figure><figure><img src="blender-r04.png"><figcaption>Blender r04：底座各层改为圆形，人物与高度保留。</figcaption></figure><p>以新城广场为中心，玩家距离不超过 200 米时申请播放老人原曲。外侧10米逐渐提高音量，离开200米停止。电车与近处战斗仍由原音乐优先级接管，区域曲不会叠播。浏览器仍遵守静音与用户手势限制。</p><figure><img src="godot-after.png"><figcaption>同一Godot工程：圆台已回接。</figcaption></figure><p><a href="audio-web.json">网页实音频测试</a> · <a href="audio-godot.json">Godot 范围测试</a>。Godot 全局检视使用当前相机作为听音位置；完整战斗音乐调度仍需随玩法接入。</p></main></html>
