<!doctype html><html lang="zh"><meta charset="utf-8"><title>霸天连续投弹 · 混音优化试听</title><style>body{font:18px system-ui;background:#202a38;color:#f2e4c5;max-width:820px;margin:8vh auto;padding:30px}button,a{font:inherit;padding:12px;display:inline-block}audio{width:100%;margin:25px 0}small{color:#b8c5cd}</style><h1>连续双弹 · 混音优化</h1><p>机械脱舱 → 交错呼啸 → 连续重爆 → 背景恢复</p><small>正式音源与混音控制器的离线试听；含合成引擎底声，无背景音乐录音，非完整游戏混音录制。</small><p><button id="render">生成混音试听</button></p><audio id="player" controls></audio><p id="status">等待生成</p><a id="download" hidden download="batian-bomb-mix-v2.wav">下载试听 WAV</a><script type="module">
import {synthBatianBombRelease,synthBatianBombFall,synthBatianBombExplosion} from '../../../src/audio/batianBombSound.js';import {createBombMixFocus} from '../../../src/audio/bombMixFocus.js';
document.querySelector('#render').onclick=async()=>{const sr=48000,duration=6.8,ctx=new OfflineAudioContext(1,Math.ceil(sr*duration),sr),comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;comp.connect(ctx.destination);const input=gain=>{const g=ctx.createGain();g.gain.value=gain;g.connect(comp);return g;};for(const t of[.10,.70]){synthBatianBombRelease(ctx,input(.497),t);synthBatianBombFall(ctx,input(.5355),{start:t+.08,duration:2.8});synthBatianBombExplosion(ctx,input(.576),t+2.88);}const bed=input(.14),ramp=ctx.createGain();ramp.gain.setValueAtTime(0,0);ramp.gain.linearRampToValueAtTime(1,.08);ramp.gain.setValueAtTime(1,duration-.1);ramp.gain.linearRampToValueAtTime(0,duration);ramp.connect(bed);for(const [f,gain]of[[74,.35],[148,.12]]){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=gain;o.connect(g).connect(ramp);o.start();o.stop(duration);}let now=0,minMusic=1;const mix=createBombMixFocus(()=>now);for(let i=0;i<=duration*50;i++){now=i/50;for(const t of[.1,.7]){if(Math.abs(now-t)<.011)mix.pulse('latch',.16);if(now>=t+.08&&now<t+2.88)mix.pulse('fall',.18);if(Math.abs(now-(t+2.88))<.011)mix.pulse('blast',.5);}const m=mix.read();minMusic=Math.min(minMusic,m.music);bed.gain.setValueAtTime(.14*m.vehicles,now);}const rendered=await ctx.startRendering(),data=rendered.getChannelData(0);let peak=0,sum=0;for(const v of data){peak=Math.max(peak,Math.abs(v));sum+=v*v;}const bytes=new ArrayBuffer(44+data.length*2),view=new DataView(bytes),str=(p,s)=>{for(let i=0;i<s.length;i++)view.setUint8(p+i,s.charCodeAt(i));};str(0,'RIFF');view.setUint32(4,36+data.length*2,true);str(8,'WAVE');str(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);str(36,'data');view.setUint32(40,data.length*2,true);for(let i=0;i<data.length;i++)view.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,data[i]))*32767),true);const url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));document.querySelector('#player').src=url;const link=document.querySelector('#download');link.href=url;link.hidden=false;document.querySelector('#status').textContent=JSON.stringify({duration,peak,rms:Math.sqrt(sum/data.length),minMusicGain:minMusic,finalMusicGain:mix.read().music});};
</script></html>
