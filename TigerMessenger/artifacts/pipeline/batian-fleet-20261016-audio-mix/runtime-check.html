<!doctype html><html lang="zh"><meta charset="utf-8"><title>炸弹正式声音总线检查</title><button id="run">运行声音总线检查</button><pre id="status">等待</pre><script type="module">
import {ensureAudio} from '../../../src/audio/sfx.js';import {sfxBatianBombRelease,sfxBatianBombFall,sfxBatianBombExplosion,setSfxListener,updateWorldSfx,getWorldSfxSnapshot} from '../../../src/audio/worldSfx.js';
document.querySelector('#run').onclick=async()=>{const ctx=ensureAudio();await ctx.resume();setSfxListener({x:0,y:160,z:0});const pos={x:0,y:195,z:0};sfxBatianBombRelease(pos);const fall=sfxBatianBombFall(pos,2.7);let blast=false;const start=ctx.currentTime,seen=new Set();let minMusic=1,maxForeground=0;const tick=()=>{const t=ctx.currentTime-start;pos.y=195-.5*9.8*Math.min(t,2.7)**2;if(t<2.7)fall?.update(pos);else if(!blast){blast=true;fall?.stop();sfxBatianBombExplosion({x:0,y:160,z:0});}updateWorldSfx(.016);const s=getWorldSfxSnapshot();for(const v of s.oneShots)seen.add(v.id);minMusic=Math.min(minMusic,s.bombMix.music);maxForeground=Math.max(maxForeground,s.foreground);document.querySelector('#status').textContent=JSON.stringify({done:t>7.5,time:t,seen:[...seen],minMusic,maxForeground,bombMix:s.bombMix});if(t<7.5)requestAnimationFrame(tick);else ctx.suspend();};tick();};
</script></html>
