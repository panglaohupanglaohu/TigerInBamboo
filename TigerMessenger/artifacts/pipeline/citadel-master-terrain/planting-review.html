<!doctype html><meta charset=utf-8><title>平台植被落地与分组</title><style>body{background:#152334;color:#eee;font:18px/1.7 system-ui;margin:30px}img{width:100%}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}a{color:#9cd1ff}</style><h1>新城平台 · 植被落地与分组</h1><p>原Blender柏树与灌木按实际平台落地，避开建筑覆盖、中央通路和守军岗位。这组植物由31棵树/54簇灌木变为80棵树/83簇灌木，保持7个合并网格。数量不是完成标准。</p><section><div><h2>修改前</h2><img src=planting-before.png></div><div><h2>修改后 · 实际游戏渲染</h2><img src=planting-after.png></div></section><p>28个岗点检查通过；Godot同步一个可见植被组、7个网格、58320顶点。整体构图、山体、灯光和完整游玩仍未完成。</p><h2>认可目标</h2><img src=../citadel-gate-plaza-design/scene-target-r01.png><p><a href=planting-audit.json>Web种植记录</a> · <a href=godot-planting.json>Godot同步核对</a> · <a href=http://localhost:8931/TigerMessenger/>8931原游戏</a></p>
