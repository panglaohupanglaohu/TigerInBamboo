<!doctype html><meta charset="utf-8"><title>筑山 1/3 · 整体山势重排</title><style>body{background:#152238;color:#eef2f5;font:18px/1.6 system-ui;max-width:1200px;margin:32px auto;padding:20px}img{width:100%;display:block;margin:20px 0}a{color:#8bd1ff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style><h1>筑山 1/3 · 整体山势重排</h1><p>这是本轮真实 Blender 与原游戏候选。旧城长台地改为错落的小台地，后山改为带鞍部的山脊，新城坡面向广场延伸。旧建筑尚未迁移；默认入口未切换，阶段尚未验收。</p><p><a href="../../../?autostart=1&citadelMasterTerrain=7">在 8931 原游戏运行山势候选</a> · <a href="../citadel-gate-plaza-design/scene-target-r01.png">认可目标图</a></p><h2>同机位整体地形</h2><div class="pair"><div>调整前<img src="blender-baseline.png"></div><div>当前<img src="blender-r07.png"></div></div><h2>原游戏实景</h2><img src="r07-target-angle.png"><h2>剩余两次</h2><p>第2次：解决新城岩壁仍过于陡直、台地与既有建筑支撑冲突，形成等高线与剖面。第3次：收接缝和关键通路，通过部分同步默认原游戏与 Godot。现有 R07 GLB 已写入同一 Godot 工程资产目录，尚未作为普通场景启用或验收。</p>
