import * as T from 'three';import {createBaseDefense} from '/TigerMessenger/src/gameplay/robotOps/baseDefense.js';import {createVanguardSquad,vanguardRosterSlot,vanguardMuzzleWorld} from '/TigerMessenger/src/world/vanguardTrooper.js';import {createSoccoCraft} from '/TigerMessenger/src/world/gateHaulerCraft.js';import {createBookshopWorker} from '/TigerMessenger/src/assets/bookshopWorker.js';import {createBatianBookshopAssault} from '/TigerMessenger/src/world/batianBookshopAssault.js';import {townSurfacePoint,seatTownObject} from '/TigerMessenger/src/world/bookshopTownSite.js';

const survivor=squad.userData.troopers.find(t=>t.userData.bookshopReceiveHit&&!t.userData.dead);assert(survivor,'survivor');const robot=new T.Group();robot.userData.robotType='ant';scene.add(robot);const target=survivor.getWorldPosition(new T.Vector3()),up=target.clone().normalize(),back=new T.Vector3(0,0,-1).addScaledVector(up,new T.Vector3(0,0,1).dot(up)).normalize();robot.position.copy(target).addScaledVector(back,12).normalize().multiplyScalar(target.length());base.attach(robot);base.userData.models=[robot];scene.userData.batianCommandMode=true;const defense=createBaseDefense({scene,base,logistics:new Map(),models:new Map(),combat:new Map(),getFleet:()=>null,getAssault:()=>null});for(let n=0;n<24;n++)defense.update(.05);snapshot.robotDefense=defense.snapshot();assert(battle.snapshot().robotKills===1,'one actual robot shell defeats armor');
for(let i=0;i<140;i++)battle.update(.05,{phase:'pincer',arsenal:{rain:1,pendingProjectiles:0}});
snapshot.crossfire=battle.snapshot();assert(snapshot.crossfire.trooperShots>0,'infantry attacks');assert(snapshot.crossfire.residentShots>0,'residents return fire');assert(actors.some(a=>a.gun),'pistol drawn');assert(snapshot.crossfire.robotKills===1,'robot superiority recorded');
for(let i=0;i<120;i++)battle.update(.05,{phase:'withdraw',arsenal:{rain:1,pendingProjectiles:0}});snapshot.evacuation=battle.snapshot();assert(snapshot.evacuation.recovered>0,'survivors recalled by rope');battle.finish();assert(!squad.userData.troopers.some(t=>t.userData.bookshopReceiveHit),'damage leases removed');assert(uuids.every((id,i)=>id===squad.userData.troopers[i].uuid),'original roster retained');battle.dispose();document.querySelector('#result').textContent=JSON.stringify({passed:true,snapshot,scope:'Real production modules CPU fixture, actual existing model constructors; not gameplay GPU validation'},null,2);
