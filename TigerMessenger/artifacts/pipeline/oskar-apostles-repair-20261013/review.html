<!doctype html><html><meta charset="utf-8"><title>十二门徒 同工厂检查</title><style>body{margin:0;background:#b7dce9;font:14px system-ui}nav{position:absolute;top:0;background:#fff9;padding:12px;z-index:2}button,a{margin:4px}pre{font-size:10px;max-width:800px}</style><nav>正式同工厂·独立球面样区（非完整游戏）<button data-view="overview">总览</button><button data-view="bay">海湾</button><button data-view="side">岩壁</button><a href="?before=1">修改前</a><a href="?">修改后</a><a href="../../../?autostart=1">正式游戏</a><pre id="info">构建中</pre></nav><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';
const before=new URLSearchParams(location.search).has('before');
const {buildTwelveApostlesTarget}=await import(before?'./before.js':'../../../src/world/twelveApostlesTarget.js');
const scene=new T.Scene();scene.background=new T.Color('#b7dce9');const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xe9f4ff,0x647265,2));const sun=new T.DirectionalLight(0xfff6db,2.6);sun.position.set(-130,240,100);scene.add(sun);
const R=160,curve={getLength:()=>Math.PI*2*161,getPointAt:u=>new T.Vector3(Math.sin(u*Math.PI*2)*161,Math.cos(u*Math.PI*2)*161,0),getTangentAt:u=>new T.Vector3(Math.cos(u*Math.PI*2),-Math.sin(u*Math.PI*2),0)},railPoints=Array.from({length:2024},(_,i)=>curve.getPointAt(i/2024));
scene.add(new T.Mesh(new T.SphereGeometry(R,128,64),new T.MeshStandardMaterial({color:0x208aab,roughness:.65})));
const result=buildTwelveApostlesTarget({parent:scene,railCurves:{red:curve},railPoints,waterAt:p=>p.clone().normalize().multiplyScalar(R),referencePoint:new T.Vector3(0,160,8)});
const line=new T.LineLoop(new T.BufferGeometry().setFromPoints(railPoints),new T.LineBasicMaterial({color:0x713f30}));scene.add(line);
const camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,1500);camera.up.set(0,1,0);function view(v){camera.position.set(...({overview:[0,255,-185],bay:[0,215,-150],side:[80,205,-105]}[v]));camera.lookAt(0,160,0);renderer.render(scene,camera);}document.querySelectorAll('button').forEach(b=>b.onclick=()=>view(b.dataset.view));view('overview');window.__apostles={scene,camera,renderer,report:result.report,view};info.textContent=JSON.stringify({version:result.report.version,built:result.report.built,triangles:result.report.triangles,masses:result.report.masses.map(m=>({id:m.id,minRail:m.minRail,solved:m.wfc?.solved}))});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera)});
</script></html>
