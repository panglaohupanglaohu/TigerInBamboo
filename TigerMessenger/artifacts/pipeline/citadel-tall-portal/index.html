<!doctype html><meta charset="utf-8"><title>新城主堡 · 尖拱比例</title><style>body{background:#152237;color:#edf3fa;font:18px/1.7 system-ui;max-width:1400px;margin:32px auto;padding:24px}img{width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}a{color:#9dd0ff}</style><h1>新城主堡 · 尖拱比例</h1><p>对照认可目标，抬高原Blender尖拱，减少门洞上方的大块平墙。门宽、地面入口、外墙宽度和13米墙顶保持；<a href="http://localhost:8931/TigerMessenger/">8931 原游戏</a>。</p><h2>认可目标</h2><img src="../citadel-gate-plaza-design/scene-target-r01.png"><h2>实际Web同机位</h2><div class="pair"><section><h3>之前</h3><img src="before.png"></section><section><h3>调整后</h3><img src="../citadel-master-terrain/tall-portal-upper.png"></section></div><p>尖拱顶约6.17→8.5米，起拱点3.83→5.3米。原门宽约4.985米，原墙接缝保留。门洞内侧雕刻与三层暖色拱券随同一原几何更新。</p><h2>正式Godot画面</h2><img src="godot.png"><p><a href="check.json">Web真实门洞检查</a> · <a href="godot.json">原生三角面检查</a> · <a href="../citadel-master-terrain/character-route-audit.json">原角色通路记录</a></p><p>门洞比例有改善，整座主堡的体量穿插、城墙层次、宽冠树与整体布光仍有差距。这不是完整目标复刻或战斗完成。</p>
