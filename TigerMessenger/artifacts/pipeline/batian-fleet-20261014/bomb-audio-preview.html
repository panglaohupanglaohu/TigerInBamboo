<!doctype html><html lang="zh"><meta charset="utf-8"><title>霸天胶囊弹音效试听</title><style>body{font:18px system-ui;background:#202a38;color:#f2e4c5;max-width:780px;margin:8vh auto;padding:30px}button,a{font:inherit;padding:12px;display:inline-block}audio{width:100%;margin:25px 0}small{color:#b8c5cd}</style><h1>霸天胶囊弹 · 加强版试听</h1><p>机械脱舱 → 渐强下落呼啸 → 重爆与碎片余响</p><small>使用正式游戏同一合成模块；此处为独立声音试听，未模拟听点距离。</small><p><button id="render">生成加强版试听</button></p><audio id="player" controls></audio><p id="status">等待生成</p><a id="download" hidden download="batian-bomb-audio-clear.wav">下载试听 WAV</a><script type="module">
import {synthBatianBombRelease,synthBatianBombFall,synthBatianBombExplosion} from '../../../src/audio/batianBombSound.js';
document.querySelector('#render').onclick=async()=>{const sampleRate=48000,ctx=new OfflineAudioContext(1,sampleRate*5.5,sampleRate),comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;comp.connect(ctx.destination);const input=gain=>{const g=ctx.createGain();g.gain.value=gain;g.connect(comp);return g;};synthBatianBombRelease(ctx,input(.497),.1);synthBatianBombFall(ctx,input(.5355),{start:.15,duration:2.8});synthBatianBombExplosion(ctx,input(.576),2.95);const rendered=await ctx.startRendering(),data=rendered.getChannelData(0);let peak=0,sum=0;const stages=[[.1,.4],[.4,1.2],[2.1,2.8],[2.95,3.5],[4.9,5.5]].map(([a,b])=>{let square=0;for(let i=Math.floor(a*sampleRate);i<Math.floor(b*sampleRate);i++)square+=data[i]*data[i];return Math.sqrt(square/((b-a)*sampleRate));});for(const v of data){peak=Math.max(peak,Math.abs(v));sum+=v*v;}const bytes=new ArrayBuffer(44+data.length*2),view=new DataView(bytes),str=(p,s)=>{for(let i=0;i<s.length;i++)view.setUint8(p+i,s.charCodeAt(i));};str(0,'RIFF');view.setUint32(4,36+data.length*2,true);str(8,'WAVE');str(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);str(36,'data');view.setUint32(40,data.length*2,true);for(let i=0;i<data.length;i++)view.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,data[i]))*32767),true);const url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));document.querySelector('#player').src=url;const link=document.querySelector('#download');link.href=url;link.hidden=false;document.querySelector('#status').textContent=JSON.stringify({duration:5.5,peak,rms:Math.sqrt(sum/data.length),stages});};
</script></html>
