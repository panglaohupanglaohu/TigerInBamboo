<!doctype html><html lang="zh"><meta charset="utf-8"><title>正式武器特效检查</title><style>body{margin:0;background:#bdd4d9;font:16px sans-serif}#controls{position:absolute;top:16px;left:16px;background:#fffD;padding:14px;border-radius:10px}button{padding:10px;margin-right:10px}canvas{display:block}#status{margin-top:8px}</style><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><div id="controls">正式 batianArsenal 模块的独立 GPU 检查（非完整游戏截图）<p><button id="hit">护罩命中</button><button id="bomb">地面爆炸</button><button id="drop">垂直投弹</button></p><div id="status"></div></div><script type="module">
import * as T from 'three';import {createBatianArsenal} from '../../../src/world/batianArsenal.js';
const scene=new T.Scene();scene.background=new T.Color(0xbdd4d9);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(95,235,105);camera.lookAt(0,182,0);
const floor=new T.Mesh(new T.CircleGeometry(100,64),new T.MeshBasicMaterial({color:0x889a83,side:T.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=160;scene.add(floor);const craft=new T.Group();craft.position.set(-20,200,0);scene.add(craft);const shell=new T.Mesh(new T.SphereGeometry(1,40,24),new T.MeshBasicMaterial({color:0x6daebd,wireframe:true,transparent:true,opacity:.15}));shell.scale.set(40,10,40);craft.add(shell);const hull=new T.Mesh(new T.OctahedronGeometry(1),new T.MeshBasicMaterial({color:0x34445c}));hull.scale.set(29,3,29);craft.add(hull);scene.updateMatrixWorld(true);const ars=createBatianArsenal({scene,aircraft:craft});document.querySelector('#hit').onclick=()=>ars.shieldImpact(craft.localToWorld(new T.Vector3(24,8,0)),craft);document.querySelector('#bomb').onclick=()=>ars.fire('cannon',new T.Vector3(32,160,18));document.querySelector('#drop').onclick=()=>ars.fire('rain',new T.Vector3(32,160,18));let last=performance.now();function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;ars.update(dt);document.querySelector('#status').textContent=JSON.stringify({shieldImpacts:ars.stats.shieldImpacts,softSmoke:ars.snapshot().activeSoftSmoke});renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
