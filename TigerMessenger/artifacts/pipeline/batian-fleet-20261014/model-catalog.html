<!doctype html><meta charset="utf-8"><title>现有莫比斯机型 · 实际模型</title><style>body{margin:0;background:#e9e5d8;font:16px system-ui;color:#263451}h1{margin:12px 20px;font-size:23px}main{display:grid;grid-template-columns:repeat(4,1fr)}article{border:1px solid #c7b69b;text-align:center}canvas{width:100%;height:245px;display:block}p{margin:8px}</style><h1>现有模型核对 · A—F 飞行器 / G 生态伴飞</h1><main id="cards"></main><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><script type="module">
