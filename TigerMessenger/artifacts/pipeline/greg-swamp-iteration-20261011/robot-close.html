<!doctype html><meta charset="utf-8"><title>生产机器人近景验证</title><style>body{margin:0;background:#18343b}iframe,img{position:fixed;inset:0;width:100%;height:100%;border:0}pre{position:fixed;bottom:0;color:white;background:#000b;z-index:4;max-width:100%;font:11px monospace;white-space:pre-wrap}</style><iframe id="g"></iframe><pre id="s">loading</pre><script>
const q=new URLSearchParams(location.search);g.src='/TigerMessenger/?tour=crystal-v7&autostart=1&cb='+Date.now()+(q.has('before')?'&robotRenderBatch=0':'&robotRenderBatch=1');
async function capture(){const w=g.contentWindow,t=w?.__tm,models=t?.scene?.getObjectByName('robot-live-units');if(!models?.children.length){setTimeout(capture,3000);return;}await new Promise(r=>setTimeout(r,1000));
function shot(){const actor=models.children.find(m=>m.visible&&m.userData.robotType==='locust');if(!actor){s.textContent='no visible locust';return;}const T=t.THREE;actor.updateWorldMatrix(true,true);const c=t.camera.clone(),target=actor.localToWorld(new T.Vector3(0,2,0)),eye=actor.localToWorld(new T.Vector3(9,5,12));c.position.copy(eye);c.up.copy(target).normalize();c.lookAt(target);c.updateMatrixWorld(true);t.renderer.info.reset();t.renderer.render(t.scene,c);let image=document.getElementById('capture');if(!image){image=document.createElement('img');image.id='capture';document.body.appendChild(image);}image.src=t.renderer.domElement.toDataURL('image/jpeg',.94);s.textContent=JSON.stringify({time:new Date().toISOString(),mode:q.has('before')?'original':'trio-batch',actor:actor.name,position:actor.position.toArray(),batch:t.scene.getObjectByName('robot-rigid-render-batches')?.userData.report,frame:{...t.renderer.info.render}});}
shot();if(q.has('multi'))setTimeout(shot,3000);}capture();</script>
