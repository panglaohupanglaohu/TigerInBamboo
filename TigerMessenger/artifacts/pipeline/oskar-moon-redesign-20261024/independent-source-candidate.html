<header><div><h1>松月留白 · 一主、低斜、远疏</h1><p>原古松不动；两株陪松各有独立曲干与枝势，非缩放克隆。日光大块面，保留原小湖与环路。</p></div><nav><button data-view="front" aria-pressed="true">主构图检查</button><button data-view="left" aria-pressed="false">左侧检查</button><button data-view="right" aria-pressed="false">右侧检查</button><button data-view="top" aria-pressed="false">俯视</button></nav></header>
<div id="view"></div><footer>原小月牙湖、深水圆片、月体与环湖路均保留。地面仅为同球面组件支撑；陪松根位和全树包络仍待正式场景承托、碰撞与导航验证。左右视图是遮挡检查机位，尚未通过多角度构图验收。不是完整游戏截图。<div id="status" data-state="loading">加载原模型…</div></footer>
<script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';
import {createMoonLake,LAKE} from '../../../src/world/lake.js';

const host=document.getElementById('view'),status=document.getElementById('status');
try{
const scene=new T.Scene();scene.background=new T.Color('#c4e2f1');const lake=createMoonLake(scene,160);lake.group.updateWorldMatrix(true,true);
const groundY=(x,z)=>Math.sqrt(160.6**2-x*x-z*z)-160.78;
const audit={type:'oskar-method-independent-moon-candidate',productionSourceChanged:false,treeFollowsCamera:false,navigationVerified:false,actualGameScreenshot:false,lake:{groupPosition:lake.group.position.toArray(),quaternion:lake.group.quaternion.toArray(),rOuter:LAKE.rOuter,rDeep:LAKE.rDeep,pathInner:LAKE.pathInner,pathOuter:LAKE.pathOuter,shapeChanged:false,deepCircleRetained:true},trees:[],camera:null};
const trees=[{id:'原',tree:lake.ancientPine,original:true,relativeScale:1}];
const wood=new T.MeshStandardMaterial({color:'#77705e',roughness:1}),needle=[new T.MeshStandardMaterial({color:'#486f51',roughness:1}),new T.MeshStandardMaterial({color:'#718963',roughness:1}),new T.MeshStandardMaterial({color:'#5b7c57',roughness:1})];
function limb(group,points,r0,r1){const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p))),geo=new T.TubeGeometry(curve,28,1,7,false),attr=geo.attributes.position;for(let i=0;i<=28;i++){const center=curve.getPointAt(i/28),r=T.MathUtils.lerp(r0,r1,i/28);for(let j=0;j<=7;j++){const k=i*8+j,p=new T.Vector3().fromBufferAttribute(attr,k).sub(center).multiplyScalar(r).add(center);attr.setXYZ(k,...p.toArray());}}geo.computeVertexNormals();group.add(new T.Mesh(geo,wood));}
function crown(group,p,width,depth,thickness){for(let i=0;i<3;i++){const o=new T.Mesh(new T.IcosahedronGeometry(1,1),needle[i]),a=i*2.4;o.position.set(p[0]+Math.cos(a)*width*.12,p[1]+(i-1)*.04,p[2]+Math.sin(a)*depth*.1);o.scale.set(width*(.41+i*.015),thickness*(.75+i*.1),depth*.43);o.rotation.y=a*.2;group.add(o);}}
function roots(group,scale){for(let i=0;i<4;i++){const a=i*Math.PI/2+.3;limb(group,[[0,.15,0],[Math.cos(a)*scale*.55,.06,Math.sin(a)*scale*.55],[Math.cos(a)*scale,-.025,Math.sin(a)*scale]],.17,.015);}}
const low=new T.Group();low.name='proposal-low-wind-swept-pine';limb(low,[[0,0,0],[-.25,.8,.1],[-1.1,1.7,.15],[-2.5,2.7,.2]],.27,.055);limb(low,[[-1,1.6,.15],[-2.9,1.9,.1],[-4.4,2.5,.0]],.13,.025);limb(low,[[-.7,1.3,.1],[.15,1.9,-.3],[.7,2.2,-.5]],.10,.02);crown(low,[-3.5,2.7,0],2.7,1.1,.21);crown(low,[-1.9,3.1,.2],2.2,1.0,.22);crown(low,[.45,2.35,-.45],1.5,.85,.17);roots(low,.85);low.position.set(-12,groundY(-12,-4),-4);lake.group.add(low);trees.push({id:'斜',tree:low,original:false,relativeScale:1});
const distant=new T.Group();distant.name='proposal-distant-open-pine';limb(distant,[[0,0,0],[.1,1.3,0],[.75,2.7,.15],[1.25,4.2,.1],[1.05,5.7,0]],.24,.045);limb(distant,[[.7,2.5,.1],[-.6,3.0,.15],[-1.6,3.8,.1]],.12,.025);limb(distant,[[1.15,4.1,.1],[2.2,4.5,-.2],[2.7,5.1,-.3]],.095,.02);crown(distant,[1.1,5.95,0],2.6,1.3,.24);crown(distant,[-1.4,3.9,.1],1.7,.9,.19);crown(distant,[2.5,5.2,-.3],1.55,.85,.18);roots(distant,.8);distant.position.set(3,groundY(3,-10),-10);lake.group.add(distant);trees.push({id:'疏',tree:distant,original:false,relativeScale:1});
lake.group.updateWorldMatrix(true,true);
const labels=[];for(const entry of trees){const p=entry.tree.position,scale=entry.tree.scale.x,rootRadius=1.93*scale,radial=Math.hypot(p.x,p.z),rootGap=radial-rootRadius-LAKE.pathOuter;const label=document.createElement('span');label.className='pin';label.textContent=entry.id;host.append(label);labels.push({label,tree:entry.tree});audit.trees.push({id:entry.id,original:entry.original,position:p.toArray(),quaternion:entry.tree.quaternion.toArray(),scale:entry.tree.scale.toArray(),relativeScale:entry.relativeScale,source:entry.original?'original-createMoonLakeAncientPine':'independent-authored-curves-and-crown-plates',pathRootEnvelopeGap:rootGap,rootEnvelopeEstimate:'conservative local radius1.93 times factory+candidate scale; not full crown/body navigation proof'});}
audit.moon={position:lake.moonOrb.group.position.toArray(),sourceYawBehaviorRetained:true};
// True sphere-support height in the lake's original local frame, not a flat invented island.
const v=[],n=48,lo=-20,step=1;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=lo+i,z=lo+j;for(const[xp,zp]of[[x,z],[x,z+step],[x+step,z],[x+step,z],[x,z+step],[x+step,z+step]])v.push(xp,groundY(xp,zp),zp);}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.computeVertexNormals();const ground=new T.Mesh(g,new T.MeshStandardMaterial({color:'#a6af84',roughness:1}));ground.name='component-only-sphere-support';ground.receiveShadow=true;lake.group.add(ground);
const up=new T.Vector3(0,1,0).transformDirection(lake.group.matrixWorld);const hemi=new T.HemisphereLight(0xf3f9ff,0x87916e,2.2);hemi.position.copy(up);scene.add(hemi);const sun=new T.DirectionalLight(0xfff1d6,2.6);sun.position.copy(lake.group.localToWorld(new T.Vector3(-20,50,28)));sun.target.position.copy(lake.group.position);scene.add(sun,sun.target);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;host.prepend(renderer.domElement);
const camera=new T.OrthographicCamera(-20,20,18,-18,.1,1000);camera.up.copy(up);const views={front:{eye:[0,11,28],look:[0,3,0],span:15},left:{eye:[-23,13,21],look:[0,3,1],span:17.5},right:{eye:[24,13,-20],look:[0,3,1],span:17.5},top:{eye:[1,44,1.01],look:[1,0,1],span:22}};let mode='front';
function render(){const w=host.clientWidth,h=host.clientHeight,span=views[mode].span;renderer.setSize(w,h,false);camera.left=-span*w/h;camera.right=span*w/h;camera.top=span;camera.bottom=-span;camera.updateProjectionMatrix();renderer.render(scene,camera);for(const{label,tree}of labels){const p=tree.localToWorld(new T.Vector3(0,2.5,0)).project(camera);label.style.left=(p.x*.5+.5)*w+'px';label.style.top=(-p.y*.5+.5)*h+'px';label.style.display=p.z>=-1&&p.z<=1?'grid':'none';}}
function setView(id){mode=id;const row=views[id],eyeLocal=new T.Vector3(...row.eye);camera.position.copy(lake.group.localToWorld(eyeLocal.clone()));camera.up.copy(id==='top'?new T.Vector3(0,0,-1).transformDirection(lake.group.matrixWorld):up);camera.lookAt(lake.group.localToWorld(new T.Vector3(...row.look)));lake.moonOrb.update(0,0,eyeLocal);audit.camera={id,localEye:row.eye,localLook:row.look,worldEye:camera.position.toArray(),projection:'orthographic component observation, not player eye'};status.dataset.audit=JSON.stringify(audit);for(const b of document.querySelectorAll('button[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===id));render();}
for(const b of document.querySelectorAll('button[data-view]'))b.onclick=()=>setView(b.dataset.view);new ResizeObserver(render).observe(host);setView('front');status.dataset.state='ready';status.textContent='原古松保留；低斜松(-12,-4)、远疏松(3,-10)为新设计候选；全模型固定不随相机改变';
}catch(error){status.dataset.state='error';status.textContent=error.stack||error.message;throw error;}
</script></html>
