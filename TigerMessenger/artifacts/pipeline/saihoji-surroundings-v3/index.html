<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苔庭外部五区 v3 · 原松树复用</title><style>body{margin:28px;background:#16211d;color:#e9f0e4;font:17px/1.7 system-ui}main{max-width:1250px;margin:auto}img{width:100%;border-radius:12px;background:#334}a{color:#b7db9a}.card{padding:16px;border-radius:12px;background:#213027}table{border-collapse:collapse}td,th{padding:7px 12px;border-bottom:1px solid #ffffff24;text-align:left}</style><main><h1>苔庭外部五区 v3</h1><p>这一版用于隐藏静止的鲲与背部苔庭。外部五区留在球面世界；鲲从中心开口升起。树木不再另造，直接复用了已经导入 Godot 的五个苔庭优化松树模型。</p><section class="card"><img src="five-static-surroundings-original-pines.png" alt="使用原苔庭优化松树的五区静态环境"><h2>尺度与树源</h2><table><tr><th>项目</th><th>原作单位</th></tr><tr><td>鲲岛原始主体</td><td>15.04 × 7.72</td></tr><tr><td>外部五区整体</td><td>18.4 × 16.0</td></tr><tr><td>中央起飞口</td><td>约 9.0 × 7.0</td></tr></table><p>外围略大于鲲岛以提供隐藏余量，但已从 v2 的约 26 宽压缩到 18.4。五区分别复用入口苔径 811、主石之庭 5566、枯瀑之庭 1401、苔海岛群 1997、回望石组 4101 的优化松树。</p></section><p><a href="../../../godot/assets/saihoji-surroundings-v3/manifest.json">Godot 资产清单</a> · <a href="../../../godot/scripts/saihoji_concealment_adapter.gd">静态世界接入脚本</a> · <a href="../saihoji-battle-review/index.html">苔庭之战总览</a></p></main></html>
