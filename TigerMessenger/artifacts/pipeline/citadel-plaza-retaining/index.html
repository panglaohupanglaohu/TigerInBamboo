<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>圣城临水台基</title><style>body{margin:0;background:#152331;color:#edf1ef;font:17px/1.7 system-ui}main{max-width:1250px;margin:auto;padding:28px}img{width:100%;display:block}a{color:#9ed3ff}figure{margin:24px 0}</style><main><h1>广场台基接入山崖</h1><p>已进入 <a href="/TigerMessenger/">8931原游戏</a> 和同一Godot工程。沿实际岩面建立连续石砌台基与五处扶壁，保留左侧城门、折返台阶与开放广场。</p><figure><img src="after.png"><figcaption>实际网页：临水立面增加分层腰线和随岩面高差变化的支撑。</figcaption></figure><figure><img src="before.png"><figcaption>修改前，同一机位。</figcaption></figure><figure><img src="godot-after.png"><figcaption>同一Godot工程实景。</figcaption></figure><p>Blender完成边角处理，两个合并材质面、1232三角形。66处岩面采样用于落地；扶壁底角埋入岩面至少0.299米。<a href="support-report.json">接地记录</a> · <a href="godot-geometry.json">原生几何核对</a> · <a href="godot-march.json">原短剑兵202段通路</a></p><p>这一批完成前侧台基支撑。更完整的滨水建筑层次、主堡与山体比例和完整攻城仍未完成。</p></main></html>
