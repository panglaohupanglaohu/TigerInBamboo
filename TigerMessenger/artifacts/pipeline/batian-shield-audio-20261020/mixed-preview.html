document.querySelector('#render').onclick=async()=>{try{const sr=48000,duration=6.5,ctx=new OfflineAudioContext(1,sr*duration,sr),master=ctx.createGain(),comp=ctx.createDynamicsCompressor();master.gain.value=.9;master.connect(comp);comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;comp.connect(ctx.destination);const voice=g=>{const v=ctx.createGain();v.gain.value=g;v.connect(master);return v;};const playing=[];for(let i=0;i<24;i++){const t=.15+i*.09,v=voice(.85*.8);v.gain.setValueAtTime(.85*.8,t);if(playing.length===3){const old=playing.shift();old.gain.cancelScheduledValues(t);old.gain.setTargetAtTime(0,t,.015);}synthBatianShieldHit(ctx,v,t,i,[100,24,9][i%3]);playing.push(v);}synthBatianBombFall(ctx,voice(.7*.85),{start:.7,duration:2.2});synthBatianBombExplosion(ctx,voice(.8*.8),2.9);const bed=voice(.055);let now=0;const focus=createBombMixFocus(()=>now);for(let i=0;i<duration*50;i++){now=i/50;if(now>=.7&&now<2.9)focus.pulse('fall',.18);if(Math.abs(now-2.9)<.011)focus.pulse('blast',.5);bed.gain.setValueAtTime(.055*focus.read().vehicles,now);}const oscillator=ctx.createOscillator();oscillator.type='triangle';oscillator.frequency.value=74;const envelope=ctx.createGain();envelope.gain.setValueAtTime(0,0);envelope.gain.linearRampToValueAtTime(1,.1);envelope.gain.setValueAtTime(1,duration-.2);envelope.gain.linearRampToValueAtTime(0,duration);oscillator.connect(envelope).connect(bed);oscillator.start();oscillator.stop(duration);const b=await ctx.startRendering(),d=b.getChannelData(0);let peak=0,sum=0,clipped=0;for(const v of d){peak=Math.max(peak,Math.abs(v));sum+=v*v;if(Math.abs(v)>=1)clipped++;}const bytes=new ArrayBuffer(44+d.length*2),v=new DataView(bytes),str=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i));};str(0,'RIFF');v.setUint32(4,36+d.length*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(2
