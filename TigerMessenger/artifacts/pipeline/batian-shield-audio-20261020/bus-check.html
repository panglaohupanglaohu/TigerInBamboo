<!doctype html><html lang="zh"><meta charset="utf-8"><title>霸天护盾 · 正式声音总线验证</title><style>body{font:16px system-ui;background:#202a38;color:#f2e4c5;padding:28px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>正式声音总线验证</h1><p>隔离夹具：实际 worldSfx、真实浏览器AudioContext；不是完整游戏战斗。</p><button id="run">运行总线验证</button><button id="mute">检查当前静音</button><pre id="status">待运行</pre><script type="module">
import * as world from '../../../src/audio/worldSfx.js';import * as base from '../../../src/audio/sfx.js';
const status=document.querySelector('#status'),wait=ms=>new Promise(r=>setTimeout(r,ms));let tick,results={};
document.querySelector('#run').onclick=async()=>{try{const ctx=base.ensureAudio();await ctx.resume();const pans=[],original=ctx.createStereoPanner.bind(ctx);ctx.createStereoPanner=()=>{const p=original();pans.push(p);return p;};world.setSfxListener({x:0,y:0,z:0});tick=setInterval(()=>world.updateWorldSfx(.02),20);const hit={x:18,y:0,z:0};results.context=ctx.state;results.first=world.sfxBatianShieldHit(hit);results.immediateDuplicate=world.sfxBatianShieldHit(hit);results.near=world.getWorldSfxSnapshot();results.initialPan=pans.at(-1)?.pan.value;await wait(100);world.setSfxListener({x:36,y:0,z:0});world.updateWorldSfx(.02);await wait(180);results.movedPan=pans[0]?.pan.value;world.setSfxListener({x:0,y:0,z:0});world.updateWorldSfx(.02);let max=0,accepted=0;for(let i=0;i<16;i++){if(world.sfxBatianShieldHit(hit))accepted++;max=Math.max(max,world.getWorldSfxSnapshot().oneShots.filter(v=>v.id==='batianShieldHit').length);await wait(70);}results.burst={accepted,maxVoices:max};await wait(700);results.afterTail=world.getWorldSfxSnapshot();world.setSfxListener({x:1000,y:0,z:0});results.far=world.sfxBatianShieldHit(hit);world.setSfxListener({x:0,y:0,z:0});world.sfxBatianBombExplosion({x:8,y:0,z:0});await wait(90);results.shieldWithBomb=world.sfxBatianShieldHit(hit);results.mixed=world.getWorldSfxSnapshot();await wait(2400);results.final=world.getWorldSfxSnapshot();ctx.createStereoPanner=original;status.textContent=JSON.stringify(results,null,2);}catch(e){status.textContent=JSON.stringify({error:String(e),stack:e.stack});}finally{clearInterval(tick);}};
document.querySelector('#mute').onclick=()=>{world.updateWorldSfx(.02);status.textContent=JSON.stringify({muted:base.isMuted(),accepted:world.sfxBatianShieldHit({x:18,y:0,z:0}),snapshot:world.getWorldSfxSnapshot()},null,2);};
</script></html>
