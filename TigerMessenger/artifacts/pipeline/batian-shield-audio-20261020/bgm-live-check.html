<!doctype html><html lang="zh"><meta charset="utf-8"><title>Hitman与霸天音效 · 正式总线验证</title><style>body{font:17px system-ui;background:#202a38;color:#f2e4c5;padding:24px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Hitman 与霸天音效</h1><p>真实音乐载入状态＋正式音效总线，约10秒后自动停止。只验证播放、让位、恢复和声部预算，不代表主观听感验收。</p><button id="run">运行真实混音验证</button><pre id="status">待运行</pre><p>Hitman — Kevin MacLeod，CC BY 4.0；沿用游戏原有来源。</p><script type="module">
import * as base from '../../../src/audio/sfx.js';import * as sfx from '../../../src/audio/worldSfx.js';
const wait=ms=>new Promise(r=>setTimeout(r,ms)),status=document.querySelector('#status');let observations=[],peakForeground=0,peakVoices=0;
const sample=label=>{const audio=sfx.getWorldSfxSnapshot(),music=base.getBgmOwnershipSnapshot();peakForeground=Math.max(peakForeground,audio.foreground);peakVoices=Math.max(peakVoices,audio.oneShots.length);const s={label,music,voices:audio.oneShots,mix:audio.bombMix};observations.push(s);return s;};
document.querySelector('#run').onclick=async()=>{let tick,fall;try{const ctx=base.ensureAudio();await ctx.resume();sfx.setSfxListener({x:0,y:0,z:0});base.setBatianBattleBgm(true);tick=setInterval(()=>{sfx.updateWorldSfx(.05);fall?.update({x:12,y:3,z:0});base.setBatianBattleBgm(true);},50);await wait(2000);sample('music-before-attacks');for(let i=0;i<12;i++){sfx.sfxBatianShieldHit({x:18,y:0,z:0});if(i===2){fall=sfx.sfxBatianBombFall({x:12,y:3,z:0},2.2);}if(i===6)sample('shield-fall-mix');await wait(90);}sample('burst-ended');await wait(1400);fall?.stop();sfx.sfxBatianBombExplosion({x:9,y:0,z:0});await wait(150);sample('blast-duck');await wait(4200);sample('recovered');clearInterval(tick);base.setBatianBattleBgm(false);await wait(150);sample('stopped');status.textContent=JSON.stringify({scope:'Actual HTMLAudioElement Hitman request and production WebAudio bus; readyState/currentTime must prove playback, not a recording',peakForeground,peakVoices,observations},null,2);}catch(e){status.textContent=JSON.stringify({error:String(e),observations});}finally{clearInterval(tick);fall?.stop();base.setBatianBattleBgm(false);}};
</script></html>
