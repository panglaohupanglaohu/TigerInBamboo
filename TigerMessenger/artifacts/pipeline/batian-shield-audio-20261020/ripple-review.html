<!doctype html><html lang="zh"><meta charset="utf-8"><title>护盾圆波 · 真实渲染检查夹具</title><script type="importmap">{"imports":{"three":"/TigerMessenger/vendor/three.module.js"}}</script><style>body{margin:0;background:#202a38;color:#f2e4c5;font:16px system-ui}header{padding:14px}button{padding:10px}pre{position:absolute;bottom:10px;left:15px;pointer-events:none}</style><header>独立真实GPU检查夹具：只展示防护罩与正式武器模块圆波，不是完整游戏实录。<p><button id="single">单次拦截并定格</button><button id="burst">连续拦截</button><button id="clear">结束并检查清理</button></p></header><div id="view"></div><pre id="status">待验证</pre><script type="module">
import * as T from 'three';import {createBatianArsenal,shieldSegmentHit} from '../../../src/world/batianArsenal.js';import {sfxBatianShieldHit,setSfxListener,getWorldSfxSnapshot,updateWorldSfx} from '../../../src/audio/worldSfx.js';import {ensureAudio} from '../../../src/audio/sfx.js';
const scene=new T.Scene(),craft=new T.Group();scene.add(craft);const shield=new T.Mesh(new T.IcosahedronGeometry(1,2),new T.MeshBasicMaterial({color:0x829bcc,transparent:true,opacity:.075,side:T.DoubleSide,depthWrite:false}));shield.scale.set(40,10,40);craft.add(shield);shield.add(new T.LineSegments(new T.WireframeGeometry(shield.geometry),new T.LineBasicMaterial({color:0x86ffe0,transparent:true,opacity:.24,depthWrite:false,fog:false})));
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,Math.max(300,innerHeight-150));document.querySelector('#view').append(renderer.domElement);const camera=new T.PerspectiveCamera(45,innerWidth/Math.max(300,innerHeight-150),.1,500);camera.position.set(57,28,105);camera.lookAt(0,0,0);const arsenal=createBatianArsenal({scene,aircraft:craft,audio:{shieldHit:sfxBatianShieldHit}});setSfxListener(camera.position,camera);let frozen=true,last=performance.now(),timer=null,frame=0;
const status=document.querySelector('#status'),snapshot=()=>{status.textContent=JSON.stringify({fixture:true,frozen,arsenal:arsenal.snapshot(),audio:getWorldSfxSnapshot().oneShots,drawCalls:renderer.info.render.calls,renderer:renderer.getContext().getParameter(renderer.getContext().VERSION)},null,2);};
async function hit(){const ctx=ensureAudio();if(ctx)await ctx.resume();const point=shieldSegmentHit(new T.Vector3(50,15,80),new T.Vector3(0,0,0),craft);arsenal.shieldImpact(point,craft);}
document.querySelector('#single').onclick=async()=>{clearInterval(timer);frozen=true;arsenal.update(2);await hit();arsenal.update(.25);snapshot();};document.querySelector('#burst').onclick=async()=>{clearInterval(timer);frozen=false;let n=0;await hit();timer=setInterval(async()=>{await hit();if(++n===11){clearInterval(timer);timer=null;}},90);};document.querySelector('#clear').onclick=()=>{clearInterval(timer);timer=null;frozen=true;arsenal.update(3);snapshot();};function render(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!frozen)arsenal.update(dt);updateWorldSfx(dt);renderer.render(scene,camera);if(++frame%20===0)snapshot();requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
