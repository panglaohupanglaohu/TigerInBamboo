<!doctype html><html lang="zh"><meta charset="utf-8"><title>护盾音效 · 持续连击资源检查</title><style>body{font:17px system-ui;background:#202a38;color:#f2e4c5;padding:28px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>持续连击资源检查</h1><p>真实浏览器正式护盾声音，100次命中，约10秒结束。只检查声源生命周期和缓冲复用，不是完整游戏性能测试。</p><button id="run">运行持续连击检查</button><pre id="status">待运行</pre><script type="module">
import {ensureAudio} from '../../../src/audio/sfx.js';import {setSfxListener,sfxBatianShieldHit,getWorldSfxSnapshot} from '../../../src/audio/worldSfx.js';
const status=document.querySelector('#status'),wait=t=>new Promise(r=>setTimeout(r,t));
document.querySelector('#run').onclick=async()=>{const ctx=ensureAudio();await ctx.resume();const original={createBuffer:ctx.createBuffer.bind(ctx),createOscillator:ctx.createOscillator.bind(ctx),createBufferSource:ctx.createBufferSource.bind(ctx)};let buffers=0,created=0,ended=0,peakPending=0,accepted=0,peakVoices=0;const track=node=>{created++;peakPending=Math.max(peakPending,created-ended);node.addEventListener('ended',()=>ended++,{once:true});return node;};ctx.createBuffer=(...args)=>{buffers++;return original.createBuffer(...args);};ctx.createOscillator=(...args)=>track(original.createOscillator(...args));ctx.createBufferSource=(...args)=>track(original.createBufferSource(...args));try{setSfxListener({x:0,y:0,z:0});sfxBatianShieldHit({x:18,y:0,z:0});await wait(650);const warmBuffers=buffers,warmCreated=created,warmEnded=ended;for(let i=0;i<100;i++){if(sfxBatianShieldHit({x:18,y:0,z:0}))accepted++;const voices=getWorldSfxSnapshot().oneShots.length;peakVoices=Math.max(peakVoices,voices);await wait(85);}await wait(1000);status.textContent=JSON.stringify({context:ctx.state,attempts:100,accepted,peakTrackedVoices:peakVoices,warmBuffers,additionalBuffers:buffers-warmBuffers,warmCreated,warmEnded,totalSourcesCreated:created,totalSourcesEnded:ended,pendingSources:created-ended,peakScheduledSourcesIncludingSilentFadingTails:peakPending,finalVoices:getWorldSfxSnapshot().oneShots.length,scope:'isolated real WebAudio source lifecycle; tracked audible voice cap differs from short fading source tails'},null,2);}catch(e){status.textContent=String(e);}finally{Object.assign(ctx,original);}};
</script></html>
