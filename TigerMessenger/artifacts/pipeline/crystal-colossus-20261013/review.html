import * as T from 'three';import {installCrystalColossus} from '../../../src/assets/crystalColossus.js';import {getCityFrame} from '../../../src/world/crystalCityLayout.js';import {canyonOffsetDir} from '../../../src/world/canyon.js';
const scene=new T.Scene();scene.background=new T.Color('#adc7cf');const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);scene.add(new T.HemisphereLight(0xe7f5ff,0x3a4350,2));const frame=getCityFrame(),sun=new T.DirectionalLight(0xfff4e0,3);sun.position.copy(frame.center).multiplyScalar(200).addScaledVector(frame.east,45);scene.add(sun);const g=new T.SphereGeometry(160,160,90),p=g.attributes.position,v=new T.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).normalize();v.multiplyScalar(160+canyonOffsetDir(v));p.setXYZ(i,v.x,v.y,v.z);}g.computeVertexNormals();scene.add(new T.Mesh(g,new T.MeshStandardMaterial({color:0x9ea694,roughness:.85})));const api=installCrystalColossus(scene,{sun}),cam=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);cam.up.copy(frame.center);let t=0,mode='craft';function aim(){const center=api.aircraft.position;cam.position.copy(mode==='craft'?center:frame.center.clone().multiplyScalar(160)).addScaledVector(frame.center,mode==='craft'?36:145).addScaledVector(frame.north,mode==='craft'?-90:-125).addScaledVector(frame.east,mode==='craft'?70:100);cam.lookAt(mode==='craft'?center:frame.center.clone().multiplyScalar(155));}craft.onclick=()=>{mode='craft';aim();};domain.onclick=()=>{mode='domain';aim();};advance.onclick=()=>{t+=30;api.update(t);aim();};r.setAnimationLoop(()=>{t+=.016;api.update(t);aim();info.textContent=JSON.stringify({t:+t.toFixed(1),length:70,shadow:api.shadow.visible});r.render(scene,cam);});
