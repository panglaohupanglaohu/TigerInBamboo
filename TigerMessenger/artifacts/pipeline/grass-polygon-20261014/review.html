import * as T from 'three';import {buildHills} from '../../../src/world/hills.js';import {buildWorld} from '../../../src/world/platforms.js';import {createPlanet} from '../../../src/world/planet.js';import {createMoonLake} from '../../../src/world/lake.js';import {flatToWorld} from '../../../src/world/sphereMath.js';
const scene=new T.Scene();scene.background=new T.Color('#dbad7e');const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const planet=createPlanet(scene),platforms=buildWorld(scene),hills=buildHills(scene,160),lake=createMoonLake(scene,160);scene.add(new T.HemisphereLight(0xfff0db,0x4e6955,2));const sun=new T.DirectionalLight(0xffe2b5,2);sun.position.set(-100,240,100);scene.add(sun);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
function view(x,z,height,targetx,targetz){camera.position.copy(flatToWorld(x,height,z,160));camera.up.copy(camera.position).normalize();camera.lookAt(flatToWorld(targetx,.6,targetz,160));}wide.onclick=()=>view(25,55,70,6,0);near.onclick=()=>view(12,12,14,10,0);wire.onclick=()=>{hills.mesh.material.wireframe=!hills.mesh.material.wireframe;};wide.onclick();report.textContent=JSON.stringify({hexes:hills.mesh.geometry.userData.hexGrass.hexes,clipped:hills.mesh.geometry.userData.hexGrass.clipped,triangles:hills.mesh.geometry.index.count/3});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
