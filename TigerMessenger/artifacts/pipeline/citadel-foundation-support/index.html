<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老城岩体支撑 · 两轮实景对照</title><style>body{margin:0;background:#101b29;color:#e4e8ee;font:17px/1.65 system-ui}main{max-width:1400px;margin:auto;padding:30px}h1{font-size:30px}a{color:#89c8ff}section{margin:35px 0}img{width:100%;display:block;border-radius:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}figcaption{padding:8px 0;color:#b9c7d4}.note{padding:18px;background:#22354a;border-radius:10px}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><main><p><a href="../citadel-default-entry/index.html">当前已合入默认 8931 入口：查看合入结果</a></p><p><a href="../citadel-shore-arcades/index.html">最新：两层滨水建筑及侧向入口已接入</a></p><h1>老城临海底座：从悬空边缘接回岩体</h1><p>保留原建筑与楼梯。Blender 两轮迭代，当前新增一个网格、192 个三角形。18 个非通路边缘测点已接住基础；5 个楼梯邻近点保留净空。</p><p><a href="/TigerMessenger/?autostart=1&amp;citadelCommonFrame=1&amp;citadelOldHarbor=1">进入 8931 原游戏候选</a> · <a href="/TigerMessenger/docs/CITADEL_FOUNDATION_SUPPORT.md">工程记录</a></p><p class="note" id="status">Web 与 Godot 候选已接入：楼梯 1,473 个采样点通过，Godot 原装备短剑兵走完 90 段。整体目标尚未完成，默认入口布局尚未切换。</p><section><h2>同机位游戏近景</h2><div class="pair"><figure><img src="before-detail.png"><figcaption>修改前：薄底座下方存在缺口。</figcaption></figure><figure><img src="after-detail.png"><figcaption>R02：岩体接住底座，并保留沿坡上城楼梯。</figcaption></figure></div></section><section><h2>两次迭代</h2><div class="pair"><figure><img src="r01-after-detail.png"><figcaption>R01：接上了，但竖直条状岩面仍显机械。</figcaption></figure><figure><img src="after-detail.png"><figcaption>R02：打散岩层高度与坡脚宽度。</figcaption></figure></div></section><section><h2>Blender 实物渲染</h2><div class="pair"><figure><img src="blender-r01.png"><figcaption>第一轮闭合支撑体。</figcaption></figure><figure><img src="blender-r02.png"><figcaption>第二轮岩坡分面。</figcaption></figure></div></section><section><h2>全景与认可目标</h2><div class="pair"><figure><img src="after.png"><figcaption>当前真实游戏。仍有大片裸岩、滨水建筑与目标的差距。</figcaption></figure><figure><img src="../citadel-old-harbor-grade/approved-target.png"><figcaption>认可目标：下一步继续分层滨水建筑、岸门与植被。</figcaption></figure></div></section><section id="native"><h2>同工程 Godot</h2><div class="pair"><figure><img src="godot-after-day.png"><figcaption>白天实景。</figcaption></figure><figure><img src="godot-after-night.png"><figcaption>夜间实景。</figcaption></figure></div></section></main></html>
