<h1>柏树与广场雕像 · 材质修复</h1>
<p>修正合并后的植物与雕像被城市统一石墙处理误覆盖的问题。柏树保留原绿叶/树皮，雕像与基座恢复原模型的暖白石雕；真正城墙继续使用砖纹。没有改几何、位置或道路。</p>
<p><a href="live.html">打开实际场景近景检查</a> · <a href="status.json">验收记录</a> · <a href="after-test.txt">回归测试</a></p>

<p>测试使用真实植物和雕像工厂，并额外把柏树再次合并为匿名网格。完整材质处理顺序下，误改由16个降为0个，原材质身份、颜色、粗糙度、金属度和几何保持；建筑墙体的砖纹及城市配色仍在。</p>
<p>旧页面已经创建的材质不会自动替换，需要刷新游戏页。<a href="citadel-material-tree.json">柏树实际材质/GPU记录</a> · <a href="citadel-material-statue.json">雕像实际材质/GPU记录</a></p></html>
