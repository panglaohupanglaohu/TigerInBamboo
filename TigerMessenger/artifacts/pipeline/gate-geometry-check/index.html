<!doctype html><meta charset="utf-8"><title>叹息之门 · 同模型三视图</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#edf1f6;color:#172738;font:16px system-ui}h1{margin:0 0 12px;font-size:28px}.legend{display:flex;gap:25px;margin:12px 0}.a{color:#bc3a22}.b{color:#087e6e}.c{color:#6940bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;background:white;border-radius:8px;overflow:hidden}figcaption{padding:12px 16px;font-size:18px;font-weight:650}img{width:100%;display:block}p{line-height:1.6;margin:8px 0 18px}.note{padding:0 16px 12px;font-size:14px}a{color:#255fa0}</style><h1>叹息之门：同一个三维模型的投影校验</h1><figure><figcaption>最新目标 V8：补建左右纵向拱廊，与正面门洞组成完整建筑（概念候选，未回接模型）</figcaption><img src="../../../assets/concepts/gate-of-sighs/target-v8-side-arcades.png"></figure><div class="legend"><b class="a">A · 近门（橙）</b><b class="b">B · 中门（绿）</b><b class="c">C · 远门（紫）</b></div><p>三道门等大、平行，分别横跨双轨；每道门由自己的两根柱与拱顶组成。下列均由 Blender 同一场景直接渲染，未经过生成式重绘。尺寸仅用于空间校验。</p><div class="grid"><figure><figcaption>① 斜视校验 · 三道完整拱门</figcaption><img src="axonometric.png"><div class="note">颜色沿同一道门连续，便于检查六根柱子各自对应哪个拱顶。</div></figure><figure><figcaption>② 正视 · 沿轨道方向的正投影</figcaption><img src="front.png"><div class="note">三道等大同轴门在正投影中重合，A挡住B、C；透视相机才会产生逐层缩小的嵌套。</div></figure><figure><figcaption>③ 严格侧视 · 垂直于轨道方向</figcaption><img src="side.png"><div class="note">能看到A、B、C三个站位，但拱门是侧边厚度。若能看见完整拱洞，那是斜视，不能称严格侧立面。</div></figure><figure><figcaption>④ 俯视 · 两条轨道依次穿过三道门</figcaption><img src="top.png"><div class="note">三道彩色横梁均垂直于铁路。会面台布置在入门前、轨道左侧。</div></figure></div><p><a href="gate-three-views.blend">同源 Blender 模型</a> · <a href="build.py">可复现生成脚本</a></p>
