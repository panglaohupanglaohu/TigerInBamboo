<!doctype html><html><meta charset="utf-8"><title>Morris悬铃树·红皮黄瓤</title><style>body{margin:0}header{position:fixed;top:10px;left:10px;background:#f3e9d7dd;padding:10px;font:14px sans-serif}button{padding:8px}</style><header>生产树模型检查 · 用户指定红皮黄瓤<br><button id="tree">整树</button><button id="fruit">果实近景</button></header><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/jsm/"}}</script><script type="module">import * as T from'three';import{createMorrisPlaneTree}from'../../../src/world/morrisBotany.js?v=red-fruit-r1';const s=new T.Scene();s.background=new T.Color(0xadc5c5);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);s.add(new T.HemisphereLight(0xfff5de,0x5f7357,2.2));const sun=new T.DirectionalLight(0xffedce,2.6);sun.position.set(-10,20,10);s.add(sun);const t=createMorrisPlaneTree();s.add(t);t.updateWorldMatrix(true,true);const c=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);tree.onclick=()=>{c.position.set(-15,12,22);c.lookAt(0,8,0);};fruit.onclick=()=>{const m=t.getObjectByName('plane-red-fruit-peel'),a=m.geometry.attributes.position,b=new T.Box3();for(let j=0;j<130;j++)b.expandByPoint(new T.Vector3().fromBufferAttribute(a,j));const p=m.localToWorld(b.getCenter(new T.Vector3()));c.position.copy(p).add(new T.Vector3(-.65,.20,.48));c.lookAt(p);};tree.click();r.setAnimationLoop(()=>r.render(s,c));</script></html>
