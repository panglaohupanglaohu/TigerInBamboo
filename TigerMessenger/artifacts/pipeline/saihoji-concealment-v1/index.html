<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苔庭五区隐蔽环境 · Blender → Godot</title><style>body{margin:28px;background:#16211d;color:#e9f0e4;font:17px/1.7 system-ui}main{max-width:1250px;margin:auto}img{width:100%;border-radius:12px;background:#334}a{color:#b7db9a}.card{padding:16px;border-radius:12px;background:#213027}li{margin:.35em 0}</style><main><h1>苔庭五区隐蔽环境</h1><p>鲲与背上的苔庭不是孤立漂浮物。五个原作场景母题以不均匀外圈覆盖其轮廓，中央保留空庭、战斗站位与起飞揭示空间。鲲抬升时，外围环境作为苔庭岛的子节点一同升空。</p><section class="card"><img src="five-zone-concealment.png" alt="Blender 中的五区外围苔庭资产"><h2>五个外围分区</h2><ul><li>入口苔径：低矮苔坡与入口松组</li><li>主石之庭：背侧石组与收束松</li><li>枯瀑之庭：侧翼岩脊，不添加真实瀑布</li><li>苔海岛群：水侧遮蔽与开阔苔面</li><li>回望石组：后侧观景石与稀疏树组</li></ul><p>空庭没有被填满；它仍服务蓝盔伏击、重甲登陆与鲲起飞的可读性。</p></section><p>已导入 Godot：<a href="../../../godot/assets/saihoji-concealment-v1/manifest.json">资产清单</a> · <a href="../../../godot/scripts/saihoji_concealment_adapter.gd">Godot 接入脚本</a> · <a href="../saihoji-battle-review/index.html">苔庭之战总览</a></p></main></html>
