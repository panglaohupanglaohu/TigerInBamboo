<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>十二门徒 · 岩台植被</title><style>body{max-width:1400px;margin:32px auto;padding:0 22px;background:#21343c;color:#e6ece6;font:17px/1.7 system-ui}img{width:100%;border-radius:8px}a{color:#b9d8bf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><h1>十二门徒 · 草皮与海岸低丛</h1><p>保留已认可的岩体与布局。植被由散落的小圆球，改为贴合岩台的连续草皮、簇状低丛和短草叶，保留裸岩间隙。</p><p><a href="../../../?autostart=1">进入游戏</a> · <a href="notes.md">实现与验证</a></p><h2>岩群全景</h2><img src="after-coastline.png"><h2>岩台近景</h2><img src="after-vegetation.png"><h2>同机位对照</h2><div class="pair"><div><p>之前：分散的圆灌木</p><img src="before-side.png"></div><div><p>现在：草皮与低丛</p><img src="after-side.png"></div></div><p>借鉴Oskar 2022年后期草地实验中连续色面与簇状轮廓的视觉组织。此处为项目自有的三角面覆盖与实例草叶，不是对作者billboard、深度或背景对比shader的复刻，也不称为Bad North草系统。</p></html>
