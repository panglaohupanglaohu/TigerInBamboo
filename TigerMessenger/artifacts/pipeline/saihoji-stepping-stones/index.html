<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苔庭散置踏步石</title><style>body{background:#18231e;color:#edf1e5;font:17px/1.7 system-ui;margin:30px}main{max-width:1300px;margin:auto}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%}a{color:#bbd9a8}@media(max-width:700px){section{grid-template-columns:1fr}}</style><main><h1>苔庭散置踏步石</h1><p>撤去六景之间等间距连续铺石和入口七石直线，改为26块疏密不一的散置石；空庭仅留2块。每块石头大小、朝向有变化，落在真实苔台上，避开松根和主石。当前树仍为v1，树形与逐面配色v2另行迭代。</p><section><article><h2>此前连续道路</h2><img src="near-before.png"></article><article><h2>当前散置与留白</h2><img src="near-after.png"></article></section><section><article><h2>此前远景</h2><img src="far-before.png"></article><article><h2>当前远景</h2><img src="far-after.png"></article></section><p>同一隔离真实苔庭场景与相机。树、松下槽位与踏步石共10项检查通过；不代表整体场景美术验收。</p><p><a href="../saihoji-pine-layout/index.html">松林与原目标图</a> · <a href="../saihoji-pine-layout/report.json">检查报告</a> · <a href="http://localhost:8931/TigerMessenger/">进入游戏</a></p></main></html>
