<h1>信使：三轮头部、两轮动作与布料</h1>

<h2>Blender 实际烘焙画面</h2><img loading="lazy" src="blender-vault-round-2.png">
<script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from '../../../vendor/three.module.js';
import {OrbitControls} from './OrbitControls.js';
import {buildRig,pose,snapshot,clips} from './rig.js';
const host=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1.25);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#28343f');const camera=new THREE.PerspectiveCamera(36,1,.01,100);camera.position.set(3.6,2.3,3.8);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();
scene.add(new THREE.HemisphereLight(0xffedd8,0x475363,2));for(const [x,y,z,intensity] of [[-3,5,4,3],[4,3,1,1.2],[1,4,-4,2]]){const l=new THREE.DirectionalLight(0xffffff,intensity);l.position.set(x,y,z);if(x<0){l.castShadow=true;l.shadow.mapSize.set(1024,1024);l.shadow.camera.left=-4;l.shadow.camera.right=4;l.shadow.camera.top=4;l.shadow.camera.bottom=-4;l.shadow.bias=-.0001}scene.add(l)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.MeshStandardMaterial({color:0x66716f,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);
const wall=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.05,.24),new THREE.MeshStandardMaterial({color:0x9d9485,roughness:1}));wall.position.y=.525;wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);
const state={clip:'walk',time:0,playing:true,round:2,clothRound:2,rig:null};
const [headStage,motionRound,clothRound,play,replay,scrub,side,front,face,top,headGallery]=['headStage','motionRound','clothRound','play','replay','scrub','side','front','face','top','headGallery'].map(id=>document.getElementById(id));
async function load(stage){const data=(await import(`../../../assets/models/optimized/human-courier-production/head-${stage}/geometry.js`)).default;const rig=buildRig(data);if(state.rig)scene.remove(state.rig.root);state.rig=rig;scene.add(rig.root);renderPose();}
function renderPose(){if(!state.rig)return;wall.visible=state.clip==='vault';const result=pose(state.rig,state.clip,state.time,state.round,state.clothRound);document.querySelector('#scrub').value=state.time/clips[state.clip].duration;document.querySelector('#status').textContent=`${state.clip} · ${state.time.toFixed(2)} 秒 · 脚部解算偏差 ${(result.footError*100).toFixed(1)} cm · 手部偏差 ${(result.handError*100).toFixed(1)} cm · 这是动作检查场，不是原游戏关卡。`;renderer.render(scene,camera);}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{state.clip=b.dataset.clip;state.time=0;state.playing=true});
headStage.onchange=()=>load(headStage.value);motionRound.onchange=()=>{state.round=+motionRound.value;renderPose()};clothRound.onchange=()=>{state.clothRound=+clothRound.value;renderPose()};
play.onclick=()=>state.playing=!state.playing;replay.onclick=()=>{state.time=0;state.playing=true};scrub.oninput=()=>{state.playing=false;state.time=+scrub.value*clips[state.clip].duration;renderPose()};
side.onclick=()=>{camera.position.set(4.6,1.6,.3);controls.target.set(0,1,.3);controls.update()};front.onclick=()=>{camera.position.set(0,1.6,5);controls.target.set(0,1,.3);controls.update()};face.onclick=()=>{state.playing=false;state.time=0;renderPose();const p=state.rig.nodes.get('head').getWorldPosition(new THREE.Vector3());camera.position.copy(p).add(new THREE.Vector3(.25,.06,.85));controls.target.copy(p).add(new THREE.Vector3(0,.08,0));controls.update()};top.onclick=()=>{state.playing=false;state.time=0;renderPose();const p=state.rig.nodes.get('head').getWorldPosition(new THREE.Vector3());camera.position.copy(p).add(new THREE.Vector3(0,.9,.001));controls.target.copy(p);controls.update()};
new ResizeObserver(()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}).observe(host);
for(const view of ['front','profile','top','three-quarter'])headGallery.innerHTML+=`<h3>${view}</h3><div class="grid">${[1,2,3].map(i=>`<figure><figcaption>第${i}轮</figcaption><img loading="lazy" src="head-${i}-${view}.png"></figure>`).join('')}</div>`;
for(const [clip,label] of Object.entries({walk:'走',run:'跑',jump:'跳',vault:'翻墙'}))document.querySelector('#videos').innerHTML+=`<h3>${label}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${[1,2].map(i=>`<div>第${i}轮<video style="width:100%" controls loop muted preload="none" poster="${clip}-round-${i}-key.png" src="${clip}-round-${i}.webm"></video></div>`).join('')}</div>`;
let last=performance.now();function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state.playing)state.time=(state.time+dt)%clips[state.clip].duration;renderPose();requestAnimationFrame(tick)}
window.courierProduction={state,scene,camera,renderer,controls,load,pose,snapshot,clips,renderPose};await load(+headStage.value);requestAnimationFrame(tick);
</script></html>
