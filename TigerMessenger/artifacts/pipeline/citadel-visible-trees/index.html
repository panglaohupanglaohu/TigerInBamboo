<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>圣城山坡植被复查</title><style>body{background:#152331;color:#edf1ef;font:17px/1.7 system-ui;margin:0}main{max-width:1250px;margin:auto;padding:28px}a{color:#9ed3ff}img{width:100%;display:block}figure{margin:24px 0}</style><main><h1>孤立树冠换为完整柏树</h1><p>实际排查发现原灰绿球团是单独树冠几何，中心点与地面接触，不能说是整体悬空坐标错误。压扁树冠的试验仍然不好看，已放弃。当前复用既有 Blender 柏树，按间距和根部支撑选出31株，原完整圆冠树保留。</p><p>已接入 <a href="/TigerMessenger/">8931原游戏</a> 与同一Godot。主山坡/桥边岩壁仍需进一步对照目标，不把这次替换等同于地形完成。</p><figure><img src="after.png"><figcaption>现在：桥附近孤立球状树冠已替换。</figcaption></figure><figure><img src="before.png"><figcaption>上一批同机位。</figcaption></figure><figure><img src="godot-after.png"><figcaption>同一Godot工程。</figcaption></figure><figure><img src="blender-layout.png"><figcaption>Blender r03 地形和植物布局检视，不包含完整城市建筑和海面。</figcaption></figure><p><a href="placement.json">31株位置与筛选记录</a> · <a href="godot-test.json">Godot几何检查</a>。新柏树4个合并材质面、4960三角形；退役独立圆团实例为0。网页广场1406点和原船上下船检查通过。</p></main></html>
