<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岩柱组件技术试验 — 非全场景</title>
<style>body{margin:0;background:#17232c;color:#e5edf2;font:14px system-ui}header{padding:10px}h1{font-size:18px;margin:0 0 6px}button,select{padding:7px;margin:3px;background:#344854;color:inherit;border:1px solid #6b8795;border-radius:4px}canvas{display:block;width:100%;height:72vh}pre{white-space:pre-wrap;max-height:35vh;overflow:auto;font-size:12px;padding:10px}p{margin:6px 0}</style>
<header><h1>独立岩柱组件技术试验 · 不是全场景截图</h1><p>直接调用当前生产几何、表面场与植被着色器。固定白昼光照；不包含实际球面海水、铁路、城镇或海蚀接触系统，不能用于验收布局及水线。</p>
<select id="seed" aria-label="岩柱种子"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>10</option></select>
<button data-angle="0">正面</button><button data-angle="90">侧面</button><button data-angle="180">背面</button><button data-angle="270">另一侧</button><button id="top">俯视</button><button id="flat">白模</button><button id="unlit">本色</button><button id="plants">植被开关</button><button id="png">导出组件 PNG</button><span id="status">加载模块…</span></header>
<canvas id="view"></canvas><pre id="report"></pre>
<script type="importmap">{"imports":{"three":"/TigerMessenger/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {coastalStackGeometry} from '/TigerMessenger/src/world/seaStackCoastalGeometry.js';
import {prepareSeaStackSurface,createCoastalMaterial,bindCoastalMesh} from '/TigerMessenger/src/world/seaStackLighting.js';
import {plantSeaStackTerraces} from '/TigerMessenger/src/world/seaStackVegetation.js';
const $=s=>document.querySelector(s),canvas=$('#view'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,1,.1,1000),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));scene.background=new THREE.Color(0xa9bcc6);
const sun=new THREE.DirectionalLight(0xfff1d5,2);sun.name='component-fixed-day-sun';sun.position.set(35,65,45);scene.add(sun,sun.target,new THREE.HemisphereLight(0xb9d6eb,0x6f7770,1));
const white=new THREE.MeshBasicMaterial({color:0xe0dfd8,side:THREE.DoubleSide}),cache=new Map(),errors=[];let rock,angle=0,elevation=.2,flat=false,unlit=false,plants=true;
const originalError=console.error.bind(console);console.error=(...args)=>{originalError(...args);errors.push(args.map(String).join(' '));};window.addEventListener('error',e=>errors.push(e.message));
function report(){const programs=(renderer.info.programs||[]).map(p=>({id:p.id,runnable:p.diagnostics?.runnable,programLog:p.diagnostics?.programLog,vertexLog:p.diagnostics?.vertexShader?.log,fragmentLog:p.diagnostics?.fragmentShader?.log}));$('#report').textContent=JSON.stringify({scope:'standalone component, not full game',seed:Number($('#seed').value),angle,elevation,flat,unlit,plants,dimensions:rock.userData.seaStack,geometry:rock.geometry.userData,vegetation:rock.userData.vegetationAudit,surface:rock.userData.coastalSurface,camera:{position:camera.position.toArray(),aspect:camera.aspect,fov:camera.fov},render:renderer.info.render,programs,errors},null,2);}
function render(){if(!rock)return;renderer.render(scene,camera);report();}
function fit(){if(!rock)return;scene.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(rock),center=box.getCenter(new THREE.Vector3()),corners=[];for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z])corners.push(new THREE.Vector3(x,y,z));const a=angle*Math.PI/180,direction=new THREE.Vector3(Math.sin(a),elevation,Math.cos(a)).normalize();camera.up.set(0,1,0);camera.updateProjectionMatrix();const fits=d=>{camera.position.copy(center).addScaledVector(direction,d);camera.lookAt(center);camera.updateMatrixWorld(true);return corners.every(p=>{const q=p.clone().project(camera);return Math.abs(q.x)<.85&&Math.abs(q.y)<.85&&q.z>-1&&q.z<1;});};let lo=0,hi=box.getSize(new THREE.Vector3()).length()*3;while(!fits(hi))hi*=1.2;for(let i=0;i<32;i++){const mid=(lo+hi)/2;if(fits(mid))hi=mid;else lo=mid;}fits(hi);render();}
function style(){rock.material=flat?white:rock.userData.originalMaterial;rock.children.forEach(o=>o.visible=plants);rock.traverse(o=>{for(const m of Array.isArray(o.material)?o.material:[o.material])if(m?.userData.coastalLighting)m.userData.coastalLighting.unlit=unlit;});rock.userData.originalMaterial.userData.coastalLighting.unlit=unlit;render();}
function build(){const seed=Number($('#seed').value),i=seed===10?0:seed,h=28+(i*13%28),radius=(12+(i%3)*4)*.68;$('#status').textContent='生成实际模块…';if(rock)scene.remove(rock);if(cache.has(seed))rock=cache.get(seed);else{rock=new THREE.Mesh(coastalStackGeometry(radius,h,seed),createCoastalMaterial({kind:'rock',height:h}));rock.userData.seaStack={height:h,radius,seaAnchor:[0,-h/2+6,0],detailId:'component-'+seed};rock.userData.originalMaterial=rock.material;scene.add(rock);prepareSeaStackSurface(rock,scene);bindCoastalMesh(rock,rock);plantSeaStackTerraces(rock);cache.set(seed,rock);}scene.add(rock);style();fit();$('#status').textContent='Ready · 固定光照 · 独立组件';}
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;fit();}new ResizeObserver(resize).observe(canvas);
$('#seed').onchange=build;document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);elevation=.2;fit();});$('#top').onclick=()=>{elevation=1.8;fit();};$('#flat').onclick=()=>{flat=!flat;style();};$('#unlit').onclick=()=>{unlit=!unlit;style();};$('#plants').onclick=()=>{plants=!plants;style();};$('#png').onclick=()=>{render();const a=document.createElement('a');a.download=`component-only-seed${$('#seed').value}-angle${angle}-flat${Number(flat)}-unlit${Number(unlit)}.png`;a.href=canvas.toDataURL('image/png');a.click();};try{build();resize();}catch(e){errors.push(String(e.stack||e));$('#status').textContent='组件生成失败';$('#report').textContent=errors.join('\n');}
</script></html>
