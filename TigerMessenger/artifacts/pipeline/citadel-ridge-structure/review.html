<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高山圣城 · 山势结构</title><style>body{margin:0;background:#17262e;color:#e2e4dd;font:16px/1.7 Georgia,serif}main{max-width:1400px;margin:40px auto;padding:0 24px}h1{font-weight:400;font-size:38px}a{color:#abcdd4}select,button{background:#30414b;color:white;padding:10px;border:1px solid #617079}figure{margin:20px 0;position:relative;aspect-ratio:1.5;overflow:hidden;background:#26343d}figure img{position:absolute;width:100%;height:100%;object-fit:contain}#new{clip-path:inset(0 50% 0 0)}input{width:100%}.labels{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid img{width:100%}small{color:#b0bfc3}</style><main><small>实际游戏渲染 · 4 次结构修正 · 同机位对照</small><h1>主峰、支脉与低鞍部</h1><p>压低孤立尖顶，连接裸山山脊，增加向海湾展开的支脉。保留城基、港口、步行面和铁路，植被重新依附最终岩面。</p><p><a href="../../../?autostart=1">进入实际场景</a> · <a href="notes.md">修改与验证记录</a></p><select id="view"><option value="old-mountain">旧城侧山势</option><option value="overview">两城总览</option><option value="new-mountain">新城背面</option><option value="new-facade">新城与山脊</option></select><figure><img id="old" alt="修改前"><img id="new" alt="修改后"></figure><div class="labels"><span>修改后 ←</span><span>→ 修改前</span></div><input id="split" aria-label="前后对照位置" type="range" min="0" max="100" value="50"><p>本轮采用人工定义的连续山脊图、局部沟槽与两轮受约束平滑，尚未接入完整 WFC 或水力侵蚀模拟。整体仍为风格化几何，不能等同写实目标图。</p><details><summary>黄昏与夜间实景</summary><div class="grid"><img src="final-dusk.png" alt="黄昏"><img src="final-night.png" alt="夜景"></div></details></main><script>const a=document.querySelector('#old'),b=document.querySelector('#new'),s=document.querySelector('#split'),v=document.querySelector('#view');function update(){a.src='before-'+v.value+'.png';b.src='r04-'+v.value+'.png'}v.onchange=update;s.oninput=()=>b.style.clipPath=`inset(0 ${100-s.value}% 0 0)`;update();</script></html>
