<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湖沼 · 完整游戏球面验收</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eee7df;color:#514b64;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}header{padding:10px 14px;border-bottom:1px solid #bd929e;display:flex;gap:8px;align-items:center;flex-wrap:wrap}strong{margin-right:8px}button,a{border:1px solid #bd929e;border-radius:4px;padding:7px 10px;background:#f9f3ee;color:#514b64;text-decoration:none;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:wait}button[aria-pressed=true]{background:#bd929e;color:#fff}small{display:block;flex-basis:100%;line-height:1.6}#status{padding:8px 14px;white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace;background:#faf6f0;min-height:48px}#message{padding:4px 14px;min-height:26px;color:#75495c}iframe{border:0;display:block;flex:1;width:100%;min-height:0;background:#163d4c}label{margin-left:6px}select{font:inherit;color:inherit;padding:6px}

<header><strong>湖沼 · 完整游戏球面验收</strong>
