<!doctype html><html lang="zh"><meta charset="utf-8"><title>月湖岸线 · 生产组件检查</title><style>body{margin:0;background:#d6e5e6;font:14px sans-serif}header{position:fixed;z-index:2;background:#fffD;padding:10px;max-width:550px}button{margin:5px}canvas{display:block}pre{font-size:12px;white-space:pre-wrap}</style><header>月湖岸线 · 生产组件检查（不是正常游戏验收）<br>同一生产月湖工厂、球面地形、固定日光与相机；不加载舰队/角色。<br><button id="before">原孔洞几何</button><button id="after">修复岸线</button><button id="low">低机位</button><button id="high">俯视</button><button id="harbor">旧港旧坐标</button><button id="coast">主岛东岸</button><button id="pond">庭园池岸</button><button id="corner">东北交线</button><button id="city">圣城方向外岸</button><button id="roundhigh">圆岸俯视</button><button id="platform">平台壳显隐</button><button id="hill">土坡显隐</button><button id="fixcoast">修复临海外岸</button><pre id="report"></pre></header><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><script type="module">
