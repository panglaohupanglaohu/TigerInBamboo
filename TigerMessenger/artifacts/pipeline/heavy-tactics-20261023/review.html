<!doctype html><meta charset="utf-8"><title>重甲兵盾枪剑 · 实际组件验证</title><style>body{margin:0;background:#adbdbd;font:14px system-ui}aside{position:fixed;left:12px;top:12px;background:#fffe;padding:12px;max-width:720px}button{margin:5px;padding:6px}pre{max-height:88px;overflow:auto;font-size:12px}</style><aside>现有1.5倍重甲兵＋正式战术模块 · 组件验证（红色为测试靶，非正式实战截图）<br><button id="close">近战接敌</button><button id="retreat">分批撤离</button><pre id="status"></pre></aside><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><script type="module">
import * as T from'three';import{createVanguardSquad,vanguardMuzzleWorld}from'../../../src/world/vanguardTrooper.js';import{createBatianTrooperTactics}from'../../../src/world/batianTrooperTactics.js';
const scene=new T.Scene();scene.background=new T.Color('#adbdbd');scene.add(new T.HemisphereLight(0xf0f8ff,0x59625c,2));const light=new T.DirectionalLight(0xfff1d5,3);light.position.set(8,180,12);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(90,90),new T.MeshStandardMaterial({color:0xb4ac90,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=159.95;scene.add(floor);const squad=createVanguardSquad({count:6});squad.visible=true;scene.add(squad);const host=new T.Group(),target=new T.Group();scene.add(host,target);target.position.set(0,160,13);const dummy=new T.Mesh(new T.BoxGeometry(.9,1.8,.6),new T.MeshStandardMaterial({color:0xbc6356}));dummy.position.y=.9;target.add(dummy);
const records=squad.userData.troopers.map((tr,i)=>{tr.position.set((i%3-1)*2.1+(i>=3?1.05:0),160,i>=3?-3.6:0);tr.userData.onGround=true;return{tr,host,state:'ground',slot:{seat:i,guard:false},drop:tr.position.clone(),path:[]}}),effects=[];let clock=0,stage='sweep',nextEnemy=2,enemyHits=0;
function line(a,b,color){const g=new T.BufferGeometry().setFromPoints([a,b]),m=new T.LineBasicMaterial({color}),o=new T.Line(g,m);scene.add(o);effects.push({o,age:0});}
const world=o=>o.getWorldPosition(new T.Vector3()),tactics=createBatianTrooperTactics({records,world,place:(o,p)=>o.position.copy(p),orient:(o,p,q)=>{const up=new T.Vector3(0,1,0),f=q.clone().sub(p);f.y=0;if(f.lengthSq()<1e-8)return;f.normalize();o.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(new T.Vector3().crossVectors(up,f),up,f));},groundAt:p=>new T.Vector3(p.x,160,p.z),routeWorld:(a,b)=>[b.clone()],lineClear:()=>true,onStrike:()=>{enemyHits++;dummy.material.emissive.setHex(0xa55e22);},onFire:(r,a,clear)=>{const from=vanguardMuzzleWorld(r.tr),to=world(a.m).add(new T.Vector3(0,1,0));if(!clear(from,to))return false;line(from,to,0x6fffea);return true;}});
document.querySelector('#close').onclick=()=>{const p=world(records[1].tr);target.position.copy(p).add(new T.Vector3(0,0,1.6));};document.querySelector('#retreat').onclick=()=>stage='evacuation';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,.1,500);camera.position.set(10,166,14);camera.lookAt(0,161,1);let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;tactics.update(dt,{time:clock,stage,targets:[{m:target}]});if(stage==='evacuation')for(const r of records)if(r.tactical.boardAllowed){r.boardClock=(r.boardClock||0)+dt;if(r.boardClock>1.8){r.state='aboard';r.tr.visible=false;}}if(clock>nextEnemy){nextEnemy=clock+.7;const r=records.find(q=>q.state==='ground');if(r){const from=world(target).add(new T.Vector3(0,1.5,0)),to=world(r.tr).add(new T.Vector3(0,1.5,0)),hit=tactics.intercept(from,to,15,target);line(from,hit?.point||to,0xffac6b);}}for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.age+=dt;if(e.age>.16){e.o.removeFromParent();e.o.geometry.dispose();e.o.material.dispose();effects.splice(i,1);}}document.querySelector('#status').textContent=JSON.stringify({stage,enemyHits,...tactics.snapshot()},null,2);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
