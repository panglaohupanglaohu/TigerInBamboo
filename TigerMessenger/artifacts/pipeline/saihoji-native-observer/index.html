<!doctype html><html lang="zh"><meta charset="utf-8"><title>苔庭 · 实时运行观察</title>
<style>body{margin:0;background:#13262d;color:#e8eee8;font:14px system-ui}header{padding:10px}button{padding:7px;margin-right:8px}iframe{width:1100px;max-width:100%;height:850px;border:0;display:block}pre{white-space:pre-wrap;padding:12px;margin:0}small{display:block;margin-top:8px}</style>
<header><button id="watch">固定镜头观察苔庭</button><button id="sample">采样30秒</button><button id="save">下载观察记录</button><small>沿用当前存档和真实游戏时钟。仅改变观察镜头；不注入命中、不改剧情、舰队、兵员和胜利状态。此页不是从头自然通关证明。</small><div id="brief">等待原游戏</div></header>
<iframe id="game" src="../../../?autostart=1" allow="autoplay"></iframe><pre id="status">等待原游戏加载…</pre>
<script type="module">
const frame=document.querySelector('#game'),status=document.querySelector('#status');
const report={scope:'Existing save, real RAF and unchanged combat logic; camera-only observer, not a fresh full playthrough',started:new Date().toISOString(),events:[],samples:[],errors:[]};
let api,lastSignature='',samplingUntil=0,lastSample=0,lastFrame=null,intervals=[];
const snapshot=()=>{const t=api,b=t.messenger.landmarks.saihojiPhalanx,w=t.scene.getObjectByName('leviathanGroup'),f=t.scene.getObjectByName('moebius-aircraft-squad'),gl=t.renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');return {at:new Date().toISOString(),phase:b.root.userData.phase,ambush:b.root.userData.saihojiAmbush?.state?.stage,departure:b.root.userData.kunDeparture,roll:w?.userData.victoryRoll,hits:f?.userData.squadArrowHits??0,gpu:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),viewport:[gl.drawingBufferWidth,gl.drawingBufferHeight],perf:t.perfProbe.snapshot()};};
document.querySelector('#watch').onclick=()=>{if(!api)return;const t=api,T=t.THREE,w=t.scene.getObjectByName('leviathanGroup'),up=w.position.clone().normalize(),east=new T.Vector3().crossVectors(up,new T.Vector3(0,1,0)).normalize();t.cameraRig.update=()=>{};t.camera.position.copy(w.position).addScaledVector(up,20).addScaledVector(east,32);t.camera.up.copy(up);t.camera.lookAt(w.position);report.cameraOnlyOverride=true;};
document.querySelector('#sample').onclick=()=>{if(!api)return;api.perfProbe.reset();report.samples=[];intervals=[];lastFrame=null;lastSample=0;samplingUntil=performance.now()+30000;report.sampleStarted=new Date().toISOString();};
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='saihoji-native-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
function draw(now){try{if(!api&&frame.contentWindow.__tm?.messenger?.landmarks?.saihojiPhalanx){api=frame.contentWindow.__tm;frame.contentWindow.addEventListener('error',e=>report.errors.push(e.message));}if(api){if(samplingUntil&&lastFrame!==null&&!document.hidden)intervals.push(now-lastFrame);lastFrame=now;if(now-lastSample>1000){lastSample=now;const s=snapshot(),signature=JSON.stringify([s.phase,s.ambush,s.roll?.reason,s.roll?.completed,s.departure?.reason]);if(signature!==lastSignature){report.events.push(s);lastSignature=signature;}if(samplingUntil)report.samples.push(s);if(samplingUntil&&now>=samplingUntil){samplingUntil=0;const sorted=intervals.slice().sort((a,b)=>a-b),mean=intervals.reduce((a,b)=>a+b,0)/Math.max(1,intervals.length);report.measurement={frames:intervals.length,meanMs:mean,fps:1000/mean,p95Ms:sorted[Math.floor(sorted.length*.95)],scope:'Visible normal Chrome, real RAF; observation page shares main thread with game'};}document.querySelector("#brief").textContent=`${s.gpu} | ${s.viewport.join("×")} | ${s.phase}/${s.ambush} | 命中 ${s.hits} | 翻身 ${s.roll?.reason} | ${s.perf.fps}fps ${s.perf.calls}calls | 30秒结果 ${report.measurement?JSON.stringify(report.measurement):"待采样"}`;status.textContent=JSON.stringify({sampling:!!samplingUntil,measurement:report.measurement,current:s,events:report.events.map(e=>({at:e.at,phase:e.phase,ambush:e.ambush,roll:e.roll?.reason,hits:e.hits})),errors:report.errors},null,2);}}}catch(e){status.textContent=String(e);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
