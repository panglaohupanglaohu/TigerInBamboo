<!doctype html><html><meta charset="utf-8"><title>Coastal rock specimen lab</title><style>body{margin:0;background:#b8cbd0;font:14px system-ui}aside{position:fixed;left:20px;top:16px;background:#fffdf4dd;padding:14px;border-radius:8px}button{padding:7px;margin:4px}canvas{display:block}</style><aside>Coastal geometry specimen lab · isolated model, not game scene<br>Drag to orbit · wheel to zoom <button id="white">White model</button><button id="colour">Rock palette</button></aside><script type="importmap">{"imports":{"three":"/TigerMessenger/vendor/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {seaStackGeometry,seaStackMaterial} from '/TigerMessenger/src/world/gateSeaStacks.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#bacdd3');const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const plane=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({color:'#356579'}));plane.rotation.x=-Math.PI/2;scene.add(plane);
const rocks=[];for(const [seed,x,z,r,h]of[[2,0,0,13.6,54],[3,-26,13,8.16,39],[6,30,-14,8.16,50]]){const m=new THREE.Mesh(seaStackGeometry(r,h,seed),seaStackMaterial(h));m.position.set(x,h/2-6,z);scene.add(m);rocks.push(m);}
const white=new THREE.MeshStandardMaterial({color:'#d8d4c6',roughness:1,flatShading:true});scene.add(new THREE.HemisphereLight('#d9f3ff','#486273',2));const sun=new THREE.DirectionalLight('#fff1d5',3);sun.position.set(-60,100,70);scene.add(sun);const mats=rocks.map(m=>m.material);document.querySelector('#white').onclick=()=>rocks.forEach(m=>m.material=white);document.querySelector('#colour').onclick=()=>rocks.forEach((m,i)=>m.material=mats[i]);
let az=.7,el=.22,dist=125,drag=false,px=0,py=0;function draw(){camera.position.set(Math.sin(az)*Math.cos(el)*dist,20+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,20,0);renderer.render(scene,camera);}renderer.domElement.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(!drag)return;az-=(e.clientX-px)*.005;el=Math.max(-.1,Math.min(1.3,el+(e.clientY-py)*.005));px=e.clientX;py=e.clientY;draw()};renderer.domElement.onwheel=e=>{dist=Math.max(50,Math.min(250,dist+e.deltaY*.04));draw()};window.specimen={scene,camera,renderer,rocks,view:(a,e)=>{az=a;el=e;draw()}};draw();
</script></html>
