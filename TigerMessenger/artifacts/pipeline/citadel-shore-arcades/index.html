<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧城滨水建筑 · 实景回接</title><style>body{background:#102032;color:#e8edf4;font:17px/1.65 system-ui;margin:0}main{max-width:1400px;margin:auto;padding:30px}a{color:#91d1ff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}img{width:100%;border-radius:10px}figure{margin:0}figcaption{color:#b5c6d8;padding:7px}section{margin:32px 0}.status{background:#243b52;padding:18px;border-radius:10px}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><main><p><a href="../citadel-default-entry/index.html">当前已合入默认 8931 入口：查看合入结果</a></p><h1>旧城滨水：两层建筑与侧向入口</h1><p>复用已有港口白石、蓝顶、布棚与拱口。两处建筑沿平台高差排布；WFC 负责前脸三个模块槽位，Blender 保留原材质、UV 和法线后回接。</p><p><a href="/TigerMessenger/?autostart=1&amp;citadelCommonFrame=1&amp;citadelOldHarbor=1">进入 8931 原游戏候选</a> · <a href="/TigerMessenger/docs/CITADEL_SHORE_ARCADES.md">工程记录</a></p><p class="status">Web 与 Godot 已同步：两条侧路实兵分别走完40段和30段；原上城90段、上下船及昼夜窗光通过。整体圣城仍未完成，默认入口尚未切换到候选。</p><section><h2>同机位修改前后</h2><div class="pair"><figure><img src="before-detail.png"><figcaption>之前：平台旁缺少建筑层次。</figcaption></figure><figure><img src="after-detail.png"><figcaption>当前：岸门旁与中段平台旁分别设置低层港口建筑。</figcaption></figure></div></section><section><h2>Blender 与 Godot</h2><div class="pair"><figure><img src="blender-r01.png"><figcaption>Blender 中保存的完整构件与台基。</figcaption></figure><figure><img src="godot-after-night.png"><figcaption>同一工程中的夜景。</figcaption></figure></div></section><section><h2>全景仍需继续对照</h2><div class="pair"><figure><img src="after.png"><figcaption>当前真实游戏。</figcaption></figure><figure><img src="../citadel-old-harbor-grade/approved-target.png"><figcaption>认可目标：滨水建筑、植被、主堡比例与整体完成度仍有差距。</figcaption></figure></div></section></main></html>
