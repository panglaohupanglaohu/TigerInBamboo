<!doctype html><html lang="zh"><meta charset="utf-8"><title>护盾 · 打水漂试听</title><style>body{font:18px system-ui;max-width:850px;margin:6vh auto;padding:24px;background:#e7efeb;color:#29453e}button,a{padding:9px;margin-right:12px}audio{display:block;width:100%;margin:24px 0}pre{white-space:pre-wrap;font:13px monospace}</style><h1>护盾拦截 · 打水漂</h1><p>轻弹 → 中弹 → 重弹 → 连发。短促湿润的三次递减点水声；音源与正式游戏相同。</p><button id="render">生成试听</button><a id="download" hidden download="shield-water-skip.wav">下载 WAV</a><audio id="audio" controls></audio><pre id="status">尚未渲染。此为同源离线试听，不是整局录音。</pre><script type="module">
import {synthBatianShieldHit} from '../../../src/audio/batianShieldSound.js';
const status=document.getElementById('status');document.getElementById('render').onclick=async()=>{try{const rate=48000,ctx=new OfflineAudioContext(1,rate*4,rate),gain=ctx.createGain();gain.gain.value=.65;gain.connect(ctx.destination);const events=[[.2,9],[.9,24],[1.6,100],[2.3,24],[2.39,24],[2.48,24],[2.57,24],[2.66,24],[2.75,24]];events.forEach(([t,p],i)=>synthBatianShieldHit(ctx,gain,t,i,p));const b=await ctx.startRendering(),d=b.getChannelData(0);let peak=0,clipped=0,sum=0,tail=0;for(let i=0;i<d.length;i++){peak=Math.max(peak,Math.abs(d[i]));sum+=d[i]*d[i];if(Math.abs(d[i])>=1)clipped++;if(i>rate*3.3)tail=Math.max(tail,Math.abs(d[i]));}const result={sameProductionSource:true,sampleRate:rate,events:events.length,peak,rms:Math.sqrt(sum/d.length),clipped,tail,render:'OfflineAudioContext; not normal-game recording',duration:4};const out=new ArrayBuffer(44+d.length*2),v=new DataView(out);const txt=(s,o)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};txt('RIFF',0);v.setUint32(4,out.byteLength-8,true);txt('WAVEfmt ',8);v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);txt('data',36);v.setUint32(40,d.length*2,true);for(let i=0;i<d.length;i++)v.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,d[i]))*32767),true);const url=URL.createObjectURL(new Blob([out],{type:'audio/wav'}));document.getElementById('audio').src=url;const a=document.getElementById('download');a.href=url;a.hidden=false;status.textContent=JSON.stringify(result,null,2);status.dataset.audit=JSON.stringify(result);status.dataset.state=clipped===0&&tail<.00001?'passed':'failed';}catch(e){status.textContent=e.stack;status.dataset.state='error';}};
</script></html>
