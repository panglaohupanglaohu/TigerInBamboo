<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基地机器人 · 实际模型检视</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#b6bdbc;color:#23302f;font:15px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:0;left:0;right:0;padding:18px 22px;background:linear-gradient(#eff2edee,#eff2ed00);pointer-events:none}header>*{pointer-events:auto}h1{font-size:20px;margin:0 0 8px}nav{display:flex;flex-wrap:wrap;gap:6px}button,a{color:inherit;background:#edf0e9d9;border:1px solid #80908a;border-radius:5px;padding:8px 14px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#34483f;color:#f6edda}footer{position:absolute;bottom:0;left:0;right:0;padding:14px 22px;background:#eef0e8e6;display:flex;gap:16px;flex-wrap:wrap;align-items:center}small{display:block;line-height:1.7;max-width:750px}#facts{font-variant-numeric:tabular-nums}a.back{position:absolute;right:20px;top:18px}@media(max-width:700px){a.back{position:static;display:inline-block;margin-top:8px}footer{font-size:12px}h1{font-size:17px}}</style>
<script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script>
<header><h1>三台机器人 · 实际三维模型</h1><nav id="models"></nav><a class="back" href="review.html">返回基地检视</a></header>
<footer><div><strong id="name"></strong><small id="facts"></small><small>拖动旋转 · 滚轮缩放 · 双击复位。刚体关节初版检视。动作文件含五种姿态；运行时材质效果与战斗逻辑不包含在 GLB 内，尚未美术验收。</small></div><select id="state" aria-label="机器人动作"><option value="idle">待机</option><option value="move">移动</option><option value="attack">射击</option><option value="transport">运输</option><option value="disabled">失能</option></select><button id="spin">自动旋转</button><button id="rear">查看背面</button><a id="actions" download>动作 GLB</a><a id="actions-blend" download>动作 Blender</a><a id="download" download>原静态 GLB</a><a id="blend" download>原静态 Blender</a></footer>
<script type="module">
import * as T from 'three';import{animateArticulatedRobot}from'../../../src/assets/robotArticulation.js';import {BOOKSHOP_ROBOT_FACTORIES} from '../../../src/assets/bookshopRobots.js';
const names=['蝗虫 · 重型装配','蚂蚁 · 蒸汽动力','甲壳虫 · 精密机械'],ids=['locust','ant','beetle'];
document.getElementById('state').onchange=e=>{window.rigState=e.target.value;window.rigSpeed=window.rigState==='move'?2:0;};const scene=new T.Scene();scene.background=new T.Color(0xb7bdbd);const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.01,100),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xe0efff,0x514033,2.1));const key=new T.DirectionalLight(0xffecd7,3.3);key.position.set(4,9,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-7,right:7,top:8,bottom:-7});key.shadow.bias=-.0001;scene.add(key);const fill=new T.DirectionalLight(0xbad6ed,1.3);fill.position.set(-6,3,-5);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xa6adab,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.035;floor.receiveShadow=true;scene.add(floor);
import {createWeaponEffects,WEAPON_VISUALS} from '../../../src/gameplay/robotOps/weaponEffects.js';
const weaponEffects=createWeaponEffects(scene);let nextShot=0,effectLast=0;
const models=BOOKSHOP_ROBOT_FACTORIES.map(make=>{const m=make({rigged:true});m.visible=false;scene.add(m);return m;});let selected=0,model,drag=false,lastX=0,lastY=0,zoom=1,pitch=.15,spin=false,distance=8,mid=new T.Vector3(),fitSize=new T.Vector3(1,1,1);
const buttons=names.map((name,i)=>{const b=document.createElement('button');b.textContent=name.split(' · ')[0];b.onclick=()=>show(i);document.getElementById('models').appendChild(b);return b;});
function fit(){const top=document.querySelector('header').getBoundingClientRect().bottom+8,bottom=document.querySelector('footer').getBoundingClientRect().height+8,height=Math.max(160,innerHeight-top-bottom);renderer.domElement.style.position='absolute';renderer.domElement.style.top=top+'px';renderer.setSize(innerWidth,height);camera.aspect=innerWidth/height;distance=Math.max(fitSize.y,fitSize.x/camera.aspect)*2.05;camera.updateProjectionMatrix();camera.position.set(mid.x+distance*.36*zoom,mid.y+distance*pitch*zoom,mid.z+distance*zoom);camera.lookAt(mid);}
function show(index,angle=-.25){weaponEffects.clear();nextShot=0;selected=index;models.forEach((m,i)=>m.visible=i===index);model=models[index];model.rotation.y=angle;zoom=1;pitch=.15;const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3());fitSize.copy(size);box.getCenter(mid);distance=Math.max(size.y,size.x/Math.min(1,camera.aspect))*2.05;mid.y+=size.y*.025;fit();buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));document.getElementById('name').textContent=names[index];document.getElementById('facts').textContent=`${model.userData.stats.triangles.toLocaleString()} 个三角形 · ${model.userData.stats.meshes} 个合批网格 · 源模型 v${model.userData.modelVersion}`;document.getElementById('actions').href=`models/${ids[index]}-actions.glb`;document.getElementById('actions-blend').href=`models/${ids[index]}-actions.blend`;document.getElementById('download').href=`../bookshop-two-hour/models/${ids[index]}.glb`;document.getElementById('blend').href=`../bookshop-two-hour/models/${ids[index]}.blend`;window.model=model;fit();models.forEach(m=>animateArticulatedRobot(m,{time:performance.now()/1000,speed:window.rigSpeed||0,state:window.rigState||"idle",aim:window.rigAim||0,recoil:0}));renderer.render(scene,camera);}
window.show=show;window.studio={scene,camera,renderer};window.robotViewer={models};show(Math.max(0,ids.indexOf(new URLSearchParams(location.search).get('model'))));
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;model.rotation.y+=(e.clientX-lastX)*.008;pitch=T.MathUtils.clamp(pitch+(e.clientY-lastY)*.002,-.12,.65);lastX=e.clientX;lastY=e.clientY;fit();});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=T.MathUtils.clamp(zoom*Math.exp(e.deltaY*.001),.65,1.8);fit();},{passive:false});renderer.domElement.ondblclick=()=>show(selected);onresize=()=>{renderer.setSize(innerWidth,innerHeight);fit();};document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'暂停旋转':'自动旋转';};document.getElementById('rear').onclick=()=>model.rotation.y+=Math.PI;
let last=performance.now();renderer.setAnimationLoop(now=>{const effectDt=Math.min(.05,(now-effectLast)/1000);effectLast=now;weaponEffects.update(effectDt);if(window.rigState==='attack'&&now>=nextShot){const tip=model.getObjectByName('robot-muzzle');if(tip){model.updateWorldMatrix(true,true);weaponEffects.burst(model,tip.getWorldPosition(new T.Vector3()).add(new T.Vector3(0,0,5).applyQuaternion(model.quaternion)));nextShot=now+(model.userData.robotType==='ant'?4500:model.userData.robotType==='locust'?2400:1800);}}if(spin&&!drag)model.rotation.y+=Math.min(.05,(now-last)/1000)*.35;last=now;models.forEach(m=>animateArticulatedRobot(m,{time:performance.now()/1000,speed:window.rigSpeed||0,state:window.rigState||"idle",aim:window.rigAim||0,recoil:0}));renderer.render(scene,camera);});
</script></html>
