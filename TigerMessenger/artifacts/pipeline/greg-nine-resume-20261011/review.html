<!doctype html><meta charset="utf-8"><title>Greg九项正式场景续做</title><style>body{margin:0;background:#163c42;color:#f5efd9;font:13px sans-serif}header{height:54px;display:flex;gap:6px;align-items:center;padding:0 10px}button{padding:6px;background:#bdd6ca;border:0}iframe{height:calc(100vh - 54px);width:100%;border:0}#capture{position:fixed;bottom:10px;right:10px;max-width:45vw;max-height:45vh}#s{position:fixed;bottom:0;left:0;max-height:20vh;max-width:55vw;overflow:auto;background:#132c35e8;font:10px monospace;white-space:pre-wrap}</style>
<header>Greg 九项 · 正式工厂与运行时 <button data-st="rim">岸顶</button><button data-st="middle">中岸</button><button data-st="stairs">入口石阶</button><button data-st="lake">湖岸</button><button id="descend">信使实际下阶验证</button><button id="tiger">开始虎饮水验证</button><button id="audit">连续交通检查</button><button id="overview">全景构图</button><button id="shot">保存时点</button><button id="perf">60帧性能</button><button id="drawaudit">全场景绘制归因</button><button id="opposite">对岸石阶检查</button><button id="hide">收起证据</button></header><iframe id="g"></iframe><img id="capture"><div id="phases" style="position:fixed;top:60px;right:0;max-width:240px;max-height:75vh;overflow:auto"></div><pre id="s">正式游戏加载中</pre>
<script type="module">
let tm,ST,station='rim',records=[],busy=false;g.src='/TigerMessenger/?tour=crystal-v7&autostart=1&cb='+Date.now();
async function ready(){if(!g.contentWindow?.__tm?.swampCameraProfile){setTimeout(ready,2000);return;}tm=g.contentWindow.__tm;ST=await g.contentWindow.eval("import('/TigerMessenger/artifacts/pipeline/swamp-target-20261010/stations.js?v='+Date.now())");if(new URLSearchParams(location.search).has('method')){const m=new URLSearchParams(location.search).get('method');tm.messenger.landmarks.moebiusSwamp.userData.inner.userData.tigerEncounter.random=()=>m==='boat'?.5:m==='whale'?.99:0;}place('rim');}ready();
function place(st){station=st;ST.place(st);if(st==='middle'||st==='stairs'){const player=tm.player,T=tm.THREE;for(const rise of [0,.5,1,2,3,4,5,6]){const probe=player.position.clone().addScaledVector(player.position.clone().normalize(),rise),supports=tm.sampleSwampGroundChain(probe),radius=supports.stair??supports.authored;if(Number.isFinite(radius)){player.position.setLength(radius+.015);player.groundR=radius;player.onGround=true;player.velocity.set(0,0,0);tm.cameraRig.snapToPlayer();break;}}}ST.settle(true);s.textContent='正式默认游戏实际运行 '+st;}
for(const b of document.querySelectorAll('[data-st]'))b.onclick=()=>place(b.dataset.st);
function record(){const inn=tm.messenger.landmarks.moebiusSwamp.userData.inner;return JSON.parse(JSON.stringify({time:new Date().toISOString(),station,player:tm.player.position.toArray(),camera:tm.camera.position.toArray(),tiger:inn.userData.tiger?.position.toArray(),tigerV3:!!inn.userData.tiger?.userData.tigerV3,wallGeometry:{vertices:inn.getObjectByName('swamp-sinkhole-wall').geometry.attributes.position.count,children:inn.getObjectByName('swamp-sinkhole-wall').children.map(o=>({name:o.name,vertices:o.geometry?.attributes.position.count,sameGeometry:o.geometry===inn.getObjectByName('swamp-sinkhole-wall').geometry}))},tigerSupport:inn.userData.tiger?.userData.tigerTargetSupport,encounter:inn.userData.tigerEncounter?.report,harbor:tm.swampHarborScene?.report,water:tm.swampPaintWater?.report,roots:tm.swampTreeRoots?.report,falls:tm.swampWaterfalls?.report,navigation:inn.userData.flowerBoyActivities?.navigation?.records?.map(r=>({index:r.index,valid:r.valid,travel:r.travel,state:r.state})),boats:inn.userData.lotuses?.map(b=>({position:b.position.toArray(),phase:b.userData.paddleMotion?.state,paddles:b.userData.paddles?.length,stem:!!b.userData.flowerStem,rowingDirection:b.userData.paddleMotion?.direction})),feeder:inn.userData.flowerBoyActivities?.feeder?.position.toArray(),draw:tm.renderer.info.render.calls,triangles:tm.renderer.info.render.triangles}));}
descend.onclick=async()=>{if(busy)return;busy=true;ST.STATIONS.entrance.p=[Math.cos(.5)*40.5,40,Math.sin(.5)*40.5];place('entrance');const inn=tm.messenger.landmarks.moebiusSwamp.userData.inner,w=g.contentWindow,T=tm.THREE,points=[],key=k=>w.dispatchEvent(new w.KeyboardEvent(k,{code:'KeyW',key:'w',bubbles:true}));const sample=()=>{const p=inn.worldToLocal(tm.player.position.clone());points.push({at:new Date().toISOString(),inner:p.toArray(),support:tm.sampleSwampGroundChain(tm.player.position),cameraForward:tm.camera.getWorldDirection(new T.Vector3()).applyQuaternion(inn.getWorldQuaternion(new T.Quaternion()).invert()).toArray(),playerForward:tm.player.forward.clone().applyQuaternion(inn.getWorldQuaternion(new T.Quaternion()).invert()).toArray(),onGround:tm.player.onGround,velocity:tm.player.velocity.toArray(),edge:JSON.parse(JSON.stringify(tm.swampEdgeGuard?.report||{})),steer:tm.swampWalkwaySteer?.report});s.textContent=JSON.stringify({method:'initial entrance placement only; real KeyW held, normal production physics and camera; no per-frame position override',points},null,2);capture.src=ST.render('beauty');};sample();key('keydown');try{for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,2000));sample();}}finally{key('keyup');busy=false;}s.textContent=JSON.stringify({method:'initial entrance placement only; real KeyW 12 seconds normal production physics',completed:true,points},null,2);};tiger.onclick=()=>{place('stairs');const inn=tm.messenger.landmarks.moebiusSwamp.userData.inner;inn.userData.tiger.userData.forceDrink=true;s.textContent='受控实景验证：仅触发原forceDrink，后续正式逐帧动作 '+JSON.stringify(inn.userData.tigerEncounter?.report);};overview.onclick=()=>{const inn=tm.messenger.landmarks.moebiusSwamp.userData.inner,T=tm.THREE,cam=new T.PerspectiveCamera(48,tm.renderer.domElement.width/tm.renderer.domElement.height,.1,500);cam.position.copy(inn.localToWorld(new T.Vector3(31,56,27)));cam.up.set(0,1,0).transformDirection(inn.matrixWorld);cam.lookAt(inn.localToWorld(new T.Vector3(0,27,0)));tm.renderer.render(tm.scene,cam);capture.src=tm.renderer.domElement.toDataURL('image/jpeg',.9);s.textContent=JSON.stringify({method:'composition camera over full production scene, no objects hidden; game camera resumes normal next frame',record:record()},null,2);};let auditTimer=null,auditStart=0,auditPhase='',auditRecords=[];
audit.onclick=()=>{if(auditTimer){clearInterval(auditTimer);auditTimer=null;s.textContent=JSON.stringify({completed:false,records:auditRecords});return;}place('middle');const inn=tm.messenger.landmarks.moebiusSwamp.userData.inner;inn.userData.tiger.userData.forceDrink=true;auditStart=Date.now();auditRecords=[];auditPhase='';phases.replaceChildren();auditTimer=setInterval(()=>{const current=inn.userData.tigerEncounter.report.phase;if(current===auditPhase)return;auditPhase=current;const r=record(),T=tm.THREE,tiger=inn.userData.tiger,cam=new T.PerspectiveCamera(48,tm.renderer.domElement.width/tm.renderer.domElement.height,.1,500);cam.position.copy(inn.localToWorld(tiger.position.clone().add(new T.Vector3(-tiger.position.x,0,-tiger.position.z).normalize().multiplyScalar(13)).add(new T.Vector3(0,7,0))));cam.up.set(0,1,0).transformDirection(inn.matrixWorld);cam.lookAt(inn.localToWorld(tiger.position.clone().add(new T.Vector3(0,1,0))));tm.renderer.render(tm.scene,cam);const im=document.createElement('img');im.src=tm.renderer.domElement.toDataURL('image/jpeg',.85);im.dataset.phase=current;im.style.width='230px';const label=document.createElement('div');label.textContent=current+' · '+r.time;phases.append(label,im);r.elapsed=(Date.now()-auditStart)/1000;auditRecords.push(r);s.textContent=JSON.stringify({method:'real default production updates, initial supported player placement and forceDrink only; each state inspected with a camera over the entire production scene, no objects hidden',records:auditRecords},null,2);if(current==='idle'&&auditRecords.length>1){s.textContent=JSON.stringify({completed:true,records:auditRecords},null,2);clearInterval(auditTimer);auditTimer=null;}},1000);};
shot.onclick=()=>{capture.src=ST.render('beauty');records.push(record());s.textContent=JSON.stringify({method:'default production runtime, camera initially placed then normal updates',records},null,2);};hide.onclick=()=>{capture.removeAttribute('src');s.textContent='实际运行';};perf.onclick=async()=>{if(busy)return;busy=true;tm.perfProbe.reset();const perf=await tm.perfProbe.settle(30000);s.textContent=JSON.stringify({record:record(),perf},null,2);busy=false;};
opposite.onclick=()=>{const inn=tm.messenger.landmarks.moebiusSwamp.userData.inner,T=tm.THREE,a=inn.userData.oppositeLanding.angle,cam=new T.PerspectiveCamera(48,tm.renderer.domElement.width/tm.renderer.domElement.height,.1,500);cam.position.copy(inn.localToWorld(new T.Vector3(Math.cos(a)*12,34,Math.sin(a)*12)));cam.up.set(0,1,0).transformDirection(inn.matrixWorld);cam.lookAt(inn.localToWorld(new T.Vector3(Math.cos(a)*31,32,Math.sin(a)*31)));tm.renderer.render(tm.scene,cam);capture.src=tm.renderer.domElement.toDataURL('image/jpeg',.9);s.textContent=JSON.stringify({method:'lake-side camera over full production scene, no geometry hidden',record:record()},null,2);};
drawaudit.onclick=()=>{const renderer=tm.renderer,original=renderer.renderBufferDirect,groups={};renderer.renderBufferDirect=function(camera,scene,geometry,material,object,group){const before={...this.info.render};let root=object;while(root.parent&&root.parent!==tm.scene)root=root.parent;const key=(scene===null?'shadow: ':'color: ')+(root.name||root.type||'unnamed');try{return original.apply(this,arguments);}finally{const b=groups[key]||(groups[key]={calls:0,triangles:0,lines:0,points:0});for(const name of Object.keys(b))b[name]+=this.info.render[name]-before[name];}};try{renderer.info.reset();renderer.render(tm.scene,tm.camera);s.textContent=JSON.stringify({method:'one reset full production normal-camera render; actual renderBufferDirect info deltas including double-side transparency, lines and shadow; wrapper restored; diagnostic overhead not an FPS measure',render:{...renderer.info.render},groups:Object.entries(groups).sort((a,b)=>b[1].calls-a[1].calls)},null,2);}finally{renderer.renderBufferDirect=original;}};
</script>
