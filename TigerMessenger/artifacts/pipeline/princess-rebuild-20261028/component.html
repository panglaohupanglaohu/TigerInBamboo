import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const s=new T.Scene();s.background=new T.Color('#bfc8c7');s.add(new T.HemisphereLight(0xfff4e0,0x5c6570,2));let sun=new T.DirectionalLight(0xfff0da,2.5);sun.position.set(3,5,5);s.add(sun);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const c=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);let actor,mode='standing',shot='front';const st=document.querySelector('output');function view(n){shot=n;let p=n==='front'?[0,.05,3]:n==='side'?[3,.05,0]:n==='back'?[0,.05,-3]:[0,.62,.75];c.position.set(...p);c.lookAt(0,n==='head'?.62:0,0);r.render(s,c);}async function load(m){mode=m;try{let g=await new GLTFLoader().loadAsync('../../../assets/models/morris-princess/princess-v13-'+m+'.glb');if(actor)s.remove(actor);actor=g.scene;s.add(actor);let images=0,meshes=0;actor.traverse(o=>{if(o.isMesh){meshes++;for(let x of(Array.isArray(o.material)?o.material:[o.material]))if(x.map?.image)images++;}});st.textContent=`${m}: GLB已加载，${meshes}网格，${images}材质纹理实例`;document.body.dataset.loaded=m;document.body.dataset.textureInstances=images;view(shot);}catch(e){st.textContent=String(e);document.body.dataset.error=String(e);}}for(let n of['front','side','back','head'])document.getElementById(n).onclick=()=>view(n);for(let m of['standing','mounted'])document.getElementById(m).onclick=()=>load(m);load('standing');
