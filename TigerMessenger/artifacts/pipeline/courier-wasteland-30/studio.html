import * as T from 'three';import{buildWastelandCourier}from'../../../src/assets/characters/courierWasteland.js';import{animateHumanCourier}from'../../../src/assets/characters/humanCourier.js';
const q=new URLSearchParams(location.search),revision=+(q.get('revision')||30),scene=new T.Scene();scene.background=new T.Color(0xa49d8e);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(2.2,1.5,3.7);camera.lookAt(0,.86,0);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xe3e7ec,0x42362a,2));const sun=new T.DirectionalLight(0xffe3b2,3);sun.position.set(-3,6,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-3,right:3,top:4,bottom:-2});scene.add(sun);const fill=new T.DirectionalLight(0xd2e8fa,.9);fill.position.set(4,2,-3);scene.add(fill);const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0x9c9483,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.008;floor.receiveShadow=true;scene.add(floor);const model=buildWastelandCourier({revision});scene.add(model);const player={velocity:new T.Vector3(),onGround:true,holdingLetter:false,riding:false,animPhase:0};let state='idle',last=0;window.studio={scene,camera,renderer,model,player};window.setPose=s=>{state=s;player.velocity.set(s==='run'?10:s==='walk'?3:0,0,0);player.riding=s==='ride';player.holdingLetter=s==='letter';};document.querySelector('#pose').onchange=e=>setPose(e.target.value);document.querySelector('#back').onclick=()=>model.rotation.y+=Math.PI;document.querySelector('#info').textContent=`重构候选 · 结构层 ${revision} · 拖动旋转 · 目标图需以实际模型复核`;let drag=false,x=0;renderer.domElement.onpointerdown=e=>{drag=true;x=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){model.rotation.y+=(e.clientX-x)*.01;x=e.clientX;}};renderer.setAnimationLoop(now=>{const dt=Math.min(.04,(now-last)/1000);last=now;animateHumanCourier(player,model,dt,state==='walk'||state==='run');renderer.render(scene,camera);});
