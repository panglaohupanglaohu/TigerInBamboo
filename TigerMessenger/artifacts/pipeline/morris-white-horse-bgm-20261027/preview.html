<!doctype html><meta charset="utf-8"><title>莫里斯岛 · 白马花径试听</title><style>body{background:#183c40;color:#f4e2b2;font:18px/1.7 system-ui;max-width:760px;margin:60px auto}button,audio{display:block;margin:20px 0}a{color:#e7c788}</style><h1>白马花径 · 原创配乐候选</h1><p>参考方向：抒情铺陈、长句起伏与巡游步伐。新写旋律；未使用商业歌曲录音或逐音转录。</p><p>钢琴、合成弦乐、笛声 · 76 BPM · 4/4 · 107 秒。已接岛屿原音乐入口；这页仅供试听，不代表正式游戏混音验收。</p><audio controls preload="metadata" src="../../../music/Morris-White-Horse-Garden-Original.wav"></audio><button id="decode">检查浏览器解码</button><pre id="result">待检查</pre><script>document.querySelector('#decode').onclick=async()=>{const out=document.querySelector('#result');try{const ctx=new AudioContext();const data=await(await fetch('../../../music/Morris-White-Horse-Garden-Original.wav')).arrayBuffer();const b=await ctx.decodeAudioData(data);out.textContent=JSON.stringify({decoded:true,duration:b.duration,channels:b.numberOfChannels,sampleRate:b.sampleRate},null,2);await ctx.close()}catch(e){out.textContent=JSON.stringify({decoded:false,error:e.message})}};</script>
