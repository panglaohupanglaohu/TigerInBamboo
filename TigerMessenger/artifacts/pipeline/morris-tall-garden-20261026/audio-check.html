<!doctype html><meta charset="utf-8"><title>织锦花园 · 正式配乐控制器检查</title><style>body{background:#183a43;color:#e5d6ac;font:16px system-ui;padding:24px}button{padding:12px;margin:5px}pre{white-space:pre-wrap}</style><h1>织锦花园 · 原创器乐</h1><p>生产音乐控制器检查，非正常游戏抵达验证。钢琴、弦乐、笛声均为合成音色。进入渐入，离开渐出，一次到访播放一次。</p><button id="enter">进入花岛</button><button id="exit">离岛</button><button id="mute">M 静音</button><button id="battle">战斗优先</button><button id="elder">老人弹琴优先</button><pre id="audit"></pre><script type="module">
import {createBgmOwnership}from'../../../src/audio/bgmOwnership.js';import{createMorrisGardenBgm}from'../../../src/audio/morrisGardenBgm.js?v=morris-tall-r15';const owner=createBgmOwnership(),score=createMorrisGardenBgm(owner,(k,url)=>owner.wrap(k,new Audio(url)));let near=false,muted=false,battle=false,elder=false;document.querySelector('#enter').onclick=()=>near=true;document.querySelector('#exit').onclick=()=>near=false;document.querySelector('#mute').onclick=()=>{muted=!muted;document.querySelector('#mute').textContent=muted?'M 恢复声音':'M 静音';};document.querySelector('#battle').onclick=()=>owner.request('batian',battle=!battle);document.querySelector('#elder').onclick=()=>owner.request('musicBox',elder=!elder);setInterval(()=>{owner.setContext({muted});const s=score.update({listener:{x:near?0:140,y:160,z:0},center:{x:0,y:160,z:0},muted});document.querySelector('#audit').textContent=JSON.stringify({...s,ownership:owner.snapshot()},null,2);document.querySelector('#audit').dataset.audit=JSON.stringify(s);},100);</script>
