<!doctype html><meta charset="utf-8"><title>Morris three-view geometry review</title><style>body{margin:0;font:14px system-ui}nav{position:fixed;top:8px;left:8px;z-index:2;background:#fffdf0e8;padding:10px;border-radius:8px}button{padding:7px;margin:3px}#audit{position:fixed;bottom:6px;left:8px;background:#fffdf0df;padding:6px;font:11px monospace;z-index:2}</style><nav>Actual production factories / component GPU, not normal gameplay<br><button id="overview">Overview</button><button id="approach">Right-bank approach</button><button id="castle">Castle close</button><button id="court">Court branch</button><button id="bare">Bare terrain</button></nav><div id="audit">loading</div><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/jsm/"}}</script><script type="module">
import * as T from 'three';import{createMorrisIsland}from'../../../src/world/morrisIsland.js?v=three-view-r1';
const scene=new T.Scene();scene.background=new T.Color(0x8dbdd5);const island=createMorrisIsland({scene}),root=island.root;
scene.add(new T.Mesh(new T.SphereGeometry(159.7,80,48),new T.MeshStandardMaterial({color:0x268cab,roughness:.7})));
scene.add(new T.HemisphereLight(0xdce9ee,0x64624c,1.6));const light=new T.DirectionalLight(0xffe4b6,2.5);light.position.copy(root.localToWorld(new T.Vector3(-65,100,70)));light.target.position.copy(root.position);scene.add(light,light.target);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);camera.up.set(0,1,0).transformDirection(root.matrixWorld);
function view(e,t){camera.position.copy(root.localToWorld(new T.Vector3(...e)));camera.lookAt(root.localToWorld(new T.Vector3(...t)));camera.updateMatrixWorld(true);}
document.querySelector('#overview').onclick=()=>view([0,75,155],[0,10,10]);
document.querySelector('#approach').onclick=()=>{const p=island.route.at(island.route.bridge.s-32),b=island.landscape.bridge.position;view([p.x-1,island.heightAt(p.x,p.z,p.h)+2.5,p.z+1],[b.x,b.y+.8,b.z]);};
document.querySelector('#castle').onclick=()=>{const c=island.landscape.castle.position;view([c.x-16,c.y+4,c.z+24],[c.x,c.y+6,c.z]);};
document.querySelector('#court').onclick=()=>{const q=island.route.branchAt(island.route.branchReport.length-9),c=island.landscape.musicCourt.position;view([q.x,island.heightAt(q.x,q.z,q.h)+3.6,q.z],[c.x,c.y+1,c.z]);};let bare=false;
document.querySelector('#bare').onclick=()=>{bare=!bare;for(const o of root.children){o.userData.beforeBare??=o.visible;o.visible=bare?/ground|rock|creek|bridge|switchback|court-branch/.test(o.name):o.userData.beforeBare;}};
view([0,75,155],[0,10,10]);document.body.dataset.ready='true';document.body.dataset.audit=JSON.stringify(island.report);
renderer.setAnimationLoop(t=>{island.update(.016,t*.001);renderer.render(scene,camera);document.querySelector('#audit').textContent=JSON.stringify({component:true,revision:island.report.revision,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,branch:island.route.branchReport});});
</script>
