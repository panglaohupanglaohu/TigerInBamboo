<meta charset="utf-8"><title>水晶城核心位置判断</title><style>body{background:#1d303e;color:#eeddbb;font:18px sans-serif;margin:24px}img{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style><h1>核心位置判断：城市组织与电车可见性</h1><p>湖沼不在建筑范围最外沿，但核心偏向一侧。轨道高差、近塔与树冠遮挡，让它缺乏高潮场景的完整展示。红蓝车反向经过同一区域，换车无法根治。</p><img src="layout.svg"><h2>同一位置：红车与蓝车正前方</h2><div class="row"><img src="red-0.3-forward.png"><img src="blue-0.3-forward.png"></div><h2>同一位置：从两车位置转头看湖沼</h2><div class="row"><img src="red-0.3-core.png"><img src="blue-0.3-core.png"></div><p>这是轨道位置的验证相机，非车厢座椅实测。轨道半径约169.5，湖面半径136.7，径向高差32.8；图中桥面和冠层遮挡明显。</p><h2>建议</h2><p>保留母塔、环湖子塔、湖沼的内部关系，将其作为一个整体规划到城市视觉中心。外围塔围绕核心组织，不强求轨道左右各6组；同时需要一段能完整看见母塔、湖面、巨树的观景线路。仅移动核心或换乘红车都不足以解决遮挡。</p>
