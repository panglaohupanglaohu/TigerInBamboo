<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苔庭外部五区 · 静态隐蔽环境</title><style>body{margin:28px;background:#16211d;color:#e9f0e4;font:17px/1.7 system-ui}main{max-width:1250px;margin:auto}img{width:100%;border-radius:12px;background:#334}a{color:#b7db9a}.card{padding:16px;border-radius:12px;background:#213027}li{margin:.35em 0}</style><main><h1>苔庭外部五区 · 静态隐蔽环境</h1><p>鲲背苔庭隐藏在相近的外部景观中。五片连续的苔坡、林缘和石组围出中央起飞口：静止时，鲲的轮廓被相同的苔庭语言打散；触发后，鲲与背上的原作苔庭从中央升起，外部五区留在球面世界上。</p><section class="card"><img src="five-static-surroundings.png" alt="Blender 中静态苔庭五区模型"><h2>静态五区</h2><ul><li>入口苔径：低处苔坡与入口树群</li><li>主石之庭：背侧石组与高松</li><li>枯瀑之庭：干岩脊与林缘，不使用瀑布</li><li>苔海岛群：水侧苔坡和稀密相间的松组</li><li>回望石组：后侧石组与观景林</li></ul><p>中央不添加新地面或碰撞；蓝盔伏击、重甲登陆、鲲背苔庭和原作支撑网格继续使用原有系统。</p></section><p>已导入 Godot：<a href="../../../godot/assets/saihoji-surroundings-v2/manifest.json">资产清单</a> · <a href="../../../godot/scripts/saihoji_concealment_adapter.gd">静态世界接入脚本</a> · <a href="../saihoji-battle-review/index.html">苔庭之战总览</a></p></main></html>
