<!doctype html><meta charset="utf-8"><title>月湖古松·实际工厂</title><style>body{margin:0;background:#abc9c0;color:#20362f;font:14px sans-serif}header{position:absolute;padding:12px;background:#fffe}button{margin:4px;padding:7px}canvas{display:block}#state{max-width:720px}</style><header>正式月湖与古松工厂 · 局部验证页（不是完整游戏）<br><button id="wide">全景</button><button id="near">古松近景</button><button id="side">横枝侧面</button><div id="state"></div></header><script type="importmap">{"imports":{"three":"../../../vendor/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {createMoonLake} from '../../../src/world/lake.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdab789);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);
const world=new THREE.Scene(), lake=createMoonLake(world,160);world.remove(lake.group);lake.group.position.set(0,0,0);lake.group.quaternion.identity();scene.add(lake.group);
const ground=new THREE.Mesh(new THREE.CircleGeometry(36,64),new THREE.MeshStandardMaterial({color:0x768961,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);
scene.add(new THREE.HemisphereLight(0xffeed5,0x556b62,2.2));const sun=new THREE.DirectionalLight(0xffe6bc,2);sun.position.set(-8,20,12);scene.add(sun);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,160);let aim=new THREE.Vector3(6,4,1);
const view=(p,a)=>{camera.position.set(...p);aim.set(...a);camera.lookAt(aim)};wide.onclick=()=>view([25,17,28],[5,4,0]);near.onclick=()=>view([25,10,21],[13,5,0]);side.onclick=()=>view([24,8,-20],[13,4,0]);wide.onclick();
const box=new THREE.Box3().setFromObject(lake.ancientPine),size=box.getSize(new THREE.Vector3());state.textContent=JSON.stringify({factory:lake.ancientPine.name,site:lake.ancientPine.position.toArray(),size:size.toArray(),...lake.ancientPine.userData});let t=0;renderer.setAnimationLoop(()=>{t+=.016;lake.moonOrb.update(t,.016,camera.position);renderer.render(scene,camera)});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
