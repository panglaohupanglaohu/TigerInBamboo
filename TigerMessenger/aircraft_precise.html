<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Precise Low-Poly Aircraft · 几何体级还原</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11151c; }
  #info {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    font: 13px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
    color: #c6d2e6; background: rgba(17,21,28,0.6);
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(120,160,255,0.25);
  }
  #info b { color: #f2c14e; }
</style>
</head>
<body>
<div id="info"><b>Precise Low-Poly Aircraft</b><br>拖拽旋转 · 滚轮缩放 · 右键平移（静态无动画）</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// =====================================================================
//  几何体级精确还原 · Low-Poly 科幻飞行器
//  全程 MeshStandardMaterial + flatShading: true
//  灰色/黄色：metalness 0, roughness 1（纯哑光）
// =====================================================================

// ---- 色板 ----
const DEEP_GREY = 0x2b2f36;   // 主机身 / 机翼 深灰
const LIGHT_GREY = 0x6b7280;  // 尾部喷口 浅灰
const OCHRE = 0xe0a020;       // 侧面能量条 土黄/橙黄
const SKY = 0x5fb6e6;         // 前置进气口 天蓝
const FLAME = 0x222428;       // 尾焰 深灰实体

/** 统一哑光材质工厂（flatShading + metalness0/roughness1） */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    flatShading: true,
    metalness: opts.metalness ?? 0,
    roughness: opts.roughness ?? 1,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 1,
  });
}

function add(geo, material, x, y, z) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}

/**
 * 创建飞行器，所有部件加入名为 aircraft 的 Group 并返回。
 * 机身长轴沿 +Z（机头朝 +Z）。
 */
function createPreciseAircraft() {
  const aircraft = new THREE.Group();
  aircraft.name = "aircraft";

  const greyMat = mat(DEEP_GREY);          // 深灰哑光
  const lightGreyMat = mat(LIGHT_GREY);    // 浅灰哑光
  const ochreMat = mat(OCHRE, { emissive: OCHRE, emissiveIntensity: 0.9 }); // 发光能量条
  const skyMat = mat(SKY);                 // 天蓝哑光
  const flameMat = mat(FLAME, { emissive: FLAME, emissiveIntensity: 0.6 });  // 深灰实体尾焰

  // ---------------------------------------------------------------
  // 2. 主机身：极度扁平且拉长的 BoxGeometry（中心轴）
  // ---------------------------------------------------------------
  const fuselage = add(new THREE.BoxGeometry(1.1, 0.45, 7.2), greyMat, 0, 0, 0);
  aircraft.add(fuselage);

  // ---------------------------------------------------------------
  // 3. 机翼：前后两对共 4 片扁平锐角三角形/梯形，深灰
  //    用缩放的扁平 Box + 三角锥(Cone,4段) 模拟尖锐后掠翼
  // ---------------------------------------------------------------
  // 前翼：较小，机身前半段两侧
  for (const sx of [-1, 1]) {
    const fw = add(new THREE.BoxGeometry(2.4, 0.12, 1.6), greyMat, sx * 1.5, 0.0, 1.9);
    fw.rotation.y = sx * 0.5;        // 后掠
    fw.scale.z = 0.6;
    aircraft.add(fw);
  }
  // 后翼：较大，机身中后段两侧，向后突出尖锐
  for (const sx of [-1, 1]) {
    const bw = add(new THREE.ConeGeometry(1.9, 4.6, 4), greyMat, sx * 1.3, 0.0, -1.6);
    bw.rotation.z = sx * Math.PI / 2;   // 平放成翼，锥尖朝后(-Z)
    bw.rotation.y = sx * 0.35;
    bw.scale.set(1, 1, 0.08);           // 压扁成薄翼
    aircraft.add(bw);
  }

  // ---------------------------------------------------------------
  // 4. 侧面能量条：两条细长扁平 Box，紧贴机身两侧，土黄发光
  // ---------------------------------------------------------------
  for (const sx of [-1, 1]) {
    const stripe = add(new THREE.BoxGeometry(0.16, 0.14, 6.4), ochreMat, sx * 0.58, 0.0, -0.2);
    aircraft.add(stripe);
  }

  // ---------------------------------------------------------------
  // 5. 前置进气口：扁平 Cylinder 放机身最前端，天蓝
  // ---------------------------------------------------------------
  const intake = add(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 12), skyMat, 0, 0, 3.7);
  intake.rotation.x = Math.PI / 2;   // 圆面朝 +Z
  intake.scale.set(1, 0.6, 1);       // 压扁
  aircraft.add(intake);

  // ---------------------------------------------------------------
  // 6. 尾部引擎喷口：六棱锥(Cone,6段) 由前向后收窄，紧贴尾部，浅灰
  // ---------------------------------------------------------------
  const nozzle = add(new THREE.ConeGeometry(0.55, 1.1, 6), lightGreyMat, 0, 0, -4.1);
  nozzle.rotation.x = -Math.PI / 2;  // 锥尖朝 -Z（向后收窄）
  aircraft.add(nozzle);

  // ---------------------------------------------------------------
  // 7. 尾部火焰：极长六棱锥(Cone,6段) 从尾部向后延伸，深灰实体(emissive)
  // ---------------------------------------------------------------
  const flame = add(new THREE.ConeGeometry(0.5, 4.2, 6), flameMat, 0, 0, -6.6);
  flame.rotation.x = -Math.PI / 2;  // 锥尖朝 -Z（向后延伸）
  aircraft.add(flame);

  return aircraft;
}

// =====================================================================
//  场景配置
// =====================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151c);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(8, 4, 11);   // 直接看到飞船的角度
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// ---- 光照：环境光基础亮度 + 强平行光硬阴影/高光 ----
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(6, 9, 5);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 1;
dir.shadow.camera.far = 40;
dir.shadow.camera.left = -12;
dir.shadow.camera.right = 12;
dir.shadow.camera.top = 12;
dir.shadow.camera.bottom = -12;
dir.shadow.bias = -0.0005;
scene.add(dir);

// 接收阴影的地面（静态展示用）
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  mat(0x1b2027, { roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3;
ground.receiveShadow = true;
scene.add(ground);

// ---- 加入飞行器 ----
const aircraft = createPreciseAircraft();
scene.add(aircraft);

// =====================================================================
//  渲染循环（无动画，仅渲染 + controls 阻尼更新）
// =====================================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
