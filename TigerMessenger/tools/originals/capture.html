window.catalog = Object.values(BUILDING_CATALOG).map(({id,label,create})=>({id,label,factory:create.toString()}));
window.captureOriginal = (id) => {
  let seed=20260907;
  const previous=Math.random;
  Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};

  } finally { Math.random=previous; }
};
