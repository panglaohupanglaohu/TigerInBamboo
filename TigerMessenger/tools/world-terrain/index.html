<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TigerMessenger · 全球地势</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1e28;color:#e6ede5;font:15px/1.65 system-ui}canvas{display:block}aside{position:absolute;left:22px;top:22px;width:280px;background:#102a35e8;padding:22px;border:1px solid #42616d;border-radius:12px}h1{font-size:24px;margin:6px 0 12px}small{color:#a0c2c5}button,select{font:inherit;color:inherit;background:#203f4d;border:1px solid #507481;border-radius:6px;padding:7px 10px;margin:5px 3px 5px 0;cursor:pointer}select{width:100%}p{color:#bfd0ce}a{color:#e6c88d}#detail{min-height:80px}.foot{font-size:12px;color:#8bb0b9}@media(max-width:700px){aside{width:210px;left:10px;top:10px;padding:12px}h1{font-size:19px}}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<aside><small>TIGER MESSENGER / 世界地势</small><h1>从半球，展开到全球</h1><p>原作雪山、裂谷、湖盆、丘陵与苔庭平原规则，生成完整球体地势候选。</p><button id="flip">另一半球</button><button id="routes">显示航线</button><button id="coastal">绕陆航线候选</button><button id="terrain">地势开关</button><select id="regions"></select><p id="detail">拖动旋转，滚轮靠近。原建筑尚未搬迁；这里先检查地势、陆海比例与区域关系。</p><div id="stats"></div><p class="foot">橙红通路与陆海不匹配，需规划港口、绕行或跨水连接。线条不是已建轨道。候选尚未替换游戏地形。</p><a href="../../">返回原游戏</a></aside>
<script type="module">
import * as T from 'three';
const [layout,meta,bytes]=await Promise.all([fetch('../../godot/data/world-layout-v2.json').then(r=>r.json()),fetch('../../godot/data/world-terrain-v3.json').then(r=>r.json()),fetch('../../godot/assets/terrain/world-terrain-v3.glb').then(r=>r.arrayBuffer())]);
const dv=new DataView(bytes),jsonLength=dv.getUint32(12,true),gltf=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,jsonLength))),binOffset=20+jsonLength+8;
const accessor=i=>{const a=gltf.accessors[i],v=gltf.bufferViews[a.bufferView],count=a.count*(a.type==='VEC3'?3:1),offset=binOffset+(v.byteOffset||0)+(a.byteOffset||0);return a.componentType===5125?new Uint32Array(bytes,offset,count):new Float32Array(bytes,offset,count)};
const scene=new T.Scene();scene.background=new T.Color('#0b1e28');const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,5,2000);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xd8e5e7,0x24383c,2));const sun=new T.DirectionalLight(0xffedd3,2);sun.position.set(250,200,300);scene.add(sun);
const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(accessor(0),3));geo.setAttribute('normal',new T.BufferAttribute(accessor(1),3));geo.setAttribute('color',new T.BufferAttribute(accessor(2),3));geo.setIndex(new T.BufferAttribute(accessor(3),1));const terrain=new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,roughness:1}));scene.add(terrain);
const ocean=new T.Mesh((()=>{const g=new T.BufferGeometry();const p=new Float32Array(accessor(0));for(let i=0;i<p.length;i+=3){const k=160/Math.hypot(p[i],p[i+1],p[i+2]);p[i]*=k;p[i+1]*=k;p[i+2]*=k}g.setAttribute('position',new T.BufferAttribute(p,3));g.setIndex(new T.BufferAttribute(accessor(3),1));g.computeVertexNormals();return g})(),new T.MeshStandardMaterial({color:'#124e67',roughness:.5,metalness:.1}));scene.add(ocean);
const unit=(lat,lon)=>new T.Vector3(Math.cos(lat*Math.PI/180)*Math.cos(lon*Math.PI/180),Math.sin(lat*Math.PI/180),Math.cos(lat*Math.PI/180)*Math.sin(lon*Math.PI/180));
const lines=new T.Group();lines.visible=false;scene.add(lines);for(const [id,r]of Object.entries(meta.routes)){const blocked=(r.mode==='sea'&&r.landFraction>.15)||(['ground','tram'].includes(r.mode)&&r.landFraction<.99);lines.add(new T.Line(new T.BufferGeometry().setFromPoints(r.points.map(p=>new T.Vector3(...p.position))),new T.LineBasicMaterial({color:blocked?0xe68c6d:0xe5c779})))}
const coastal=await fetch('../../godot/data/world-coastal-routes-v1.json').then(r=>r.json());
if(coastal.terrainSHA256!==meta.sha256)throw new Error('海岸路线已过期，请重新生成，避免显示不匹配的航线');
const coastLines=new T.Group();coastLines.visible=false;scene.add(coastLines);
for(const route of Object.values(coastal.routes))coastLines.add(new T.Line(new T.BufferGeometry().setFromPoints(route.points.map(p=>new T.Vector3(...p.position))),new T.LineBasicMaterial({color:0x73d9d0})));
for(const [id,port] of Object.entries(coastal.ports)){
 const marker=new T.Mesh(new T.SphereGeometry(1.5,8,6),new T.MeshBasicMaterial({color:0x73d9d0}));marker.position.set(...port.position);coastLines.add(marker);
 if(port.accessDistance>5){const r=layout.regions.find(r=>r.id===id),a=unit(r.targetLat,r.targetLon),b=new T.Vector3(...port.direction),angle=a.angleTo(b);const pts=Array.from({length:65},(_,i)=>{const t=i/64;return a.clone().multiplyScalar(Math.sin((1-t)*angle)).addScaledVector(b,Math.sin(t*angle)).normalize().multiplyScalar(174)});const line=new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineDashedMaterial({color:0xee986f,dashSize:2,gapSize:2}));line.computeLineDistances();coastLines.add(line)}
}
document.getElementById('coastal').onclick=()=>{coastLines.visible=!coastLines.visible;document.getElementById('detail').textContent=coastLines.visible?'青色：沿候选海底网格绕陆的海路。橙色虚线：未建的区域到海岸连接，不能乘船直接驶入。书店海岸距离仍需通过地形调整缩短。':'拖动旋转，选择区域。'};
const labels=[];for(const r of layout.regions){const dir=unit(r.targetLat,r.targetLon),height=Math.max(0,meta.regionalHeights[r.id]);const marker=new T.Mesh(new T.SphereGeometry(1.3,8,6),new T.MeshBasicMaterial({color:r.sourceLandmark?0xe6d499:0x90a5b2}));marker.position.copy(dir).multiplyScalar(163+height);scene.add(marker);const c=document.createElement('canvas');c.width=512;c.height=72;const ctx=c.getContext('2d');ctx.font='26px system-ui';ctx.textAlign='center';ctx.fillStyle='#f4f0dc';ctx.fillText(r.label,256,43);const sprite=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:true,transparent:true}));sprite.position.copy(dir).multiplyScalar(171+height);sprite.scale.set(60,8.4,1);scene.add(sprite);labels.push({sprite,marker,dir})}
let yaw=.7,pitch=.35,distance=530,drag=false,px=0,py=0;function frame(){camera.position.set(Math.cos(pitch)*Math.cos(yaw),Math.sin(pitch),Math.cos(pitch)*Math.sin(yaw)).multiplyScalar(distance);camera.lookAt(0,0,0);camera.setViewOffset(innerWidth,innerHeight,-140,0,innerWidth,innerHeight);for(const l of labels){const show=l.dir.dot(camera.position.clone().normalize())>.25;l.sprite.visible=show;l.marker.visible=show}renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
renderer.domElement.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){yaw-=(e.clientX-px)*.006;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY}};renderer.domElement.onwheel=e=>{e.preventDefault();distance=Math.max(280,Math.min(800,distance*Math.exp(e.deltaY*.001))) };
const $=id=>document.getElementById(id);$('flip').onclick=()=>{yaw+=Math.PI;pitch=-pitch};$('routes').onclick=()=>{lines.visible=!lines.visible;$('routes').textContent=lines.visible?'隐藏航线':'显示航线'};$('terrain').onclick=()=>terrain.visible=!terrain.visible;
$('regions').innerHTML='<option value="">选择区域 · 查看地势</option>'+layout.regions.map(r=>'<option value="'+r.id+'">'+r.label+'</option>').join('');$('regions').onchange=e=>{const r=layout.regions.find(r=>r.id===e.target.value);if(!r)return;yaw=r.targetLon*Math.PI/180;pitch=r.targetLat*Math.PI/180;$('detail').textContent=r.purpose+'。纬度 '+r.targetLat+'°，经度 '+r.targetLon+'°。'};$('stats').innerHTML='地势采样陆地约 '+Math.round(meta.landFraction*100)+'% · 海洋约 '+Math.round((1-meta.landFraction)*100)+'%';
window.__terrainReview={meta,layout,coastal,coastLines,renderer,scene,camera,flip:()=>{yaw+=Math.PI;pitch=-pitch},focus:(lat,lon)=>{pitch=lat*Math.PI/180;yaw=lon*Math.PI/180}};
window.onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};
</script></html>
