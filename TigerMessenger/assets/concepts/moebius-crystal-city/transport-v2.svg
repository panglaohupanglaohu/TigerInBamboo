<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" role="img" aria-label="水晶城三站与三港交通示意，非实测坐标"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#66d9df" stroke-width="1.5"/></marker></defs><rect width="1280" height="740" fill="#172b3b"/><g font-family="sans-serif" fill="#eee"><text x="36" y="45" font-size="27">水晶城 · 轨道与水路独立规划</text><text x="36" y="78" font-size="17">拓扑示意，非比例施工图；三站贯通、三港互通、各站均有步行换乘</text><path d="M100 360 Q240 290 410 350 Q680 235 870 335 Q1080 350 1190 455 L1190 680L100 680Z" fill="#245967"/><g fill="#324c49"><ellipse cx="265" cy="250" rx="125" ry="100"/><ellipse cx="705" cy="210" rx="140" ry="115"/><ellipse cx="1080" cy="370" rx="130" ry="115"/></g><path d="M35 205 L265 205 C450 205 500 125 705 125 S900 325 1080 325 L1250 325" fill="none" stroke="#eeb874" stroke-width="13"/><path d="M35 205 L265 205 C450 205 500 125 705 125 S900 325 1080 325 L1250 325" fill="none" stroke="#172b3b" stroke-width="3"/><g stroke="#fff" fill="#bceaf1" stroke-width="3"><circle cx="265" cy="205" r="12"/><circle cx="705" cy="125" r="12"/><circle cx="1080" cy="325" r="12"/></g><g font-size="22"><text x="175" y="176">A 西侧花厅站</text><text x="630" y="101">B 母塔站</text><text x="990" y="293">C 东侧花厅站</text><text x="38" y="238" font-size="16">区域来线</text><text x="1170" y="359" font-size="16">区域去线</text></g><g fill="#a8dae9"><path d="M250 285 L265 245L285 285Z"/><path d="M680 235L705 160L740 235Z"/><path d="M1060 410L1080 355L1110 410Z"/></g><g stroke="#efdca9" stroke-width="5" stroke-dasharray="9 7" fill="none"><path d="M265 220 L310 305L265 455"/><path d="M705 140L775 245L710 405"/><path d="M1080 340L1130 405L1080 485"/></g><g fill="#ddd4b0"><rect x="220" y="445" width="90" height="18"/><rect x="665" y="395" width="90" height="18"/><rect x="1035" y="475" width="90" height="18"/></g><g font-size="20"><text x="185" y="425">A 港 · 到达换乘</text><text x="630" y="375">B 港 · 母塔服务</text><text x="1000" y="455">C 港 · 东区</text></g><path d="M265 480 Q450 470 710 435 Q920 440 1080 510 Q870 660 480 600 Q300 575 265 480" fill="none" stroke="#66d9df" stroke-width="6" marker-mid="url(#arrow)" marker-end="url(#arrow)"/><text x="495" y="535" font-size="25" fill="#a8eef1">连续湖面主航道 · 双向通行</text><text x="345" y="574" font-size="18">停靠在侧湾；等待艇退出航道；桥墩与晶簇不得占用水路</text><text x="37" y="708" font-size="17">金色双线＝轨道　青色＝水路（箭头仅示连续性）　浅黄虚线＝步行／坡道／升降换乘</text></g></svg>