  #status { position: fixed; left: 8px; top: 8px; font: 12px/1.4 monospace; color: #333; }

  @media (max-width: 860px) {
    body { overflow-x: hidden; overflow-y: auto; }

      position: relative;
      left: auto;
      top: auto;
      width: auto;
      max-width: none;
      margin: 12px;

</style>
<!-- 与 index.html 一致的 importmap，复用本地 vendor/three -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",

}

<body>
<canvas id="c" width="512" height="512"></canvas>
<div id="status">init…</div>
<section id="lighting-lab" data-ready="false" data-preset="legacy">

  <select id="lighting-object">
    <option value="citadelEnsemble">高山圣城全景</option>
    <option value="odysseyCitadel">高山圣城主体（隔离）</option>
    <option value="citadelCascadeAudit">古堡顶层攻城梯近景</option>
    <option value="citadelStairAudit">山路阶梯近景</option>
    <option value="planetOskarV9">Oskar 风格·球面地貌 V9</option>
  </select>
  <button type="button" id="lighting-build">构建</button><br>
  <button type="button" data-lighting-mode="legacy">旧光照</button>
  <button type="button" data-lighting-mode="prototype" data-phase="noon">实验·正午</button>
  <button type="button" data-lighting-mode="prototype" data-phase="sunset">实验·黄昏</button>
  <button type="button" data-lighting-mode="prototype" data-phase="night">实验·深夜</button>

const STATUS = document.getElementById("status");
const R_DEFAULT = 40;

  // ---------------- 器物（建筑/道具/载具/结构）----------------
  { id: "bookshop", cat: "器物", label: "Hard To Find 书店",
    build: () => createHardToFindBookshop({ bermEdgeY: 0.02, signLine1: "HARD TO FIND", signLine2: "BOOKSHOP" }) },
  { id: "house", cat: "器物", label: "水墨小房", build: () => createLowPolyHouse() },

  { id: "lamp", cat: "器物", label: "街灯", build: () => createLowPolyStreetLamp() },

  { id: "hydrangea", cat: "植物", label: "绣球花丛", build: () => createLowPolyHydrangeaBush(1, 7) },

  { id: "swampZone", cat: "场景结构", label: "莫比斯湖沼生态区", R: 40,
    build: (ctx) => createMoebiusSwampZone({ seed: 20260804 }) },
  { id: "moebiusCity", cat: "场景结构", label: "莫比斯水晶城", R: 6,
    build: (ctx) => buildMoebiusCrystalMetropolis(ctx.scene, ctx.R, {}) },
  { id: "startingCamp", cat: "场景结构", label: "起始营地",

  { id: "planet", cat: "场景结构", label: "小星球本体", R: 40,

  { id: "planetOskarV9", cat: "场景结构", label: "Oskar 风格·球面地貌 V9", R: 160,

  { id: "moonLake", cat: "场景结构", label: "月牙湖", R: 40,

  { id: "odysseyCitadel", cat: "场景结构", label: "太古高山圣城要塞", manualFrame: true,

      const castle = buildOdysseyCitadel({ place: false, seed: 20260808 });
      // 隔离镜头只检查建筑层级，排除前景山体的遮挡；全景选项仍显示完整山谷。

      ctx.camera.up.set(0, 1, 0);
      ctx.camera.position.set(0, 25, 102);
      ctx.camera.fov = 40;
      ctx.camera.near = 0.5;
      ctx.camera.far = 400;
      ctx.camera.updateProjectionMatrix();
      ctx.camera.lookAt(0, 19, -2);
      return castle;
    } },
  { id: "mangaWaterfall", cat: "场景结构", label: "多层清透水帘与雾气瀑布",
    build: () => createMangaWaterfall({ seed: 20260809 }) },
  { id: "citadelRange", cat: "场景结构", label: "圣城山脉（双峰峡谷）", manualFrame: true,
    build: (ctx) => {
      const r = buildLatestCitadelRange(ctx.scene, 160);
      // 球面贴片通用对角取景会侧视成细条：沿站点法向拉开、岛侧俯看双峰峡谷
      const target = r.siteDir.clone().multiplyScalar(168);
      ctx.camera.position.copy(r.siteDir).multiplyScalar(160 + 45)
        .addScaledVector(r.fwd, 105); // 岛侧低位远景：双峰 + 峡谷体量
      ctx.camera.near = 1;
      ctx.camera.far = 800;
      ctx.camera.updateProjectionMatrix();
      ctx.camera.lookAt(target);
      return r.mesh;
    } },
  { id: "citadelEnsemble", cat: "场景结构", label: "圣城·前哨塔·雪山组合", R: 160,
    manualFrame: true,
    build: (ctx) => {
      const range = buildLatestCitadelRange(ctx.scene, 160);
      const site = citadelSiteDir(new THREE.Vector3());
      const castle = buildOdysseyCitadel({
        dir: site,
        faceDir: range.fwd,
        groundRadius: 160 + citadelRangeLiftDir(site),
        planetRadius: 160,
        seed: 20260808,
      });
      ctx.scene.add(castle);
      const target = site.clone().multiplyScalar(176)
        .addScaledVector(range.fwd, -1);
      ctx.camera.up.copy(site);
      ctx.camera.position.copy(site).multiplyScalar(174)
        .addScaledVector(range.fwd, 92)
        .addScaledVector(range.right, 16);
      ctx.camera.fov = 42;
      ctx.camera.near = 1;
      ctx.camera.far = 900;
      ctx.camera.updateProjectionMatrix();
      ctx.camera.lookAt(target);
      return null;
    } },
  { id: "citadelPilgrimageVista", cat: "场景结构", label: "送信人·白石梯湖·圣城远眺", R: 160,
    manualFrame: true,
    build: (ctx) => {
      const range = buildLatestCitadelRange(ctx.scene, 160);
      const site = citadelSiteDir(new THREE.Vector3());
      const castle = buildOdysseyCitadel({
        dir: site,
        faceDir: range.fwd,
        groundRadius: 160 + citadelRangeLiftDir(site),
        planetRadius: 160,
        seed: 20260808,
      });
      ctx.scene.add(castle);

      const messenger = buildMessenger();
      const viewpoint = range.pilgrimageLookout.userData.viewpoint.clone();
      const viewForward = range.pilgrimageLookout.userData.lookDirection.clone()
        .addScaledVector(site, -range.pilgrimageLookout.userData.lookDirection.dot(site))
        .normalize();
      const viewRight = new THREE.Vector3().crossVectors(site, viewForward).normalize();
      messenger.position.copy(viewpoint);
      messenger.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(viewRight, site, viewForward)
      );
      messenger.scale.setScalar(1.55);
      ctx.scene.add(messenger);

      ctx.camera.up.copy(site);
      ctx.camera.position.copy(site).multiplyScalar(176)
        .addScaledVector(range.fwd, 137)
        .addScaledVector(range.right, 18);
      const target = site.clone().multiplyScalar(181)
        .addScaledVector(range.fwd, 18);
      ctx.camera.fov = 38;
      ctx.camera.near = 1;
      ctx.camera.far = 900;
      ctx.camera.updateProjectionMatrix();
      ctx.camera.lookAt(target);
      return null;
    } },
  { id: "citadelCascadeAudit", cat: "场景结构", label: "古堡顶层攻城梯近景", R: 160,
    manualFrame: true,
    build: (ctx) => {
      const auditGround = new THREE.Mesh(
        new THREE.SphereGeometry(160, 64, 40),
        toonMat(0x6d8a63, { flatShading: true })
      );
      auditGround.name = "citadel-cascade-audit-global-ground";
      ctx.scene.add(auditGround);
      const range = buildLatestCitadelRange(ctx.scene, 160);
      const site = citadelSiteDir(new THREE.Vector3());
      const castle = buildOdysseyCitadel({
        dir: site,
        faceDir: range.fwd,
        groundRadius: 160 + citadelRangeLiftDir(site),
        planetRadius: 160,
        seed: 20260808,
      });
      ctx.scene.add(castle);
      ctx.scene.updateMatrixWorld(true);
      const deck = castle.getObjectByName("highland-castle-top-capture-deck");
      const target = deck
        ? deck.getWorldPosition(new THREE.Vector3())
        : site.clone().multiplyScalar(191);
      ctx.camera.up.copy(site);
      ctx.camera.position.copy(target)
        .addScaledVector(site, 5.5)
        .addScaledVector(range.fwd, 34)
        .addScaledVector(range.right, 4.5);
      ctx.camera.fov = 34;
      ctx.camera.near = 0.5;
      ctx.camera.far = 500;
      ctx.camera.updateProjectionMatrix();
      ctx.camera.lookAt(target);
      return null;
    } },
  { id: "citadelSideAudit", cat: "场景结构", label: "圣城侧视接地验收", R: 160,

      ctx.camera.near = 1;

  { id: "citadelStairAudit", cat: "场景结构", label: "圣城折返石阶·正门平桥近景", R: 160,

    build: (ctx) => {
      const range = buildLatestCitadelRange(ctx.scene, 160);
      const site = citadelSiteDir(new THREE.Vector3());
      const castle = buildOdysseyCitadel({
        dir: site,
        faceDir: range.fwd,
        groundRadius: 160 + citadelRangeLiftDir(site),
        planetRadius: 160,
        seed: 20260808,
      });
      ctx.scene.add(castle);
      // 左前低位看向连续山路：无旧五层台地，路线直接接入顶层古堡。
      ctx.camera.up.copy(site);
      ctx.camera.position.copy(site).multiplyScalar(183)

// =====================================================================
//  渲染器 / 场景 / 相机 / 灯光
// =====================================================================
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(512, 512, false);
// 莫比斯黄昏结界淡粉紫底（禁止纯黑背景把 Toon 色块压脏）
const SKY_MOEBIUS = 0xebb9b6;
renderer.setClearColor(SKY_MOEBIUS, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_MOEBIUS);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
camera.layers.enable(1); // 高山圣城建筑使用独立塑形光层

// 强白光：Ambient 1.35 把橙红/奶黄色块彻底照亮，无死黑面
const hemi = new THREE.HemisphereLight(0xffffff, 0xf5e6e0, 1.05);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.25);
dir.position.set(6, 12, 8);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xfff5e8, 0.55);
dir2.position.set(-8, 4, -6);
scene.add(dir2);
const ambient = new THREE.AmbientLight(0xffffff, 1.35);
scene.add(ambient);

const lightingPrototype = createOskLightingPrototype({
  scene,
  renderer,
  legacyLights: [hemi, dir, dir2, ambient],
  shadowMapSize: 1024,
});

let dynamic = null;

function disposeObject(obj) {
  obj.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (m.map) m.map.dispose();
        m.dispose();
      }
    }
  });
}

function frameCamera(box, mode = "bbox") {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 0.001);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.7; // 留白
  dist = Math.max(dist, 1.2);
  // 35° 仰角、约 30° 方位
  const az = THREE.MathUtils.degToRad(32);
  const el = THREE.MathUtils.degToRad(26);
  const off = new THREE.Vector3(
    Math.cos(el) * Math.sin(az),
    Math.sin(el),
    Math.cos(el) * Math.cos(az)
  ).multiplyScalar(dist);
  camera.position.copy(center).add(off);
  camera.near = Math.max(dist / 100, 0.05);
  camera.far = dist * 100 + maxDim * 10;
  camera.updateProjectionMatrix();
  camera.lookAt(center);
}

function canvasStats() {
  const gl = renderer.getContext();
  if (!gl?.readPixels) return null;
  const pixels = new Uint8Array(512 * 512 * 4);
  gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const bg = [pixels[0], pixels[1], pixels[2]];
  const luminance = [];
  let clipped = 0;
  let dark = 0;
  let saturationSum = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    const r = pixels[i];
    const g = pixels[i + 1];
    const b = pixels[i + 2];
    const bgDistance = Math.abs(r - bg[0]) + Math.abs(g - bg[1]) + Math.abs(b - bg[2]);
    if (bgDistance < 20 || pixels[i + 3] === 0) continue;
    const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    luminance.push(y);
    if (Math.max(r, g, b) >= 250) clipped++;
    if (y <= 18) dark++;
    const hi = Math.max(r, g, b);
    const lo = Math.min(r, g, b);
    saturationSum += hi > 0 ? (hi - lo) / hi : 0;
  }
  if (!luminance.length) return null;
  luminance.sort((a, b) => a - b);
  const q = (p) => luminance[Math.min(luminance.length - 1, Math.floor(luminance.length * p))];
  return {
    subjectPixels: luminance.length,
    p10: +q(0.1).toFixed(2),
    p50: +q(0.5).toFixed(2),
    p90: +q(0.9).toFixed(2),
    contrastP90P10: +(q(0.9) / Math.max(1, q(0.1))).toFixed(2),
    clippedPercent: +((clipped / luminance.length) * 100).toFixed(2),
    darkPercent: +((dark / luminance.length) * 100).toFixed(2),
    meanSaturation: +(saturationSum / luminance.length).toFixed(3),
  };
}

function rerenderLighting(mode = "legacy", phase = "noon") {
  lightingPrototype.attach(dynamic, camera);
  lightingPrototype.setMode(mode, phase);
  const citadelPhase = phase === "night" ? 0.92 : phase === "sunset" ? 0.79 : 0.5;
  dynamic?.traverse((object) => {
    if (object.userData?.kind === "odyssey-citadel") {
      updateCitadelNightWindows(object, citadelPhase, { force: true });
    }
    // 正式场景的 light volume 由 castle.update/P.timeOfDay 驱动；独立验收页
    // 没有主循环昼夜系统，因此显式注入相同相位，保证 A/B 截图能看到
    // 塔群冷光、低城暖光和贴合曲面湖泊的动态倒影。
    if (object.userData?.kind === "highland-light-volumes") {
      object.update?.(performance.now() * 0.001, citadelPhase);
    }
  });
  const renderTimes = [];
  for (let i = 0; i < 5; i++) {
    const started = performance.now();
    renderer.render(scene, camera);
    if (i > 0) renderTimes.push(performance.now() - started);
  }
  renderTimes.sort((a, b) => a - b);
  return {
    state: lightingPrototype.getState(),
    stats: canvasStats(),
    render: {
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      medianMs: +((renderTimes[1] + renderTimes[2]) * 0.5).toFixed(3),
    },
    dataUrl: canvas.toDataURL("image/png"),
  };
}

async function renderItem(id) {
  const entry = BY_ID[id];
  if (!entry) return { ok: false, error: "no such id: " + id };
  try {
    if (dynamic) {
      scene.remove(dynamic);
      if (dynamic.userData?.planetV8State) disposePlanetV8Runtime(dynamic.userData.planetV8State);
      else disposeObject(dynamic);
      dynamic = null;
    }
    dynamic = new THREE.Group();
    scene.add(dynamic);
    // Expose the current subject for the local visual harness only; this is
    // useful for isolating a generated surface from its water/vegetation
    // companions during browser-side QA.
    window.__shotHarnessDynamic = dynamic;
    const ctx = { THREE, scene: dynamic, camera, R: entry.R ?? R_DEFAULT };
    const obj = entry.build(ctx);
    if (obj) dynamic.add(obj);

    // 透射/玻璃材质在 SwiftShader 下会卡死：降级为普通半透明标准材质
    dynamic.traverse((o) => {
      if (!o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (let i = 0; i < mats.length; i++) {
        const m = mats[i];
        if (m && m.isMeshPhysicalMaterial && m.transmission && m.transmission > 0) {
          const repl = new THREE.MeshStandardMaterial({
            color: m.color ? m.color.clone() : new THREE.Color(0xbfe0ff),
            transparent: true,
            opacity: 0.5,
            roughness: 0.25,
            metalness: 0.0,
            emissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
            emissiveIntensity: m.emissiveIntensity || 0,
            side: m.side,
          });
          if (Array.isArray(o.material)) o.material[i] = repl; else o.material = repl;
        }
      }
    });

    let box;
    if (entry.frameMode === "cluster" && dynamic.children.length) {
      box = new THREE.Box3();
      for (const c of dynamic.children) {
        box.expandByPoint(c.position.clone());
      }
      // 给每个中心留一点半径缓冲
      const pad = 1.2;
      const min = box.min.clone().addScalar(-pad);
      const max = box.max.clone().addScalar(pad);
      box.set(min, max);
    } else {
      box = new THREE.Box3().setFromObject(dynamic);
    }
    if (box.isEmpty()) return { ok: false, error: "empty bounds" };
    if (!entry.manualFrame) frameCamera(box, entry.frameMode);
    lightingPrototype.attach(dynamic, camera);
    lightingPrototype.setMode("legacy");
    renderer.render(scene, camera);
    const dataUrl = canvas.toDataURL("image/png");
    return { ok: true, dataUrl, label: entry.label, cat: entry.cat };
  } catch (e) {
    return { ok: false, error: (e && e.stack) ? e.stack.split("\n").slice(0, 3).join(" | ") : String(e) };
  }
}

window.renderItem = renderItem;
window.renderLightingVariant = rerenderLighting;
window.__ready = true;
STATUS.textContent = "ready · " + REGISTRY.length + " items";

const LIGHTING_PANEL = document.getElementById("lighting-lab");
const LIGHTING_STATS = document.getElementById("lighting-stats");
const LIGHTING_OBJECT = document.getElementById("lighting-object");
let lightingBuilt = false;

function publishLightingResult(mode, phase, result) {
  const compact = { mode, phase, state: result.state, stats: result.stats, render: result.render };
  LIGHTING_PANEL.dataset.ready = "true";
  LIGHTING_PANEL.dataset.preset = mode === "legacy" ? "legacy" : phase;
  LIGHTING_STATS.textContent = JSON.stringify(compact, null, 2);
}

async function buildLightingObject() {
  LIGHTING_PANEL.dataset.ready = "false";
  LIGHTING_STATS.textContent = "构建中…";
  const built = await renderItem(LIGHTING_OBJECT.value);
  if (!built.ok) {
    LIGHTING_STATS.textContent = built.error || "构建失败";
    return;
  }
  lightingBuilt = true;
  publishLightingResult("legacy", "noon", rerenderLighting("legacy", "noon"));
}

document.getElementById("lighting-build").addEventListener("click", buildLightingObject);
for (const button of document.querySelectorAll("[data-lighting-mode]")) {
  button.addEventListener("click", async () => {
    if (!lightingBuilt) await buildLightingObject();
    if (!lightingBuilt) return;
    const mode = button.dataset.lightingMode;
    const phase = button.dataset.phase || "noon";
    publishLightingResult(mode, phase, rerenderLighting(mode, phase));
  });
}
