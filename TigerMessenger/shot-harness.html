function buildStartingCampThumbnail() {
  const g = new THREE.Group();
  const rnd = () => Math.random();

  // 小沙滩地面
  const sand = new THREE.Mesh(
    new THREE.CircleGeometry(4.2, 48),
    toonMat(0xd2c4a7, { side: THREE.DoubleSide })
  );
  sand.rotation.x = -Math.PI / 2;
  sand.position.y = -0.02;
  sand.receiveShadow = true;
  g.add(sand);

  // 浅海斑块
  const sea = new THREE.Mesh(
    new THREE.CircleGeometry(6.0, 48),
    toonMat(0x2e8b9a, { transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthWrite: false })
  );
  sea.rotation.x = -Math.PI / 2;
  sea.position.y = -0.05;
  g.add(sea);

  // 下海小台阶
  for (let i = 0; i < 3; i++) {
    const step = new THREE.Mesh(
      facet(new THREE.BoxGeometry(1.2 - i * 0.15, 0.12, 0.5)),
      toonMat(0xb8ad96)
    );
    step.position.set(2.2 + i * 0.6, 0.06 - i * 0.02, 2.4 + i * 0.7);
    step.rotation.y = 0.3;
    step.castShadow = true;
    addOutline(step, 0.012);
    g.add(step);
  }

  // 左侧荒山 + 山洞
  const rockMat = toonMat(0x8b8579);
  const cragPos = [[-3.6, -1.8, 2.2], [-2.8, -2.4, 1.9], [-3.0, -0.9, 1.7], [-3.2, -1.6, 1.3], [-2.6, -1.4, 0.9]];
  for (const [x, z, s] of cragPos) {
    const c = new THREE.Mesh(facet(new THREE.IcosahedronGeometry(s, 0)), rockMat);
    c.position.set(x, s * 0.55, z);
    c.rotation.set(Math.random() * 0.6, Math.random() * Math.PI, Math.random() * 0.5);
    c.castShadow = true;
    addOutline(c, 0.03);
    g.add(c);
  }
  const cave = new THREE.Mesh(facet(new THREE.BoxGeometry(1.4, 1.0, 0.9)), toonMat(0x2a2521));
  cave.position.set(-2.9, 0.55, -1.0);
  addOutline(cave, 0.02);
  g.add(cave);

  // 叠瀑
  const fallMat = toonMat(0x00a896, { emissive: 0x50c878, emissiveIntensity: 0.25, transparent: true, opacity: 0.78, depthWrite: false });
  for (let i = 0; i < 3; i++) {
    const h = 1.2 - i * 0.15;
    const stream = new THREE.Mesh(facet(new THREE.CylinderGeometry(0.07, 0.14, h, 6)), fallMat);
    stream.position.set(-2.9 - i * 0.35, 1.6 - i * 0.55, -1.6 + i * 0.45);
    stream.rotation.z = 0.08;
    g.add(stream);
  }

  // 太空水环
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(3.8, 4.2, 64),
    new THREE.MeshBasicMaterial({ color: 0xa3e4d7, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false })
  );
  ring.position.set(3, 4.5, -4);
  ring.lookAt(0, 0, 0);
  g.add(ring);

  // 弹琴老人
  const elder = new THREE.Group();
  const cloth = toonMat(0x3a3f46);
  const skin = toonMat(0xe8c39a);
  const beardMat = toonMat(0xf0ede6);
  const torso = new THREE.Mesh(facet(new THREE.BoxGeometry(0.5, 0.55, 0.4)), cloth);
  torso.position.y = 0.55;
  torso.castShadow = true;
  addOutline(torso, 0.018);
  elder.add(torso);
  for (const side of [-1, 1]) {
    const leg = new THREE.Mesh(facet(new THREE.BoxGeometry(0.15, 0.16, 0.5)), cloth);
    leg.position.set(side * 0.14, 0.14, 0.3);
    addOutline(leg, 0.012);
    elder.add(leg);
  }
  const head = new THREE.Mesh(facet(new THREE.BoxGeometry(0.34, 0.32, 0.32)), skin);
  head.position.y = 1.05;
  head.castShadow = true;
  addOutline(head, 0.015);
  elder.add(head);
  const beard = new THREE.Mesh(facet(new THREE.BoxGeometry(0.28, 0.22, 0.1)), beardMat);
  beard.position.set(0, 0.9, 0.18);
  addOutline(beard, 0.01);
  elder.add(beard);
  const qin = new THREE.Mesh(facet(new THREE.BoxGeometry(0.58, 0.16, 0.3)), toonMat(0x8a5a3a));
  qin.position.set(0, 0.52, 0.34);
  qin.castShadow = true;
  addOutline(qin, 0.012);
  elder.add(qin);
  const keys = new THREE.Mesh(facet(new THREE.BoxGeometry(0.5, 0.05, 0.12)), beardMat);
  keys.position.set(0, 0.6, 0.38);
  addOutline(keys, 0.006);
  elder.add(keys);
  elder.position.set(-0.8, 0, 0.4);
  elder.rotation.y = 2.6;
  g.add(elder);

  // 阿狸
  const ali = createLowPolyFox({ scale: 0.52 });
  ali.position.set(0.9, 0, 1.1);
  ali.rotation.y = -0.9;
  g.add(ali);

  // 古松
  const pine = createAncientPineTree();
  pine.scale.multiplyScalar(0.85);
  pine.position.set(2.6, 0, -1.6);
  g.add(pine);

  // 野花
  for (let i = 0; i < 6; i++) {
    const a = rnd() * Math.PI * 2;
    const d = 1.5 + rnd() * 2.2;
    const x = -0.8 + Math.cos(a) * d;
    const z = 0.4 + Math.sin(a) * d;
    const flower = createLowPolyFlower(INK_FLOWER_COLORS[(rnd() * INK_FLOWER_COLORS.length) | 0]);
    flower.position.set(x, 0, z);
    flower.rotation.y = rnd() * Math.PI * 2;
    g.add(flower);
  }

  return g;
}

let dynamic = null;

function disposeObject(obj) {
  obj.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (m.map) m.map.dispose();
        m.dispose();
      }
    }
  });
}

function frameCamera(box, mode = "bbox") {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 0.001);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.7; // 留白
  dist = Math.max(dist, 1.2);
  // 35° 仰角、约 30° 方位
  const az = THREE.MathUtils.degToRad(32);
  const el = THREE.MathUtils.degToRad(26);
  const off = new THREE.Vector3(
    Math.cos(el) * Math.sin(az),
    Math.sin(el),
    Math.cos(el) * Math.cos(az)
  ).multiplyScalar(dist);
  camera.position.copy(center).add(off);
  camera.near = Math.max(dist / 100, 0.05);
  camera.far = dist * 100 + maxDim * 10;
  camera.updateProjectionMatrix();
  camera.lookAt(center);
}

async function renderItem(id) {
  const entry = BY_ID[id];
  if (!entry) return { ok: false, error: "no such id: " + id };
  try {
    if (dynamic) {
      scene.remove(dynamic);
      disposeObject(dynamic);
      dynamic = null;
    }
    dynamic = new THREE.Group();
    scene.add(dynamic);
    const ctx = { THREE, scene: dynamic, R: entry.R ?? R_DEFAULT };
    const obj = entry.build(ctx);
    if (obj) dynamic.add(obj);

    // 透射/玻璃材质在 SwiftShader 下会卡死：降级为普通半透明标准材质
    dynamic.traverse((o) => {
      if (!o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (let i = 0; i < mats.length; i++) {
        const m = mats[i];
        if (m && m.isMeshPhysicalMaterial && m.transmission && m.transmission > 0) {
          const repl = new THREE.MeshStandardMaterial({
            color: m.color ? m.color.clone() : new THREE.Color(0xbfe0ff),
            transparent: true,
            opacity: 0.5,
            roughness: 0.25,
            metalness: 0.0,
            emissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
            emissiveIntensity: m.emissiveIntensity || 0,
            side: m.side,
          });
          if (Array.isArray(o.material)) o.material[i] = repl; else o.material = repl;
        }
      }
    });

    let box;
    if (entry.frameMode === "cluster" && dynamic.children.length) {
      box = new THREE.Box3();
      for (const c of dynamic.children) {
        box.expandByPoint(c.position.clone());
      }
      // 给每个中心留一点半径缓冲
      const pad = 1.2;
      const min = box.min.clone().addScalar(-pad);
      const max = box.max.clone().addScalar(pad);
      box.set(min, max);
    } else {
      box = new THREE.Box3().setFromObject(dynamic);
    }
    if (box.isEmpty()) return { ok: false, error: "empty bounds" };
    frameCamera(box, entry.frameMode);
    renderer.render(scene, camera);
    const dataUrl = canvas.toDataURL("image/png");
    return { ok: true, dataUrl, label: entry.label, cat: entry.cat };
  } catch (e) {
    return { ok: false, error: (e && e.stack) ? e.stack.split("\n").slice(0, 3).join(" | ") : String(e) };
  }
}

window.renderItem = renderItem;
window.__ready = true;
STATUS.textContent = "ready · " + REGISTRY.length + " items";
</script>
</body>
</html>
