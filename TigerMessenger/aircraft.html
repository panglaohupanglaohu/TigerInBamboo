<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly 科幻飞行器 · Procedural Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  #info {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    font: 13px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
    color: #b9c6e0; background: rgba(10,16,32,0.55);
    padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);
    border: 1px solid rgba(120,160,255,0.25);
  }
  #info b { color: #7fd0ff; }
</style>
</head>
<body>
<div id="info"><b>Low-Poly 科幻飞行器</b><br>拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// =====================================================================
//  程序化 Low-Poly 科幻飞行器（纯基础几何体拼装）
//  约定：所有 MeshStandardMaterial 一律 flatShading: true
// =====================================================================

/** 统一平直着色材质工厂 */
function stdMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    flatShading: true,
    metalness: opts.metalness ?? 0.35,
    roughness: opts.roughness ?? 0.6,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 1,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1,
    side: opts.side ?? THREE.FrontSide,
  });
}

/** 发光件（不受光照影响，纯色高亮） */
function glowMat(color, opacity = 1) {
  return new THREE.MeshBasicMaterial({
    color,
    transparent: opacity < 1,
    opacity,
  });
}

function mesh(geo, mat, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = true;
  return m;
}

/**
 * 创建飞行器，所有部件加入一个 Group 并返回。
 * 机身长轴沿 +Z（机头朝 +Z），整体中心在局部原点附近。
 */
function createAircraft() {
  const g = new THREE.Group();
  g.name = "sci-fi-aircraft";

  // ---------- 色板 ----------
  const HULL = 0x2b3540;       // 暗灰哑光钛合金
  const HULL_HI = 0x3c4a59;    // 高光金属面
  const ACCENT = 0xf2c14e;     // 黄色拉花 / 发光线条
  const GLASS = 0x8fd6ff;      // 浅蓝玻璃罩
  const THRUST = 0x39b6ff;     // 蓝色喷射核心
  const THRUST2 = 0xff8a3c;    // 橙色喷射核心

  // ============================================================
  // 1. 机身 Fuselage：前宽后狭的六边流线锥体
  // ============================================================
  // 主机体：圆锥体压扁 + 拉长，模拟流线
  const bodyMat = stdMat(HULL, { metalness: 0.5, roughness: 0.55 });

  const fuselage = mesh(new THREE.CylinderGeometry(0.9, 0.35, 5.2, 6, 1), bodyMat);
  fuselage.rotation.x = Math.PI / 2;   // 立起的柱体放倒，长轴沿 Z
  fuselage.position.z = -0.2;
  g.add(fuselage);

  // 机头尖锥（前宽后狭：机头更宽更钝，尾部收尖）
  const nose = mesh(new THREE.ConeGeometry(0.92, 1.8, 6), stdMat(HULL_HI, { metalness: 0.55, roughness: 0.45 }));
  nose.rotation.x = -Math.PI / 2;      // 锥尖朝 +Z
  nose.position.z = 3.1;
  g.add(nose);

  // 机尾收口
  const tailCone = mesh(new THREE.ConeGeometry(0.36, 1.4, 6), bodyMat);
  tailCone.rotation.x = Math.PI / 2;   // 锥尖朝 -Z
  tailCone.position.z = -3.1;
  g.add(tailCone);

  // 机身背部脊线（让切面更硬朗）
  const spine = mesh(new THREE.BoxGeometry(0.18, 0.35, 4.6), stdMat(HULL_HI, { metalness: 0.6, roughness: 0.4 }));
  spine.position.set(0, 0.62, -0.2);
  g.add(spine);

  // 黄色拉花条（机身两侧）
  for (const sx of [-1, 1]) {
    const stripe = mesh(new THREE.BoxGeometry(0.08, 0.16, 3.6), glowMat(ACCENT), false);
    stripe.position.set(sx * 0.82, 0.12, -0.2);
    g.add(stripe);
  }

  // ============================================================
  // 2. 驾驶舱 Cockpit：菱形多边形发光玻璃罩
  // ============================================================
  const canopy = mesh(new THREE.OctahedronGeometry(0.78, 0), stdMat(GLASS, {
    metalness: 0.0, roughness: 0.15,
    emissive: GLASS, emissiveIntensity: 0.55,
    transparent: true, opacity: 0.85,
  }));
  canopy.scale.set(1.0, 0.7, 1.5);
  canopy.position.set(0, 0.62, 1.5);
  g.add(canopy);

  // 座舱下围框（深色金属环）
  const canopyRing = mesh(new THREE.CylinderGeometry(0.62, 0.7, 0.35, 6), stdMat(HULL_HI, { metalness: 0.6, roughness: 0.4 }));
  canopyRing.rotation.x = Math.PI / 2;
  canopyRing.position.set(0, 0.5, 1.2);
  g.add(canopyRing);

  // ============================================================
  // 3. 机翼与尾翼 Wings & Tail：后折前掠三角翼 + 翼尖小翼
  // ============================================================
  const wingMat = stdMat(HULL_HI, { metalness: 0.45, roughness: 0.5 });

  // 用一个函数造一侧机翼（含翼尖小翼），镜像复用
  function buildWing(side) {
    const w = new THREE.Group();
    // 主翼：扁平三角（用缩放的六棱柱近似三角翼），向后折角
    const wingGeo = new THREE.CylinderGeometry(0.05, 2.6, 3.0, 3, 1);
    const wing = mesh(wingGeo, wingMat);
    wing.rotation.z = Math.PI / 2;       // 平放
    wing.rotation.y = side * -0.45;      // 后掠角
    wing.scale.set(1, 1, 0.08);          // 压扁成薄翼
    wing.position.set(side * 1.4, -0.1, -0.6);
    w.add(wing);

    // 翼尖竖直小翼
    const tip = mesh(new THREE.BoxGeometry(0.1, 0.9, 1.1), stdMat(HULL, { metalness: 0.5, roughness: 0.5 }));
    tip.position.set(side * 2.35, 0.3, -1.4);
    tip.rotation.y = side * 0.3;
    w.add(tip);

    // 机翼前缘黄色发光线条
    const led = mesh(new THREE.BoxGeometry(0.07, 0.07, 2.6), glowMat(ACCENT), false);
    led.position.set(side * 2.0, 0.0, -0.5);
    led.rotation.y = side * -0.45;
    w.add(led);

    return w;
  }
  g.add(buildWing(1));
  g.add(buildWing(-1));

  // 尾翼（垂直 + 水平小翼）
  const vTail = mesh(new THREE.BoxGeometry(0.1, 1.3, 1.1), wingMat);
  vTail.position.set(0, 0.7, -3.0);
  g.add(vTail);

  const hTail = mesh(new THREE.BoxGeometry(2.4, 0.1, 1.0), wingMat);
  hTail.position.set(0, 0.05, -3.0);
  g.add(hTail);

  // 尾翼黄色细线
  const tailLed = mesh(new THREE.BoxGeometry(2.5, 0.06, 0.06), glowMat(ACCENT), false);
  tailLed.position.set(0, 0.12, -3.0);
  g.add(tailLed);

  // ============================================================
  // 4. 推进引擎 Engine / Thrusters：尾部 2 个六边形喷气口
  // ============================================================
  for (const sx of [-1, 1]) {
    // 引擎短舱
    const pod = mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.4, 6), stdMat(HULL, { metalness: 0.55, roughness: 0.45 }));
    pod.rotation.x = Math.PI / 2;
    pod.position.set(sx * 0.7, -0.15, -2.7);
    g.add(pod);

    // 六边形喷气口外圈
    const ring = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.2, 6), stdMat(0x141a22, { metalness: 0.7, roughness: 0.35 }));
    ring.rotation.x = Math.PI / 2;
    ring.position.set(sx * 0.7, -0.15, -3.45);
    g.add(ring);

    // 内嵌蓝色/橙色高亮发光体（MeshBasicMaterial）
    const coreColor = sx > 0 ? THRUST : THRUST2;
    const core = mesh(new THREE.CylinderGeometry(0.34, 0.28, 0.4, 6), glowMat(coreColor), false);
    core.rotation.x = Math.PI / 2;
    core.position.set(sx * 0.7, -0.15, -3.5);
    core.name = "thruster-core";
    g.add(core);

    // 喷射焰（半透明锥，向后）
    const flame = mesh(new THREE.ConeGeometry(0.3, 1.3, 6), glowMat(coreColor, 0.6), false);
    flame.rotation.x = -Math.PI / 2;    // 锥尖朝 -Z
    flame.position.set(sx * 0.7, -0.15, -4.2);
    flame.name = "thruster-flame";
    g.add(flame);
  }

  // 整体缩放统一量纲
  g.scale.setScalar(1.0);
  g.userData.thrusters = g.getObjectsByProperty("name", "thruster-core");
  g.userData.flames = g.getObjectsByProperty("name", "thruster-flame");
  return g;
}

// =====================================================================
//  基础场景搭建
// =====================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 18, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(7, 4.5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.5, 0);

// ---------- 光照 ----------
scene.add(new THREE.AmbientLight(0x6b7da8, 0.7));
const hemi = new THREE.HemisphereLight(0x9fc6ff, 0x202830, 0.5);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(6, 10, 6);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 1;
dir.shadow.camera.far = 40;
dir.shadow.camera.left = -12;
dir.shadow.camera.right = 12;
dir.shadow.camera.top = 12;
dir.shadow.camera.bottom = -12;
dir.shadow.bias = -0.0005;
scene.add(dir);

// 侧补光（冷蓝）让金属切面更分明
const fill = new THREE.DirectionalLight(0x4f7bd6, 0.4);
fill.position.set(-8, 4, -6);
scene.add(fill);

// ---------- 演示地面（接收阴影，衬托悬浮飞行） ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 48),
  stdMat(0x141b2b, { metalness: 0.1, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3;
ground.receiveShadow = true;
scene.add(ground);

// 网格点缀
const grid = new THREE.GridHelper(40, 40, 0x2a3a5c, 0x1b2740);
grid.position.y = -2.99;
scene.add(grid);

// ---------- 加入飞行器 ----------
const aircraft = createAircraft();
scene.add(aircraft);

// =====================================================================
//  渲染循环 + 悬停浮动动画
// =====================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // 轻微上下浮动 + 自转 + 微摆
  aircraft.position.y = Math.sin(t * 1.2) * 0.35;
  aircraft.rotation.y = Math.sin(t * 0.4) * 0.25;
  aircraft.rotation.z = Math.sin(t * 0.9 + 1.0) * 0.04;

  // 喷射焰脉动（缩放 + 透明度）
  if (aircraft.userData.flames) {
    const pulse = 0.8 + Math.sin(t * 14) * 0.25;
    for (const f of aircraft.userData.flames) {
      f.scale.set(1, pulse, 1);
    }
  }
  if (aircraft.userData.thrusters) {
    const glow = 0.85 + Math.sin(t * 10) * 0.15;
    for (const c of aircraft.userData.thrusters) {
      c.material.color.offsetHSL(0, 0, 0); // 保持颜色
      c.material.opacity = glow;
      c.material.transparent = true;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
