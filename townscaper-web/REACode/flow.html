<!--
  flow.html — 同一张体素场的三件非光照用途：软法线 / 简化碰撞 / 风。
  原文 931196707236392960 列的四项里，`lighting.js` 做了光照烘焙，这一页验证剩下三项
  （工具在新文件 `src/voxelflow.js`，只读体素场，不改共享文件）。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow · 体素场的软法线 / 碰撞 / 风</title>
<style>
  :root { --bg:#0f1417; --panel:rgba(18,24,28,.86); --line:rgba(255,255,255,.14); --ink:#e9eeea; --muted:#9db0ad; --accent:#7fd1b9; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; backdrop-filter:blur(8px); }
  #stats { top:14px; left:14px; max-width:390px; color:var(--muted); font-size:12px; line-height:1.75; }
  #stats b { color:var(--accent); font-weight:600; }
  #ctl { top:14px; right:14px; width:206px; }
  #ctl h2 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  #ctl label { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; }
  #ctl input { accent-color:var(--accent); }
  #ctl .hint { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; line-height:1.6; }
  #ctl a { color:var(--accent); text-decoration:none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="stats" class="panel"></div>
<div id="ctl" class="panel">
  <h2>体素场 · 三件用途</h2>
  <label><input type="checkbox" id="wind" checked> 风场箭头</label>
  <label><input type="checkbox" id="soft"> 地形软法线</label>
  <label><input type="checkbox" id="houses" checked> 房子</label>
  <label><input type="checkbox" id="terrain" checked> 地形</label>
  <div class="hint">
    拖动 = 旋转，滚轮 = 缩放，鼠标悬停 = 读碰撞高度。<br>
    「软法线」关掉就是逐面法线（一格一个折面）；打开后崖体的明暗跨格连续。<br>
    箭头颜色 = 风速，房子背风面几乎是蓝的。<br>
    <a href="fusion.html">融合场景</a> · <a href="index.html">index</a>
  </div>
</div>
<script type="module" src="src/flowdemo.js"></script>
</body>
</html>
