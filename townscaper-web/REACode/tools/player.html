<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<video id="v" muted playsinline preload="auto" style="display:none"></video>
<canvas id="c"></canvas>
<script>
const v = document.getElementById('v'), c = document.getElementById('c');
const ctx = c.getContext('2d', { willReadFrequently: true });
window.loadSrc = (src) => new Promise((res, rej) => {
  v.src = src; v.load();
  v.addEventListener('loadedmetadata', () => res({
    w: v.videoWidth, h: v.videoHeight, dur: v.duration,
    vw: v.webkitVideoDecodedByteCount ?? null,
  }), { once: true });
  v.addEventListener('error', () => rej(new Error('load error ' + (v.error && v.error.code))), { once: true });
});
window.start = () => { v.currentTime = 0; return v.play(); };
/* Capture one presented frame, return its pixel signature + png */
window.capture = () => {
  c.width = v.videoWidth; c.height = v.videoHeight;
  ctx.drawImage(v, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  // cheap signature: sampled luminance + channel sum
  let sum = 0, n = 0, r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4 * 37) {
    r += d[i]; g += d[i+1]; b += d[i+2];
    sum += d[i] * 0.3 + d[i+1] * 0.59 + d[i+2] * 0.11; n++;
  }
  return {
    t: v.currentTime,
    sig: [Math.round(r/n), Math.round(g/n), Math.round(b/n), Math.round(sum/n)].join(','),
    png: c.toDataURL('image/png'),
  };
};
window.dur = () => v.duration;
</script>
