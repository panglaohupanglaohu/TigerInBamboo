<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Engine — Box Test（自己写的 OBB 相交 + 突袭规划器）</title>
<style>
  html, body { margin: 0; height: 100%; background: #404040; overflow: hidden;
    font: 12px/1.45 -apple-system, "PingFang SC", sans-serif; color: #d0d0d0; }
  #app { display: flex; height: 100%; }
  #view { flex: 1 1 auto; display: block; cursor: crosshair; min-width: 0; }
  #panel { flex: 0 0 268px; width: 268px; background: #2d2d2d; border-left: 1px solid #1e1e1e; padding: 10px 12px;
    box-sizing: border-box; overflow-y: auto; }
  .t { color: #8a8a8a; font-size: 11px; margin: 10px 0 4px; border-bottom: 1px solid #3c3c3c; padding-bottom: 3px; }
  .t:first-child { margin-top: 0; }
  label { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  label > span:first-child { width: 96px; color: #a5a5a5; flex: none; }
  input[type=range] { width: 100%; }
  .stat { font: 11px ui-monospace, monospace; color: #a8e6c4; }
  .stat b { color: #fff; font-weight: 600; }
  .warn { color: #f0a07a; }
  #hint { position: fixed; left: 12px; bottom: 8px; color: #8b8b8b; font: 11px ui-monospace, monospace; }
  button { background: #3a3a3a; color: #d5d5d5; border: 1px solid #4a4a4a; border-radius: 3px;
    padding: 3px 9px; font: 11px inherit; cursor: pointer; }
  button:hover { background: #474747; }
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="panel">
    <div class="t">Planner</div>
    <label><span>格数上限</span><input id="maxBoxes" type="range" min="6" max="60" value="40" /></label>
    <div class="stat" id="maxBoxesV" style="margin:-2px 0 6px 102px">40</div>
    <label><span>半宽</span><input id="halfWidth" type="range" min="6" max="30" value="14" /></label>
    <div class="stat" id="halfWidthV" style="margin:-2px 0 6px 102px">0.14</div>
    <label><span>长宽比</span><input id="aspect" type="range" min="20" max="120" value="76" /></label>
    <div class="stat" id="aspectV" style="margin:-2px 0 6px 102px">7.6</div>
    <label><span>车道数</span><input id="lanes" type="range" min="1" max="9" value="5" /></label>
    <div class="stat" id="lanesV" style="margin:-2px 0 6px 102px">5</div>
    <div class="t">View</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">
      <button data-view="boxes" class="vbtn">框</button>
      <button data-view="circles" class="vbtn">外接圆</button>
      <button data-view="corner" class="vbtn">角点</button>
      <button data-view="audit" class="vbtn">裁剪面积复核</button>
    </div>
    <div class="t">Stats</div>
    <div class="stat" id="stats"></div>
    <div class="t">Test</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="stress">2 万对随机对账</button>
      <button id="speed">耗时对比</button>
      <button id="reseed">换 seed</button>
    </div>
    <div class="stat" id="testOut" style="margin-top:6px"></div>
  </div>
</div>
<div id="hint">鼠标点击 = 放一个盒子试探命不命中（绿=不碰，红=碰）· 原文 974325184525201409</div>
<script type="module">
import {
  makeBox, corners, planRaid, auditPlan, overlaps, satDepth, clipArea,
  stressReport, speedReport,
} from '../src/boxtest.js';

const cv = document.getElementById('view');
const ctx = cv.getContext('2d');
const statsEl = document.getElementById('stats');
const testOut = document.getElementById('testOut');
let dpr = Math.min(devicePixelRatio || 1, 2);
let W = 0, H = 0;

const cfg = { maxBoxes: 40, halfWidth: 0.14, aspect: 7.6, lanes: 5, seed: 5, view: 'boxes' };
let plan = null;
let audit = null;
let probe = null;

const GROUPS = ['#e2564a', '#4a8ee2', '#e2c14a', '#e28a3c'];

function rebuild() {
  plan = planRaid({
    maxBoxes: cfg.maxBoxes, halfWidth: cfg.halfWidth, aspect: cfg.aspect,
    lanes: cfg.lanes, seed: cfg.seed,
  });
  audit = auditPlan(plan.boxes);
  statsEl.innerHTML = [
    `放下 <b>${plan.boxes.length}</b> / ${cfg.maxBoxes} · 站位 ${plan.stations}`,
    `空站位 ${plan.rejected}（走廊已满）`,
    `粗筛省掉 <b>${plan.broadphaseSaved}</b> 次完整 SAT`,
    `两两复核 ${audit.checked} 对 · 相交 <b class="${audit.bad ? 'warn' : ''}">${audit.bad}</b>`,
    `覆盖面积 ${audit.coveredArea}`,
    `aspect 实测 ${plan.aspect}`,
  ].join('<br>');
}

/* 世界范围 */
const WORLD = { x0: -5.2, x1: 5.2, z0: -3.6, z1: 3.6 };
function mapper() {
  const s = Math.min(W / (WORLD.x1 - WORLD.x0), H / (WORLD.z1 - WORLD.z0)) * 0.92;
  const cx = W / 2, cy = H / 2;
  return {
    s,
    X: (x) => cx + x * s,
    Y: (z) => cy + z * s,
    invX: (px) => (px - cx) / s,
    invY: (py) => (py - cy) / s,
  };
}

function resize() {
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const m = mapper();
  ctx.fillStyle = '#404040';
  ctx.fillRect(0, 0, W, H);

  // 网格 1 单位
  ctx.strokeStyle = '#4a4a4a';
  ctx.lineWidth = 1;
  for (let x = Math.ceil(WORLD.x0); x <= WORLD.x1; x++) {
    ctx.beginPath(); ctx.moveTo(m.X(x), m.Y(WORLD.z0)); ctx.lineTo(m.X(x), m.Y(WORLD.z1)); ctx.stroke();
  }
  for (let z = Math.ceil(WORLD.z0); z <= WORLD.z1; z++) {
    ctx.beginPath(); ctx.moveTo(m.X(WORLD.x0), m.Y(z)); ctx.lineTo(m.X(WORLD.x1), m.Y(z)); ctx.stroke();
  }

  // 岛屿（中央一小块，对应帧里那座体素岛）
  ctx.fillStyle = '#6b4f45';
  ctx.beginPath();
  const R = 0.95, N = 9;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = R * (0.82 + 0.18 * Math.sin(i * 2.7 + 1.1));
    const px = m.X(Math.cos(a) * r), py = m.Y(Math.sin(a) * r * 0.92);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8f6d5e'; ctx.stroke();

  // 路径（规划器的走廊）
  if (plan) {
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    plan.route.forEach((p, i) => (i ? ctx.lineTo(m.X(p.x), m.Y(p.z)) : ctx.moveTo(m.X(p.x), m.Y(p.z))));
    ctx.stroke();
  }

  if (plan) {
    for (const b of plan.boxes) {
      const cs = corners(b);
      const col = GROUPS[b.group % GROUPS.length];
      if (cfg.view === 'circles') {
        ctx.strokeStyle = col; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(m.X(b.cx), m.Y(b.cz), Math.hypot(b.hx, b.hz) * m.s, 0, 7);
        ctx.stroke();
        continue;
      }
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      cs.forEach((p, i) => (i ? ctx.lineTo(m.X(p.x), m.Y(p.z)) : ctx.moveTo(m.X(p.x), m.Y(p.z))));
      ctx.closePath(); ctx.stroke();
      if (cfg.view === 'corner') {
        ctx.fillStyle = col;
        for (const p of cs) ctx.fillRect(m.X(p.x) - 2, m.Y(p.z) - 2, 4, 4);
      }
      // 中心短轴：让"又长又窄"看得见
      ctx.beginPath();
      const c = Math.cos(b.rot), s = Math.sin(b.rot);
      ctx.moveTo(m.X(b.cx - s * b.hz), m.Y(b.cz + c * b.hz));
      ctx.lineTo(m.X(b.cx + s * b.hz), m.Y(b.cz - c * b.hz));
      ctx.stroke();
    }
  }

  // 手工试探的盒子
  if (probe) {
    const hit = plan.boxes.some((b) => overlaps(probe, b));
    const cs = corners(probe);
    ctx.strokeStyle = hit ? '#ff6b5e' : '#6bff9e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    cs.forEach((p, i) => (i ? ctx.lineTo(m.X(p.x), m.Y(p.z)) : ctx.moveTo(m.X(p.x), m.Y(p.z))));
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = hit ? 'rgba(255,107,94,0.16)' : 'rgba(107,255,158,0.14)';
    ctx.fill();
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillStyle = hit ? '#ff9a90' : '#8dffb8';
    ctx.fillText(hit ? '相交' : '不碰', m.X(probe.cx) + 6, m.Y(probe.cz) - 8);
  }

  ctx.fillStyle = 'rgba(208,208,208,0.8)';
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillText(`OBB ${plan ? plan.boxes.length : 0} 个 · SAT 4 轴 · 视图 ${cfg.view}`, 14, 20);
}

/* 绑定 */
const bindRange = (id, key, scale, toCfg) => {
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'V');
  el.addEventListener('input', () => {
    const v = parseFloat(el.value) * scale;
    cfg[key] = toCfg ? toCfg(v) : v;
    if (out) out.textContent = cfg[key];
    rebuild(); draw();
  });
};
bindRange('maxBoxes', 'maxBoxes', 1);
bindRange('halfWidth', 'halfWidth', 0.01);
bindRange('aspect', 'aspect', 0.1);
bindRange('lanes', 'lanes', 1);

document.querySelectorAll('.vbtn').forEach((b) => {
  b.onclick = () => { cfg.view = b.dataset.view; draw(); };
});

document.getElementById('stress').onclick = () => {
  const t = [];
  for (const seed of [1, 2, 3]) t.push(stressReport({ n: 20000, seed }));
  testOut.innerHTML = t.map((r) =>
    `seed ${r.seed}: 真错 <b class="${r.mismatch ? 'warn' : ''}">${r.mismatch}</b> / 擦边 ${r.grazing} · 相交率 ${r.overlapRate} · ${r.ms}ms`
  ).join('<br>') + '<br><span style="color:#8a8a8a">真错=深度&gt;1e-3 或面积&gt;1e-4 时两边结论不一致</span>';
};
document.getElementById('speed').onclick = () => {
  const r = speedReport({ n: 120000 });
  testOut.innerHTML = `12 万对：SAT ${r.satMs}ms（${r.satUsPerPair}µs/对）· 裁剪 ${r.clipMs}ms（${r.clipUsPerPair}µs/对）<br>` +
    `命中 ${r.satHits} / ${r.clipHits} · 慢 <b>${r.ratio}×</b>`;
};
document.getElementById('reseed').onclick = () => { cfg.seed++; rebuild(); draw(); };

cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect();
  const m = mapper();
  const x = m.invX(e.clientX - r.left), z = m.invY(e.clientY - r.top);
  const ang = (cfg.seed * 0.37 + x) % (Math.PI * 2);
  probe = makeBox(x, z, cfg.halfWidth * cfg.aspect, cfg.halfWidth, ang);
  draw();
});

addEventListener('resize', resize);
resize();
rebuild();
draw();

window.__boxtest = {
  get plan() { return plan; }, get audit() { return audit; },
  cfg, rebuild, stressReport, speedReport, clipArea, satDepth, overlaps,
};
</script>
</body>
</html>
