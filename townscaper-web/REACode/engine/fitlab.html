<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Engine — adjacency from mesh + "which ones fit"</title>
<style>
  html, body { margin: 0; height: 100%; background: #22252b; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; color: #dfe3e8;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: pre;
  }
  #title {
    position: fixed; left: 16px; top: 14px; color: #e7eaee;
    font: 13px/1.5 -apple-system, "PingFang SC", sans-serif;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">从网格抽邻接 + 哪些装得上（795010582239997952）</div>
<div id="hud"></div>

<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>

<script type="module">
/**
 * fitlab.html — src/adjacency.js 的验证页。
 *
 * 照参考片 795010582239997952 复刻：
 *   · 灰白房子转角、窗台/落水管/檐口的层次；
 *   · 选中的模块外面套一个**线框盒**，八个角各一个白点；
 *   · 盒子上有几条边被**黄绿色**描亮 —— 那些是"装得上"的边，
 *     没被描亮的边（灰）表示模块库里没有同样签名的对手。
 *
 * 和片子的差别：片子里是从一个真模型里选模块；这里模块库是现场用盒子搭的，
 * 但"签名相同 ⇒ 装得上"这条判断走的是 src/adjacency.js 的真代码。
 *
 * 键位：空格 换下一个选中模块 / W 线框总开关。
 */
import * as THREE from 'three';
import { buildFitTable, whichFits } from '../src/adjacency.js';

const cv = document.getElementById('c');
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#3a3f47');
scene.fog = new THREE.Fog('#3a3f47', 16, 34);

const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 80);

scene.add(new THREE.HemisphereLight(0xeaf0f6, 0x9aa3ad, 1.25));
const sun = new THREE.DirectionalLight(0xfff6ea, 1.9);
sun.position.set(4, 7, 6);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc9d8e6, 0.6);
fill.position.set(-6, 3, -4);
scene.add(fill);

// ── 模块库：全是盒子，尺寸就是"契约"──────────────────────────────
function boxVertsTris(sx, sy, sz, ox = 0, oy = 0, oz = 0) {
  const h = [sx / 2, sy / 2, sz / 2];
  const V = [];
  for (const z of [-1, 1]) for (const y of [-1, 1]) for (const x of [-1, 1]) {
    V.push({ x: ox + x * h[0], y: oy + y * h[1], z: oz + z * h[2] });
  }
  // 索引顺序： (x,y,z) → 4*z'+2*y'+x'
  const T = [
    [0, 1, 3], [0, 3, 2],       // -z
    [4, 6, 7], [4, 7, 5],       // +z
    [0, 4, 5], [0, 5, 1],       // -y
    [2, 3, 7], [2, 7, 6],       // +y
    [0, 2, 6], [0, 6, 4],       // -x
    [1, 5, 7], [1, 7, 3],       // +x
  ];
  return { verts: V, tris: T };
}

// 楔形：斜面那条边（长度 √(0.5²+0.5²)≈0.707、方向 45°）在纯盒子库里没有对手，
// 于是 whichFits 会对它返回空 —— 这正是片子里"有的边描亮、有的边不描"的由来。
function wedgeVertsTris(sx, sy, sz) {
  const h = [sx / 2, sy / 2, sz / 2];
  const V = [
    { x: -h[0], y: -h[1], z: -h[2] }, { x: h[0], y: -h[1], z: -h[2] },
    { x: -h[0], y: -h[1], z: h[2] }, { x: h[0], y: -h[1], z: h[2] },
    { x: -h[0], y: h[1], z: -h[2] }, { x: h[0], y: h[1], z: -h[2] },
  ];
  const T = [
    [0, 1, 3], [0, 3, 2],       // 底
    [0, 4, 5], [0, 5, 1],       // 后
    [2, 3, 5], [2, 5, 4],       // 斜（唯一有斜边的面）
    [0, 2, 4], [1, 5, 3],       // 两侧
  ];
  return { verts: V, tris: T };
}

const catalog = [
  { name: 'wall 1.0×1.0×0.2', ...boxVertsTris(1.0, 1.0, 0.2) },
  { name: 'window 0.6×0.6×0.2', ...boxVertsTris(0.6, 0.6, 0.2) },
  { name: 'door 0.6×1.0×0.2', ...boxVertsTris(0.6, 1.0, 0.2) },
  { name: 'balcony 1.0×0.2×0.4', ...boxVertsTris(1.0, 0.2, 0.4) },
  { name: 'chimney 0.2×0.6×0.2', ...boxVertsTris(0.2, 0.6, 0.2) },
  { name: 'finial 0.6×0.6×0.6', ...boxVertsTris(0.6, 0.6, 0.6) },
  { name: 'wedge 0.7×0.5×0.7', ...wedgeVertsTris(0.7, 0.5, 0.7) },
];
const fit = buildFitTable(catalog);

// ── 场景：两层墙 + 窗 + 阳台 + 烟囱（片子的房子转角）──────────────
const wallMat = new THREE.MeshStandardMaterial({ color: '#d7d9dc', roughness: 0.95 });
const trimMat = new THREE.MeshStandardMaterial({ color: '#e6e8ea', roughness: 0.9 });
const darkMat = new THREE.MeshStandardMaterial({ color: '#5a626c', roughness: 0.8 });

function addBox(sx, sy, sz, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

// 地面
scene.add(new THREE.Mesh(
  new THREE.BoxGeometry(18, 0.4, 18),
  new THREE.MeshStandardMaterial({ color: '#7b8189', roughness: 1 }),
).translateY(-0.2));

// 主墙（朝 +z）与侧墙（朝 +x）
addBox(4.2, 4.2, 0.3, 0, 2.1, 0, wallMat);
addBox(0.3, 4.2, 3.6, 2.1, 2.1, 1.8, wallMat);
// 檐口
addBox(4.4, 0.2, 0.42, 0, 4.2, 0.02, trimMat);
addBox(0.42, 0.2, 3.8, 2.1, 4.2, 1.8, trimMat);
// 窗（就是被选中的模块）
const winGroup = new THREE.Group();
const winBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.16), darkMat);
winBox.position.set(0, 2.6, 0.2);
winGroup.add(winBox);
const winFrame = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.05, 0.1), trimMat);
winFrame.position.set(0, 2.6, 0.14);
winGroup.add(winFrame);
scene.add(winGroup);
// 窗台（阳台模块）
addBox(1.1, 0.12, 0.34, 0, 2.1, 0.28, trimMat);
// 落水管
addBox(0.14, 4.2, 0.14, 1.9, 2.1, 0.28, trimMat);
// 拱（门洞下的小块，纯装饰）
addBox(0.7, 1.2, 0.18, -1.1, 0.6, 0.18, darkMat);
// 烟囱
addBox(0.3, 0.7, 0.3, -1.4, 4.64, -0.6, wallMat);

// ── 选中断言：线框盒 + 八个角的白点 + 能装的边描亮 ──────────────────
const selBox = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.15, 1.15, 0.5)),
  new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.9 }),
);
selBox.position.set(0, 2.6, 0.22);
scene.add(selBox);

const cornerDots = new THREE.Group();
{
  const g = new THREE.SphereGeometry(0.035, 10, 8);
  const m = new THREE.MeshBasicMaterial({ color: '#ffffff' });
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
    const d = new THREE.Mesh(g, m);
    d.position.set(x * 0.575, 2.6 + y * 0.575, 0.22 + z * 0.25);
    cornerDots.add(d);
  }
}
scene.add(cornerDots);

// 黄绿描边：把"装得上"的那些边画出来（片子里就是这种细短线）
const fitLines = new THREE.Group();
scene.add(fitLines);

let selIdx = 1;                  // 默认选中 window
let selStats = { module: '', edges: 0, fit: 0, dim: 0, partners: {} };

function rebuildFitHighlight() {
  while (fitLines.children.length) {
    const c = fitLines.children.pop();
    c.geometry.dispose(); c.material.dispose();
    fitLines.remove(c);
  }
  const mod = catalog[selIdx];
  const modFit = fit.table[selIdx];
  let nFit = 0, nDim = 0;
  const partners = {};

  // 每条边画一小段（从边的中点向外 0.35），绿色=有对手，暗红=没有
  for (const e of modFit.edges) {
    const a = modFit.merged[e.a], b = modFit.merged[e.b];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 };
    const d = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
    const len = Math.hypot(d.x, d.y, d.z) || 1;
    const k = 0.42 / len;
    const cands = whichFits(fit, selIdx, e.key);
    const ok = cands.length > 0;
    if (ok) { nFit++; for (const c of cands) partners[catalog[c.module].name] = (partners[catalog[c.module].name] || 0) + 1; }
    else nDim++;
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(mid.x - d.x * k, mid.y - d.y * k, mid.z - d.z * k),
      new THREE.Vector3(mid.x + d.x * k, mid.y + d.y * k, mid.z + d.z * k),
    ]);
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: ok ? '#c3d93f' : '#8d4a44',
      transparent: true, opacity: ok ? 0.95 : 0.55,
    }));
    // 变换到场景里选中盒的位置
    l.position.set(0, 2.6, 0.22);
    fitLines.add(l);
  }
  selStats = { module: mod.name, edges: modFit.edges.length, fit: nFit, dim: nDim, partners };
}
rebuildFitHighlight();

addEventListener('keydown', (e) => {
  if (e.key === ' ') {
    selIdx = (selIdx + 1) % catalog.length;
    rebuildFitHighlight();
    e.preventDefault();
  }
});

let yaw = 1.36, pitch = 0.13, dist = 7.6;
function frame() {
  // 坑：机位一开始放在 +x/+z 的 45°，结果被 x=2.1 那堵侧墙整个挡住，
  // 截图里只有一面白墙。改成正对 +z（窗前）并稍稍抬高。
  camera.position.set(
    2.6 + Math.cos(yaw) * Math.cos(pitch) * dist,
    2.6 + Math.sin(pitch) * dist,
    1.6 + Math.sin(yaw) * Math.cos(pitch) * dist,
  );
  camera.lookAt(-0.1, 2.45, 0.2);
  hud.textContent =
    `selected: ${selStats.module}\n` +
    `edges=${selStats.edges}  fits=${selStats.fit}  noPartner=${selStats.dim}\n` +
    `partners: ${Object.entries(selStats.partners).slice(0, 3).map(([k, v]) => `${k}×${v}`).join('  ') || '—'}\n` +
    `键：空格 换模块`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

window.__worldStats = { kind: 'fitlab' };
window.__fit = {
  get stats() {
    return { ...selStats, catalog: catalog.map((c) => c.name), lineCount: fitLines.children.length };
  },
  next(n = 1) { selIdx = (selIdx + n) % catalog.length; rebuildFitHighlight(); return this.stats; },
  look(y, p, d) { yaw = y; pitch = p; dist = d; },
};
</script>
</body>
</html>
