<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Engine — Blob Canopy (surface nets + rubber band / balloon)</title>
<style>
  html, body { margin: 0; height: 100%; background: #38535f; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; color: #e9f2f5;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-shadow: 0 1px 2px rgba(0,0,0,.45); white-space: pre;
  }
  #title {
    position: fixed; left: 16px; top: 14px; color: #dfeaf0;
    font: 13px/1.5 -apple-system, "PingFang SC", sans-serif;
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">球堆 → 等值面（surface nets）→ 硬边橡皮筋 / 其余气球（1580162341668237312）</div>
<div id="hud"></div>

<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>

<script type="module">
/**
 * blobs.html — src/blobrelax.js 的验证页。
 *
 * 照参考片的两段来：先看**线框 + 红线**（红线 = 最靠近不同球的边），
 * 再切**实体**看松弛后的树冠。键位：W 线框 / H 红线 / R 松弛开关。
 * URL：`?state=raw|relaxed&wire=1&hard=1`
 */
import * as THREE from 'three';
import { buildBlobCanopy } from '../src/blobrelax.js';

const q = new URLSearchParams(location.search);
const cv = document.getElementById('c');
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#38535f');

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xdfeef7, 0xb7ad99, 1.15));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4);
sun.position.set(3.2, 5.5, 2.4);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc4dced, 0.7);
fill.position.set(-4, 2.5, -3);
scene.add(fill);

// 地面 + 一块"崖顶"，让树冠有落点（参考片里树冠是压在崖沿上的）
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(5.2, 0.5, 5.2),
  new THREE.MeshStandardMaterial({ color: '#cfc7b2', roughness: 0.95 }),
);
ground.position.y = -0.28;
scene.add(ground);

let state = q.get('state') || 'relaxed';
let wire = q.get('wire') === '1';
let showHard = q.get('hard') !== '0';

let mesh = null;
let lines = null;
let canopy = null;
let stats = null;

function rebuild() {
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  if (lines) { scene.remove(lines); lines.geometry.dispose(); lines.material.dispose(); }
  mesh = lines = null;

  const built = buildBlobCanopy({ seed: 3, res: 22, relax: state === 'relaxed' });
  stats = built.stats;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(built.mesh.verts.flat(), 3));
  geo.setIndex(built.mesh.tris.flat());
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: '#4d6b40',
    roughness: 0.9,
    metalness: 0,
    flatShading: false,
    wireframe: wire,
    side: THREE.DoubleSide,
  });
  mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  // 红线：最靠近不同球的边
  if (showHard && built.mesh.hardEdges.length) {
    const pts = [];
    for (const [a, b] of built.mesh.hardEdges) {
      pts.push(...built.mesh.verts[a], ...built.mesh.verts[b]);
    }
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: '#e8564a' }));
    scene.add(lines);
  }

  const s = stats;
  hud.textContent =
    `${state === 'relaxed' ? '松弛后' : '原始 MC'}   顶点 ${s.verts}   三角 ${s.tris}   硬边 ${s.hardEdges}\n` +
    `硬顶点 ${s.hardVerts}   软顶点 ${s.softVerts}\n` +
    `边长 均值 ${s.edgeBefore.mean} → ${s.edgeAfter.mean}   变异系数 ${s.edgeBefore.cv} → ${s.edgeAfter.cv}\n` +
    `接缝内陷 ${s.creaseBefore} → ${s.creaseAfter}\n` +
    `W 线框 · H 红线 · R 松弛开关`;
}

function resize() {
  const w = cv.clientWidth || innerWidth;
  const h = cv.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

addEventListener('keydown', (e) => {
  if (e.key === 'w' || e.key === 'W') { wire = !wire; rebuild(); }
  if (e.key === 'h' || e.key === 'H') { showHard = !showHard; rebuild(); }
  if (e.key === 'r' || e.key === 'R') { state = state === 'relaxed' ? 'raw' : 'relaxed'; rebuild(); }
});

let yaw = 0.7, pitch = 0.42, dist = 6.2;
let dragging = false, lx = 0, ly = 0, spin = true;
cv.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; spin = false; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lx) * 0.006;
  pitch = Math.min(1.2, Math.max(0.06, pitch + (e.clientY - ly) * 0.004));
  lx = e.clientX; ly = e.clientY;
});

resize();
rebuild();

const target = new THREE.Vector3(0, 0.65, 0);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (spin) yaw += dt * 0.22;
  camera.position.set(
    target.x + Math.cos(yaw) * Math.cos(pitch) * dist,
    target.y + Math.sin(pitch) * dist,
    target.z + Math.sin(yaw) * Math.cos(pitch) * dist,
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__worldStats = { kind: 'blobs' };
window.__blobs = {
  get stats() { return stats; },
  get state() { return state; },
  set(next, opts = {}) {
    state = next;
    if (opts.wire !== undefined) wire = opts.wire;
    if (opts.hard !== undefined) showHard = opts.hard;
    rebuild();
    return stats;
  },
  stopSpin() { spin = false; },
  look(y, p, d) { yaw = y; pitch = p; dist = d; spin = false; },
};
</script>
</body>
</html>
