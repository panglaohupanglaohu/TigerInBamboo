<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- python 的 http.server 不发 Cache-Control，浏览器会按 Last-Modified 启发式缓存，
     改了页面刷新还看到旧版（这次就踩了）。本地开发页直接禁掉。 -->
<meta http-equiv="Cache-Control" content="no-store" />
<meta http-equiv="Pragma" content="no-cache" />
<title>管线图与学习路线</title>
<style>
  :root { --bg: #eef4f3; --ink: #1d2f36; --muted: #5d7279; --card: #fff; --line: #d6e2e1; --accent: #2f7f8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 110px; }  /* 底部留给悬浮按钮 */
  nav a { color: var(--accent); text-decoration: none; font-weight: 600; margin-right: 14px; }
  h1 { font-size: 26px; margin: 14px 0 6px; }
  h2 { font-size: 19px; margin: 36px 0 12px; }
  .sub { color: var(--muted); max-width: 820px; margin: 0; }
  .verdict { background: #fff; border: 1px solid var(--line); border-left: 4px solid #7b5fb0; border-radius: 12px; padding: 14px 16px; margin-top: 16px; }
  .verdict b { font-size: 16px; }
  .timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 6px; }
  .era { border-radius: 10px; padding: 10px 12px; color: #fff; }
  .era small { display: block; opacity: .9; }
  .ev { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; margin-top: 8px; }
  .thumb { width: 74px; height: 50px; border-radius: 7px; border: 0; padding: 0; cursor: pointer; background: #9cc center / cover no-repeat; position: relative; }
  .thumb::after { content: '▶'; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 11px; text-shadow: 0 0 4px #000; }
  .thumb.sm { width: 54px; height: 36px; }
  .road { display: flex; flex-direction: column; gap: 12px; }
  .stp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 54px 1fr; gap: 14px; }
  .num { width: 46px; height: 46px; border-radius: 12px; color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
  .stp h3 { margin: 0 0 4px; font-size: 16.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; color: #fff; }
  .stp p { margin: 4px 0; }
  .lab { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 8px; }
  .clips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .reuse { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
  .reuse code, .check code { background: #eef4f3; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .check { background: #f4f8f7; border-radius: 8px; padding: 6px 10px; margin-top: 8px; font-size: 13.5px; }
  .recent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .rc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start; }
  .rc .t { font-weight: 600; font-size: 13.5px; margin: 0; }
  .rc .w { color: var(--muted); font-size: 11.5px; margin: 2px 0 0; word-break: break-all; }
  .rc .n { font-size: 11.5px; color: #2f7f8a; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .rc a { font-size: 11.5px; }
  .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .lane { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; border-top: 5px solid; }
  .lane h3 { margin: 0 0 4px; font-size: 15px; }
  .lane .note { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
  .lane .g { font-size: 11.5px; color: var(--muted); margin: 8px 0 2px; letter-spacing: .03em; }
  .st { display: grid; grid-template-columns: 10px 1fr 54px; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid #eef3f2; font-size: 13px; }
  .st .d { width: 10px; height: 10px; border-radius: 50%; }
  .st small { display: block; color: var(--muted); font-size: 11.5px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(96vw, 1520px); background: #111; }
  #dlg .vidRow { display: flex; align-items: stretch; max-height: 86vh; }
  #dlg .vidCol { display: flex; flex-direction: column; flex: 1 1 100%; min-width: 320px; }
  #dockHost { width: 0; overflow: hidden; transition: width .2s ease; background: #f7fbfa; }
  #dlg.withPanel #dockHost { width: min(48vw, 620px); border-left: 1px solid #22333a; }
  #dlg.withPanel .vidCol { flex: 1 1 52%; }
  #dlg::backdrop { background: rgba(0,0,0,.6); }
  #dlg video { width: 100%; display: block; max-height: 86vh; background: #000; }
  #dlg p { color: #e8eeee; margin: 0; padding: 10px 14px 14px; font-size: 13.5px; }
  /* 只作用于视频自己的关闭按钮；写成 #dlg button 会把面板里的按钮也钉到右上角 */
  /* 关闭按钮放**左上角**（视频上方）：右上角是钉住面板的标题栏，会被它压住 */
  #dlg > #close { position: absolute; left: 10px; right: auto; top: 8px; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; z-index: 3; }

  nav { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .navopen { margin-left: 8px; border: 0; border-radius: 999px; background: linear-gradient(135deg,#2f7f8a,#4f7fb8);
    color: #fff; font: 600 12.5px/1 -apple-system,"PingFang SC",sans-serif; padding: 8px 13px; cursor: pointer; }
  .navopen:hover { filter: brightness(1.07); }
  .cta { margin: 10px 0 2px; border: 1px dashed #9ecfca; background: #eef8f6; color: #235e64;
    border-radius: 10px; padding: 10px 14px; font: 600 13px/1.4 -apple-system,"PingFang SC",sans-serif; cursor: pointer; text-align: left; }
  .cta:hover { background: #e2f3f0; }

  /* ---------- 「我学到了什么」浮动面板（可拖拽 / 可钉到视频旁边） ---------- */
  #learnOpen { position: fixed; right: 20px; bottom: 18px; z-index: 40; border: 0; cursor: pointer;
    background: linear-gradient(135deg,#2f7f8a,#4f7fb8); color: #fff; font: 600 13.5px/1 -apple-system,"PingFang SC",sans-serif;
    padding: 13px 16px; border-radius: 999px; box-shadow: 0 8px 24px rgba(20,60,70,.28); }
  #learnOpen:hover { filter: brightness(1.06); }
  body.vid-open #learnOpen { opacity: 0; pointer-events: none; }
  .learn-float { position: fixed; z-index: 70; width: min(96vw, 1060px); height: min(86vh, 720px);
    border-radius: 16px; overflow: hidden; background: #f7fbfa; border: 1px solid #cfdcda;
    box-shadow: 0 24px 64px rgba(10,30,36,.34); display: flex; }
  .learn-float[hidden] { display: none; }
  .learn-panel { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; color: var(--ink); }
  /* 钉进视频对话框时：撑满右侧那一列，不再有圆角与阴影 */
  .learn-panel.docked { border-radius: 0; box-shadow: none; background: #f7fbfa; }
  /* 钉住时目录收窄但保留（620px 的列里 148 + 正文 够用） */
  .learn-panel.docked .lw { grid-template-columns: 148px 1fr; }
  .learn-panel.docked #learnToc button { font-size: 11.5px; padding: 6px 7px; }
  .learn-panel.docked #learnToc button small { display: none; }
  .learn-panel.docked #learnToc button { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .learn-panel.docked #learnBody { padding: 12px 14px 24px; }
  .lh { display: flex; align-items: baseline; cursor: move; user-select: none; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #fff; }
  .lh b { font-size: 16px; }
  .lh span { color: var(--muted); font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lh button { cursor: pointer; margin-left: 8px; flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .lw { flex: 1 1 0; display: grid; grid-template-columns: 248px 1fr; grid-template-rows: minmax(0,1fr); min-height: 0; overflow: hidden; }
  #learnToc { overflow: auto; border-right: 1px solid var(--line); background: #fff; padding: 10px 8px 20px; }
  #learnToc h4 { margin: 12px 8px 6px; font-size: 11.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  #learnToc button { display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    padding: 7px 9px; border-radius: 8px; font: 13px/1.4 -apple-system,"PingFang SC",sans-serif; color: var(--ink); }
  #learnToc button small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  #learnToc button.on, #learnToc button:hover { background: #eaf3f2; }
  #learnBody { overflow: auto; padding: 16px 20px 40px; }
  #learnBody h2 { margin: 4px 0 6px; font-size: 18px; }
  #learnBody .mut { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  .li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .li h3 { margin: 0 0 6px; font-size: 14.5px; }
  .li h3 .tag { font: 600 11px/1 ui-monospace,monospace; color: #fff; background: #7b8f95; border-radius: 5px; padding: 3px 6px; margin-left: 6px; vertical-align: 1px; }
  .li dl { margin: 0; display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px; font-size: 13px; }
  .li dt { color: var(--muted); font-weight: 600; font-size: 12px; padding-top: 1px; }
  .li dd { margin: 0; }
  .li dd.q { color: #3d5560; font-style: italic; }
  .li dd.n { color: #1f6b76; font-variant-numeric: tabular-nums; }
  .li dd.p { color: #9a4b2f; }
  .li a { color: var(--accent); }
  .clipquote { background: #fff; border-left: 3px solid #b8d3cf; border-radius: 0 10px 10px 0;
    padding: 9px 12px; font-size: 13px; color: #3d5560; font-style: italic; margin: 6px 0 10px; }
  .clipmeta dl { margin: 0; display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px; font-size: 12.5px; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .clipmeta dt { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .clipmeta dd { margin: 0; }
  .clipnote { font-size: 13px; background: #eef8f6; border-radius: 10px; padding: 9px 12px; margin-top: 10px; }
  .li.hi { box-shadow: 0 0 0 2px #7fc3b4 inset, 0 6px 18px rgba(47,127,138,.12); border-color: #9ecfca; }
  .ans { background: #fff; border: 1px solid var(--line); border-left: 4px solid #4f9a86; border-radius: 12px; padding: 14px 16px; }
  .ans .q { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .ans h3 { margin: 0 0 8px; font-size: 15.5px; }
  .ans .body { font-size: 13.5px; line-height: 1.7; }
  .ans .rf { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .li .more button { margin-top: 8px; border: 1px solid var(--line); background: #fff; color: var(--accent);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .li .more button:hover { background: #eef6f5; }
  .msg.u { cursor: pointer; }
  .lq { border-top: 1px solid var(--line); background: #fff; padding: 10px 16px 12px; flex: 0 0 auto; }
  #lqLog { max-height: 150px; overflow: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .msg { font-size: 13px; line-height: 1.55; }
  .msg.u { align-self: flex-end; background: #e8f2f1; border-radius: 10px 10px 2px 10px; padding: 6px 10px; max-width: 78%; }
  .msg.a { background: #f6f8f7; border: 1px solid var(--line); border-radius: 10px 10px 10px 2px; padding: 8px 11px; }
  .msg.a b { display: block; margin-bottom: 3px; }
  .msg.a .rf { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .msg.a .hit { font-size: 12.5px; color: #2b4750; margin-top: 6px; padding-left: 12px; border-left: 2px solid #cfe0dd; }
  .lq form { display: flex; gap: 8px; }
  .lq input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-family: inherit; }
  .lq input:focus { outline: 2px solid #bcdcd8; border-color: #9ecfca; }
  .lq form button { border: 0; border-radius: 10px; background: var(--accent); color: #fff; padding: 0 18px; font-size: 13.5px; cursor: pointer; }
  #lqChips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #lqChips button { border: 1px solid var(--line); background: #fff; color: #33545c; border-radius: 999px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #lqChips button:hover { background: #eef6f5; }
  @media (max-width: 860px) { .lw { grid-template-columns: 1fr; } #learnToc { display: none; } }
  @media (max-width: 980px) { .lanes { grid-template-columns: 1fr 1fr; } .recent { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { main { padding: 18px 16px 48px; } .lanes, .timeline, .recent { grid-template-columns: 1fr; } .stp { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← 场景</a><a href="learn.html">学习笔记</a><a href="overview.html">总览</a><a href="PIPELINE.md">PIPELINE.md</a><a href="GUIDE.md">接手指南 GUIDE.md</a><button class="navopen" data-learn-open>📚 我学到了什么（12 轮 / 134 条）</button></nav>
  <h1>管线图与学习路线</h1>
  <p class="sub">把 237 段视频按"管线"重新排了一遍：共享底座（网格、水、光照、导航）→ 建筑管线（Townscaper）和地形管线（engine）→ 两者在第三个项目里融合，最终上到球面。下面先是判断，再是"最近 12 轮新增了什么"，然后是一条可以照着学、照着做的路线（已扩到 11 步），最后是完整的管线图。<b>已学 134 / 237</b>；标「对照页」的都能直接打开，▶ 都能播放对应原片。</p>

  <div class="verdict" id="verdict"></div>

  <h2>最近 12 轮新增（第 9–20 轮）</h2>
  <p class="sub" id="recentNote"></p>
  <button class="cta" data-learn-open>看全部 12 轮的逐条台账（原文 / 画面 / 做法 / 数字 / 踩的坑），并可以直接提问 →</button>
  <div class="recent" id="recent"></div>

  <h2>学习路线（按这个顺序学和做）</h2>
  <div class="legend" id="legend"></div>
  <div class="road" id="road"></div>

  <h2>完整管线图</h2>
  <div class="lanes" id="lanes"></div>
</main>
<button id="learnOpen" data-learn-open>📚 我学到了什么 · 12 轮 / 134 条</button>

<div id="learnFloat" class="learn-float" hidden>
  <div id="learnPanel" class="learn-panel">
    <div class="lh" id="learnDrag">
      <b>我学到了什么</b>
      <span id="learnMeta"></span>
      <button id="learnPop" title="浮起来 / 钉回视频旁边">浮起</button>
      <button id="learnClose">收起</button>
    </div>
    <div class="lw">
      <aside id="learnToc"></aside>
      <main id="learnBody"></main>
    </div>
    <div class="lq">
      <div id="lqLog"></div>
      <form id="lqForm" autocomplete="off">
        <input id="lqInput" placeholder="针对这些学习提问，例如：河道流向为什么不能按高差算？" />
        <button type="submit">提问</button>
      </form>
      <div id="lqChips"></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="vidRow">
    <div class="vidCol">
      <video id="vid" controls loop playsinline></video>
      <p id="cap"></p>
    </div>
    <div id="dockHost"></div>
  </div>
  <button id="close">关闭</button>
</dialog>
<script src="learn/data.js?v=20261101d"></script>
<script src="learn/pipeline.js?v=20261101d"></script>
<script src="learn/learned.js?v=20261101d"></script>
<script src="learn/learnui.js?v=20261101d" defer></script>
<script>
const P = window.PIPELINE;
const byId = new Map((window.LEARN?.items ?? []).map((it) => [it.id, it]));
const laneOf = Object.fromEntries(P.lanes.map((l) => [l.key, l]));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const thumb = (id, cls = '') => {
  const it = byId.get(id);
  return `<button class="thumb ${cls}" data-play="${id}" title="${esc(it ? it.date + ' · ' + it.text : id)}" style="background-image:url(learn/thumbs/${id}.jpg)"></button>`;
};
const code = (s) => esc(s).replace(/(src\/[\w./]+|engine\/[\w./]+)/g, '<code>$1</code>');

document.getElementById('verdict').innerHTML = `<b>判断：${esc(P.verdict.title)}</b>
  <div class="timeline">
    <div class="era" style="background:#8a6b4f"><b>Bad North</b><small>2017–2019 · 方格体素岛：地形、房子、士兵、风、雪共用一个体素空间</small></div>
    <div class="era" style="background:#d9663f"><b>Townscaper</b><small>2019–2021 · 不规则四边形网格，只有建筑；水沿用 Bad North</small></div>
    <div class="era" style="background:#7b5fb0"><b>第三个项目</b><small>2021–2025 · 不规则网格 + 多格 tile，房子拼进地形，上球面</small></div>
  </div>
  ${P.verdict.points.map(([id, t]) => `<div class="ev">${thumb(id)}<span>${esc(t)}</span></div>`).join('')}`;

document.getElementById('recentNote').textContent = P.recentNote || '';
document.getElementById('recent').innerHTML = (P.recent || []).map((r) => `<div class="rc">
    ${thumb(r.id, 'sm')}
    <div>
      <p class="t">${esc(r.name)}</p>
      <p class="w">${code(r.where)}</p>
      <p class="n">${esc(r.num || '')}</p>
      ${r.page ? `<a href="${r.page}">${esc(r.pageName || r.page)} →</a>` : ''}
    </div>
  </div>`).join('');

document.getElementById('legend').innerHTML = Object.entries(P.statusName).map(([k, n]) => `<span><i style="background:${P.statusColor[k]}"></i>${n}</span>`).join('');

document.getElementById('road').innerHTML = P.roadmap.map((r) => {
  const lane = laneOf[r.lane];
  return `<section class="stp">
    <div class="num" style="background:${lane.color}">${r.step}</div>
    <div>
      <h3>${esc(r.name)}<span class="badge" style="background:${lane.color}">${esc(lane.name)}</span><span class="badge" style="background:${P.statusColor[r.status]}">${P.statusName[r.status]}</span></h3>
      <p>${esc(r.why)}</p>
      <div class="lab">要学的视频</div><div class="clips">${r.study.map((id) => thumb(id, 'sm')).join('')}</div>
      <div class="lab">可以直接引用的代码</div><ul class="reuse">${r.reuse.map((x) => `<li>${code(x)}</li>`).join('')}</ul>
      <div class="check"><b>怎么验收：</b>${code(r.check)}</div>
      ${r.page ? `<div class="check"><b>已经能看：</b><a href="${r.page}">${esc(r.page)} →</a></div>` : ''}
    </div></section>`;
}).join('');

document.getElementById('lanes').innerHTML = P.lanes.map((lane) => `
  <div class="lane" style="border-top-color:${lane.color}">
    <h3>${esc(lane.name)}</h3><p class="note">${esc(lane.note)}</p>
    ${lane.groups.map(([g, steps]) => `<div class="g">${esc(g)}</div>` + steps.map((s) => `
      <div class="st"><span class="d" style="background:${P.statusColor[s.status]}" title="${P.statusName[s.status]}"></span>
        <span>${esc(s.name)}${s.where ? `<small>${esc(s.where)}</small>` : ''}${s.toggle ? `<small><a href="index.html?on=${s.toggle === 'time' ? '' : s.toggle}${s.toggle === 'time' ? '&time=night' : ''}">在场景里看 →</a></small>` : ''}${s.tour ? `<small><a href="index.html?tour=${s.tour}">在场景里看 →</a></small>` : ''}${s.page ? `<small><a href="${s.page}">打开 ${esc(s.page)} →</a></small>` : ''}</span>
        ${thumb(s.id, 'sm')}</div>`).join('')).join('')}
  </div>`).join('');

const dlg = document.getElementById('dlg'), vid = document.getElementById('vid'), cap = document.getElementById('cap');
document.body.addEventListener('click', (e) => {
  const b = e.target.closest('[data-play]');
  if (!b) return;
  const id = b.dataset.play, it = byId.get(id);
  cap.innerHTML = `<b>${it?.date ?? ''}</b> · ${esc(it?.text ?? id)}${it?.note ? '<br><br>学到：' + esc(it.note) : ''}`;
  vid.poster = `learn/thumbs/${id}.jpg`;
  vid.src = `gifs/${id}.mp4`;
  vid.onerror = () => { cap.innerHTML += `<br><br><span style="color:#ffcf8a">本地没有视频：用 ./start.sh 启动；或看<a style="color:#ffcf8a" target="_blank" href="https://x.com/OskSta/status/${id}">原帖</a>。</span>`; };
  dlg.showModal();
  vid.play().catch(() => {});
  // 视频旁边自动挂上台账，并跳到这一条
  if (window.__learnUI) window.__learnUI.dockFor(id);
});
const close = () => {
  vid.pause(); vid.removeAttribute('src'); vid.load(); dlg.close();
  // 面板收回成浮动窗口（用户可能还想继续看别的条目）
  if (window.__learnUI && window.__learnUI.mode === 'docked') window.__learnUI.undock();
};
document.getElementById('close').onclick = close;
dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); });
dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
</script>
</body>
</html>
