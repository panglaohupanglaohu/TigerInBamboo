<!--
  Townscaper-like town builder — reconstruction from the WebGL build.
  Structure mirrors the shipped game's architecture (see README):
    Placemaker.GridGenerator  ->  src/quadgrid.js (triangle hex -> merged -> subdivided -> squared quads)
    Placemaker.Graphs.Graph   ->  src/town.js   (voxel columns, corner values, module choice)
    Placemaker.BigMeshMaster  ->  src/townmesh.js (one merged mesh, batched rebuild)
    Placemaker.AoBaker        ->  src/townmesh.js (layered occlusion + colour bounce bake)
    Placemaker.TextSaveSystem ->  src/save.js   (bit-array -> char alphabet)
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Townscaper REACode · 场景 + 学习导航</title>
<link rel="stylesheet" href="src/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="palette" class="panel" aria-label="palette"></div>

  <div id="tools" class="panel">
    <button class="tool" data-tool="build" title="建造 / Build (B)">▲</button>
    <button class="tool" data-tool="erase" title="拆除 / Erase (E)">▼</button>
    <button class="tool" data-tool="paint" title="刷色 / Paint (P)">■</button>
    <button class="tool" data-tool="line" title="直线刷：沿拓扑直线整条上色 / Straight-line paint (L)">╱</button>
    <span class="sep"></span>
    <button class="tool" id="undo" title="撤销 / Undo (Z)">↶</button>
    <button class="tool" id="redo" title="重做 / Redo (Y)">↷</button>
  </div>

  <div id="topright" class="panel">
    <button id="palettestyle" title="切换配色 / Palette">◐</button>
    <button id="timeofday" title="白天 / 黄昏 / 夜晚 (N)">☀</button>
    <button id="demo" title="生成示例城镇 / Demo town">◎</button>
    <button id="clear" title="清空 / Clear">✕</button>
    <button id="share" title="复制分享链接 / Copy link">⧉</button>
    <button id="help" title="帮助 / Help">?</button>
  </div>

  <div id="learnpanel"></div>

  <div id="toast"></div>

  <div id="helpcard" class="panel hidden">
    <h1>Townscaper <span>REACode</span></h1>
    <p>左键拖动 = 建造，<b>右键点击 = 拆除单块</b>（掏空底部会自动长出钢架；两侧都有支撑时变成拱），右键拖动 = 旋转，中键拖动 = 平移，滚轮 = 缩放。</p>
    <p>快捷键：<kbd>B</kbd> 建造　<kbd>E</kbd> 拆除　<kbd>P</kbd> 刷色　<kbd>1</kbd>–<kbd>9</kbd> 选色　<kbd>Z</kbd> 撤销　<kbd>Y</kbd> 重做　<kbd>R</kbd> 示例　<kbd>C</kbd> 清空　<kbd>N</kbd> 白天/黄昏/夜晚</p>
    <p>拖动同一处会连续升高；掏掉下方的方块，上面的建筑会由钢架托住，左右两侧都有房子时则变成拱门。被房子围起来的空地会变成后院。</p>
    <button id="helpclose">知道了</button>
  </div>
</div>

<script src="learn/data.js"></script>
<script src="learn/pipeline.js"></script>
<script type="module" src="src/app.js"></script>
<noscript>需要启用 JavaScript。</noscript>
</body>
</html>
