<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>节点图编辑器 · REACode重构版</title>
<style>body{margin:0;background:#edf3f0;color:#233b42;font:14px/1.6 system-ui}header{padding:14px 20px;background:white}h1{font-size:20px;margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button,select{padding:5px 9px;margin:3px}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;padding:12px}.canvas{overflow:auto;height:650px;background:#24333a;border-radius:12px}svg{display:block;touch-action:none}aside{background:white;border-radius:12px;padding:14px}label{display:block;margin:6px 0}input[type=number]{width:110px}textarea{width:100%;box-sizing:border-box;height:120px;font:11px monospace}fieldset{border:1px solid #c5d9d3;margin:10px 0}#preview{height:140px;background:#b1d5d4;position:relative;overflow:hidden}#mover{position:absolute;background:white;padding:5px;border-radius:4px;left:60px;top:60px;transition:none}#status{min-height:24px}a{color:#167786}.port{cursor:crosshair}.node-title{cursor:move}.edge{cursor:pointer}.edge:hover{stroke:#fff;stroke-width:6}@media(max-width:800px){main{grid-template-columns:1fr}.canvas{height:440px}}</style>
<header><h1>节点图编辑器</h1><a href="index.html">场景</a> · <a href="node-graph.html">原链对照</a> · <a href="artifacts/coverage/1724449858369568780-review-r61.md">学习来源</a><p>拖节点标题移动；从右侧输出圆点拖到左侧输入圆点接线；点连线删除。修改直接驱动下面的运行预览。</p>
<select id="type" aria-label="新节点类型"></select><button id="add">添加节点</button><button id="delete" disabled>删除选中节点</button><button id="undo">撤销</button><button id="redo">重做</button><button id="export">导出图与布局</button><button id="import">载入 JSON</button><span id="status" role="status"></span></header>
<main><div class="canvas"><svg id="graph" width="2100" height="1500" aria-label="可编辑节点画布"></svg></div><aside><h2>资产与参数</h2><p id="selection">请选择节点</p><div id="parameters"></div><h2>运行预览</h2><div id="preview"><div id="mover">Moving!</div></div><output id="value"></output><p>预览来自当前图的 sink 输出；原片未展示的编辑器外观由本地界面设计，不冒称 Unity 面板复刻。</p><textarea id="json" aria-label="节点图 JSON"></textarea></aside></main>
<script type="module" src="src/ui/node-graph-editor.js"></script></html>
