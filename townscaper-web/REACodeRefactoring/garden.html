<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>连通庭院小径 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:76vh;border:0}a{color:#26758a}label{margin-right:18px}</style><header><b>实际共享World · 院内连通小径</b> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/garden-contrast-review.md">逐帧证据</a><p>1290997501332525056展示封闭草坪、小径与中心装饰；本地用邻接图连接主轴端点，避免格心筛选导致断路。院墙按地面以上实际体素层判定；上层有桥但墙层镂空时不再误判封闭。未复现原作精细门口/形变边界、石板宽度和中心雕塑。</p><label>网格<select id="grid"><option value="mixed">三角＋四边</option><option value="quad">四边形</option></select></label><label><input id="hole" type="checkbox" checked>院中建筑障碍</label><label>院墙<select id="boundary"><option value="closed">封闭</option><option value="elevated">上层保留 / 墙层镂空</option><option value="open">地面开口</option></select></label><button id="restore">恢复原场景</button><button id="build">重建院落示例</button><span id="status">加载…</span></header><iframe id="scene" title="共享庭院小径"></iframe><script type="module">
const $=s=>document.querySelector(s);let api,saved;function build(){if(!api)return;const {world,grid,view}=api;world.reset();const start=grid.cells.reduce((a,c)=>c.cx*c.cx+c.cz*c.cz<a.cx*a.cx+a.cz*a.cz?c:a),depth=new Map([[start.id,0]]),q=[start];for(let i=0;i<q.length;i++){const c=q[i],d=depth.get(c.id);if(d>=3)continue;for(let j=0;j<c.n;j++){const o=world.neighbor(c,j);if(o&&!depth.has(o.id)){depth.set(o.id,d+1);q.push(o)}}}for(const c of q)world.fill(c,1);for(const c of q)for(let j=0;j<c.n;j++){const o=world.neighbor(c,j);if(o&&!depth.has(o.id))world.fill(o,3)}const wall=q.flatMap(c=>Array.from({length:c.n},(_,j)=>world.neighbor(c,j))).find(o=>o&&!depth.has(o.id));if(wall&&$('#boundary').value==='elevated')world.setSolid(wall,2,false);if(wall&&$('#boundary').value==='open')world.fill(wall,1);if($('#hole').checked)world.fill(start,3);view.worldMesh.invalidate();view.target.set(start.cx,1,start.cz);view.distance=14;view.pitch=1.25;view.updateCamera();view.render(0);$('#status').textContent=`院落${view.worldMesh.garden.yards.size}格 · 小径${view.worldMesh.garden.paths.size}格`;}function load(){api=null;window.gardenReview=null;$('#scene').src='index.html?scene=town&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.garden){setTimeout(ready,100);return}api=r;saved=r.world.snapshot();window.gardenReview={api,build};build()};ready()};$('#boundary').onchange=build;$('#grid').onchange=load;$('#hole').onchange=$('#build').onclick=build;$('#restore').onclick=()=>{if(api){api.world.restore(saved);api.view.worldMesh.invalidate();$('#status').textContent='已恢复原World；可重建示例'}};load();
</script></html>
