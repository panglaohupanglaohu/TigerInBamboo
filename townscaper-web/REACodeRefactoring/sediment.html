<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>世界坐标层理 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:74vh;border:0}a{color:#26758a}label{margin-right:14px}input{width:100px}</style><header><b>共享World岩壁 · 世界坐标沉积层</b> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/sediment-review.md">逐帧证据</a><p>1699038611125985317：宽窄层带；1699146321318314094：对坐标做扭曲后采层理，几何保持原位。本地采用可精确逆的Y剪切场；原作具体场/图案未知。</p><label>网格<select id="grid"><option value="mixed">三角＋四边</option><option value="quad">四边形</option></select></label><label>模式<select id="mode"><option value="2">弯层理着色</option><option value="1">直层理着色</option><option value="0">保留旧窄条网格</option></select></label><label>间距<input id="period" type="range" min=".1" max="1.5" step=".05" value=".5"></label><label>扭曲<input id="amplitude" type="range" min="0" max=".6" step=".02" value=".14"></label><span id="status">加载…</span><p>仅岩壁着色，屋顶/草顶/洞顶不套层理；反射、阴影和轮廓仍沿用旧网格近似，尚未匹配原作完整外观。</p></header><iframe id="scene" title="实际共享岩壁层理"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function apply(){if(!api)return;api.view.setStrataStyle({mode:+$('#mode').value,period:+$('#period').value,amplitude:+$('#amplitude').value});$('#status').textContent=`World ${api.world.version} · 仅uniform更新，几何/存档不变`;}function load(){api=null;window.sedimentReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.sedimentReview={api,apply};apply()};ready()};$('#grid').onchange=load;for(const id of ['mode','period','amplitude'])$('#'+id).oninput=apply;load();
</script></html>
