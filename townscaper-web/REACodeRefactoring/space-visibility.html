<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>共享World · 空间可见度</title><style>body{margin:0;font:15px system-ui;background:#eef4f3}header{padding:12px}button{margin-right:8px}iframe{width:100%;height:calc(100vh - 140px);border:0}</style><header><b>空间射线 · 真实共享World</b> <a href="pipeline.html" target="_top">管线</a><p><button id="quad">四边</button><button id="mixed">混合</button><button id="room">室内夹具</button><button id="inside">室内采样</button><button id="outside">屋顶上方采样</button><label><input id="on" type="checkbox" checked>射线</label> <output id="stats"></output></p><small>三维固定步长开阔度诊断，与导航门户视线独立。可漏掉薄障碍，不接管游戏视线或原片灰度着色；室内示例直接使用真实岩体。</small></header><iframe id="scene" src="index.html?scene=terrain&grid=quad"></iframe><script>
const f=document.querySelector('#scene');let cell;for(const kind of['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.spaceReview=null;cell=null;f.src='index.html?scene=terrain&grid='+kind;};
function sample(outside=false){if(!cell)return;const r=spaceReview;r.view.spaceVisibility.setPoint({x:cell.cx,y:(outside?4:1)*r.view.levelHeight+.08,z:cell.cz});}
document.querySelector('#room').onclick=()=>{const r=spaceReview,w=r.world;w.reset();cell=w.cells.reduce((a,b)=>Math.hypot(b.cx,b.cz)<Math.hypot(a.cx,a.cz)?b:a);w.fill(cell,1,{rock:true});for(const id of cell.edgeNeighbors)if(id>=0)w.fill(w.cells[id],4,{rock:true});w.setSolid(cell,4,true,{rock:true});r.view.changed();r.view.worldMesh.invalidate();sample();window.spaceCell=cell;};
document.querySelector('#inside').onclick=()=>sample();document.querySelector('#outside').onclick=()=>sample(true);document.querySelector('#on').onchange=()=>spaceReview?.view.setDebug('rayvis',document.querySelector('#on').checked);
const timer=setInterval(()=>{const r=f.contentWindow.rea;if(!r?.view.spaceVisibility)return;window.spaceReview=r;r.view.setDebug('rayvis',document.querySelector('#on').checked);const v=r.view.spaceVisibility.result;document.querySelector('#stats').value=v?'开阔度 '+v.value.toFixed(3)+' · '+v.rays.length+' 射线 · '+v.samples+' 次占用查询':'';},150);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
