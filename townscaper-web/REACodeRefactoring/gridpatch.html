<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>规则局部模板与顶点对偶 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.65 system-ui}header{padding:16px 24px}a{color:#26758a}button{margin:4px;padding:6px 12px}canvas{display:block;width:100%;height:68vh}#report{white-space:pre-wrap}</style><header><b>规则环带嵌入共享网格 → 同一World建筑/地形 → 顶点对偶观察</b> · <a href="pipeline.html">管线</a><p>130181视频是手工四边格/放射模板与环院，不是正六边形格子。本地单补丁：原边界顶点原样共用，规则内环，过渡带拒绝翻折。新世界种子，不迁移已有存档；复杂边界/多模板仍待补。</p><a href="?grid=quad">四边形底网</a> · <a href="?grid=mixed">三角+方格底网</a> · <button id="toggle">显示顶点对偶/候选点</button><button id="edit">切换中央塔</button><p>959752视频展示三角网的脉动顶点格。本页把真实格子扇形三角化，再做重心对偶；黄色点为区域内候选，尚未替换全局植被/导航。悬崖按源三角形分层，不声称垂直面完整贴合。</p><details><summary>查看实际网格平面与模板接缝</summary><svg id="plan" viewBox="-10 -10 20 20" style="width:320px;height:320px;background:#314552"></svg></details><div id="report"></div></header><canvas id="view"></canvas><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import{buildQuadGrid,buildMixedGrid}from'./src/core/grid.js';import{insertRadialPatch}from'./src/core/radial-patch.js';import{decorateCells,buildCellIndex}from'./src/core/spatial.js';import{World}from'./src/core/world.js';import{PALETTES}from'./src/core/palette.js';import{View}from'./src/world/view.js';import{VertexDualOverlay}from'./src/world/vertex-dual-overlay.js';
const kind=new URLSearchParams(location.search).get('grid')==='mixed'?'mixed':'quad',base=(kind==='mixed'?buildMixedGrid:buildQuadGrid)({radius:10,hexSize:1,seed:7}),grid=decorateCells(insertRadialPatch(base,{radius:3})),world=new World(grid);world.palette=PALETTES.town;
for(const c of world.cells){const r=Math.hypot(c.cx,c.cz);if(r<7)world.fill(c,1,{rock:true});if(r>2&&r<3.6){world.fill(c,3);world.color[c.id]=1}}
const view=new View(document.querySelector('#view'),world,grid,buildCellIndex(grid),{levelHeight:.5}),dual=new VertexDualOverlay(world,view.scene);view.frameTown();view.distance=22;view.target.set(0,1.2,0);view.updateCamera();const patchSet=new Set(grid.patch.cellIds);document.querySelector('#plan').innerHTML=grid.cells.map(c=>'<polygon points="'+c.pts.map(p=>p.x+','+p.z).join(' ')+'" fill="'+(patchSet.has(c.id)?'#438b86':'#314552')+'" stroke="#cde0dc" stroke-width=".025"/>').join('');let tower=false;function report(){document.querySelector('#report').textContent=JSON.stringify({kind,cells:grid.cells.length,replaced:grid.patch.removedCells,patchCells:grid.patch.cellIds.length,seamVertices:grid.patch.boundaryIds.length,worldVersion:world.version,dual:dual.stats},null,2)}
document.querySelector('#toggle').onclick=()=>{dual.group.visible=!dual.group.visible};document.querySelector('#edit').onclick=()=>{tower=!tower;for(const id of grid.patch.cellIds){const c=world.cells[id];if(Math.hypot(c.cx,c.cz)<1){world.fill(c,tower?5:1,{rock:!tower});world.color[id]=3}}view.changed();dual.refresh();report()};window.patchRuntime={world,grid,view,dual,kind};let last=performance.now();function frame(t){view.render(Math.max(0,Math.min((t-last)/1000,.05)));last=t;dual.update(t/1000);requestAnimationFrame(frame)}dual.refresh();report();requestAnimationFrame(frame);
</script></html>
