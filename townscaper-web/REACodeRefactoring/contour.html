<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>等值线连接审核 · REACode重构版</title><style>body{margin:24px;background:#edf4f0;color:#20343c;font:15px/1.6 system-ui}canvas{max-width:100%;background:#d5e3dc;border-radius:12px}input,select{font:inherit;margin:6px}a{color:#276e86}</style><h1>共享角点 · 不规则网格等值线</h1><p>跨格端点复用同一对象，橙线闭合、蓝线开放。三角格用线性插值，四边形鞍点用双线性判别。此页验证连接，不复现视频中的建筑模块库。</p><label><input type="checkbox" id="mixed" checked>混合网格</label><select id="field"><option value="island">内部岛屿</option><option value="slope">穿过边界的斜坡</option></select><label>等值<input id="iso" type="range" min="0.1" max="2.9" step="0.1" value="0.5"></label><div id="stats"></div><canvas width="1000" height="650"></canvas><p><a href="index.html?scene=terrain&on=contours">在真实场景开语义海岸诊断线</a> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/contour-review.md">逐帧记录</a></p><script type="module">
import{marchGrid}from'./src/core/contour.js';import{buildMixedGrid,buildQuadGrid}from'./src/core/grid.js';import{World}from'./src/core/world.js';
function run(){const mixed=document.querySelector('#mixed').checked,grid=mixed?buildMixedGrid({radius:6,seed:5}):buildQuadGrid({radius:4,seed:5}),world=new World(grid),kind=document.querySelector('#field').value;for(const c of world.cells)world.fill(c,kind==='island'?(Math.hypot(c.cx,c.cz)<1.5?3:0):Math.max(0,Math.min(3,Math.floor(c.cx+2))),{rock:true});const iso=Number(document.querySelector('#iso').value),result=marchGrid(world.cells,c=>world.top(c),{iso}),level=result.levels[0],ctx=document.querySelector('canvas').getContext('2d'),pts=grid.verts,minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minZ=Math.min(...pts.map(p=>p.z)),maxZ=Math.max(...pts.map(p=>p.z)),scale=Math.min(900/(maxX-minX),550/(maxZ-minZ)),P=p=>[500+(p.x-(minX+maxX)/2)*scale,325+(p.z-(minZ+maxZ)/2)*scale];ctx.clearRect(0,0,1000,650);for(const c of world.cells){ctx.beginPath();c.pts.forEach((p,i)=>i?ctx.lineTo(...P(p)):ctx.moveTo(...P(p)));ctx.closePath();ctx.fillStyle=world.top(c)?'#b5cba7':'#bdd2d6';ctx.fill();ctx.strokeStyle='#879f9b';ctx.lineWidth=1;ctx.stroke();}for(const path of level.paths){ctx.beginPath();path.points.forEach((p,i)=>i?ctx.lineTo(...P(p)):ctx.moveTo(...P(p)));ctx.strokeStyle=path.closed?'#a96422':'#226e9f';ctx.lineWidth=4;ctx.stroke();}for(const p of result.field.corners.values()){ctx.beginPath();ctx.arc(...P(p),2,0,7);ctx.fillStyle=p.value>iso?'#728a3d':'#576b7d';ctx.fill();}document.querySelector('#stats').textContent=`${world.cells.length}格 · 等值${iso} · ${level.segments.length}段 · 闭环${level.paths.filter(p=>p.closed).length} · 开放端点${level.openEndpoints.length} · 分叉${level.branches.length}`;window.contourReview={world,result,level};}
for(const id of ['mixed','field','iso'])document.querySelector('#'+id).oninput=run;run();
</script></html>
