<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>球面 World：网格生成 / 编辑 / 保存恢复 · 浏览器验收</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #22303c; font: 13px/1.5 system-ui, "PingFang SC", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 14px; top: 14px; width: 400px; background: rgba(255,255,255,.92); color: #1d2f36; border-radius: 12px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #ui h1 { font-size: 15px; margin: 0 0 4px; }
  #stat { font-size: 11.5px; color: #2f7f8a; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>球面 World（sphere-world.js）浏览器验收</h1>
  <div id="stat">加载中…</div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeSpherePatch, mapPoint } from './src/sphere/world-sphere.js';
import {
  makeSphereWorld, spherePick, sphereApply, sphereEdit,
  encodeSphereWorld, decodeSphereWorld,
} from './src/sphere/sphere-world.js';

const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

/* ---- 球面 World -------------------------------------------------------------- */
const R = 60;
const patch = makeSpherePatch({ R, up: norm([0.15, 1, -0.25]) });
const spec = { kind: 'quad', radius: 7, cellSize: 1.1, seed: 11, mode: 'sphere', y: 0, levelHeight: 1 };
const ctx = makeSphereWorld(patch, spec);

/* ---- 渲染 ------------------------------------------------------------------ */
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22303c);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 1000);
const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const HOME = {
  pos: V(patch.anchor).addScaledVector(V(patch.up), 15).addScaledVector(V(patch.e1), 10).addScaledVector(V(patch.e2), -6),
  look: V(patch.anchor).addScaledVector(V(patch.up), 0.5),
};
camera.position.copy(HOME.pos); camera.lookAt(HOME.look);
scene.add(new THREE.HemisphereLight(0xbfd6e4, 0x27333f, 1.15));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.7);
sun.position.copy(V(patch.anchor).addScaledVector(V(patch.up), 40).addScaledVector(V(patch.e1), 25));
scene.add(sun);
// 海洋球壳（网格面片之下的水体）
const ocean = new THREE.Mesh(new THREE.SphereGeometry(R * 0.996, 72, 48), new THREE.MeshLambertMaterial({ color: 0x2e5066 }));
scene.add(ocean);

const PALETTE = ['#d9b380', '#c96f4a', '#e0e4e8', '#8fb573', '#b5533c', '#e5c07b', '#7fa6b8', '#a08bc0', '#d989a6', '#6b8f71', '#c4a484', '#94795d', '#5d7a94', '#b8b09a', '#8a5a44'];
const SEA = [0.38, 0.46, 0.52], ROCK = [0.52, 0.55, 0.47];
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const shade = (rgb, k) => rgb.map((v) => v * k);
const cellMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });

/** 由 ctx 的 grid+world 重建三角网格：空格海平面面片 + 实心柱（顶盖 + 高出邻居的侧壁）。 */
function buildMesh(c) {
  const { grid, world } = c, lh = c.levelHeight;
  const pos = [], col = [];
  const push = (p, rgb) => { pos.push(p[0], p[1], p[2]); col.push(rgb[0], rgb[1], rgb[2]); };
  const lift = (x, z, y) => mapPoint(patch, x, z, { mode: c.mode, y });
  for (const cell of grid.cells) {
    if (!cell.inRange) continue;
    const t = world.top(cell);
    if (!t) {                                        // 空格：球面海平面面片（扇形三角化）
      for (let i = 1; i < cell.n - 1; i++) { push(cell.pos, SEA); push(cell.pts3[i], SEA); push(cell.pts3[i + 1], SEA); }
      continue;
    }
    const rockTop = world.isRock(cell, t);
    const wallCol = world.color[cell.id] >= 0 ? hex(PALETTE[world.color[cell.id] % PALETTE.length]) : (rockTop ? ROCK : hex(PALETTE[0]));
    const capCol = rockTop ? ROCK : wallCol;
    const topY = t * lh, ctr = lift(cell.cx, cell.cz, topY);
    const ring = cell.pts.map((p) => lift(p.x, p.z, topY));
    for (let i = 1; i < cell.n - 1; i++) { push(ctr, capCol); push(ring[i], capCol); push(ring[i + 1], capCol); }
    for (let i = 0; i < cell.n; i++) {               // 侧壁：只画高出邻居顶面的部分
      const nb = cell.edgeNeighbors[i], nbTop = nb >= 0 ? world.top(grid.cells[nb]) : 0;
      if (nbTop >= t) continue;
      const y0 = nbTop * lh, a = cell.pts[i], b = cell.pts[(i + 1) % cell.n];
      const a0 = lift(a.x, a.z, y0), b0 = lift(b.x, b.z, y0), b1 = ring[(i + 1) % cell.n], a1 = ring[i], wc = shade(wallCol, 0.8);
      push(a0, wc); push(b0, wc); push(b1, wc);
      push(a0, wc); push(b1, wc); push(a1, wc);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, cellMat);
}

let mesh = null;
function show(c) { if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); } mesh = buildMesh(c); scene.add(mesh); }
function render() { renderer.render(scene, camera); }
show(ctx); render();

/* ---- 验收 API --------------------------------------------------------------- */
const snaps = {};
function snap(name) {
  render();
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const buf = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  snaps[name] = buf;
  return { w, h, bytes: buf.length };
}
function diff(a, b) {
  const A = snaps[a], B = snaps[b];
  if (!A || !B || A.length !== B.length) throw new Error('snap missing');
  let px = 0, maxd = 0;
  for (let i = 0; i < A.length; i += 4) {
    const d = Math.max(Math.abs(A[i] - B[i]), Math.abs(A[i + 1] - B[i + 1]), Math.abs(A[i + 2] - B[i + 2]), Math.abs(A[i + 3] - B[i + 3]));
    if (d) { px++; if (d > maxd) maxd = d; }
  }
  return { pixels: px, maxDelta: maxd, totalPx: A.length / 4 };
}

function stats() {
  const g = ctx.grid, pa = mesh.geometry.attributes.position.array;
  let nonFinite = 0;
  for (let i = 0; i < pa.length; i++) if (!Number.isFinite(pa[i])) nonFinite++;
  let onSphere = 0;
  for (const c of g.cells) for (const p of c.pts3) if (Math.abs(Math.hypot(...p) - R) < 1e-9) onSphere++;
  return {
    cells: g.cells.length, coverage: g.coverage, meshVerts: pa.length / 3, meshTris: pa.length / 9,
    nonFinite, cornerRefsOnSphere: onSphere, radius: R,
  };
}

/** 接缝对账：每条内部半边的 twin 角点 3D 距离 + 全网格角点 weld 统计（GPU 顶点逐位同源）。 */
function seamReport() {
  const g = ctx.grid;
  let pairs = 0, mismatched = 0, maxGap = 0;
  for (const c of g.cells) for (let i = 0; i < c.n; i++) {
    const nb = c.edgeNeighbors[i];
    if (nb < 0) continue;
    const t = c.edgeTwins[i], twin = g.cells[nb];
    const d = Math.max(dist(twin.pts3[t], c.pts3[(i + 1) % c.n]), dist(twin.pts3[(t + 1) % twin.n], c.pts3[i]));
    pairs++;
    if (d > maxGap) maxGap = d;
    if (d !== 0) mismatched++;
  }
  const seen = new Map(); let refs = 0;
  for (const c of g.cells) for (const p of c.pts3) { const k = p[0] + ',' + p[1] + ',' + p[2]; refs++; seen.set(k, (seen.get(k) || 0) + 1); }
  let weldedRefs = 0, maxSharing = 0;
  for (const v of seen.values()) { if (v > 1) weldedRefs += v; if (v > maxSharing) maxSharing = v; }
  return { edgePairs: pairs, mismatched, maxGap, cornerRefs: refs, uniqueCorners: seen.size, weldedCornerRefs: weldedRefs, maxSharing };
}

/** 球面编辑演示：全走 sphereEdit（球面 3D 点 → unmapPoint → 落格 → applyAt 同语义）。 */
function applyEdits() {
  const ops = [];
  const at = (x, z, tool, n = 1, opts = {}) => {
    for (let i = 0; i < n; i++) {
      const r = sphereEdit(ctx, mapPoint(patch, x, z), tool, opts);
      ops.push({ x, z, tool, i, hit: !!r, changed: r?.changed ?? null, target: r?.target ?? null, cell: r?.cell?.id ?? null });
    }
  };
  at(0.4, 0.3, 'build', 3);            // 锚点旁起三层柱
  at(1.9, -0.9, 'build', 2);
  at(-1.7, 1.3, 'build', 4);
  at(-1.7, 1.3, 'erase', 1);           // 点柱顶之上 → 扣顶一层（剩 3）
  at(0.4, 0.3, 'paint', 1, { color: 4 });
  at(2.7, 1.5, 'raise', 2);            // 岩石地形抬升
  at(-2.6, -1.6, 'level', 1, { level: 2, rock: true });
  at(30, 30, 'build', 1);              // 贴片外 → null（无操作）
  show(ctx); render();
  const tops = {};
  for (const o of ops) if (o.cell !== null) tops[o.cell] = ctx.world.top(ctx.grid.cells[o.cell]);
  return { ops, tops, solidCells: ctx.grid.cells.filter((c) => ctx.world.top(c) > 0).length };
}

/** 保存恢复往返：encode → 同规格新 World decode → 体素逐位 + 再编码逐字 + 渲染逐像素。 */
function roundtrip() {
  const s = encodeSphereWorld(ctx);
  const c2 = makeSphereWorld(patch, spec);
  const specOut = decodeSphereWorld(s, c2);
  const arraysEqual = ['solid', 'rock', 'color', 'river'].every((f) => {
    const a = ctx.world[f], b = c2.world[f];
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  });
  const reencoded = encodeSphereWorld(c2) === s;
  snap('beforeDecode');
  show(c2);                            // 换渲染「恢复出来的世界」
  snap('decoded');
  const d = diff('beforeDecode', 'decoded');
  show(ctx); render();                 // 换回活世界
  return { saveLen: s.length, specRoundTrip: JSON.stringify(specOut) === JSON.stringify(ctx.spec), arraysEqual, reencoded, pixelDiff: d.pixels, maxDelta: d.maxDelta };
}

/** 接缝特写：找最靠锚点的一条内部边，相机贴上去看两侧面片是否开裂。 */
let seamView = null;
function focusSeam() {
  const g = ctx.grid;
  let best = null, bd = Infinity;
  for (const c of g.cells) for (let i = 0; i < c.n; i++) {
    if (c.edgeNeighbors[i] < 0) continue;
    const mid = [(c.pts3[i][0] + c.pts3[(i + 1) % c.n][0]) / 2, (c.pts3[i][1] + c.pts3[(i + 1) % c.n][1]) / 2, (c.pts3[i][2] + c.pts3[(i + 1) % c.n][2]) / 2];
    const d = dist(mid, patch.anchor);
    if (d < bd) { bd = d; best = mid; }
  }
  const m = V(best), up = m.clone().sub(V(patch.center)).normalize();
  seamView = { pos: m.clone().addScaledVector(up, 1.4), look: m.clone().addScaledVector(up, -0.15) };
  camera.position.copy(seamView.pos); camera.lookAt(seamView.look); render();
  return { edgeMid: best, anchorDist: bd };
}
function restoreView() { camera.position.copy(HOME.pos); camera.lookAt(HOME.look); render(); }

const api = {
  ready: true, ctx, patch, spec, R, renderer, scene, camera,
  stats, seamReport, snap, diff, applyEdits, roundtrip, focusSeam, restoreView,
  pick: (x, z, y = 0) => spherePick(ctx, mapPoint(patch, x, z, { y })),
};
window.sphereWorldDemo = api;

const st = stats(), sm = seamReport();
document.getElementById('stat').textContent =
  `patch R=${R} · 网格 ${spec.kind} r${spec.radius}/cs${spec.cellSize}/seed${spec.seed}（${st.cells} 格，inRange ${st.coverage.inRange}）\n` +
  `mesh ${st.meshTris} 三角 / ${st.meshVerts} 顶点 · 非有限顶点 ${st.nonFinite}\n` +
  `接缝：${sm.edgePairs} 条内部半边，角点 3D 最大缝 ${sm.maxGap}（对不上 ${sm.mismatched} 条）· 共享角点 ${sm.weldedCornerRefs}/${sm.cornerRefs} 引用（${sm.uniqueCorners} 个唯一角点，最多 ${sm.maxSharing} 格共点）\n` +
  `window.sphereWorldDemo：stats / seamReport / applyEdits / roundtrip / focusSeam / snap / diff`;
</script>
</body>
</html>
