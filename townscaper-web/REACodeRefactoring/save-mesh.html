<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重构 · 分享存档与合并网格验收</title>
<style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:12px}textarea{width:100%;height:52px;font:12px monospace}iframe{width:100%;height:72vh;border:0}button,select{padding:5px;margin:4px}#status{white-space:pre-wrap}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>当前场景的分享字符串 / 合并网格</b><p>存档编码沿用本地v5位流，并非原作格式。坏输入拒绝时保留当前岛；自定义墙色/天气/战斗进度尚未存档。测量仅合并的地形＋建筑主体，不代表全场景只有一次draw call，亦非Switch性能复现。</p>
<label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><button id="encode" disabled>读取当前分享串</button><button id="decode" disabled>校验并导入</button><button id="measure" disabled>测量主体提交</button><textarea id="code" aria-label="场景分享字符串"></textarea><output id="status">场景加载中…</output></header><iframe id="scene" title="分享与网格实景"></iframe>
<script type="module">
const $=s=>document.querySelector(s);let api,frame=$('#scene');
function encode(){const s=api.encodeWorld(api.world,api.scene);$('#code').value=s;$('#status').textContent=`${s.length} 字符 · ${api.scene} · World ${api.world.version}`;return s;}
function decode(){try{const scene=api.decodeWorld($('#code').value,api.world);api.view.changed();api.view.render(0);$('#status').textContent=`已导入 ${scene} 的体素数据（不切换当前场景主题）`;return scene;}catch(e){$('#status').textContent=`拒绝导入，当前岛保留：${e.message}`;throw e;}}
async function measure(){const {measureWorldSurface}=await frame.contentWindow.eval("import('./src/tools/mesh-audit.js')");const r=measureWorldSurface(api.view);$('#status').textContent=`主体 ${r.calls} 次提交 · ${r.triangles} 三角 · ${r.chunks} 缓存块（不含水/植被/阴影）`;return r;}
function load(){api=null;window.saveMesh=null;for(const id of ['encode','decode','measure'])$('#'+id).disabled=true;frame.src='index.html?scene=fusion&grid='+$('#grid').value;}
frame.onload=()=>{const ready=()=>{api=frame.contentWindow.rea;if(!api?.view.worldMesh.geometry.attributes.color?.count){setTimeout(ready,100);return}window.saveMesh={api,encode,decode,measure};for(const id of ['encode','decode','measure'])$('#'+id).disabled=false;encode();};ready();};
$('#encode').onclick=encode;$('#decode').onclick=()=>{try{decode()}catch{}};$('#measure').onclick=()=>measure().catch(e=>$('#status').textContent=e.message);$('#grid').onchange=load;load();
</script></html>
