<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重构 · 远景阴云</title><style>body{margin:0;font:14px/1.5 system-ui;background:#eef4f3;color:#20343c}header{padding:12px}label,button{margin:5px}iframe{width:100%;height:78vh;border:0}</style><header><a href="pipeline.html">管线</a> · <b>远景阴云 · 共享World</b><p>已有云图集保留，背景云改用共享时钟与连续绕岛漂移，避免近云40单位硬回绕。此处为本地环带近似，未复现原片高耸云体/完整层次；冬季宣传片战斗全景另列待实现。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><button id="horizon">低机位看远云</button><button id="island">回全景</button><output id="status">加载…</output></header><iframe id="scene" title="真实云层共享场景"></iframe><script type="module">
