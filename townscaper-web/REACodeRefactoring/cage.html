<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续笼形变 · REACode 重构版</title><style>body{margin:0;font:14px/1.6 system-ui;color:#203a42;background:#edf4f2}header{padding:12px}p{margin:4px}label{margin:5px}iframe{width:100%;height:76vh;border:0}</style><header><a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/cage-review.md">726帧核验</a> · <b>共享World · 连续笼角点采样</b><p>白色为同一格的实际分层笼边，橙点沿竖向角点段连续滑动。沉积线已复用相邻切面插值。勾「笼碰撞探针」= 形变壁面内部点（`cageWallPoint`）与该高度暴露墙的逐点对账 + 3D 笼推出（`cageCollider.pushOut`，红=陷进岩石的探针、绿=推出后）。</p><label>网格<select id="grid"><option value="mixed">混合</option><option value="quad">四边形</option></select></label><label><input id="smooth" type="checkbox" checked>平滑与笼形变</label><label>相对高度<input id="height" type="range" min="0" max="1" step=".001" value=".625"></label><label><input id="probe" type="checkbox">笼碰撞探针</label><output id="status">加载…</output><p id="probeStatus"></p><p>1579478470098243584展示线框构建、着色与转镜；原笼算法/更强形变不由画面反推。1579474420749725696展示多岛构建及小屋，完整斜坡/模块联合生成仍待补。</p></header><iframe id="scene" title="共享笼形变"></iframe><script type="module">
import * as CG from './src/terrain/cage-c09.js';
import { terrainCollider } from './src/terrain/terrain-collide.js';
const $=s=>document.querySelector(s);let api,T,cell,group,epoch=0;
function draw(){if(!api)return;const{view,world}=api;if(view.worldMesh.smooth!==$('#smooth').checked){view.worldMesh.smooth=$('#smooth').checked;view.worldMesh.invalidate();}view.render(0);const shape=view.worldMesh.shape,L=view.levelHeight,h=world.ground(cell),level=h*+$('#height').value;
 if(group){view.scene.remove(group);group.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}group=new T.Group();const points=[];for(let s=0;s<=h;s++)for(let i=0;i<cell.n;i++){const p=cell.pts[i],q=cell.pts[(i+1)%cell.n],a=shape.at(p,s),b=shape.at(q,s);points.push(a[0],s*L+.01,a[1],b[0],s*L+.01,b[1]);if(s<h){const c=shape.at(p,s+1);points.push(a[0],s*L,a[1],c[0],(s+1)*L,c[1]);}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(points,3));const wire=new T.LineSegments(g,new T.LineBasicMaterial({color:0xffffff,depthTest:false}));wire.renderOrder=99;group.add(wire);for(const p of cell.pts){const a=shape.at(p,level),dot=new T.Mesh(new T.SphereGeometry(.06,10,6),new T.MeshBasicMaterial({color:0xff9900,depthTest:false}));dot.position.set(a[0],level*L,a[1]);dot.renderOrder=100;group.add(dot);}view.scene.add(group);$('#status').textContent=`格${cell.id} · ${cell.n}角 · 连续层高${level.toFixed(3)} / ${h} · 保持原World`;window.cageReview={api,cell,level,shape,group};if($('#probe').checked)addProbe(shape,view,world,L,cell);else{window.cageProbe=null;$('#probeStatus').textContent='';}}
/* 笼碰撞探针：形变壁面内部点 × terrainmesh 实际发出的墙四边形逐点对账 + 3D 笼推出。
   口径同 tests/c09-terrain-d.mjs 的 C 段，只是搬进页面、量具暴露在 window.cageProbe。 */
function addProbe(shape,view,world,L,c){
 if(!world.terrainCollide){world.terrainCollide=true;view.worldMesh.invalidate();view.render(0);}
 const surf=world.terrainSurface,h=world.ground(c),r=.15;
 if(!surf?.walls){window.cageProbe=null;return;}
 // 高度滑杆在「本格真实存在的暴露层」里挑一段（不能凭空选一个 lv：高崖顶格的墙只在邻格没填到的层出现）
 const own=surf.walls.filter(w=>w.cell===c.id),lvls=[...new Set(own.map(w=>w.lv))].sort((a,b)=>a-b);
 const lv=lvls.length?lvls[Math.max(0,Math.min(lvls.length-1,Math.round((lvls.length-1)*(.15+.7*(+$('#height').value)))))]:1,y=(lv-.5)*L;
 const walls=own.filter(w=>w.lv===lv),lerp=(a,b,t)=>a+(b-a)*t;
 let maxDev=0,samples=0,worstU=0;const pts=[];
 for(const w of walls){
  const a=c.pts[w.edge],b=c.pts[(w.edge+1)%c.n],[A,B,C,D]=w.q;
  for(const u of [0,.25,.5,.75,1])for(const v of [.25,.5,.75]){
   const P=CG.cageWallPoint(shape,a,b,lv,u,v,L);
   const E=[0,1,2].map(k=>lerp(lerp(A[k],B[k],u),lerp(D[k],C[k],u),v));
   const d=Math.hypot(P[0]-E[0],P[1]-E[1],P[2]-E[2]);if(d>maxDev){maxDev=d;worstU=u;}
   samples++;pts.push(P);
  }
 }
 let probe=null,bent=0;
 for(const p of c.pts){const A=shape.at(p,0),B2=shape.at(p,h),M=shape.at(p,h/2);bent=Math.max(bent,Math.hypot(M[0]-(A[0]+B2[0])/2,M[1]-(A[1]+B2[1])/2));}
 if(walls.length){
  const cc=CG.cageCollider(shape,world,L),col=terrainCollider(world);
  const w0=walls[Math.floor(walls.length/2)],a=c.pts[w0.edge],b=c.pts[(w0.edge+1)%c.n];
  const P=CG.cageWallPoint(shape,a,b,lv,.5,.5,L),[nx,,nz]=w0.out;
  const x0=P[0]-nx*.08,z0=P[2]-nz*.08;
  const insideCageBefore=CG.insideCage(shape,c,x0,y,z0,L),solidBefore=cc.solid(x0,y,z0);
  const res=cc.pushOut(x0,y,z0,r),d2=col.wallDistance(res.x,y,res.z,r);
  probe={insideCageBefore,solidBefore,outInside:res.inside,clearance:+res.clearance.toFixed(5),contacts:res.contacts,
   agreeInside:d2.inside,agreeClearance:+d2.d.toFixed(5),from:[x0,z0],to:[res.x,res.z],cell:w0.cell,edge:w0.edge,lv};
  const mk=(x,z,color)=>{const m=new T.Mesh(new T.SphereGeometry(.07,10,6),new T.MeshBasicMaterial({color,depthTest:false}));m.position.set(x,y,z);m.renderOrder=101;group.add(m);};
  mk(x0,z0,0xff3b30);mk(res.x,res.z,0x00c853);
  const g2=new T.BufferGeometry();g2.setAttribute('position',new T.Float32BufferAttribute([x0,y,z0,res.x,y,res.z],3));
  const ln=new T.LineSegments(g2,new T.LineBasicMaterial({color:0xffffff,depthTest:false}));ln.renderOrder=102;group.add(ln);
 }
 for(let i=0;i<pts.length;i+=6){const m=new T.Mesh(new T.SphereGeometry(.028,8,5),new T.MeshBasicMaterial({color:0x22d3ee,depthTest:false}));m.position.set(pts[i][0],pts[i][1],pts[i][2]);m.renderOrder=101;group.add(m);}
 window.cageProbe={cell:c.id,level:lv,y:+y.toFixed(3),walls:walls.length,samples,maxDev:+maxDev.toExponential(3),worstU,
  radius:r,sliceVerts:CG.cageSlice(shape,c,y/L).length,bent:+bent.toFixed(4),probe};
 $('#probeStatus').textContent=probe
  ? `格${c.id} · 层${lv} · 该高度暴露墙 ${walls.length} · 壁面点 ${samples} 最大偏差 ${maxDev.toExponential(2)} · 推出后 inside=${probe.outInside} 余量=${probe.clearance} 接触=${probe.contacts} · terrain-collide 认同=${probe.agreeInside===false&&probe.agreeClearance>=r-1e-3}`
  : `格${c.id} · 层${lv} · 该高度没有暴露墙`;
}
function load(){const token=++epoch;api=null;window.cageReview=null;group=null;$('#scene').onload=()=>{const ready=async()=>{if(token!==epoch)return;const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh?.shape){setTimeout(ready,100);return}api=r;T=await $('#scene').contentWindow.eval("import('three')");if(token!==epoch)return;cell=api.world.cells.filter(c=>c.edgeNeighbors.some(id=>id>=0&&api.world.ground(api.world.cells[id])<api.world.ground(c))).reduce((a,b)=>api.world.ground(b)>api.world.ground(a)?b:a);const v=api.view;v.target.set(cell.cx,api.world.ground(cell)*v.levelHeight*.5,cell.cz);v.distance=10;v.pitch=.35;v.updateCamera();draw();};ready();};$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value;}$('#grid').onchange=load;$('#smooth').onchange=draw;$('#height').oninput=draw;$('#probe').onchange=draw;load();
</script></html>
