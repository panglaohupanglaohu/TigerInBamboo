const $=s=>document.querySelector(s);let api,T,cell,group,epoch=0;
function draw(){if(!api)return;const{view,world}=api;if(view.worldMesh.smooth!==$('#smooth').checked){view.worldMesh.smooth=$('#smooth').checked;view.worldMesh.invalidate();}view.render(0);const shape=view.worldMesh.shape,L=view.levelHeight,h=world.ground(cell),level=h*+$('#height').value;
 if(group){view.scene.remove(group);group.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}group=new T.Group();const points=[];for(let s=0;s<=h;s++)for(let i=0;i<cell.n;i++){const p=cell.pts[i],q=cell.pts[(i+1)%cell.n],a=shape.at(p,s),b=shape.at(q,s);points.push(a[0],s*L+.01,a[1],b[0],s*L+.01,b[1]);if(s<h){const c=shape.at(p,s+1);points.push(a[0],s*L,a[1],c[0],(s+1)*L,c[1]);}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(points,3));const wire=new T.LineSegments(g,new T.LineBasicMaterial({color:0xffffff,depthTest:false}));wire.renderOrder=99;group.add(wire);for(const p of cell.pts){const a=shape.at(p,level),dot=new T.Mesh(new T.SphereGeometry(.06,10,6),new T.MeshBasicMaterial({color:0xff9900,depthTest:false}));dot.position.set(a[0],level*L,a[1]);dot.renderOrder=100;group.add(dot);}view.scene.add(group);$('#status').textContent=`格${cell.id} · ${cell.n}角 · 连续层高${level.toFixed(3)} / ${h} · 保持原World`;window.cageReview={api,cell,level,shape,group};}
