<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · WFC候选过程</title><style>body{background:#edf4f3;color:#20343c;font:15px system-ui}canvas{max-width:100%;background:#304951}button,input{margin:8px}</style><a href="wfc.html">共享WFC</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/wfc-trace-review.md">逐帧证据</a><h3>真实求解器 · 候选域过程回看</h3><p>记录共享半边求解器实际传播后的候选，拖动查看。当前为本地socket图，不是原片图块素材；最多256份快照，满额明确标出截断。</p><button id="reset">重置/重算种子7</button><label>步骤<input id="step" type="range" min="0" value="0"></label><output id="stats"></output><p><canvas width="900" height="650"></canvas></p><script type="module">
import{solveWFC}from'./src/core/wfc.js';import{buildSquareGrid}from'./src/core/grid.js';const grid=buildSquareGrid({radius:2}),tiles=Array.from({length:16},(_,i)=>({id:String(i),edges:Array.from({length:4},(_,e)=>(i>>e)&1)})),slider=document.querySelector('#step'),ctx=document.querySelector('canvas').getContext('2d');let result;function draw(){const n=Number(slider.value),frame=result.trace[n];ctx.clearRect(0,0,900,650);for(const c of grid.cells){const ids=frame.domains[c.id],x=225+(c.cx+2)*90,z=100+(c.cz+2)*90;ctx.fillStyle=ids.length===1?'#95baa5':ids.length?'#dfcd99':'#cc6666';ctx.fillRect(x,z,84,84);ctx.fillStyle='#20343c';ctx.fillText(`${c.id}: ${ids.length}候选`,x+6,z+20);ctx.fillText(ids.slice(0,4).join(','),x+6,z+43);}document.querySelector('#stats').textContent=`${n+1}/${result.trace.length} · ${frame.stage} · 传播步骤${frame.steps} · ${result.traceTruncated?'记录截断':'记录完整'}`;window.wfcTraceReview={grid,result,frame};}function run(){result=solveWFC(grid,{tiles,seed:7,traceLimit:256});slider.max=result.trace.length-1;slider.value=0;draw();}slider.oninput=draw;document.querySelector('#reset').onclick=run;run();
</script></html>
