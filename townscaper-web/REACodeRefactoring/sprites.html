<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>单方向精灵审核 · REACode重构版</title><style>body{margin:24px;background:#edf4f0;color:#20343c;font:15px/1.6 system-ui}canvas{background:#a8bfbd;border-radius:8px;image-rendering:pixelated}section{display:inline-block;vertical-align:top;width:31%;min-width:230px}a{color:#276e86}input{margin:8px}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><h1>单方向精灵 · 剑尖与斧刃对照</h1><p>左为原图，右为绕脚底中轴镜像；每种只生成一张贴图。指标帮助比较轮廓和颜色，不能代替小尺寸下的目视判断。</p><label>目标像素高度<input id="size" type="range" min="24" max="120" step="12" value="48"></label><label><input type="checkbox" id="flip">交换左右图</label><div id="cards"></div><p><a href="index.html?scene=badnorth&on=unitsprites">真实北境：单方向精灵模式</a> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/sprites-review.md">逐帧记录</a></p><script type="module">
import{renderUnit}from'./src/life/unit-sprites.js';import{measureAmbiguity}from'./src/core/sprite-ambiguity.js';
function run(){const height=Number(document.querySelector('#size').value),flip=document.querySelector('#flip').checked,cards=document.querySelector('#cards');cards.replaceChildren();const reports=[];for(const variant of ['sword','axe','spear']){const {canvas,data}=renderUnit({height,variant}),metrics=measureAmbiguity(data),section=document.createElement('section'),name=document.createElement('h2');name.textContent={sword:'竖直剑尖',axe:'单侧斧刃',spear:'细长矛尖'}[variant];section.append(name);const out=document.createElement('canvas');out.width=height*2+12;out.height=height;out.style.width=(height*2+12)*2+'px';out.style.maxWidth='95%';const ctx=out.getContext('2d');for(let i=0;i<2;i++){ctx.save();ctx.translate(i*(height+12)+(!!i!==flip?height:0),0);ctx.scale(!!i!==flip?-1:1,1);ctx.drawImage(canvas,0,0);ctx.restore();}section.append(out);const desc=document.createElement('p');desc.textContent=`IoU ${metrics.mirrorIoU.toFixed(3)} · 亮度差${metrics.flipDiff.toFixed(3)} · 重心偏移${metrics.massSkew.toFixed(3)}`;section.append(desc);cards.append(section);reports.push({variant,...metrics});}window.spriteReview={height,flip,reports};}
for(const id of ['size','flip'])document.querySelector('#'+id).oninput=run;run();
</script></html>
