<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>多格整体编辑验收 · REACode重构版</title><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.5 system-ui}header{padding:12px 20px}button,select{font:inherit;margin:4px;padding:4px}iframe{width:100%;height:78vh;border:0}a{color:#276e86}p{margin:4px}</style><header><b>双格房屋整体编辑 · 真实融合场景</b> <a href="pipeline.html">管线</a> · <a href="coverage.html">映射</a><p>在同一World内整栋替换/移除；任一目标格被改动则拒绝。撤销使用页面本次操作快照。v5存档保存体量与颜色，工程JSON另存实例ID与整栋编辑回执，可重新载入后继续整体编辑。</p><label><input type="checkbox" id="mixed" checked>混合网格</label><select id="tile"></select><button id="replace" disabled>整栋改为两层</button><button id="remove" disabled>整栋移除</button><button id="undo" disabled>撤销本页操作</button><button id="save" disabled>体素存档往返</button><button id="project-save" disabled>生成工程JSON</button><button id="project-load" disabled>载入工程JSON</button><button id="reset">重置场景</button><span id="status">加载中</span><p><textarea id="project" rows="2" style="width:96%" aria-label="房屋工程JSON" placeholder="生成后可复制保存；粘贴同网格工程JSON再载入"></textarea></p></header><iframe id="scene" title="共享World融合场景"></iframe><script type="module">
import{editHouseTiles}from'./src/build/multicell.js';
import{exportHouseProject,importHouseProject}from'./src/ui/house-project.js';
const frame=document.querySelector('#scene'),select=document.querySelector('#tile');let entries=[],instanceIds=[],history=[],ready=false;
const api=()=>frame.contentWindow.rea;
function status(message){document.querySelector('#status').textContent=message;for(const id of ['replace','remove','save','project-save','project-load'])document.querySelector('#'+id).disabled=!ready;document.querySelector('#undo').disabled=!history.length;window.multicellReview={ready,entries,instanceIds,historyLength:history.length,message};}
function options(){const chosen=select.value;select.replaceChildren(...entries.map((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${instanceIds[i]} · ${e?e.placement.cells.join('+')+' / '+e.placement.stories+'层':'已移除'}`;return o}));select.value=chosen||'0';}
function change(remove){const index=Number(select.value),entry=entries[index];if(!ready||!entry){status('所选房屋已移除');return;}const rea=api(),world=rea.world,before=world.snapshot(),old=[...entries],p=entry.placement,r=editHouseTiles(world,{remove:{entries:[entry]},placements:remove?[]:[{...p,stories:2}],color:4});if(r.ok){history.push({snapshot:before,entries:old,instanceIds:[...instanceIds]});entries[index]=remove?null:r.receipt.entries[0];rea.view.changed();options();}status(r.ok?(remove?'整栋移除成功':'整栋替换成功'):'操作拒绝：'+r.reason);}
document.querySelector('#replace').onclick=()=>change(false);document.querySelector('#remove').onclick=()=>change(true);
document.querySelector('#undo').onclick=()=>{const h=history.pop();if(!h)return;api().world.restore(h.snapshot);entries=h.entries;instanceIds=h.instanceIds;api().view.changed();options();status('本页操作已撤销')};
document.querySelector('#save').onclick=()=>{const rea=api(),world=rea.world,before=world.snapshot(),s=rea.encodeWorld(world,'fusion');try{rea.decodeWorld(s,world);if(['solid','rock','color','river'].some(k=>before[k].some((v,i)=>world[k][i]!==v)))throw Error('体素不一致');rea.view.changed();status('v5体素存档往返一致；实例身份未写入存档');}catch(e){world.restore(before);rea.view.changed();status('往返失败：'+e.message)}};
document.querySelector('#project-save').onclick=()=>{try{document.querySelector('#project').value=exportHouseProject(api().world,entries,{scene:'fusion',instanceIds});status('工程JSON已生成：可复制保存并重新载入')}catch(e){status('生成拒绝：'+e.message)}};
document.querySelector('#project-load').onclick=()=>{const world=api().world,before=world.snapshot(),old=entries,oldIds=instanceIds;try{const restored=importHouseProject(world,document.querySelector('#project').value,{expectedScene:'fusion'});history.push({snapshot:before,entries:old,instanceIds:oldIds});entries=restored.entries;instanceIds=restored.instanceIds;api().view.changed();options();status('工程已载入：实例身份及整栋编辑已恢复')}catch(e){status('载入拒绝：'+e.message)}};
function load(){ready=false;history=[];status('加载中');frame.src='index.html?grid='+(document.querySelector('#mixed').checked?'mixed':'quad')+'&scene=fusion'}
frame.onload=()=>{const r=api()?.world?.fusionTileReport;if(!r){status('场景未就绪');return;}entries=[...r.receipt.entries];instanceIds=entries.map((_,i)=>`house:${i+1}`);ready=true;options();status(`已就绪 · ${entries.length}个双格房屋`)};
document.querySelector('#mixed').onchange=load;document.querySelector('#reset').onclick=load;load();
</script></html>
