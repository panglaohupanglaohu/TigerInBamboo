<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>确定性WFC · REACode重构版</title><style>body{margin:24px;background:#edf4f0;color:#20343c;font:15px/1.6 system-ui}input,button{font:inherit;margin:6px;padding:5px}canvas{background:#d4e5e0;max-width:100%;border-radius:12px}a{color:#276e86}</style><h1>确定性 WFC · 多边形接口约束</h1><p>同一网格与种子，即使倒序输入格子和tile也得到同一解。接口按真实半边配对，支持三角形与四边形。可选将四边形沿对角线切为四个三角子格，保留父格对应；子格当前独立求解，尚未实现四子格联合模块约束。此页验证求解器，不代表完整建筑模块WFC已接入。</p><label><input type="checkbox" id="mixed" checked>混合网格</label><label><input type="checkbox" id="subtiles">四边形切四三角</label><label>种子<input id="seed" type="number" value="7"></label><button id="solve">求解</button><button id="pin">固定首格全1接口</button><button id="repair">改中间一格并局部修复</button><button id="frontier">枚举已固定格周边</button><button id="reset">清除约束</button><div id="stats"></div><pre id="frontier-stats"></pre><canvas width="1000" height="650"></canvas><p><a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="coverage.html">映射</a> · <a href="adjacency.html">几何邻接审核</a> · <a href="artifacts/coverage/wfc-review.md">逐帧记录</a></p><script type="module">
import{frontierCandidates}from'./src/core/frontier-candidates.js';
import{selfCheck}from'./src/core/adjacency.js';import{solveWFC,repairWFC}from'./src/core/wfc.js';import{buildMixedGrid,buildQuadGrid,buildTriangularSubgrid}from'./src/core/grid.js';import{World}from'./src/core/world.js';
const tiles=[3,4].flatMap(n=>Array.from({length:2**n},(_,i)=>({id:n+':'+i,edges:Array.from({length:n},(_,e)=>(i>>e)&1)}))),byTile=new Map(tiles.map(t=>[t.id,t]));let pins={},world;
function run({repair=false}={}){window.frontierReview=null;document.querySelector('#frontier-stats').textContent='';const previous=window.wfcReview?.result;const mixed=document.querySelector('#mixed').checked,base=mixed?buildMixedGrid({radius:6,seed:5}):buildQuadGrid({radius:4,seed:5});const grid=document.querySelector('#subtiles').checked?buildTriangularSubgrid(base):base;world=new World(grid);const adjacency=selfCheck(grid,world);if(adjacency.mismatched)throw Error('Geometry adjacency mismatch');const seed=Number(document.querySelector('#seed').value)||0,t0=performance.now(),options={tiles,seed,pins};let result,reverse;if(repair&&previous?.ok){const c=grid.cells[Math.floor(grid.cells.length/2)],old=Number(previous.tiles[c.id].split(':')[1]),edits={...pins,[c.id]:c.n+':'+((old+1)%(2**c.n))};result=repairWFC(grid,{tiles,seed,current:previous.tiles,edits});reverse=repairWFC({...grid,cells:[...grid.cells].reverse()},{tiles:[...tiles].reverse(),seed,current:previous.tiles,edits});}else{result=solveWFC(grid,options);reverse=solveWFC({...grid,cells:[...grid.cells].reverse()},{tiles:[...tiles].reverse(),seed,pins});}const deterministic=JSON.stringify(result.tiles)===JSON.stringify(reverse.tiles);window.wfcReview={world,result,deterministic,pins,adjacency,subdivision:grid.subdivision??null};
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,1000,650);const pts=grid.verts,minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minZ=Math.min(...pts.map(p=>p.z)),maxZ=Math.max(...pts.map(p=>p.z)),scale=Math.min(900/(maxX-minX),550/(maxZ-minZ)),P=p=>[500+(p.x-(minX+maxX)/2)*scale,325+(p.z-(minZ+maxZ)/2)*scale];for(const c of world.cells){const tile=byTile.get(result.tiles[c.id]);ctx.beginPath();c.pts.forEach((p,i)=>{const[x,y]=P(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=result.changedCells?.includes(c.id)?'#dcad94':tile?`hsl(${145-tile.edges.reduce((a,b)=>a+b,0)*20} 25% 65%)`:'#cf7770';ctx.fill();ctx.strokeStyle='#5e7477';ctx.stroke();if(tile)for(let e=0;e<c.n;e++){const p=c.pts[e],q=c.pts[(e+1)%c.n],[x,y]=P({x:(p.x+q.x)/2,z:(p.z+q.z)/2});ctx.fillStyle=tile.edges[e]?'#b46b42':'#326a94';ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();}}
document.querySelector('#stats').textContent=`${result.ok?'解成功':'失败：'+result.reason} · ${world.cells.length}格 · 父格${grid.subdivision?.groups.length??grid.cells.length} · ${result.steps}步骤 · 回溯${result.backtracks} · 倒序一致${deterministic?'通过':'失败'} · 修复改动${result.changedCells?.length??0}格/范围${result.region?.length??0}格 · 固定${Object.keys(pins).length}格 · ${(performance.now()-t0).toFixed(1)}ms（含正反对照）`;}
document.querySelector('#frontier').onclick=()=>{const c=world.cells[0],collapsed=Object.keys(pins).length?{...pins}:{[c.id]:c.n+':'+(2**c.n-1)},result=frontierCandidates(world.grid,{tiles,collapsed});window.frontierReview={result,world,collapsed};document.querySelector('#frontier-stats').textContent='158229：只读枚举已固定格周边（无固定时采用首格全1锚点）；不是战役边境，也不是完整导航生成。\n'+`完成${result.complete} · 周边${result.frontier.length}格 · 候选检验${result.tests}次\n`+result.rows.map(r=>`格${r.cell}：${r.candidates.length}/${r.fullCount}候选`).join('\n')};
document.querySelector('#repair').onclick=()=>run({repair:true});document.querySelector('#solve').onclick=()=>run();document.querySelector('#mixed').onchange=()=>{pins={};run()};document.querySelector('#subtiles').onchange=()=>{pins={};run()};document.querySelector('#pin').onclick=()=>{const c=world.cells[0];pins[c.id]=c.n+':'+(2**c.n-1);run()};document.querySelector('#reset').onclick=()=>{pins={};run()};document.querySelector('#subtiles').checked=new URLSearchParams(location.search).get('subtiles')==='1';run();
</script></html>
