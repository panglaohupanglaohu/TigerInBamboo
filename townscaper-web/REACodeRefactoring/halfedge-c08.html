<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>半边 · 方格块 + 剩余区域环 + 间隙三角（r56 C08）</title>
<style>body{margin:0;background:#333;color:#ddd;font:13px/1.5 system-ui,"PingFang SC",sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;left:12px;top:12px;max-width:380px;background:rgba(255,255,255,.92);color:#1d2f36;border-radius:12px;padding:10px 12px}#ui p{margin:3px 0;font-size:12px;color:#3e5a5e}button{border:1px solid #c9d8d7;background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;font:inherit}button.on{background:#2f7f8a;color:#fff}#stat{font-size:12px;color:#2f7f8a;white-space:pre-wrap}</style>
<canvas id="c"></canvas>
<div id="ui"><a href="index.html">← 首页</a>
<h3 style="margin:4px 0">Half Edge 探索（1458921394855718917）</h3>
<p>① 圆内撒旋转方格块（彩色）→ ② 只用间隙三角建共享半边（core/halfedge.js），boundaryLoops 追出剩余区域的每条边界环（彩色描线）→ ③ 间隙三角网（core/trigraph.js Delaunay + 强制翻边约束）填满 → 方格 + 三角合成一张半边网格校验（单边界环、Euler=1）→ 重置换种子。</p>
<button id="play" class="on">播放</button> <button id="next">换种子</button>
<div id="stat"></div></div>
<script type="module">
import { scatterGroups, fillGaps, gapLoops, fullMesh } from './src/core/halfedge-patch-c08.js';
const Q = new URLSearchParams(location.search), cv = document.getElementById('c'), ctx = cv.getContext('2d');
let seed = Number(Q.get('seed') || 1), t = Q.has('t') ? Number(Q.get('t')) : 0, playing = !Q.has('t'), S;
function build() { const G = scatterGroups({ seed }), F = fillGaps(G, { seed }), L = gapLoops(F), M = fullMesh(F); S = { G, F, L, M }; }
build();
const hue = (i) => `hsl(${(i * 67) % 360},70%,62%)`;
function draw() {
  const dpr = Math.min(2, devicePixelRatio); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#333'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  const sc = Math.min(innerWidth - 420, innerHeight) / 22.5, ox = 420 + (innerWidth - 420) / 2, oy = innerHeight / 2, V = S.F.V;
  const P = (i) => [ox + V[i].x * sc, oy + V[i].z * sc];
  ctx.strokeStyle = '#4a5f9a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ox, oy, 10 * sc, 0, Math.PI * 2); ctx.stroke();
  const shownGroups = t < 1 ? Math.floor(t * S.G.length) : S.G.length;
  // phase 3: gap triangles (grey)
  if (t >= 2) { const k = Math.floor(Math.min(1, t - 2) * S.F.tris.length); ctx.strokeStyle = 'rgba(200,200,200,.55)'; ctx.lineWidth = 1; ctx.beginPath(); for (const tr of S.F.tris.slice(0, k)) { ctx.moveTo(...P(tr[0])); ctx.lineTo(...P(tr[1])); ctx.lineTo(...P(tr[2])); ctx.closePath(); } ctx.stroke(); }
  // phase 1: groups
  ctx.lineWidth = 1.3;
  for (const q of S.F.quads) { if (q.group >= shownGroups) continue; ctx.strokeStyle = t >= 3 ? 'rgba(200,200,200,.55)' : hue(q.group); ctx.beginPath(); q.v.forEach((i, j) => j ? ctx.lineTo(...P(i)) : ctx.moveTo(...P(i))); ctx.closePath(); ctx.stroke(); }
  // phase 2: half-edge boundary loops of the remaining region
  if (t >= 1 && t < 3) { const k = Math.ceil(Math.min(1, (t - 1) / .8) * S.L.loops.length); ctx.lineWidth = 2.2; S.L.loops.slice(0, k).forEach((loop, li) => { ctx.strokeStyle = ['#e6d24a', '#5fd38a', '#e46a6a', '#5aa7e8', '#c77ae6', '#4fd1c5'][li % 6]; ctx.beginPath(); for (const [a, b] of loop) { ctx.moveTo(...P(a)); ctx.lineTo(...P(b)); } ctx.stroke(); }); }
  const M = S.M;
  document.getElementById('stat').textContent = `种子 ${seed} · 阶段 t=${t.toFixed(2)}\n方格块 ${S.G.length} 组 / ${S.F.quads.length} 格 · 间隙三角 ${S.F.tris.length}（强制翻边 ${S.F.forced}，缺约束边 ${S.F.missingConstraints}）\n剩余区域半边：边界环 ${S.L.loops.length} 条（圆 1 + 块轮廓），一致性错误 ${S.L.errors.length}\n整网半边：${M.H.he.length} 条，内边 ${M.H.interiorEdges} / 边界 ${M.H.boundaryEdges}，边界环 ${M.H.boundaryLoops.length}，Euler ${M.H.euler}，错误 ${M.errors.length}`;
  window.halfedgeC08 = { seed, t, groups: S.G.length, quads: S.F.quads.length, tris: S.F.tris.length, loops: S.L.loops.length, euler: M.H.euler, fullLoops: M.H.boundaryLoops.length, errors: M.errors.length + S.L.errors.length, missing: S.F.missingConstraints };
}
document.getElementById('play').onclick = (e) => { playing = !playing; e.target.classList.toggle('on', playing); };
document.getElementById('next').onclick = () => { seed++; build(); t = 0; draw(); };
addEventListener('resize', draw);
setInterval(() => { if (!playing) return; t += .02; if (t > 3.6) { seed++; build(); t = 0; } draw(); }, 50);
draw();
</script></html>
