<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>共享World体素用途验收 · REACode重构版</title><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.5 system-ui}header{padding:12px 20px}button,input{font:inherit;margin:4px}iframe{width:100%;height:76vh;border:0}a{color:#276e86}</style><header><b>同一World：碰撞 / 占用梯度法线 / 风场</b> · <a href="pipeline.html" target="_top">管线</a><p>真实场景载入后，按钮构造“楼板1、洞顶3”的验证夹具。查看洞内0.75高度；封洞仅补第2层。雪片按真实层占用碰撞，屋顶下空洞不再被柱顶填满；这是体素端点近似，非形变网格扫掠或物理积雪。梯度法线为占用场诊断，不替换现有网格软法线。</p><label><input id="mixed" type="checkbox" checked>混合网格</label><button id="open" disabled>构造通洞</button><button id="closed" disabled>封洞</button><label><input id="collision" type="checkbox" checked>碰撞探针</label><label><input id="normal" type="checkbox" checked>梯度法线</label><label><input id="snow" type="checkbox">共享风场雪片</label><label><input id="wind" type="checkbox">实际风场箭头</label><button id="look">洞口近景</button><div id="stats">加载中</div></header><iframe id="scene" title="实际World及渲染管线"></iframe><script type="module">
import{makeWorldProbes}from'./src/core/world-probes.js';
const frame=document.querySelector('#scene');let ready=false,mode='open',markers;
function run(){if(!ready)return;const r=frame.contentWindow.rea,w=r.world,L=r.view.levelHeight;w.reset();w.church=null;for(const c of w.cells){w.fill(c,1,{rock:true});if(Math.abs(c.cx)<1.5&&Math.abs(c.cz)<2){w.setSolid(c,3,true,{rock:true});if(mode==='closed')w.setSolid(c,2,true,{rock:true});}}r.view.changed();r.view.atmosphere.rebuild(w,r.view.index);const c=w.cells.reduce((a,b)=>Math.hypot(a.cx,a.cz)<Math.hypot(b.cx,b.cz)?a:b),p=makeWorldProbes(w,r.view.index,{levelHeight:L}),occupied=p.occupied(c.cx,L*1.5,c.cz),support=p.supportBelow(c.cx,c.cz,L*2),normal=p.normalAt(c.cx,L,c.cz),v=r.view.atmosphere.sample(c.cx,L*1.5,c.cz),speed=v.length();
markers.set({x:c.cx,y:L*1.5,z:c.cz,floor:L,normal,occupied,showProbe:document.querySelector('#collision').checked,showNormal:document.querySelector('#normal').checked});r.view.setDebug('wind',document.querySelector('#wind').checked);r.view.setDebug('snow',document.querySelector('#snow').checked);
const report={mode,occupied,support: support?.level??null,normal,speed,wind:[v.x,v.y,v.z],worldVersion:w.version,windVersion:r.view.atmosphere.field.worldVersion};document.querySelector('#stats').textContent=`${mode==='open'?'通洞':'封洞'} · 碰撞${occupied?'实心':'空'} · 下方支撑层${report.support} · 风速${speed.toFixed(4)} · 占用法线${normal?.map(n=>n.toFixed(2)).join(',')??'无梯度'} · World/风场版本${report.worldVersion}/${report.windVersion}`;window.flowReview={ready:true,report};}
function load(){ready=false;markers=null;window.flowReview={ready:false};for(const id of ['open','closed'])document.querySelector('#'+id).disabled=true;frame.src='index.html?scene=terrain&grid='+(document.querySelector('#mixed').checked?'mixed':'quad');}
frame.onload=async()=>{if(!frame.contentWindow.rea)return;const script=frame.contentWindow.document.createElement('script');script.type='module';script.src='src/ui/flow-markers.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;frame.contentWindow.document.head.append(script)});markers=frame.contentWindow.mountFlowMarkers(frame.contentWindow.rea.view);ready=true;for(const id of ['open','closed'])document.querySelector('#'+id).disabled=false;run()};document.querySelector('#look').onclick=()=>{if(!ready)return;const v=frame.contentWindow.rea.view;v.target.set(0,.75,0);v.distance=7;v.pitch=.08;v.updateCamera()};document.querySelector('#open').onclick=()=>{mode='open';run()};document.querySelector('#closed').onclick=()=>{mode='closed';run()};document.querySelector('#mixed').onchange=load;document.querySelector('#collision').onchange=e=>{markers?.showProbe(e.target.checked)};document.querySelector('#normal').onchange=e=>{markers?.showNormal(e.target.checked)};document.querySelector('#snow').onchange=e=>{if(ready)frame.contentWindow.rea.view.setDebug('snow',e.target.checked)};document.querySelector('#wind').onchange=e=>{if(ready)frame.contentWindow.rea.view.setDebug('wind',e.target.checked)};load();
</script></html>
