<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>共享悬挑 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:74vh;border:0}a{color:#26758a}label{margin-right:18px}</style><header><b>共享World · 岩檐底面与空洞</b> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/mirror-overhang-review.md">悬挑证据</a> · <a href="artifacts/coverage/slope-cliff-review.md">形变保护验收</a><p>1671808851895627776展示柱间空洞、岩檐与环绕镜头。保留已有分层岩石/侧壁/底面，新增真实岩石区间与level1连通诊断；新增切面面积/边长保护；不是完整侵蚀有效地形或原作视觉等价。</p><label>网格<select id="grid"><option value="mixed">三角＋四边</option><option value="quad">四边形</option></select></label><label><input id="disconnect" type="checkbox">断开岩檐支撑（只诊断）</label><label><input id="smooth" type="checkbox" checked>平滑形变</label><label><input id="guard" type="checkbox" checked>面积/边长保护</label><label><input id="skinny" type="checkbox">薄檐测试</label><button id="low">低机位</button><button id="top">俯视</button><button id="restore">恢复原World</button><span id="status">加载…</span></header><iframe id="scene" title="真实共享悬挑"></iframe><script type="module">
import {rockTopology} from './src/core/rock-topology.js';const $=s=>document.querySelector(s);let api,saved;function measure(){const m=rockTopology(api.world);$('#status').textContent=`岩石${m.rockVoxels} · 底面${m.undersides} · 空隙列${m.cavityColumns} · 未连level1岩石${m.unsupported} · 保护切面${api.view.worldMesh.shape?.guard.guardedSlices??0}`;return m}function camera(pitch){const v=api.view;v.pitch=pitch;v.updateCamera();v.render(0)}function applyShape(){if(!api)return;const v=api.view;v.worldMesh.smooth=$('#smooth').checked;v.worldMesh.shapeOptions={guardCells:$('#guard').checked};v.worldMesh.invalidate();v.render(0);measure()}function build(){if(!api)return;const {world,grid,view}=api;world.reset();view.worldMesh.smooth=$('#smooth').checked;view.worldMesh.shapeOptions={guardCells:$('#guard').checked};const c=grid.cells.reduce((a,c)=>c.cx*c.cx+c.cz*c.cz<a.cx*a.cx+a.cz*a.cz?c:a),o=world.neighbor(c,0);const support=$('#skinny').checked?[c]:[c,...Array.from({length:c.n},(_,i)=>world.neighbor(c,i)).filter(n=>n&&n.id!==o.id)];for(const a of support){world.fill(a,$('#disconnect').checked?4:5,{rock:true});for(let i=0;i<a.n;i++){const n=world.neighbor(a,i);if(n&&!world.top(n))world.fill(n,1,{rock:true});}}world.fill(o,1,{rock:true});world.setSolid(o,5,true,{rock:true});view.target.set((c.cx+o.cx)/2,1.6,(c.cz+o.cz)/2);view.distance=12;view.yaw=Math.atan2(o.cx-c.cx,o.cz-c.cz);view.worldMesh.invalidate();camera(-.06);window.overhangReview={api,measure,build,pillar:c.id,lip:o.id};measure()}function load(){api=null;window.overhangReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.shape){setTimeout(ready,100);return}api=r;saved=r.world.snapshot();build()};ready()};$('#grid').onchange=load;$('#disconnect').onchange=$('#skinny').onchange=build;$('#smooth').onchange=$('#guard').onchange=applyShape;$('#low').onclick=()=>camera(-.06);$('#top').onclick=()=>camera(1.25);$('#restore').onclick=()=>{api.world.restore(saved);api.view.worldMesh.smooth=true;api.view.worldMesh.shapeOptions={};api.view.worldMesh.invalidate();api.view.render(0);measure()};load();
</script></html>
