import {rockTopology,measureOverhang} from './src/core/rock-topology.js';const $=s=>document.querySelector(s);let api,saved;function measure(){const m=rockTopology(api.world),o=measureOverhang(api.world);$('#status').textContent=`岩石${m.rockVoxels} · 底面${m.undersides} · 空隙列${m.cavityColumns} · 未连level1岩石${m.unsupported} · 悬挑${o.overhangAboveWater} · 岩檐底面${o.soffits} · 洞内空气${o.coveredAir}/${o.reachableCoveredAir} · 洞深${o.caveDepth} · 保护切面${api.view.worldMesh.shape?.guard.guardedSlices??0}`;return {...m,overhang:o}}function camera(pitch){const v=api.view;v.pitch=pitch;v.updateCamera();v.render(0)}function applyShape(){if(!api)return;const v=api.view;v.worldMesh.smooth=$('#smooth').checked;v.worldMesh.shapeOptions={guardCells:$('#guard').checked};v.worldMesh.invalidate();v.render(0);measure()}function build(){if(!api)return;const {world,grid,view}=api;world.reset();view.worldMesh.smooth=$('#smooth').checked;view.worldMesh.shapeOptions={guardCells:$('#guard').checked};const c=grid.cells.reduce((a,c)=>c.cx*c.cx+c.cz*c.cz<a.cx*a.cx+a.cz*a.cz?c:a),o=world.neighbor(c,0);const support=$('#skinny').checked?[c]:[c,...Array.from({length:c.n},(_,i)=>world.neighbor(c,i)).filter(n=>n&&n.id!==o.id)];for(const a of support){world.fill(a,a===c?($('#disconnect').checked?4:5):1,{rock:true});for(let i=0;i<a.n;i++){const n=world.neighbor(a,i);if(n&&!world.top(n))world.fill(n,1,{rock:true});}}world.fill(o,1,{rock:true});if(!$('#nocap').checked)world.setSolid(o,5,true,{rock:true});view.target.set(o.cx,4.5*view.levelHeight,o.cz);view.distance=9;view.yaw=Math.atan2(o.cx-c.cx,o.cz-c.cz);view.worldMesh.invalidate();camera(-.22);window.overhangReview={api,measure,build,pillar:c.id,lip:o.id,pillarCell:c,lipCell:o,probe};measure()}function load(){api=null;window.overhangReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.shape){setTimeout(ready,100);return}api=r;saved=r.world.snapshot();build()};ready()};$('#grid').onchange=load;$('#disconnect').onchange=$('#skinny').onchange=$('#nocap').onchange=build;$('#smooth').onchange=$('#guard').onchange=applyShape;$('#low').onclick=()=>camera(-.22);$('#top').onclick=()=>camera(1.25);$('#restore').onclick=()=>{api.world.restore(saved);api.view.worldMesh.smooth=true;api.view.worldMesh.shapeOptions={};api.view.worldMesh.invalidate();api.view.render(0);measure()};load();
/* 只读探针（r152）：把「岩檐朝下面是否真在画面里、柱间空洞是否真透气」量成数。不改 World、不改几何。 */
async function probe(){const {world,view}=api,L=view.levelHeight,THREE=await import('three');const m=rockTopology(world),o=measureOverhang(world);const lip=world.cells[overhangReview.lip],pillar=world.cells[overhangReview.pillar];const cam=view.camera;cam.updateMatrixWorld(true);cam.updateProjectionMatrix();
 const g=view.worldMesh.geometry,pos=g.attributes.position,nor=g.attributes.normal,idx=g.index?g.index.array:null,tris=(idx?idx.length:pos.count)/3;const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),loop=new THREE.Vector3();
 const soffits=[];for(let t=0;t<tris;t++){const i0=idx?idx[t*3]:t*3,i1=idx?idx[t*3+1]:t*3+1,i2=idx?idx[t*3+2]:t*3+2;if((nor.getY(i0)+nor.getY(i1)+nor.getY(i2))/3>-.5)continue;A.fromBufferAttribute(pos,i0);B.fromBufferAttribute(pos,i1);C.fromBufferAttribute(pos,i2);const area=new THREE.Triangle(A,B,C).getArea();if(area<1e-7)continue;const c=loop.copy(A).add(B).add(C).multiplyScalar(1/3);if(Math.hypot(c.x-lip.cx,c.z-lip.cz)>1.15)continue;soffits.push({c:c.clone(),area});}
 const rc=new THREE.Raycaster(),mesh=view.mesh;const vis=soffits.map(s=>{const ndc=s.c.clone().project(cam),inFrame=Math.abs(ndc.x)<1&&Math.abs(ndc.y)<1&&ndc.z<1;const dir=s.c.clone().sub(cam.position),dist=dir.length();dir.normalize();rc.set(cam.position,dir);const hit=rc.intersectObject(mesh,false)[0];return{inFrame,unoccluded:!hit||hit.distance>dist-.04,y:+s.c.y.toFixed(3),x:+s.c.x.toFixed(2),z:+s.c.z.toFixed(2),ndc:[+ndc.x.toFixed(3),+ndc.y.toFixed(3)]}});
 const out=new THREE.Vector3(lip.cx-pillar.cx,0,lip.cz-pillar.cz).normalize(),band=[];for(let lv=2;lv<=4;lv++){const y=(lv-1)*L+L/2,from=new THREE.Vector3(lip.cx+out.x*3.2,y,lip.cz+out.z*3.2),to=new THREE.Vector3(pillar.cx,y,pillar.cz),d=to.clone().sub(from),dist=d.length();d.normalize();rc.set(from,d);const hit=rc.intersectObject(mesh,false)[0];band.push({level:lv,y:+y.toFixed(2),lipSolid:world.isSolid(lip,lv),hit:hit?+hit.distance.toFixed(3):null,clear:hit?+(dist-hit.distance).toFixed(3):null,reachesPillar:!!hit&&hit.distance<dist+.01});}
 const section=[];for(let lv=1;lv<=5;lv++)section.push((world.isSolid(lip,lv)?'R':'.')+(world.isSolid(pillar,lv)?'R':'.'));
 const ground=[];for(let i=0;i<lip.n;i++){const nb=world.neighbor(lip,i);if(nb)ground.push(world.ground(nb));}
 return{topo:{rockVoxels:m.rockVoxels,undersides:m.undersides,cavityColumns:m.cavityColumns,unsupported:m.unsupported},overhang:{overhangAboveWater:o.overhangAboveWater,soffits:o.soffits,coveredAir:o.coveredAir,reachableCoveredAir:o.reachableCoveredAir,sealedAir:o.sealedAir,caveDepth:o.caveDepth},
  camera:{x:+cam.position.x.toFixed(3),y:+cam.position.y.toFixed(3),z:+cam.position.z.toFixed(3),pitch:view.pitch,distance:view.distance,fov:cam.fov},eaveY:+((5-1)*L).toFixed(3),levelHeight:L,lip:{cx:lip.cx,cz:lip.cz,groundLevel:world.ground(lip),neighborGround:ground},
  soffits:{count:soffits.length,area:+soffits.reduce((s,x)=>s+x.area,0).toFixed(4),yMin:+Math.min(...vis.map(v=>v.y)).toFixed(3),yMax:+Math.max(...vis.map(v=>v.y)).toFixed(3),inFrame:vis.filter(v=>v.inFrame).length,unoccluded:vis.filter(v=>v.inFrame&&v.unoccluded).length,samples:vis},
  cavity:{band,section,triangles:tris,vertices:pos.count}}}
window.__overhangProbe=probe;
