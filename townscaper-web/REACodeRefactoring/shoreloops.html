<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>岸线闭环 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:78vh;border:0}a{color:#26758a}label{margin-right:16px}</style><header><b>同一World编辑 · 角点分岛与岸线闭环</b> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/shore-topology-review.md">学习记录</a><p>1215642481162887168展示码头从空水面逐步生长；1666429884208381953展示改良岸线。保留现有水层，本页用实际网格检查点接陆地的闭环，不声称原作采用此算法。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边形</option></select></label><label>实际World状态<select id="preset"><option value="touch">两岛仅角点相接</option><option value="bridge">加一格码头相连</option><option value="town">恢复本页原小镇</option></select></label><label><input id="lines" type="checkbox" checked>黄蓝岸线</label><span id="status">加载…</span><p>黄色为实际边界小偏移，蓝色为外推/平滑。闭环拓扑修复不等于消除蓝色浪带在窄湾的几何交叠。</p></header><iframe id="scene" title="实际World岸线"></iframe><script type="module">
import {traceShoreLoops} from './src/core/shore-loops.js';const $=s=>document.querySelector(s);let api,original,pair;
function findPair(){const cells=[...api.grid.cells].sort((a,b)=>Math.hypot(a.cx,a.cz)-Math.hypot(b.cx,b.cz));for(const a of cells){const ids=new Set(a.pts.map(p=>p.id));for(const b of cells){if(a===b||a.edgeNeighbors.includes(b.id)||b.pts.filter(p=>ids.has(p.id)).length!==1)continue;const bridge=api.grid.cells.find(c=>c.edgeNeighbors.includes(a.id)&&c.edgeNeighbors.includes(b.id));if(bridge)return{a,b,bridge}}}throw Error('当前网格没有可展示的一格桥点接候选')}
function apply(){if(!api)return;const w=api.world,preset=$('#preset').value;if(preset==='town')w.restore(original);else{w.reset();w.fill(pair.a,3);w.fill(pair.b,2);w.color[pair.a.id]=0;w.color[pair.b.id]=3;if(preset==='bridge')w.fill(pair.bridge,1)}api.view.frameTown();if(preset!=='town'){api.view.distance=Math.max(api.view.distance,8);api.view.pitch=.95;api.view.updateCamera();}api.view.setDebug('shorelines',$('#lines').checked);const loops=traceShoreLoops(api.grid.cells,c=>w.isSolid(c,1));window.shoreReview={api,pair,loops,preset,version:w.version};$('#status').textContent=`${loops.length}闭环 · ${loops.reduce((n,l)=>n+l.length,0)}边 · World ${w.version}`;}
function load(){api=null;window.shoreReview=null;$('#scene').src='index.html?scene=town&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh){setTimeout(ready,100);return}api=r;original=r.world.snapshot();pair=findPair();apply()};ready()};$('#grid').onchange=load;$('#preset').onchange=apply;$('#lines').onchange=()=>api?.view.setDebug('shorelines',$('#lines').checked);load();
</script></html>
