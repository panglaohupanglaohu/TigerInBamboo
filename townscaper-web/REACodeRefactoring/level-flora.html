<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 分层地被</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 150px)}button,label{margin-right:12px}</style><header><b>分层地被 · 共享World实际植被</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/level-flora-review.md">逐帧证据</a><p><label><input id="enabled" type="checkbox">按真实地层选择地被色组</label><button id="quad">四边网格</button><button id="mixed">混合网格</button></p><small>保留既有落点/花/树/灌木/风。当前仅迁移分层色组；原片两套生态的物种形态/密度/雨景尚缺，四级以上重复色组。</small></header><iframe id="scene" src="index.html?scene=terrain&grid=quad"></iframe><script>
const f=document.querySelector('#scene'),on=document.querySelector('#enabled');function sync(){const r=f.contentWindow.rea;if(!r?.view?.vegetation||!r.view.worldMesh?.shape)return;const v=r.view.vegetation;if(v.levelFlora!==on.checked){v.levelFlora=on.checked;v.refresh(r.view.town,r.view.worldMesh.shape,r.view.worldMesh.garden);}window.levelFloraReview=r;}

</script></html>
