<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>单贴图镜像纹饰 · REACode重构版</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;padding:24px;background:#4c5a67;color:#eee8dc;font:14px/1.7 system-ui}a{color:#bde6ed}label{display:inline-block;margin:5px 12px 5px 0}input{vertical-align:middle}#panel{position:relative;margin:40px auto;width:max-content;max-width:100%;overflow:auto}#label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 24px;border:1px solid #bcb5a5;background:#eee9dd;color:#343942;white-space:nowrap;font-size:22px}button{font:inherit}canvas{display:block}</style><h2>单张距离场 → 镜像UV → 独立cutoff / 展开</h2><nav><a href="pipeline.html" target="_top">管线</a> · <a href="textures.html">原纹理实验</a> · <a href="campaign.html">战役</a></nav><p>128²场只生成一次，调整尺寸、边框与中心阈值、展开度都只更新uniform。同一纹样镜像复用；图案、阈值展开曲线及可拖动的标题/外纹两轨时序均为本地样例，尚未复现原作徽章、美术、逐部件时序或九宫格。</p><label>宽 <input id="width" type="range" min="320" max="960" value="640" step="32"></label><label>高 <input id="height" type="range" min="160" max="480" value="320" step="16"></label><label>边框cutoff <input id="border" type="range" min="0" max="0.15" value="0.018" step="0.001"></label><label>中心cutoff <input id="center" type="range" min="0" max="0.15" value="0.036" step="0.001"></label><label>展开 <input id="reveal" type="range" min="0" max="1" value="1" step="0.01"></label><label><input id="staged" type="checkbox">分层时序（本地示例）</label><label>时序秒 <input id="timeline" type="range" min="0" max="4" step=".01" value="0"></label><button id="animate">播放展开/收起</button><div id="stats"></div><div id="panel"><canvas id="view"></canvas><div id="label" contenteditable="true" aria-label="纹饰中央文字">REA 能力库</div></div><script type="module">
import {uiRevealAt} from './src/core/ui-reveal.js';
import * as THREE from 'three';import{createOrnament}from'./src/ui/ornament.js';
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),alpha:true}),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10),ornament=createOrnament(),geometry=new THREE.PlaneGeometry(2,2);camera.position.z=2;scene.add(new THREE.Mesh(geometry,ornament.material));let animate=false,started=0;
function read(){return Object.fromEntries(['width','height','border','center','reveal'].map(id=>[id,+document.getElementById(id).value]))}
function draw(options=read(),titleOpacity=null){ornament.set(options);const size=ornament.uniforms.panel.value;renderer.setSize(size.x,size.y);renderer.render(scene,camera);const label=document.getElementById('label'),alpha=titleOpacity??ornament.uniforms.reveal.value;label.style.opacity=alpha;label.inert=alpha===0;label.setAttribute('aria-hidden',String(alpha===0));document.getElementById('stats').textContent=`1张 ${ornament.baked.size}²贴图 · ${size.x}×${size.y} · border ${ornament.uniforms.border.value.toFixed(3)} / center ${ornament.uniforms.center.value.toFixed(3)} · 展开 ${ornament.uniforms.reveal.value.toFixed(2)}`}
function drawTimeline(seconds){document.getElementById('staged').checked=true;const state=uiRevealAt(seconds);document.getElementById('timeline').value=seconds;document.getElementById('reveal').value=state.ornament;draw({...read(),reveal:state.ornament},state.title)}
for(const id of ['width','height','border','center','reveal'])document.getElementById(id).oninput=()=>{animate=false;document.getElementById('staged').checked=false;draw()};document.getElementById('animate').onclick=()=>{animate=!animate;started=performance.now()};document.getElementById('timeline').oninput=e=>{animate=false;document.getElementById('staged').checked=true;drawTimeline(+e.target.value)};document.getElementById('staged').onchange=e=>{animate=false;if(e.target.checked)drawTimeline(+document.getElementById('timeline').value);else draw()};function tick(t){if(animate){if(document.getElementById('staged').checked){drawTimeline(((t-started)/1000)%4)}else{const reveal=.5-.5*Math.cos((t-started)/800);document.getElementById('reveal').value=reveal;draw({...read(),reveal})}}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.ornamentReview={ornament,renderer,scene,camera,draw,drawTimeline,stop:()=>{animate=false}};addEventListener('pagehide',()=>{ornament.dispose();geometry.dispose();renderer.dispose()});
</script></html>
