<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 台地结构</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{width:100%;height:calc(100vh - 160px);border:0}button{margin:8px}</style><header><b>台地结构 · 实际World只读诊断</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/terrace-profile-review.md">逐帧证据</a><p><button id="quad">四边网格</button><button id="mixed">混合网格</button><label><input id="woodladder" type="checkbox">木梯几何（导航不变）</label><label>格边遍<select id="edgepass"><option value="off">成图</option><option value="steps">台地层界</option><option value="wire">顶面线框</option><option value="shore">格边岸界</option></select></label><output id="stats">加载…</output></p><small>保留已有量化/洞窟/坡面/导航。格边遍共用World端点与当前笼形变，不代表最终倒角网格完全重合。统计逻辑顶列的同高连片、顶面积和高度阶差代理；不是实际网格坡度、洞内/悬垂面积或可走性证明。</small></header><iframe id="scene" src="index.html?scene=terrain&grid=quad"></iframe><script type="module">
import{terraceProfile}from'./src/core/terrace-profile.js';const f=document.querySelector('#scene');function sync(){const r=f.contentWindow.rea;if(!r?.view?.town)return;if(r.view.navLayer.woodLadders!==document.querySelector('#woodladder').checked)r.view.setDebug('woodladders',document.querySelector('#woodladder').checked);r.view.terraceEdges.setMode(document.querySelector('#edgepass').value);const report=terraceProfile(r.view.town,{levelHeight:r.view.vegetation.L});document.querySelector('#stats').textContent=`陆格 ${report.landCells} · 同高片 ${report.patches.length} · 顶面积 ${report.topArea.toFixed(2)} · 阶差面积代理 ${report.stepArea.toFixed(2)}`;window.terraceReview={rea:r,report,refresh:sync};}for(const kind of['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.terraceReview=null;f.src='index.html?scene=terrain&grid='+kind};document.querySelector('#woodladder').onchange=sync;document.querySelector('#edgepass').onchange=sync;const timer=setInterval(sync,500);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
