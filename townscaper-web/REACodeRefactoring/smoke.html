<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>两遍烟雾验收 · REACode重构版</title><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.5 system-ui}header{padding:12px 20px}input,button{font:inherit;margin:5px}iframe{width:100%;height:80vh;border:0}a{color:#276e86}</style><header><b>真实World烟雾 · 两遍与排序</b> · <a href="pipeline.html" target="_top">管线</a><p>保留已有黑底/浅色两遍、底部硬边到顶部淡出的实现；补相机深度排序。已续审UV前后滚动和mip两段；可关闭任一机制对照，查看实际采样方片。Max/收缩火焰仍待续审。</p><label><input id="mixed" type="checkbox">混合网格</label><label><input id="back" type="checkbox" checked>黑底遍</label><label><input id="front" type="checkbox" checked>浅色遍</label><label><input id="scroll" type="checkbox" checked>UV前后滚动</label><label><input id="mip" type="checkbox" checked>年龄mip偏移</label><label><input id="lobes" type="checkbox" checked>轮廓凹凸</label><label title="第56批 C01：6–7 个直径≈柱宽的大瓣"><input id="bigLobes" type="checkbox">大瓣</label><label title="第56批 C01：柱顶之后断开的独立烟团"><input id="detach" type="checkbox">顶端断开</label><label title="第56批 C01：两柱之间低对比弥散薄雾"><input id="haze" type="checkbox">弥散薄雾</label><label title="第64轮：断口上方那一组更大更圆、边界更清楚、散得更晚（关掉=与柱身同外观）"><input id="crown" type="checkbox" checked>顶团差异</label><select id="debug"><option value="off">烟雾</option><option value="checker">棋盘烟雾</option><option value="noise">噪声方片</option><option value="cards">棋盘方片</option></select><button id="reset">重置烟雾</button><span id="stats">加载中</span></header><iframe id="scene" title="真实场景烟雾"></iframe><script type="module">
import{makeRng}from'./src/core/noise.js';const frame=document.querySelector('#scene');let ready=false;
function reset(){if(!ready)return;const r=frame.contentWindow.rea,w=r.world,c=w.cells.filter(c=>w.top(c)>0).reduce((a,b)=>Math.hypot(a.cx,a.cz)<Math.hypot(b.cx,b.cz)?a:b),s=r.view.smoke;s.clear();s.random=makeRng(7);s.sources=[{x:c.cx,y:w.top(c)*r.view.levelHeight+.2,z:c.cz}];applySampling();s.setPasses({back:document.querySelector('#back').checked,front:document.querySelector('#front').checked});document.querySelector('#stats').textContent='已重置 · 相机深度排序 · 最多240片';applyShape();window.smokeReview={ready:true};}
function applyShape(){if(!ready)return;const q=new URLSearchParams(location.search);if(!window._shapeUrl)for(const id of ['bigLobes','detach','haze','crown'])if(q.get(id)==='1')document.querySelector('#'+id).checked=true;window._shapeUrl=1;const o={bigLobes:document.querySelector('#bigLobes').checked,detach:document.querySelector('#detach').checked,haze:document.querySelector('#haze').checked,crown:document.querySelector('#crown').checked};/* 第 63 轮：三条口径已native化进 smoke.js（大瓣=真发射间隔/噪声尺度、顶端断开=分组发射、薄雾=独立扁卡层），不再走 smoke-c01 的外挂近似 */const s=frame.contentWindow.rea.view.smoke;s.setLobeStyle(o.bigLobes?'big':'fine');s.setTopBreak(o.detach);s.setHaze(o.haze);s.setCrown(o.crown);window.smokeShapeStats={...o,lobeStyle:s.lobeStyle,topBreak:s.topBreak,haze:s.hazeStats,crownOn:s.crownOn,crownCount:s.crownCount};}for(const id of ['bigLobes','detach','haze','crown'])document.querySelector('#'+id).onchange=applyShape;
function applySampling(){if(!ready)return;const s=frame.contentWindow.rea.view.smoke;s.setSampling({scroll:document.querySelector('#scroll').checked,mip:document.querySelector('#mip').checked});s.setDebug(document.querySelector('#debug').value)}for(const id of ['scroll','mip','debug'])document.querySelector('#'+id).onchange=applySampling;
document.querySelector('#lobes').onchange=e=>{if(ready)frame.contentWindow.rea.view.smoke.setLobes(e.target.checked)};
window.smokeSetLobes=on=>{if(!ready)return false;frame.contentWindow.rea.view.smoke.setLobes(on);document.querySelector('#lobes').checked=on;return true};
frame.onload=()=>{ready=!!frame.contentWindow.rea;reset()};document.querySelector('#reset').onclick=reset;for(const id of ['back','front'])document.querySelector('#'+id).onchange=()=>{if(ready)frame.contentWindow.rea.view.smoke.setPasses({back:document.querySelector('#back').checked,front:document.querySelector('#front').checked})};document.querySelector('#mixed').onchange=()=>{ready=false;window.smokeReview={ready:false};load()};function load(){frame.src='index.html?scene=town&grid='+(document.querySelector('#mixed').checked?'mixed':'quad')}load();
</script></html>
