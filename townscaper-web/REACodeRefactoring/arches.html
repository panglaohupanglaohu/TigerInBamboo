<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 实际建筑拱底</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 150px)}button{margin-right:12px}</style><header><b>建筑拱底 · 曲线分段</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/arch-profile-review.md">逐帧证据</a><p><button id="quad">四边网格</button><button id="mixed">混合网格</button><button id="sample">桥洞示例</button><label>曲线精度 <select id="tolerance"><option value=".0025">精细</option><option value=".025">粗分段</option></select></label> <label>楼板保留 <select id="slab"><option value=".05">0.05</option><option value=".2">0.20</option></select></label> <span id="stats"></span></p><small>共用实际建筑管线，保持既有拱的轮廓与支撑条件。楼板保留厚度直接限制拱顶，楔石/复杂穿楼构造仍待迁移；未改变导航碰撞。</small></header><iframe id="scene" src="index.html?scene=town&grid=quad"></iframe><script>
const f=document.querySelector('#scene'),select=document.querySelector('#tolerance');for(const kind of['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.archReview=null;f.src='index.html?scene=town&grid='+kind;};
select.onchange=()=>{if(!window.archReview)return;archReview.world.archTolerance=Number(select.value);archReview.view.worldMesh.invalidate();};
document.querySelector('#sample').onclick=()=>{const r=archReview,w=r.world;w.reset();const c=w.cells.find(c=>c.n===4&&Math.hypot(c.cx,c.cz)<1&&w.neighbor(c,0)&&w.neighbor(c,2));w.fill(c,1);for(const i of[0,2])w.fill(w.neighbor(c,i),3);w.setSolid(c,4,true);r.view.worldMesh.invalidate();};
const timer=setInterval(()=>{const r=f.contentWindow.rea;if(!r?.view?.worldMesh)return;window.archReview=r;const slab=Number(document.querySelector('#slab').value);if(r.world.archSlab!==slab){r.world.archSlab=slab;r.view.worldMesh.invalidate();}const tolerance=Number(select.value);if(r.world.archTolerance!==tolerance){r.world.archTolerance=tolerance;r.view.worldMesh.invalidate();}const s=r.view.worldMesh.buildStats;document.querySelector('#stats').textContent=s?'拱 '+s.archCount+' · 分段 '+s.archSegments:'';},150);addEventListener('pagehide',()=>clearInterval(timer));</script></html>
