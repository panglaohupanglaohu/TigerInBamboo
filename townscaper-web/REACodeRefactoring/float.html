<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>浮点GPU实测 · REACode重构版</title><style>body{background:#edf4f0;color:#20343c;font:16px/1.7 system-ui;max-width:950px;margin:40px auto;padding:0 20px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;border:1px solid #ccd9d8;text-align:left}button{font:inherit;padding:6px 14px}pre{font-size:13px;overflow:auto}a{color:#276e86}</style><nav><a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a></nav><h1>浮点渲染目标与CPU回读</h1><p>1664565063552847873：先测本机RGBA16F/32F写入、浮点回读及线性过滤，避免仅凭扩展名判断可用。</p><p>结果只代表当前浏览器和GPU；不等于所有平台可用，也没有据此宣称完成流体求解。</p><button id="run">重新实测</button><p id="scope">检测中…</p><table><thead><tr><th>格式</th><th>可渲染</th><th>HDR/负值回读</th><th>线性过滤</th></tr></thead><tbody id="rows"></tbody></table><pre id="details"></pre><script type="module">
import{probeFloatTargets}from'./src/world/float-probe.js';
function run(){const report=probeFloatTargets();window.floatReview=report;document.querySelector('#scope').textContent=report.webgl2?'当前环境：'+report.renderer+' · '+report.version:'此环境不支持WebGL2';document.querySelector('#rows').replaceChildren(...report.formats.map(row=>{const tr=document.createElement('tr');for(const value of[row.name,row.renderable?'通过':'未通过',row.readback?'通过':'未通过',row.linearFiltering?'通过':'未通过']){const td=document.createElement('td');td.textContent=value;tr.append(td)}return tr}));document.querySelector('#details').textContent=JSON.stringify(report,null,2)}document.querySelector('#run').onclick=run;run();
</script></html>
