<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 中心锚点卡片对照</title><style>body{margin:0;font:14px system-ui;background:#eef4f3;color:#20343c}header{padding:12px}iframe{width:100%;height:80vh;border:0}button,label{margin:5px}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>共享地被卡片 · 中心锚定对照</b><p>1191990107785572352原片是墙根灌木。这里先在既有草卡片上对照“环绕相机 / 中心固定实例轴”，默认场景仍用旧模式；尚非原片灌木形状/纹理或生命周期复现。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label><input type="checkbox" id="anchor">中心固定</label><button id="turn">转90°</button><button id="close">贴近真实草簇</button><output id="status">加载…</output></header><iframe id="scene" title="真实共享草卡片"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function apply(){if(api){api.view.vegetation.setTuftAnchor($('#anchor').checked);$('#status').textContent=`实际草卡片 ${api.view.vegetation.tufts.count} · ${$('#anchor').checked?'中心固定实例轴':'旧模式中心随镜头'}`;}}function close(){if(!api)return;const v=api.view,T=v.vegetation.tufts,m=T.instanceMatrix.array;if(!T.count)return;v.target.set(m[12],m[13]+.12,m[14]);v.distance=3;v.pitch=.8;v.updateCamera();}function load(){api=null;window.billboardAnchor=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value;}$('#scene').onload=()=>{const ready=()=>{api=$('#scene').contentWindow.rea;if(!api?.view.vegetation.tufts.count){setTimeout(ready,100);return}window.billboardAnchor={api,apply,close};apply();};ready();};$('#anchor').onchange=apply;$('#turn').onclick=()=>{if(api){api.view.yaw+=Math.PI/2;api.view.updateCamera();}};$('#close').onclick=close;$('#grid').onchange=load;load();
</script></html>
