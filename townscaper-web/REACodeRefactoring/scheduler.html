<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>跨帧协程 · REACode重构版</title><style>body{font:15px/1.6 system-ui;background:#edf4f0;color:#20343c;margin:24px}canvas{background:#d4e5e0;max-width:100%;border-radius:14px}button,input{font:inherit;margin:6px;padding:5px}a{color:#276e86}</style><h1>嵌套协程 · 共享 World 连通性分析</h1><p>明确的子迭代器栈按帧摊开深度优先遍历；不复制格子或体素。原文强调跨帧算法，画面本身不展示内部调用栈。</p><label><input id="mixed" type="checkbox" checked>三角＋方格</label><label>每帧工作量<input id="budget" type="number" value="8" min="1" max="128"></label><button id="start">重新运行</button><button id="cancel">取消</button><div id="stats"></div><canvas width="1000" height="650"></canvas><p><a href="index.html">首页</a> · <a href="pipeline.html">管线</a> · <a href="coverage.html">模块映射</a> · <a href="artifacts/coverage/coroutine-review.md">逐帧记录</a></p><script type="module">
import{Scheduler,frame}from'./src/core/coroutine.js';import{buildMixedGrid,buildQuadGrid}from'./src/core/grid.js';import{World}from'./src/core/world.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let job,world,seen=new Set(),timer;
function draw(){ctx.clearRect(0,0,1000,650);const pts=world.grid.verts,minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minZ=Math.min(...pts.map(p=>p.z)),maxZ=Math.max(...pts.map(p=>p.z)),scale=Math.min(900/(maxX-minX),550/(maxZ-minZ)),P=p=>[500+(p.x-(maxX+minX)/2)*scale,325+(p.z-(maxZ+minZ)/2)*scale];for(const c of world.cells){ctx.beginPath();c.pts.forEach((p,i)=>{const[x,y]=P(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=seen.has(c.id)?'#498e81':'#d9d5bd';ctx.fill();ctx.strokeStyle='#637e7c';ctx.stroke()}document.querySelector('#stats').textContent=`已分析 ${seen.size}/${world.cells.length} 格 · 帧 ${job.frames} · 工作量 ${job.totalOps} · 最大显式深度 ${job.depthMax} · ${job.cancelled?'已取消':job.done?'完成':'进行中'}`;window.schedulerReview={job,world,seen};}
function* visit(c){if(seen.has(c.id))return;seen.add(c.id);yield frame();for(const id of c.edgeNeighbors)if(id>=0&&!seen.has(id))yield visit(world.cells[id]);}
function tick(){job.step();draw();if(!job.done)timer=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(timer);job?.cancel();const grid=document.querySelector('#mixed').checked?buildMixedGrid({radius:7,seed:5}):buildQuadGrid({radius:5,seed:5});world=new World(grid);for(const c of world.cells)world.fill(c,1,{rock:true});seen=new Set();job=new Scheduler({opsPerFrame:Math.max(1,Math.min(128,Number(document.querySelector('#budget').value)||8))});job.add(visit(world.cells[0]));tick()}
document.querySelector('#start').onclick=start;document.querySelector('#mixed').onchange=start;document.querySelector('#cancel').onclick=()=>{cancelAnimationFrame(timer);job.cancel();draw()};start();
</script></html>
