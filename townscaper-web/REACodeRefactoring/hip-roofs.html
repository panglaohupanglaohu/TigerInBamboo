<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 四檐屋顶</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 160px)}button,label{margin-right:12px}</style><header><b>四檐屋顶 · 共享建筑实际开关</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/hip-roof-review.md">逐帧证据</a><p><label><input id="enabled" type="checkbox">独立四边房屋改为四檐顶</label><button id="quad">四边网格</button><button id="mixed">混合网格</button><button id="sample">加载独立塔示例</button></p><small>默认保留已有屋顶；仅改独立四边房屋，三角与连片屋顶保持既有生成。矩形屋脊由长短边差决定，不规则四边使用双线性映射，非原作完整屋顶规则。</small></header><iframe id="scene" src="index.html?scene=town&grid=quad"></iframe><script>
const f=document.querySelector('#scene'),on=document.querySelector('#enabled');function sync(){const r=f.contentWindow.rea;if(!r?.view?.worldMesh||!r.world)return;const w=r.world;if(!!w.hipRoofs!==on.checked){w.hipRoofs=on.checked;w.touch();r.view.worldMesh.invalidate();}window.hipRoofReview=r;}
on.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.hipRoofReview=null;f.src='index.html?scene=town&grid='+kind;};document.querySelector('#sample').onclick=()=>{const r=hipRoofReview,w=r.world;w.reset();const chosen=[];for(const c of w.cells)if(c.n===4&&Math.hypot(c.cx,c.cz)<5&&chosen.every(o=>Math.hypot(c.cx-o.cx,c.cz-o.cz)>1.6)){chosen.push(c);w.fill(c,3+chosen.length%3);if(chosen.length===8)break;}r.view.worldMesh.invalidate();};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
