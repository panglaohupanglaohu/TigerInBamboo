<style>body{margin:0;background:#253239;color:#213c42;font:14px/1.5 system-ui}main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:18px}aside{background:#f0f6f4;padding:16px;border-radius:14px;align-self:start}h1{font-size:18px}button,input{font:inherit;margin:4px;padding:5px}a{color:#147b88}#stage{min-width:0}canvas{width:100%;height:auto;display:block}#status{overflow-wrap:anywhere}small{display:block}@media(max-width:750px){main{display:block;padding:10px}aside{margin-bottom:14px}}</style>
<main><aside><nav><a href="index.html">首页</a> · <a href="pipeline.html">管线</a> · <a href="grids.html?t=atlas">候选/跨叶查询</a></nav><h1>运行时网格烘焙图集</h1><p>1593215065423245313：从网格现场烘焙并增删精灵槽。本页调用主场景同一个 ImpostorBaker / Atlas，每次新增保留8个方位；删除后回收槽位，存活UV不移动。</p><label>单帧像素 <input id="pixels" type="number" min="16" max="128" step="16" value="64"></label><div><button id="sphere">加球</button><button id="box">加方块</button><button id="knot">加扭结</button><button id="remove">删最后一组</button></div><p id="status" role="status"></p><small>显示真实GPU纹理。满板保持原内容，错误不算成功；删除先清空再回收。本地固定512²、8视角接口，尚无自动扩容/重打包；原片的单视角素材和UI编号、全级mip隔离仍未复现。删除组前须解绑其消费者。</small></aside><section id="stage"></section></main>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import{ImpostorBaker}from'./src/life/impostor.js';
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(768,768,false);renderer.setPixelRatio(1);document.querySelector('#stage').append(renderer.domElement);
const baker=new ImpostorBaker(renderer,512),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;
const material=new THREE.MeshBasicMaterial({map:baker.rt.texture,transparent:true}),plane=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);scene.add(plane);renderer.setClearColor('#253239',1);
const items=[];function draw(){renderer.render(scene,camera);const r=baker.atlas.report();document.querySelector('#status').textContent=`${items.length}组 / ${r.leaves}叶 · ${baker.atlas.rects().length}槽 · 占用 ${(r.fill*100).toFixed(1)}%`}
function add(kind,pixels=+document.querySelector('#pixels').value){let g;if(kind==='sphere')g=new THREE.SphereGeometry(1,20,14);else if(kind==='box')g=new THREE.BoxGeometry(1.6,1.1,1.3);else if(kind==='knot')g=new THREE.TorusKnotGeometry(.6,.18,64,8);else throw Error('unknown shape');try{const baked=baker.bake(g,pixels);items.push(baked);draw();return baked}finally{g.dispose()}}
function remove(){const last=items.at(-1);if(!last)return false;if(!baker.release(last))return false;items.pop();draw();return true}
for(const kind of ['sphere','box','knot'])document.querySelector('#'+kind).onclick=()=>{try{add(kind)}catch(e){document.querySelector('#status').textContent=e.message}};document.querySelector('#remove').onclick=remove;
window.atlasLive={renderer,baker,items,add,remove,draw};add('sphere');add('box');
</script></html>
