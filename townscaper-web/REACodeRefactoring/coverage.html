<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版 → 重构模块映射 · REACode 重构版</title><style>body{font:14px/1.6 system-ui;margin:24px;color:#20343c;background:#f0f6f3}a{color:#286d89}table{width:100%;border-collapse:collapse;table-layout:fixed}th:nth-child(1){width:19%}th:nth-child(2){width:20%}th:nth-child(3){width:12%}th:nth-child(4){width:29%}th:nth-child(5){width:20%}td,th{overflow-wrap:anywhere}th,td{border:1px solid #bed0cf;padding:10px;text-align:left;vertical-align:top}input,select{font:inherit;padding:7px;margin:8px}td:first-child{white-space:normal}tr:target{background:#fff1bf}small{display:block;color:#607a7e}code{font-size:12px}</style><h1>原版模块 → 重构模块映射</h1><p><a href="index.html" target="_top">重构版首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="MODULE-MAP.md">文字版</a> · <a href="learn/coverage.json">映射数据</a></p><p>涵盖原版 src 与 engine 全部 JS。按职责映射，已合并/迁移保留历史成果；部分覆盖明确记录机制缺口。帖子 ID 相同只是线索，不据此认定功能等价。页面内联脚本与工具属于后续扩展范围。</p><div id="counts"></div><label>搜索<input id="search" placeholder="模块、接口、视频 ID"></label><label>状态<select id="status"><option value="">全部</option></select></label><span id="total"></span><table><thead><tr><th>原版模块 / 导出接口</th><th>重构落点</th><th>覆盖状态</th><th>差距 / 说明</th><th>对应视频</th></tr></thead><tbody id="rows"></tbody></table><script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=await (await fetch('learn/coverage.json',{cache:'no-store'})).json();
const search=document.querySelector('#search'),status=document.querySelector('#status');
document.querySelector('#counts').textContent='更新：'+data.updatedAt+' · '+Object.entries(data.counts).map(([k,v])=>k+' '+v).join(' · ');
for(const k of Object.keys(data.counts)){const o=document.createElement('option');o.value=k;o.textContent=k;status.appendChild(o)}
function draw(){const list=data.modules.filter(x=>(!status.value||x.status===status.value)&&JSON.stringify(x).toLowerCase().includes(search.value.toLowerCase()));document.querySelector('#total').textContent=`显示 ${list.length} / ${data.modules.length}`;document.querySelector('#rows').innerHTML=list.map(x=>`<tr id="${esc(x.source)}"><td><code>${esc(x.source)}</code><small>${esc(x.sourceExports.join(', '))}</small></td><td>${x.targets.map(t=>`<a href="${esc(t)}"><code>${esc(t)}</code></a>`).join('<br>')||'尚无落点'}</td><td>${esc(x.status)}${x.evidence?`<small><a href="${esc(x.evidence)}">本轮证据</a></small>`:''}</td><td>${esc(x.gap)}</td><td>${x.clips.map(id=>`<a href="gifs/${id}.mp4">${id}</a>`).join('<br>')}</td></tr>`).join('')};search.oninput=status.onchange=draw;draw();
</script></html>
