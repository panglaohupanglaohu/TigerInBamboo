<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>彩色反射 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:76vh;border:0}a{color:#26758a}label{margin-right:14px}</style><header><b>实际WorldMesh · 彩色中间色反射</b> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/reflection-review.md">学习证据</a><p>1215644531221311488：彩色块面倒影与更宽岸裙；1758250248483278925：多组岛屿的新反射。保留共享网格翻转近似，修复水面上方残影与淡出范围；不宣称原作公式。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边形</option></select></label><label>场景<select id="kind"><option value="town">小镇</option><option value="terrain">地形</option></select></label><label>颜色混合<input id="mix" type="range" min="0" max="1" step=".05" value=".5"></label><label>扰动<input id="distortion" type="range" min="0" max=".1" step=".002" value=".018"></label><label><input id="show" type="checkbox" checked>反射</label><label><input id="wire" type="checkbox">反射线框</label><span id="status">加载…</span><p>混合0为水色单色，1为对象色；中点在场景线性颜色中插值。尚未覆盖原作全部平坦色块、遮挡/投影算法和浪裙视觉尺度。</p></header><iframe id="scene" title="实际共享网格反射"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function load(){api=null;window.reflectionReview=null;$('#scene').src='index.html?scene='+$('#kind').value+'&grid='+$('#grid').value}function apply(){if(!api)return;api.view.setReflectionStyle({colorMix:+$('#mix').value,distortion:+$('#distortion').value});api.view.setDebug('reflection',$('#show').checked);api.view.reflectMaterial.wireframe=$('#wire').checked;$('#status').textContent=`World ${api.world.version} · 与主体共用 ${api.view.worldMesh.geometry.attributes.position.count} 顶点`;}
$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.reflectMaterial){setTimeout(ready,100);return}api=r;window.reflectionReview={api};apply()};ready()};$('#grid').onchange=$('#kind').onchange=load;for(const id of ['mix','distortion','show','wire'])$('#'+id).oninput=apply;load();
</script></html>
