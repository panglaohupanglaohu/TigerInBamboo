<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>共享地形填洼</title><style>body{margin:0;background:#edf4f3;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 130px)}button{margin-right:10px}</style><header><b>共享地形 · 填洼</b> <a href="index.html" target="_top">首页</a> · <a href="artifacts/coverage/depression-fill-review.md">证据与缺口</a><p><button id="quad">四边网格</button><button id="mixed">混合网格</button><button id="network-seed">生成可重建岩地形</button><button id="basin">封闭洼地示例</button><button id="fill">填到溢出口</button><button id="river">填洼后重建河网/开槽</button><button id="restore">恢复</button><span id="stats"></span></p><small>直接修改真实岩石体素：填洼只抬高；重建河网会切低河床、替换旧河标记。平湖沿显式出口树排水；受影响河段会清除旧标记；可对连续岩柱重新累计汇水并开槽；含洞/建筑时拒绝以保护已有成果。连续微坡、湖水与原球面联合约束尚缺。</small></header><iframe id="scene" src="index.html?scene=terrain&grid=quad"></iframe><script type="module">
import{generateTerrain}from'./src/terrain/generate.js';
import{rebuildRiverNetwork}from'./src/terrain/river-network.js';
import{fillTerrainDepressions}from'./src/terrain/drainage.js';const f=document.querySelector('#scene');let backup=null;
for(const kind of['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.drainageReview=null;backup=null;f.src='index.html?scene=terrain&grid='+kind;};
document.querySelector('#network-seed').onclick=()=>{const r=drainageReview;generateTerrain(r.world,{seed:7,caves:0,features:false,rivers:0});backup=r.world.snapshot();r.view.changed();r.view.worldMesh.invalidate();document.querySelector('#stats').textContent='连续岩地形已生成，可重建河网';};document.querySelector('#basin').onclick=()=>{const r=drainageReview,w=r.world;w.reset();for(const c of w.cells){const d=Math.hypot(c.cx,c.cz);if(d<3)w.fill(c,d<1.4?1:4,{rock:true});}backup=w.snapshot();w.drainage=null;r.view.changed();r.view.worldMesh.invalidate();};
document.querySelector('#fill').onclick=()=>{const r=drainageReview;backup??=r.world.snapshot();const result=fillTerrainDepressions(r.world);r.view.changed();r.view.worldMesh.invalidate();document.querySelector('#stats').textContent='抬高 '+result.raised+' 格 · 清除失效河格 '+result.invalidatedRiverCells;};document.querySelector('#river').onclick=()=>{const r=drainageReview;backup??=r.world.snapshot();try{const x=rebuildRiverNetwork(r.world,{threshold:4,depth:1});r.view.changed();r.view.worldMesh.invalidate();document.querySelector('#stats').textContent='新河格 '+x.riverCells+' · 河口/边界出口 '+x.outlets.length+' · 修改 '+x.changed+' 格';}catch(e){document.querySelector('#stats').textContent=e.message;}};document.querySelector('#restore').onclick=()=>{if(!backup)return;drainageReview.world.restore(backup);drainageReview.world.drainage=null;drainageReview.world.riverNetwork=null;drainageReview.view.changed();drainageReview.view.worldMesh.invalidate();document.querySelector('#stats').textContent='已恢复';};const timer=setInterval(()=>{if(f.contentWindow.rea?.view?.worldMesh)window.drainageReview=f.contentWindow.rea;},150);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
