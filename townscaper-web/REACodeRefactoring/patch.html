<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指定模块局部网格 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;font:15px/1.6 system-ui;background:#edf4f0;color:#20343c}header{padding:16px 24px}canvas{display:block;width:100%;height:60vh}pre{max-height:130px;overflow:auto;font-size:12px}button{margin:5px}a{color:#276e86}</style><header><b>先生成模块需要的局部网格</b> · <a href="pipeline.html">管线</a><p>显式几何模板 → 共享半边 → 同一个World的地形/建筑 → WorldMesh。当前仅生成新世界的种子，尚不拼接到已有世界或联合WFC；模板不是视频精确复刻。</p><button id="mixed">三角＋四边形</button><button id="quad">四边形</button><span id="report"></span><label><input id="empty" type="checkbox">预留空地（重置此实验）</label><button id="place">整体放置体素模块</button><button id="unplace">撤回本次放置</button><span id="volume-status"></span><button id="audit">固定种子样本网格诊断</button><p><button id="search">查找5格模板（仅拓扑候选）</button><label><input id="metric" type="checkbox">刚体几何复核</label><label><input id="distort" type="checkbox">X方向拉伸对照</label><label>候选测试预算 <input id="budget" type="number" min="0" max="250000" value="10000"></label></p><details id="audit-details"><summary>样本网格诊断（不是WFC出现概率）</summary><pre id="audit-report">尚未运行</pre></details><pre id="search-report">尚未搜索；结果不等于几何/插槽适配。</pre></header><canvas></canvas><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import{placeModuleVolume,undoModuleVolume}from'./src/build/module-volume.js';import{auditModuleOccurrences}from'./src/core/module-audit.js';import{buildQuadGrid,buildMixedGrid}from'./src/core/grid.js';import{fitModuleGeometry}from'./src/core/module-fit.js';import{describeModule,findModulePatches}from'./src/core/module-search.js';import*as T from'three';import{generateModulePatch,PATCH_EXAMPLE}from'./src/core/module-patch.js';import{World}from'./src/core/world.js';import{WorldMesh}from'./src/world/worldmesh.js';import{PALETTES}from'./src/core/palette.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new T.Scene();scene.background=new T.Color('#7fa69c');scene.add(new T.HemisphereLight(0xffffff,0x657467,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(3,7,4);scene.add(sun);const camera=new T.PerspectiveCamera(40,1,.1,100);camera.position.set(5,5,6);camera.lookAt(0,.7,0);let mesh,wm,receipt=null;
function build(mixed){receipt=null;window.patchVolume=null;document.querySelector('#volume-status').textContent='';window.patchSearch=null;document.querySelector('#search-report').textContent='尚未搜索；结果不等于几何/插槽适配。';mesh?.removeFromParent();mesh?.material.dispose();wm?.geometry.dispose();const spec={...PATCH_EXAMPLE,vertices:PATCH_EXAMPLE.vertices.map(([x,z])=>[x*(document.querySelector('#distort').checked?1.3:1),z]),faces:mixed?PATCH_EXAMPLE.faces:[[0,1,4,3],[1,2,5,4],[3,4,7,6],[4,5,8,7]]};const grid=generateModulePatch(spec,{x:-1,z:-1}),world=new World(grid);world.palette=PALETTES.town;for(const c of grid.cells){world.fill(c,1,{rock:true});if(c.cx<.1&&!document.querySelector('#empty').checked){world.setSolid(c,2,true);world.color[c.id]=3}}wm=new WorldMesh(world);wm.rebuild();mesh=new T.Mesh(wm.geometry,new T.MeshStandardMaterial({vertexColors:true,roughness:.95}));scene.add(mesh);window.patchReview={world,grid,wm,kind:mixed?'mixed':'quad'};document.querySelector('#report').textContent=grid.cells.length+'格 · '+grid.cells.map(c=>c.n).join('/')+' · 共享World实际几何';}
const templateGrid=generateModulePatch(PATCH_EXAMPLE),pattern=describeModule(templateGrid,[0,1,2,3,4]);document.querySelector('#search').onclick=()=>{try{const r=findModulePatches(window.patchReview.grid,pattern,{maxTests:Number(document.querySelector('#budget').value),limit:20,accept:document.querySelector('#metric').checked?mapping=>!!fitModuleGeometry(templateGrid,window.patchReview.grid,mapping):null});window.patchSearch=r;document.querySelector('#search-report').textContent=JSON.stringify(r,null,2)}catch(e){document.querySelector('#search-report').textContent=e.message}};
document.querySelector('#empty').onchange=()=>build(window.patchReview.kind==='mixed');function showVolume(result){window.patchVolume=result;document.querySelector('#volume-status').textContent=result.ok?'成功 · World版本'+window.patchReview.world.version:'拒绝：'+result.reason;wm.rebuild();mesh.geometry=wm.geometry}document.querySelector('#place').onclick=()=>{try{const result=placeModuleVolume(window.patchReview.world,templateGrid,templateGrid.cells.map(c=>c.id));if(result.ok)receipt=result.receipt;showVolume(result)}catch(e){showVolume({ok:false,reason:e.message})}};document.querySelector('#unplace').onclick=()=>{const result=undoModuleVolume(window.patchReview.world,receipt);if(result.ok)receipt=null;showVolume(result)};document.querySelector('#audit').onclick=()=>{const samples=[];for(const [kind,build]of [['quad',buildQuadGrid],['mixed',buildMixedGrid]])for(const seed of [7,19])samples.push({id:kind+'-'+seed,grid:build({radius:3,seed,relaxPasses:3})});const result=auditModuleOccurrences(pattern,samples,{maxTestsPerGrid:20000,totalTests:60000,limit:50});window.patchAudit=result;document.querySelector('#audit-details').open=true;document.querySelector('#audit-report').textContent=JSON.stringify(result,null,2)};document.querySelector('#distort').onchange=()=>build(window.patchReview.kind==='mixed');document.querySelector('#mixed').onclick=()=>build(true);document.querySelector('#quad').onclick=()=>build(false);build(true);function draw(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
</script></html>
