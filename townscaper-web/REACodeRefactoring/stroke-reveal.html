<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>线稿逐笔描出 · REACode重构版</title>
<style>
body{margin:0;background:#f2f5f3;color:#1f2c31;font:14px/1.6 system-ui}
main{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:18px;align-items:start}
aside{background:#e6efec;border-radius:14px;padding:16px}
h1{font-size:18px;margin:0 0 8px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#14171a}
button,input{font:inherit;margin:4px 4px 4px 0;padding:4px 6px}
aside label{display:inline-block;white-space:nowrap;margin-right:10px}
#stats{font-variant-numeric:tabular-nums;background:#fff;border-radius:8px;padding:8px 10px;margin-top:10px;white-space:pre-line}
small{display:block;color:#41565e;margin-top:8px}
a{color:#16626f}
@media(max-width:760px){main{display:block;padding:10px}}
</style>
<main>
<aside>
  <nav><a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="learn.html" target="_top">逐帧库</a></nav>
  <h1>线稿 · 逐笔描出</h1>
  <p>1448039167057879048 / 1447483550257799171：原片里岛屿生成的可视化是黑底白线<b>一笔一笔描出来</b>，画完停住再换下一座岛。</p>
  <label>种子 <input id="seed" type="number" value="7" min="1" max="9999"></label>
  <label>总时长(s) <input id="dur" type="number" value="3.2" min="0.5" max="20" step="0.1" style="width:70px"></label>
  <label>错峰 <input id="stagger" type="number" value="0.6" min="0" max="0.95" step="0.05" style="width:70px"></label>
  <div><button id="play">播放</button><button id="pause">暂停</button><button id="reset">重画</button></div>
  <div><button id="seek00">0%</button><button id="seek25">25%</button><button id="seek50">50%</button><button id="seek75">75%</button><button id="seek100">100%</button></div>
  <div id="stats" role="status">…</div>
  <small>排期与按弧长裁剪在 <code>src/core/stroke-reveal.js</code>，本页只负责画。等高线是环状近似，真实 marching squares 在 <code>src/core/contour.js</code>（用于世界网格）。</small>
</aside>
<section><canvas id="c" width="720" height="720"></canvas></section>
</main>
<script type="module">
import {createStrokeReveal} from './src/core/stroke-reveal.js';

const canvas = document.querySelector('#c'), ctx = canvas.getContext('2d', {willReadFrequently: true});
const W = canvas.width, H = canvas.height;
let state = null, raf = 0;

function mulberry32(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// 环状等高线近似：每层半径带角度噪声，层间同心缩放，得到岛状等高线草图
function buildStrokes(seed) {
  const rand = mulberry32(seed * 2654435761);
  const cx = W * .5, cy = H * .52;
  const strokes = [];
  const phase = [rand() * 6.283, rand() * 6.283, rand() * 6.283];
  const amp = [.16 + rand() * .1, .09 + rand() * .06, .05 + rand() * .04];
  const levels = 9;
  const baseR = 250;
  for (let L = 0; L < levels; L++) {
    const k = L / (levels - 1);
    const scale = .34 + .66 * (1 - k);
    const seg = 92;
    const pts = [];
    for (let i = 0; i <= seg; i++) {
      const a = (i / seg) * Math.PI * 2;
      const wob = Math.sin(a * 2 + phase[0]) * amp[0] + Math.sin(a * 3 + phase[1]) * amp[1] + Math.sin(a * 7 + phase[2]) * amp[2];
      const r = baseR * scale * (1 + wob * .9) + Math.sin(a * 11 + L) * 6;
      pts.push([cx + Math.cos(a) * r * 1.12, cy + Math.sin(a) * r * .86]);
    }
    strokes.push(pts);
  }
  // 山脊短笔：从中心散出的短线（原片里岛中央也有一撮碎线）
  for (let i = 0; i < 26; i++) {
    const a = rand() * Math.PI * 2, r0 = 20 + rand() * 90, len = 26 + rand() * 70;
    const jitter = () => (rand() - .5) * 16;
    strokes.push([
      [cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * .86],
      [cx + Math.cos(a) * (r0 + len * .5) + jitter(), cy + Math.sin(a) * (r0 + len * .5) * .86 + jitter()],
      [cx + Math.cos(a) * (r0 + len) + jitter(), cy + Math.sin(a) * (r0 + len) * .86 + jitter()],
    ]);
  }
  // 岸线碎笔：外圈几段弧
  for (let i = 0; i < 7; i++) {
    const a0 = rand() * Math.PI * 2, span = .25 + rand() * .5, pts = [];
    for (let j = 0; j <= 14; j++) {
      const a = a0 + (j / 14) * span;
      const r = baseR * 1.02 * (1 + Math.sin(a * 3 + phase[1]) * .12);
      pts.push([cx + Math.cos(a) * r * 1.12, cy + Math.sin(a) * r * .86]);
    }
    strokes.push(pts);
  }
  return strokes;
}

function draw(t) {
  ctx.fillStyle = '#14171a';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e9eeec';
  ctx.lineWidth = 1.15;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const shown = state.reveal.sampleAt(t);
  ctx.beginPath();
  for (const s of shown) {
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i][0], s.points[i][1]);
  }
  ctx.stroke();
  const st = state.reveal.statsAt(t);
  state.last = st;
  document.querySelector('#stats').textContent =
    `笔画 ${st.strokes} 笔 · 开始 ${st.started} · 画完 ${st.finished}\n` +
    `已描 ${(st.ratio * 100).toFixed(1)}% · 弧长 ${st.drawnLength.toFixed(0)}/${st.totalLength.toFixed(0)}\n` +
    `时间 ${st.time.toFixed(2)}s / 收尾 ${state.reveal.endTime.toFixed(2)}s`;
}

function build({keepTime = false} = {}) {
  cancelAnimationFrame(raf);
  const seed = Math.max(1, Number(document.querySelector('#seed').value) || 1);
  const duration = Math.max(.5, Number(document.querySelector('#dur').value) || 3.2);
  const stagger = Math.min(.95, Math.max(0, Number(document.querySelector('#stagger').value) || 0));
  const strokes = buildStrokes(seed);
  const reveal = createStrokeReveal({strokes, duration, stagger, order: 'random', seed, ease: 'smooth'});
  const prevT = keepTime && state ? state.last.time : 0;
  state = {seed, duration, stagger, strokes, reveal, t: prevT, playing: false, last: null};
  draw(Math.min(prevT, reveal.endTime));
}

function inkPixels() {
  const d = ctx.getImageData(0, 0, W, H).data;
  let n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if ((d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114) > 110) n++;
  }
  return n;
}

function play() {
  if (!state) return;
  if (state.last.time >= state.reveal.endTime) state.t = 0;
  state.playing = true;
  const startedAt = performance.now() - state.t * 1000;
  const step = () => {
    if (!state.playing) return;
    const t = (performance.now() - startedAt) / 1000;
    state.t = Math.min(t, state.reveal.endTime);
    draw(state.t);
    if (state.t >= state.reveal.endTime) { state.playing = false; return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function pause() { state.playing = false; cancelAnimationFrame(raf); }
function seek(norm) {
  pause();
  state.t = Math.max(0, Math.min(1, norm)) * state.reveal.endTime;
  draw(state.t);
}

document.querySelector('#play').onclick = play;
document.querySelector('#pause').onclick = pause;
document.querySelector('#reset').onclick = () => build();
document.querySelector('#seed').onchange = () => build();
document.querySelector('#dur').onchange = () => build({keepTime: true});
document.querySelector('#stagger').onchange = () => build({keepTime: true});
for (const [id, n] of [['seek00', 0], ['seek25', .25], ['seek50', .5], ['seek75', .75], ['seek100', 1]]) {
  document.querySelector('#' + id).onclick = () => seek(n);
}

window.strokeReveal = {
  get ready() { return !!state && !!state.last; },
  seek, play, pause, inkPixels,
  get duration() { return state.duration; },
  get endTime() { return state.reveal.endTime; },
  stats() {
    const st = state.reveal.statsAt(state.t);
    return {...st, inkPixels: inkPixels(), strokeCount: state.reveal.strokeCount, endTime: state.reveal.endTime};
  },
  config() { return {seed: state.seed, duration: state.duration, stagger: state.stagger, strokes: state.strokes.length}; },
};

build();
seek(0);
</script>
</html>
