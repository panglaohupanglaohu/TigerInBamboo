<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SpriteAtlas · 原版代码重构</title><style>body{background:#1d282e;color:#dce6e3;font:15px system-ui;padding:20px}a{color:#a9d3c0}canvas{width:min(80vw,650px);image-rendering:pixelated;border:1px solid #617b7a}button{font:inherit;margin:8px}</style><h1>SpriteAtlas → 共享Atlas</h1><p>插入/更新/释放及有界增长；径向排序使用共享树碰撞查询，保留原版位置策略。这里只是矩形图集，不代表三角UV图块填充率或主场景烘焙已完成。</p><a href="src/core/sprite-atlas.js">重构源码</a> · <a href="../REACode/engine/spritepack.js">原版源码</a><div><button id="add">插入一块</button><button id="remove">释放最后一块</button><button id="radial">对照径向排布</button></div><p id="status"></p><canvas id="canvas"></canvas><script type="module">
import {SpriteAtlas,radialPack} from './src/core/sprite-atlas.js';
const atlas=new SpriteAtlas(64),keys=[],canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let radial=false;
function draw(){canvas.width=canvas.height=atlas.size;ctx.fillStyle='#142027';ctx.fillRect(0,0,canvas.width,canvas.height);const rects=radial?radialPack([...atlas.items].map(([key,it])=>({key,...it})),{size:atlas.size}).placed:[...atlas.slots].map(([key,r])=>({key,...r}));rects.forEach((r,i)=>{ctx.fillStyle=`hsl(${i*47%360},35%,60%)`;ctx.fillRect(r.x,r.y,r.w,r.h)});status.textContent=`${atlas.size}² · ${atlas.slots.size}块 · 占用 ${(atlas.occupancy()*100).toFixed(1)}% · ${radial?'径向':'共享树'}`;}
document.getElementById('add').onclick=()=>{const i=keys.length,key='sprite'+i;atlas.insert(key,12+i%5*3,10+i%4*3);keys.push(key);draw()};document.getElementById('remove').onclick=()=>{const key=keys.pop();if(key)atlas.free(key);draw()};document.getElementById('radial').onclick=()=>{radial=!radial;draw()};for(let i=0;i<15;i++)document.getElementById('add').click();window.spriteReview={atlas,keys};draw();
</script></html>
