import{shapeTerrain}from'./src/terrain/shape.js';const $=s=>document.querySelector(s);let api,T,pair,slice,baseline,line,epoch=0;
function apply(){if(!api)return;const{world,grid,view}=api;view.worldMesh.smooth=$('#smooth').checked;view.worldMesh.shapeOptions={...view.worldMesh.shapeOptions,hardEdges:$('#hard').checked?[pair]:[]};view.worldMesh.invalidate();view.render(0);const shape=view.worldMesh.shape;let error=0;for(const id of pair)for(let s=0;s<shape.slices;s++){const p=grid.verts[id],q=shape.at(p,s);error=Math.max(error,Math.hypot(p.x-q[0],p.z-q[1]));}if(line){view.scene.remove(line);line.geometry.dispose();line.material.dispose();}const points=pair.map(id=>{const q=shape.at(grid.verts[id],slice);return new T.Vector3(q[0],slice*.5+.04,q[1]);});line=new T.Line(new T.BufferGeometry().setFromPoints(points),new T.LineBasicMaterial({color:$('#hard').checked?0x111111:0x00ffff,depthTest:false}));line.renderOrder=100;view.scene.add(line);$('#status').textContent=`边${pair.join('↔')} · 原平滑位移${baseline.toFixed(4)} · 当前端点最大位移${error.toFixed(7)} · 保护切面${shape.guard.guardedSlices}`;window.hierarchyReview={api,pair,slice,shape,baseline,error};}
function focus(){if(!api)return;const [a,b]=pair.map(id=>api.grid.verts[id]),v=api.view;v.target.set((a.x+b.x)/2,slice*.5,(a.z+b.z)/2);v.distance=8;v.pitch=.65;v.updateCamera();v.render(0);}
function load(){const token=++epoch;api=null;window.hierarchyReview=null;line=null;$('#scene').onload=()=>{const ready=async()=>{if(token!==epoch)return;const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh?.shape){setTimeout(ready,100);return}api=r;T=await $('#scene').contentWindow.eval("import('three')");if(token!==epoch)return;const base=shapeTerrain(api.world);baseline=-1;for(const c of api.grid.cells)for(let i=0;i<c.n;i++){const a=c.pts[i],b=c.pts[(i+1)%c.n];for(let s=0;s<base.slices;s++){const qa=base.at(a,s),qb=base.at(b,s),d=Math.max(Math.hypot(a.x-qa[0],a.z-qa[1]),Math.hypot(b.x-qb[0],b.z-qb[1]));if(d>baseline){baseline=d;pair=[a.id,b.id];slice=s;}}}apply();focus();};ready();};$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value;}$('#focus').onclick=focus;$('#grid').onchange=load;$('#hard').onchange=$('#smooth').onchange=apply;load();
</script></html>
