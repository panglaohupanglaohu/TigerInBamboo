<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网格实验室 · REACode 重构版</title>
<style>
  :root { --bg: #2a3238; --card: rgba(255,255,255,.94); --accent: #2f7f8a; }
  html, body { margin: 0; height: 100%; background: var(--bg); font: 14px/1.5 -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 16px; top: 16px; width: 380px; max-height: calc(100vh - 32px); overflow: auto; background: var(--card); color: #1d2f36; border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  #ui h1 { font-size: 16px; margin: 0 0 4px; }
  #ui p { margin: 4px 0; font-size: 12.5px; color: #4d6369; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  button { border: 1px solid #c9d8d7; background: #fff; border-radius: 8px; padding: 4px 9px; cursor: pointer; font: inherit; font-size: 12.5px; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #stat { font-size: 12px; color: var(--accent); }
  code { font-size: 11.5px; background: #eef4f3; padding: 0 4px; border-radius: 4px; }
  nav a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 10px; font-size: 12.5px; }
  @media (max-width: 600px) { #ui { left: 8px; right: 8px; width: auto; max-height: 45vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <nav><a href="index.html">← 首页</a><a href="pipeline.html">管线</a><a href="planet.html">球面</a></nav>
  <h1>网格实验室</h1>
  <div class="row" id="tabs">
    <button data-t="kinds" class="on">三角 / 方格 / 混合</button>
    <button data-t="infinite">无限网格</button>
    <button data-t="lines">直线 + 环</button>
    <button data-t="bary">重心坐标</button>
    <button data-t="atlas">图集打包</button>
  </div>
  <div class="row" id="sub"></div>
  <p id="note"></p>
  <div id="stat"></div>
</div>
<script type="module">
import { buildMixedGrid, buildQuadGrid, buildSquareGrid, traceStraightReport } from './src/core/grid.js';
import { buildInfinite, verify } from './src/core/infinite.js';
import { baryPrep } from './src/core/spatial.js';
import { Atlas } from './src/core/atlas.js';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize() { DPR = Math.min(2, devicePixelRatio); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; draw(); }
addEventListener('resize', () => resize());

const NOTES = {
  kinds: '1670790425232175108 "my generator also output pure triangle/hex and square grids, to illustrate why I\'m going for my mixed approach"：本轮610帧全核验：纯方格现用真正正交方格；旧合并率1仍有残留三角，改名“合并菱形”。纯三角/混合继续用原生成器，六边仅对偶诊断，尚非独立六边形World/原模块生成。1447496205282549761：底图就是一张不规则三角网。1471817524148940807 "Square, yet hex"。959752525867036672 / 1151770831619534848：对偶图（顶点格）——每个内部顶点周围的格子中心连成一圈。',
  infinite: '1332410042784641026：网格由块（Patch）组成，相邻三块组成簇（Cluster），块和簇各自松弛；每个顶点 = 它在所在块和最近两个簇里的三个版本按重心坐标插值。1151137783785771008 / 1151770831619534848：无限、确定、无缝。1302686201401442309：每组松弛外圈钉住，不会翻折。',
  lines: '1384958097542819845：每到四边格从对边出去；按“格子＋出边”状态识别闭环，区分边界/三角格/预算。画出真实入边到对边段；闭环不等于通过飞岛支撑规则。点击格子试验。',
  atlas: '1764958522398146667 "A cute binary tree rect packer … using the tree properly for fast collision checks"；1765115069837221962：递归解析树的过程，板子越碎"手指"越多；1765041830461055127：也能删除矩形，用久了会碎，但仍然紧。本地保留first-fit，并可切换候选+跨叶放置；青线显示真实搜索，黄框是命中、橙框是尺寸拒绝，可暂停逐步查看。删除只合并空兄弟，跨切线空区仍可能放不下；最大空闲占比只是叶面积指标，不是最优装填证明。候选是边角+有界随机尝试，不保证最优。原3D树和完整兼容接口仍待补。',
  bary: '974579499802202113：预先算好三角形里的两个向量，重心坐标只要 1 次减法 + 1 次点积。974564862729838592：讲课用的小工具。移动鼠标。',
};
let tab = 'kinds', sub = 'mixed', showDual = false, infMode = 'blend', picked = null, mouse = null;
const cache = {};
const grids = {
  tri: () => buildMixedGrid({ radius: 9, hexSize: 1, mergeRate: 0, seed: 5 }),
  square: () => buildSquareGrid({ radius: 9, cellSize: 1 }),
  rhombi: () => buildMixedGrid({ radius: 9, hexSize: 1, mergeRate: 1, seed: 5 }),
  mixed: () => buildMixedGrid({ radius: 9, hexSize: 1, mergeRate: 0.55, seed: 5 }),
  townscaper: () => buildQuadGrid({ radius: 6, hexSize: 1.4, seed: 7 }),
};
const get = (k) => cache[k] || (cache[k] = grids[k]());
let inf = null, infStats = null;

function setTab(t) {
  tab = t; picked = null;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  const s = document.getElementById('sub');
  s.innerHTML = '';
  const add = (label, on, fn) => { const b = document.createElement('button'); b.textContent = label; b.classList.toggle('on', on); b.onclick = () => { fn(); setTab(tab); }; s.appendChild(b); };
  if (t === 'kinds') { for (const [k, l] of [['tri', '纯三角'], ['square', '纯方格'], ['rhombi', '合并菱形（含三角）'], ['mixed', '混合']]) add(l, sub === k, () => (sub = k)); add('对偶图', showDual, () => (showDual = !showDual)); }
  if (t === 'infinite') {
    if (!inf) { const t0 = performance.now(); inf = buildInfinite({ N: 4, L: 1, rings: 2 }); infStats = { ms: performance.now() - t0 }; }
    for (const [k, l] of [['raw', '未松弛'], ['patch', '只按块'], ['cluster', '只按簇'], ['blend', '块 + 两簇插值']]) add(l, infMode === k, () => (infMode = k));
  }
  if (t === 'lines' || t === 'bary') sub = t === 'lines' ? 'townscaper' : 'mixed';
  if (t === 'atlas') {
    add(atlasState.running ? '暂停' : '自动增删', atlasState.running, () => { atlasState.running = !atlasState.running; });
    add(atlasState.candidates ? '候选 + 跨叶' : '单叶 first-fit', atlasState.candidates, () => {atlasState.candidates=!atlasState.candidates});
    add('添加一块', false, () => atlasStep('add'));
    add('删除一块', false, () => atlasStep('remove'));
    add('重置种子7', false, resetAtlas);
    const label=document.createElement('label'); label.textContent='搜索步骤 ';
    const slider=document.createElement('input');slider.id='atlas-trace';slider.type='range';slider.min=0;slider.max=atlasState.atlas.lastTrace.length;slider.value=atlasState.traceStep;slider.setAttribute('aria-label','实际搜索步骤');
    slider.oninput=()=>{atlasState.running=false;stopAtlas();atlasState.traceStep=+slider.value;draw()};label.append(slider);s.append(label);
    if(atlasState.running) startAtlas(); else stopAtlas();
  } else stopAtlas();
  document.getElementById('note').textContent = NOTES[t];
  draw();
}
document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => setTab(b.dataset.t)));

function view(bounds) {
  const [x0, z0, x1, z1] = bounds;
  const s = Math.min((W - 40) / (x1 - x0), (H - 40) / (z1 - z0)) * 0.92;
  const ox = W / 2 + (innerWidth > 800 ? 190 : 0) - (x0 + x1) / 2 * s, oz = H / 2 - (z0 + z1) / 2 * s;
  return { s, P: (x, z) => [ox + x * s, oz + z * s], inv: (px, py) => [(px - ox) / s, (py - oz) / s] };
}
function boundsOf(pts) { let a = [1e9, 1e9, -1e9, -1e9]; for (const [x, z] of pts) { a[0] = Math.min(a[0], x); a[1] = Math.min(a[1], z); a[2] = Math.max(a[2], x); a[3] = Math.max(a[3], z); } return a; }
let V = null;

function poly(pts, fill, stroke, lw = 1) {
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function drawGrid(g, hl = new Map()) {
  V = view(boundsOf(g.verts.map((v) => [v.x, v.z])));
  for (const c of g.cells) {
    const fill = hl.get(c.id) || (c.n === 3 ? '#e9d9b0' : '#cfe2d6');
    poly(c.pts.map((p) => V.P(p.x, p.z)), fill, '#2a3238', 1.2);
  }
  if (showDual && tab === 'kinds') {
    ctx.strokeStyle = 'rgba(214,80,60,.85)'; ctx.lineWidth = 1.2;
    for (const [vid, ids] of g.vertexCells) {
      const v = g.verts[vid];
      if (v.pinned || ids.length < 3) continue;
      const cs = ids.map((i) => g.cells[i]).sort((a, b) => Math.atan2(a.cz - v.z, a.cx - v.x) - Math.atan2(b.cz - v.z, b.cx - v.x));
      poly(cs.map((c) => V.P(c.cx, c.cz)), null, 'rgba(214,80,60,.85)', 1.2);
    }
  }
  return V;
}

function draw() {
  if (!W) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#2a3238'; ctx.fillRect(0, 0, W, H);
  const st = document.getElementById('stat');
  if (tab === 'kinds') {
    const g = get(sub);
    drawGrid(g);
    const n3 = g.cells.filter((c) => c.n === 3).length;
    st.textContent = `${g.cells.length} 格：三角 ${n3}，方格 ${g.cells.length - n3}`;
  } else if (tab === 'infinite') {
    const at = inf.versions[infMode];
    V = view(boundsOf(inf.verts.map((v) => [v.x0, v.z0])));
    const pal = ['#cfe2d6', '#e3d7b8', '#d6d3e8', '#e6cfcf', '#cde0e6', '#e0e3c6', '#d9cce0'];
    for (const P of inf.patches) for (const qd of P.quads) poly(qd.map((v) => V.P(...at(v))), pal[(P.q * 7 + P.r * 3 + 1000) % pal.length], '#2a3238', 0.9);
    // 块边界：只属于一块的边且两端都在边界上
    ctx.strokeStyle = '#d6503c'; ctx.lineWidth = 2;
    for (const qd of inf.quads) for (let i = 0; i < 4; i++) {
      const a = qd[i], b = qd[(i + 1) % 4];
      if (a.patches.length > 1 && b.patches.length > 1) { ctx.beginPath(); ctx.moveTo(...V.P(...at(a))); ctx.lineTo(...V.P(...at(b))); ctx.stroke(); }
    }
    // 簇：块中心三角形
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.2;
    for (const C of inf.clusters) poly(C.patches.map((i) => V.P(...inf.patches[i].center)), null, 'rgba(255,255,255,.6)', 1.2);
    ctx.setLineDash([]);
    const vr = verify(inf, infMode);
    st.textContent = `${inf.patches.length} 块 · ${inf.clusters.length} 簇 · ${vr.quads} 格 · 翻折 ${vr.flipped} · 块边界点 ${vr.border} 个，两侧算出的位置最大差 ${vr.seam.toExponential(1)} · ${infStats.ms.toFixed(0)} ms`;
  } else if (tab === 'lines') {
    const g = get('townscaper');
    const hl = new Map();
    let msg = '点一个格子';
    if (picked) {
      hl.set(picked.id, '#2f7f8a');
      const traces = [];
      for (let i = 0; i < picked.n; i++) traces.push(traceStraightReport(g, picked, i));
      const lines=traces.map(t=>t.cells);
      window.topolineReview={grid:g,picked,traces};
      const colors = ['#f2c14e', '#e98fa6', '#8fc1e3', '#b6e38f'];
      lines.forEach((L, i) => L.forEach((c) => hl.set(c.id, c === picked ? '#ffffff' : colors[i % 4])));
      const loop = traces.some(t=>t.closed);
      msg = `4 个方向：${traces.map(t=>t.cells.length+'('+t.reason+')').join(' / ')} 格${loop ? ' · 绕回起点了：完美环！' : ''}`;
    }
    drawGrid(g, hl);
    if(picked&&window.topolineReview){const colors=['#cc9b21','#c55b7c','#438aaf','#75a34f'];window.topolineReview.traces.forEach((t,i)=>{ctx.strokeStyle=colors[i%4];ctx.lineWidth=2;ctx.beginPath();for(const s of t.segments){const a=V.P(...s.a),b=V.P(...s.b);ctx.moveTo(...a);ctx.lineTo(...b);}ctx.stroke();});}
    st.textContent = msg;
  } else if (tab === 'atlas') {
    const A=atlasState.atlas;
    const R=A.report();
    st.textContent=`${atlasState.live.length} 块 · 占用 ${(R.fill*100).toFixed(1)}% · 空闲叶 ${R.freeLeaves}/${R.leaves} · 最大空闲占比 ${(R.largestShare*100).toFixed(1)}% · 本次访问 ${A.lastSearch.visited} 节点 · 失败 ${atlasState.fail}`;
    const wide=W>800, top=wide?30:document.getElementById('ui').getBoundingClientRect().bottom+16;
    const S=Math.max(1,Math.min(W-(wide?460:40),H-top-20)),ox=wide?440:(W-S)/2,oy=top+(H-top-20-S)/2,k=S/A.width;
    ctx.fillStyle='#1f262b';ctx.fillRect(ox,oy,S,S);
    const stack=[A.root];
    while(stack.length) {
      const n=stack.pop();
      if(n.a) {ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.strokeRect(ox+n.x*k,oy+n.y*k,n.w*k,n.h*k);stack.push(n.b,n.a);}
      else if(n.used) {ctx.fillStyle=`hsl(${(n.x*7+n.y*13)%360},55%,62%)`;ctx.fillRect(ox+n.x*k+1,oy+n.y*k+1,Math.max(1,n.w*k-2),Math.max(1,n.h*k-2));}
    }
    const trace=A.lastTrace;
    if(A.lastSearch.x!==undefined){const q=A.lastSearch;ctx.strokeStyle=q.found?'#fff38b':'#fa9470';ctx.lineWidth=3;ctx.strokeRect(ox+q.x*k,oy+q.y*k,q.w*k,q.h*k);}
    for(let i=0;i<Math.min(trace.length,atlasState.traceStep);i++) {
      const n=trace[i],parent=trace[n.parent];ctx.strokeStyle=n.decision==='fit'?'#fff38b':n.decision==='size'?'#ee9d70':'#52ebdf';ctx.lineWidth=1.5;
      if(parent){ctx.beginPath();ctx.moveTo(ox+(parent.x+parent.w/2)*k,oy+(parent.y+parent.h/2)*k);ctx.lineTo(ox+(n.x+n.w/2)*k,oy+(n.y+n.h/2)*k);ctx.stroke();}
      ctx.strokeRect(ox+n.x*k,oy+n.y*k,n.w*k,n.h*k);
    }
    const slider=document.getElementById('atlas-trace');if(slider){slider.max=trace.length;slider.value=atlasState.traceStep;}
    cv.dataset.atlasBounds=JSON.stringify({x:ox,y:oy,size:S});
  } else if (tab === 'bary') {
    const g = get('mixed');
    drawGrid(g);
    if (mouse) {
      const [x, z] = V.inv(mouse[0], mouse[1]);
      for (const c of g.cells) {
        if (c.n !== 3) continue;
        const B = baryPrep(c.pts[0], c.pts[1], c.pts[2]);
        const w = B(x, z);
        if (w.every((k) => k >= 0)) {
          const P = c.pts.map((p) => V.P(p.x, p.z));
          poly(P, 'rgba(47,127,138,.35)', '#2f7f8a', 2);
          const cols = ['#d6503c', '#3c9a5b', '#3c6fd6'];
          P.forEach(([px, py], i) => { ctx.strokeStyle = cols[i]; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(...mouse); ctx.stroke(); ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.arc(px, py, 4 + 10 * w[i], 0, 7); ctx.fill(); });
          st.textContent = `重心坐标 = (${w.map((k) => k.toFixed(2)).join(', ')})，和 = ${(w[0] + w[1] + w[2]).toFixed(3)}`;
          break;
        }
        st.textContent = '移到一个三角格上';
      }
    }
  }
}
cv.addEventListener('pointermove', (e) => { mouse = [e.clientX, e.clientY]; if (tab === 'bary') draw(); });
cv.addEventListener('click', (e) => {
  if (tab !== 'lines' || !V) return;
  const [x, z] = V.inv(e.clientX, e.clientY);
  const g = get('townscaper');
  let best = null, bd = 1e9;
  for (const c of g.cells) { const d = Math.hypot(c.cx - x, c.cz - z); if (d < bd) { bd = d; best = c; } }
  picked = best; draw();
});
const atlasState={atlas:new Atlas(512,512),live:[],fail:0,timer:null,running:true,seed:7,traceStep:0,candidates:false,nextKey:0};
function atlasRandom(){atlasState.seed=(Math.imul(atlasState.seed,1664525)+1013904223)>>>0;return atlasState.seed/4294967296;}
function resetAtlas(){atlasState.atlas=new Atlas(512,512);atlasState.live=[];atlasState.fail=0;atlasState.seed=7;atlasState.traceStep=0;atlasState.nextKey=0;}
function atlasStep(action) {
  const S=atlasState;
  if(action==='remove'&&S.live.length) {const i=Math.floor(atlasRandom()*S.live.length);S.atlas.free(S.live[i]);S.live.splice(i,1);}
  else if(action==='add') {const w=16*(1+Math.floor(atlasRandom()*atlasRandom()*6)),h=16*(1+Math.floor(atlasRandom()*atlasRandom()*6)),r=S.candidates?S.atlas.place('demo-'+S.nextKey++,w,h,{rng:atlasRandom,attempts:32,trace:true}):S.atlas.allocate(w,h,{trace:true});if(r)S.live.push(r);else S.fail++;}
  S.traceStep=S.atlas.lastTrace.length;if(tab==='atlas')draw();
}
function startAtlas(){if(atlasState.timer)return;atlasState.timer=setInterval(()=>{const S=atlasState;atlasStep(S.live.length>60||(S.live.length>20&&atlasRandom()<.35)?'remove':'add')},240);}
function stopAtlas(){clearInterval(atlasState.timer);atlasState.timer=null;}
addEventListener('pagehide',stopAtlas);
resize(); setTab(new URLSearchParams(location.search).get('t') || 'kinds');
window.gridLab = { selectLineCell(id){if(tab!=='lines')setTab('lines');const g=get('townscaper');picked=g.cells.find(c=>c.id===id);draw();}, setTab, atlasStep, resetAtlas, pauseAtlas(){atlasState.running=false;stopAtlas();if(tab==='atlas')setTab('atlas')}, get selectedGrid(){return tab==='kinds'?get(sub):null}, get gridKind(){return sub}, get atlas(){return atlasState.atlas}, get atlasLive(){return atlasState.live.slice()} };
</script>
</body>
</html>
