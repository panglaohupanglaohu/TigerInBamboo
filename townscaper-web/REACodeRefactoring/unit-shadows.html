<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 单位软影</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 190px)}button,label{margin-right:12px}small{display:block;margin-top:4px;color:#4a6470}code{background:#dce8e6;padding:0 4px}</style><header><b>单位软影 · 实际北境战斗</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/unit-shadow-review.md">逐帧证据</a><p><label><input type="checkbox" id="enabled" checked>贴地软盘</label><label><input type="checkbox" id="fit">坡面贴合（shadowFit）</label><label><input type="checkbox" id="arc">挥砍弧形拖影（swingArc）</label><button id="quad">四边网格</button><button id="mixed">混合网格</button><span id="stat"></span><br><span id="stat2"></span></p><small>接触地板取真实单位导航楼层，软盘裁剪在「本格 + 共顶点同层格」内（跨格连续），楼梯上沿坡向拉长（面积守恒），离地按主光方向偏移 <code>0.36·h</code>；<code>shadowFit</code> 用射线采样渲染网格拟合平面，贴形变斜面 / 崖边。原片是 25 帧 Unity 网格动画演示（脚下软盘 + 竖直月牙扫掠面），本仓用刚体单位姿态 + 程序化月牙带对应，不追逐帧的原画肌理。</small></header><iframe id="scene" src="index.html?scene=badnorth&grid=quad"></iframe><script type="module">
import { measure, LIGHT_DIR } from './src/core/unit-shadow.js';
const f=document.querySelector('#scene'),on=document.querySelector('#enabled'),fit=document.querySelector('#fit'),arc=document.querySelector('#arc'),stat=document.querySelector('#stat'),stat2=document.querySelector('#stat2');
const state={grid:'quad',fit:false,arc:false};
function url(){return `index.html?scene=badnorth&grid=${state.grid}`+(state.fit?'&shadowFit=1':'')+(state.arc?'&c02=swingArc':'');}
function load(){window.unitShadowReview=null;f.src=url();}
function sync(){const r=f.contentWindow.rea;if(!r?.battle?.running)return;const b=r.battle,s=b.unitShadows;s.enabled=on.checked;if(!s.enabled)s.clear();else s.update(b.world,b.units,b.navigation,b.L);
 stat.textContent=`实际软影 ${s.count} / 单位 ${b.units.length} · ${s.geometry.drawRange.count}顶点`;
 const st=s.stats??{},m=measure();
 stat2.textContent=`pieces ${st.pieces??0} · 跨格 ${st.multiCell??0} · 楼梯 ${st.onStairs??0} · 拟合 ${st.fitted??0} ｜ measure: h.5 半径 ${m.rows[2].r.toFixed(4)} 浓度 ${m.rows[2].alpha.toFixed(3)} 偏移 ${m.rows[2].off.toFixed(4)} · 26° 拉长 ${m.stretch.toFixed(4)} 压短 ${m.squash.toFixed(4)} 面积比 ${m.areaRatio.toFixed(5)}`;
 window.unitShadowReview={rea:r,batch:s,stats:st,measure:m,light:LIGHT_DIR,arcStats:()=>b.c02?.stats??null};}
on.onchange=sync;fit.onchange=()=>{state.fit=fit.checked;load();};arc.onchange=()=>{state.arc=arc.checked;load();};
for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{state.grid=kind;load();};
const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
