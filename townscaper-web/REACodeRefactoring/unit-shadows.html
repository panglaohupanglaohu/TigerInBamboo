<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 单位软影</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 145px)}button,label{margin-right:12px}</style><header><b>单位软影 · 实际北境战斗</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/unit-shadow-review.md">逐帧证据</a><p><label><input type="checkbox" id="enabled" checked>贴地软盘</label><button id="quad">四边网格</button><button id="mixed">混合网格</button><span id="stat"></span></p><small>接触地板取真实单位导航楼层，软盘裁剪在所属凸格内。高度淡出为本地策略；坡面、跨格连续阴影和原角色动画仍未覆盖。</small></header><iframe id="scene" src="index.html?scene=badnorth&grid=quad"></iframe><script>
const f=document.querySelector('#scene'),on=document.querySelector('#enabled');
function sync(){const r=f.contentWindow.rea;if(!r?.battle?.running)return;const b=r.battle;b.unitShadows.enabled=on.checked;b.unitShadows.update(b.world,b.units,b.navigation,b.L);document.querySelector('#stat').textContent=`实际软影 ${b.unitShadows.count} / 单位 ${b.units.length} · ${b.unitShadows.geometry.drawRange.count}顶点`;window.unitShadowReview={rea:r,batch:b.unitShadows};}
on.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.unitShadowReview=null;f.src='index.html?scene=badnorth&grid='+kind;};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
