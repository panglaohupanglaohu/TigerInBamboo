<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>岸浪周期 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:76vh;border:0}a{color:#26758a}button,input,select{margin:0 8px}#status{font-variant-numeric:tabular-nums}</style><header><b>独立岸浪周期 · 实际共享World</b> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/wave-cycle-review.md">学习与验收记录</a><p>1849730611964973481：重叠浪各走自己的周期。1991101097818403263：生成时烘入方向、出方向和时间偏移。本页复用主场景岸浪，提供时间与线框对照。1991103578011029507/1991099314714902634展示克制外海与分段白浪；新增沿岸分段浪峰，可关掉对照。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边形</option></select></label><label>基础周期（秒）<input id="period" type="number" min="0.2" max="30" step="0.1" value="4.6"></label><button id="play">暂停</button><label>时间<input id="time" type="range" min="0" max="30" step="0.01" value="0"></label><label><input id="wire" type="checkbox">浪带线框</label><label><input id="breakup" type="checkbox" checked>分段浪峰</label><span id="status">加载实际场景…</span><p>退浪采用局部几何反射近似；不是流体模拟。全局岩石泡沫遮罩、窄湾浪带交叠与全路径防穿岸仍待补。</p></header><iframe id="scene" title="共享World岸浪场景"></iframe><script type="module">
const $=s=>document.querySelector(s);let api,time=0,playing=true,previous=performance.now();
function load(){api=null;window.waveReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}
$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.waves?.geometry?.attributes.aPeriod?.count){setTimeout(ready,100);return}api=r;api.view.waveMaterial.uniforms.uTime={value:time};api.view.setDebug('wavewire',$('#wire').checked);api.view.waveMaterial.uniforms.uCrestBreakup.value=$('#breakup').checked?1:0;window.waveReview={api};};ready()};
$('#breakup').onchange=()=>{if(api)api.view.waveMaterial.uniforms.uCrestBreakup.value=$('#breakup').checked?1:0};$('#grid').onchange=load;$('#wire').onchange=()=>api?.view.setDebug('wavewire',$('#wire').checked);$('#time').oninput=()=>{time=Number($('#time').value);playing=false;$('#play').textContent='播放'};$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'暂停':'播放'};
function frame(now){const dt=Math.max(0,Math.min(.1,(now-previous)/1000));previous=now;if(api){const period=Number($('#period').value);if(Number.isFinite(period)&&period>=.2&&period<=30)api.view.waveMaterial.uniforms.uPeriod.value=period;if(playing)time+=dt;$('#time').max=Math.max(30,Math.ceil(time));api.view.waveMaterial.uniforms.uTime.value=time;$('#time').value=time;$('#status').textContent=`${time.toFixed(2)}秒 · ${new Set(api.view.waves.geometry.attributes.aPeriod.array).size}组错开周期 · World ${api.world.version}`;}requestAnimationFrame(frame)}load();requestAnimationFrame(frame);
</script></html>
