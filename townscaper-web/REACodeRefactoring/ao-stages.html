<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 分层遮蔽与反弹对照</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 155px)}button,label{margin-right:12px}</style><header><b>分层遮蔽 / 彩色反弹 · 共享建筑实际对照</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/ao-stages-review.md">逐帧证据</a><p><label>烘焙<select id="stage"><option value="original">原有遮蔽＋反弹</option><option value="raw">关闭本地顶点烘焙</option><option value="ao">仅本地分层遮蔽</option><option value="bounce">仅本地彩色反弹</option><option value="flat">原片① flat</option><option value="up">原片② up normal</option><option value="voxel">原片③ vertex voxel AO</option><option value="ssao">原片④ + SSAO（屏幕空间）</option><option value="directional">原片⑤ directional AO</option><option value="sun">逐顶点体素太阳阴影</option></select></label><label><input id="white" type="checkbox">白模（只看光照）</label><button id="quad">四边网格</button><button id="mixed">混合网格</button></p><small>793557992931266561 五阶段 flat → up normal → vertex voxel AO → SSAO → directional AO：①②③⑤ 是 WorldMesh.setBakeLighting 的 aoMode；④ 是第 56 批 C04 的屏幕空间 AO（world/view-c04.js，深度重建 + 半球 16 采样，叠在体素 AO 之上）。复用既有World和分层烘焙；SSAO 常数是本地选择。URL <code>?stage=ssao&amp;white=1</code> 可直接定格。</small></header><iframe id="scene"></iframe><script>
const q=new URLSearchParams(location.search),f=document.querySelector('#scene'),stage=document.querySelector('#stage'),white=document.querySelector('#white');
if(q.get('stage'))stage.value=q.get('stage');white.checked=q.get('white')==='1';
const src=(kind)=>'index.html?scene=town&c04=&grid='+kind;f.src=src(q.get('grid')==='mixed'?'mixed':'quad');
function sync(){const r=f.contentWindow.rea;if(!r?.view?.worldMesh)return;const options={original:{},raw:{enabled:false},ao:{bounce:0},bounce:{strength:0},flat:{aoMode:'flat'},up:{aoMode:'up'},voxel:{aoMode:'vertex',bounce:0},ssao:{aoMode:'vertex',bounce:0},directional:{aoMode:'directional'},sun:{sunShadow:{dir:r.view.sunDir.toArray()}}}[stage.value];r.view.worldMesh.setBakeLighting(options);
 if(r.view.lightOnlyOn!==undefined||true){if(!!r.view._aoWhite!==white.checked){r.view.setDebug('lightonly',white.checked);r.view._aoWhite=white.checked;}}
 r.view.c04?.set('ssao',stage.value==='ssao');window.aoStageReview=r;}
stage.onchange=sync;white.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.aoStageReview=null;f.src=src(kind);};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
