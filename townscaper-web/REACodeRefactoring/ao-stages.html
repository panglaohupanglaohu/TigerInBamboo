<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 分层遮蔽与反弹对照</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 155px)}button,label{margin-right:12px}</style><header><b>分层遮蔽 / 彩色反弹 · 共享建筑实际对照</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/ao-stages-review.md">逐帧证据</a><p><label>烘焙<select id="stage"><option value="original">原有遮蔽＋反弹</option><option value="raw">关闭本地顶点烘焙</option><option value="ao">仅本地分层遮蔽</option><option value="bounce">仅本地彩色反弹</option></select></label><button id="quad">四边网格</button><button id="mixed">混合网格</button></p><small>复用既有World和分层烘焙；不是原片五阶段复现。关闭烘焙仍有实时场景光照/阴影；未实现原SSAO或方向AO等价比较。</small></header><iframe id="scene" src="index.html?scene=town&grid=quad"></iframe><script>
const f=document.querySelector('#scene'),stage=document.querySelector('#stage');function sync(){const r=f.contentWindow.rea;if(!r?.view?.worldMesh)return;const options={original:{},raw:{enabled:false},ao:{bounce:0},bounce:{strength:0}}[stage.value];r.view.worldMesh.setBakeLighting(options);window.aoStageReview=r;}
stage.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.aoStageReview=null;f.src='index.html?scene=town&grid='+kind;};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
