<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 分层遮蔽与反弹对照</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 155px)}button,label{margin-right:12px}</style><header><b>分层遮蔽 / 彩色反弹 · 共享建筑实际对照</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/ao-stages-review.md">逐帧证据</a><p><label>烘焙<select id="stage"><option value="original">原有遮蔽＋反弹</option><option value="raw">关闭本地顶点烘焙</option><option value="ao">仅本地分层遮蔽</option><option value="bounce">仅本地彩色反弹</option><option value="flat">原片① flat</option><option value="up">原片② up normal</option><option value="voxel">原片③ vertex voxel AO</option><option value="ssao">原片④ + SSAO（屏幕空间）</option><option value="directional">原片⑤ directional AO</option><option value="sun">逐顶点体素太阳阴影</option></select></label><label><input id="white" type="checkbox">白模（只看光照）</label><label><input id="baked" type="checkbox">只看烘焙（无光照，原片五阶梯口径）</label><button id="quad">四边网格</button><button id="mixed">混合网格</button></p><small>793557992931266561 五阶段 flat → up normal → vertex voxel AO → SSAO → directional AO：①②③⑤ 是 WorldMesh.setBakeLighting 的 aoMode；④ 是第 56 批 C04 的屏幕空间 AO（world/view-c04.js，深度重建 + 半球 16 采样，叠在体素 AO 之上）。复用既有World和分层烘焙；SSAO 常数是本地选择。URL <code>?stage=ssao&amp;white=1</code> 可直接定格。</small></header><iframe id="scene"></iframe><script>
const q=new URLSearchParams(location.search),f=document.querySelector('#scene'),stage=document.querySelector('#stage'),white=document.querySelector('#white'),baked=document.querySelector('#baked');
if(q.get('stage'))stage.value=q.get('stage');white.checked=q.get('white')==='1';baked.checked=q.get('baked')==='1';
const src=(kind)=>'index.html?scene=town&c04=&grid='+kind;f.src=src(q.get('grid')==='mixed'?'mixed':'quad');
function sync(){const r=f.contentWindow.rea;if(!r?.view?.worldMesh)return;const options={original:{},raw:{enabled:false},ao:{bounce:0},bounce:{strength:0},flat:{aoMode:'flat'},up:{aoMode:'up'},voxel:{aoMode:'vertex',bounce:0},ssao:{aoMode:'vertex',bounce:0},directional:{aoMode:'directional'},sun:{sunShadow:{dir:r.view.sunDir.toArray()}}}[stage.value];r.view.worldMesh.setBakeLighting(options);
 if(r.view.lightOnlyOn!==undefined||true){if(!!r.view._aoWhite!==white.checked){r.view.setDebug('lightonly',white.checked);r.view._aoWhite=white.checked;}}
 r.view.setDebug('bakedonly',baked.checked);
 r.view.c04?.set('ssao',stage.value==='ssao');window.aoStageReview=r;}
// 只读探针：给运行验收读「这一档烘成什么、画的是哪份几何」
window.aoStageReport=()=>{const r=window.aoStageReview;if(!r?.view?.worldMesh)return null;const v=r.view,g=v.mesh.geometry,c=g.attributes.color?.array||[];
 let h=0,mn=9,mx=-9;for(let i=0;i<c.length;i+=97){h=(h*31+Math.round(c[i]*1000))|0;if(c[i]<mn)mn=c[i];if(c[i]>mx)mx=c[i];}
 return{stage:stage.value,baked:!!v.bakedOnlyOn,material:v.mesh.material.type,aoMode:v.worldMesh.bakeLightingOptions?.aoMode??null,
  colorHash:h,colorRange:[+mn.toFixed(3),+mx.toFixed(3)],geoAttached:g===v.worldMesh.geometry,rebuilding:v.worldMesh.builtVersion!==r.world.version,
  ssao:!!v.c04?.state?.ssao,triangles:v.worldMesh.stats.triangles};};
// 只读探针：按**法线主轴**分组读顶点色的冷暖（R−B）——第⑤档「整面墙按朝向分冷暖」的直读口径，
// 与片内同一条读数（左半 R−B − 右半 R−B）。轴序 +X/−X/+Y/−Y/+Z/−Z，值与 AX 一致。
window.aoTintAxisReport=()=>{const r=window.aoStageReview;if(!r?.view?.worldMesh)return null;const g=r.view.mesh.geometry,p=g.attributes.position?.array,c=g.attributes.color?.array;
 if(!p||!c)return null;const N=['+X','-X','+Y','-Y','+Z','-Z'],acc=N.map(()=>({n:0,tr:0,tg:0,tb:0,trb:0}));
 for(let t=0;t<p.length;t+=9){const ax=p[t],ay=p[t+1],az=p[t+2],ux=p[t+3]-ax,uy=p[t+4]-ay,uz=p[t+5]-az,vx=p[t+6]-ax,vy=p[t+7]-ay,vz=p[t+8]-az;
  let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
  const a=[nx,ny,nz];let best=0,bi=0;for(let k=0;k<6;k++){const s=(k%2?-1:1)*a[(k/2)|0];if(s>best){best=s;bi=k;}}
  for(let v=0;v<3;v++){const o=t+v*3;const R=Math.round(c[o]*255),G=Math.round(c[o+1]*255),B=Math.round(c[o+2]*255);
   const e=acc[bi];e.n++;e.tr+=R;e.tg+=G;e.tb+=B;e.trb+=R-B;}}
 return{axes:Object.fromEntries(N.map((n,i)=>[n,acc[i].n?{n:acc[i].n,r:+(acc[i].tr/acc[i].n).toFixed(1),g:+(acc[i].tg/acc[i].n).toFixed(1),b:+(acc[i].tb/acc[i].n).toFixed(1),rb:+(acc[i].trb/acc[i].n).toFixed(2)}:null])),
  gapPlusMinusX:(acc[1].n&&acc[0].n)?+((acc[1].trb/acc[1].n)-(acc[0].trb/acc[0].n)).toFixed(2):null,
  gapPlusMinusZ:(acc[5].n&&acc[4].n)?+((acc[5].trb/acc[5].n)-(acc[4].trb/acc[4].n)).toFixed(2):null};};
stage.onchange=sync;white.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.aoStageReview=null;f.src=src(kind);};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
