<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 色彩范围与对比场</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:12px}label{margin-right:12px}main{display:flex}iframe{width:70%;height:78vh;border:0}aside{width:30%;padding:12px;box-sizing:border-box}canvas{width:100%;background:#fff}input{width:70px}p{margin:8px 0}</style><header><a href="pipeline.html">← 管线</a> · <b>HSL色彩范围 / 三角约束诊断</b><p>左：真实World顶面取色。右：同一网格的三角邻接，按地面层高定义对比边；未接原作纹理atlas，不声称原作配色或收敛保证。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>H起 <input id="h0" type="number" min="0" max="1" step=".02" value=".18"></label><label>H止 <input id="h1" type="number" min="0" max="1" step=".02" value=".35"></label><label>启用 <input id="enabled" type="checkbox" checked></label><button id="solve">求解对比场</button><span id="status"></span></header><main><iframe id="scene" title="实际HSL顶面"></iframe><aside><b>三角邻接诊断</b><canvas id="graph" width="600" height="600"></canvas><p id="metrics"></p></aside></main><script type="module">
import{solveContrastField}from'./src/core/contrast-field.js';const $=s=>document.querySelector(s);let api;function apply(){if(!api)return;try{api.view.setGroundColorVolume($('#enabled').checked?{h:[+$('#h0').value,+$('#h1').value],s:[.2,.5],l:[.35,.65]}:null);$('#status').textContent='World '+api.world.version+' · 仅着色参数'}catch(e){$('#status').textContent=e.message}}
function solve(){const cells=api.world.cells,triangles=[],edges=[],outer=new Map();for(const c of cells){const first=triangles.length;for(let i=0;i<c.n;i++){const a=c.pts[i],b=c.pts[(i+1)%c.n],id=triangles.length;triangles.push({pts:[[c.cx,c.cz],[a.x,a.z],[b.x,b.z]],level:api.world.ground(c)});const key=[a.id,b.id].sort((a,b)=>a-b).join(':');if(outer.has(key)){const j=outer.get(key);edges.push({i:id,j,contrast:triangles[j].level!==triangles[id].level})}else outer.set(key,id)}for(let i=0;i<c.n;i++)edges.push({i:first+i,j:first+(i+1)%c.n,contrast:false})}const result=solveContrastField(triangles.length,edges,{iterations:180});const ctx=$('#graph').getContext('2d'),all=triangles.flatMap(t=>t.pts),minX=Math.min(...all.map(p=>p[0])),minZ=Math.min(...all.map(p=>p[1])),span=Math.max(...all.map(p=>p[0]))-minX,scale=570/span;ctx.clearRect(0,0,600,600);triangles.forEach((t,i)=>{ctx.beginPath();t.pts.forEach(([x,z],j)=>ctx[j?'lineTo':'moveTo'](15+(x-minX)*scale,15+(z-minZ)*scale));ctx.closePath();const v=Math.round(result.values[i]*255);ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.fill()});$('#metrics').textContent=`${triangles.length} 三角 / ${edges.length} 边，同类均差 ${result.before.sameMean.toFixed(3)} → ${result.after.sameMean.toFixed(3)}，未满足对比边 ${result.after.violations}（如实保留）`;window.colorLab.result=result;}
function load(){api=null;window.colorLab=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.colorLab={api,apply,solve};apply();solve()};ready()};$('#grid').onchange=load;for(const id of['h0','h1','enabled'])$('#'+id).oninput=apply;$('#solve').onclick=solve;load();
</script></html>
