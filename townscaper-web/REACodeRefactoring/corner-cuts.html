<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 切角轮廓</title><style>body{font:16px system-ui;background:#edf4f3;color:#20343c}canvas{background:#304951;max-width:100%}label{margin:12px}</style><a href="pipeline.html" target="_top">管线</a> · <a href="index.html" target="_top">首页</a> · <a href="artifacts/coverage/corner-cuts-review.md">逐帧证据</a><h3>共享方格 · 可选切角绘制轮廓</h3><p>复用Workbuddy切角策略，数据仍是共享方格。原片不证明切角算法；轮廓空隙不用于地形、导航或碰撞。</p><label>深度<input id="cut" type="range" min="0" max="0.5" step="0.05" value="0.25"></label><label><input id="all" type="checkbox">切四角</label><label><input id="flip" type="checkbox">交替对角</label><output id="stats"></output><p><canvas id="view" width="900" height="650"></canvas></p><script type="module">
import{buildSquareGrid}from'./src/core/grid.js';import{cornerFootprint}from'./src/core/corner-footprint.js';const grid=buildSquareGrid({radius:3}),ctx=document.querySelector('canvas').getContext('2d');function draw(){const cut=Number(document.querySelector('#cut').value),all=document.querySelector('#all').checked,flip=document.querySelector('#flip').checked;ctx.clearRect(0,0,900,650);const footprints=grid.cells.map(c=>cornerFootprint(c,{cut,all,flip:flip&&c.id%2===0}));for(const f of footprints){ctx.beginPath();f.points.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](450+p.x*75,325+p.z*75));ctx.closePath();ctx.fillStyle=f.sourceCell%2?'#8bb6a1':'#d4c391';ctx.fill();ctx.strokeStyle='#203a40';ctx.stroke();}document.querySelector('#stats').textContent=`${grid.cells.length}格 / ${footprints[0].points.length}边 / 面积比${footprints[0].areaRatio.toFixed(3)}`;window.cornerCutReview={grid,footprints,draw};}for(const id of ['cut','all','flip'])document.querySelector('#'+id).oninput=draw;draw();
</script></html>
