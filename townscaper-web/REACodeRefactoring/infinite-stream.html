<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>无限网格 · 流式窗口 / 黑白对偶 / 翻折 bug · REACode 重构版（第 56 批 C06）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3a3a3a; font: 13px/1.5 system-ui, "PingFang SC", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 14px; top: 14px; width: 360px; background: rgba(255,255,255,.93); color: #1d2f36; border-radius: 12px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #ui h1 { font-size: 15px; margin: 0 0 4px; } #ui p { margin: 3px 0; font-size: 12px; color: #4d6369; }
  #ui .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  #ui button, #ui select { font: inherit; font-size: 12px; border: 1px solid #c9d8d7; border-radius: 7px; background: #fff; padding: 3px 8px; cursor: pointer; }
  #stat { font-size: 11.5px; color: #2f7f8a; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>无限四边形网格</h1>
  <p><b>流式</b>（1151137783785771008 / 1151770831619534848）：拖动画面里的黄色焦点（或自动巡游），圈内的块按需最终化（块 + 三块簇松弛 + 插值，白网），圈外一圈只生成未松弛拓扑（暗网），更远的缓存丢弃；黑网是白网的对偶。<br><b>翻折 bug</b>（1302686201401442309）：几块在松弛里绕向取反 → 塌成一团、邻块被拉长；可切回正常、再开面积回拉。</p>
  <div class="row">模式 <select id="mode"><option value="stream">流式窗口</option><option value="bug">翻折 bug 复现</option></select>
    <label><input type="checkbox" id="dual" checked> 黑网（对偶）</label> <label><input type="checkbox" id="area"> 面积回拉</label></div>
  <div class="row" id="bugrow">bug 块 <select id="bug"><option value="0,5,12">3 块翻折</option><option value="0">1 块翻折</option><option value="">修好（无 bug）</option></select></div>
  <div class="row">半径 <input id="rad" type="range" min="4" max="20" step="0.5" value="10"> <button id="auto">⟳ 自动巡游</button></div>
  <div id="stat"></div>
</div>
<script type="module">
import { buildInfinite, verify, createInfiniteStream, clusterCost } from './src/core/infinite.js';
import { streamWindow, windowDual, areaStats, densityStats, restoreArea, patchLattice } from './src/core/infinite-c06.js';

const q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const modeEl = document.getElementById('mode'), dualEl = document.getElementById('dual'), areaEl = document.getElementById('area'), bugEl = document.getElementById('bug'), radEl = document.getElementById('rad'), statEl = document.getElementById('stat');
modeEl.value = q.get('mode') === 'bug' ? 'bug' : 'stream';
if (q.get('dual') === '0') dualEl.checked = false;
if (q.get('area')) areaEl.checked = true;
if (q.has('bug')) bugEl.value = q.get('bug');
if (q.get('r')) radEl.value = q.get('r');
let stream = createInfiniteStream({ N: 4, passes: 40 }), lat = patchLattice(stream);
let focus = [Number(q.get('fx') || 0), Number(q.get('fz') || 0)], auto = !!q.get('auto'), tAuto = 0, view = { s: 12, cx: 0, cz: 0 }, dirty = true, bugCache = null;
const cost = clusterCost({ N: 4, passes: 4 });
const W = () => cv.width, H = () => cv.height;
const toS = (x, z) => [W() / 2 + (x - view.cx) * view.s, H() / 2 + (z - view.cz) * view.s];
function strokeQuads(quads, pos, color, width = 1) { ctx.beginPath(); for (const qd of quads) { qd.forEach((v, i) => { const p = toS(...pos(v)); i ? ctx.lineTo(...p) : ctx.moveTo(...p); }); ctx.closePath(); } ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); }
function drawStream() {
  const radius = +radEl.value;
  const t0 = performance.now();
  const win = streamWindow(stream, { focus, radius, areaFix: areaEl.checked });
  const ms = performance.now() - t0;
  ctx.fillStyle = '#3c3c3c'; ctx.fillRect(0, 0, W(), H());
  for (const P of win.raws) strokeQuads(P.quads, (v) => [v.x0, v.z0], 'rgba(20,20,20,.75)');
  let dual = null;
  if (dualEl.checked) { dual = windowDual(win); ctx.beginPath(); for (const f of dual.faces) { f.pts.forEach((p, i) => { const s = toS(...p); i ? ctx.lineTo(...s) : ctx.moveTo(...s); }); ctx.closePath(); } ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3; ctx.stroke(); }
  for (const P of win.finals) strokeQuads(P.quads, (v) => P.pos.get(v.id), 'rgba(250,250,250,.92)');
  const [fx, fz] = toS(...focus);
  ctx.beginPath(); ctx.arc(fx, fz, radius * view.s, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ffe23a'; ctx.fillRect(fx - 7, fz - 7, 14, 14); ctx.strokeStyle = '#ffe23a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx, fz); ctx.lineTo(fx + 40, fz); ctx.moveTo(fx, fz); ctx.lineTo(fx, fz - 40); ctx.stroke();
  const quads = win.finals.flatMap((P) => P.quads), posMap = new Map(); for (const P of win.finals) for (const [id, p] of P.pos) posMap.set(id, p);
  // 块边界两侧一致性：同一顶点在不同块的最终化结果
  let seam = 0; const seen = new Map(); for (const P of win.finals) for (const [id, p] of P.pos) { const o = seen.get(id); if (o) seam = Math.max(seam, Math.hypot(o[0] - p[0], o[1] - p[1])); else seen.set(id, p); }
  const st = areaStats(quads, (v) => posMap.get(v.id));
  const den = densityStats(win);
  statEl.textContent = `焦点 (${focus[0].toFixed(1)}, ${focus[1].toFixed(1)}) · 最终化 ${win.finals.length} 块 / ${quads.length} 格 · 圈外未松弛 ${win.raws.length} 块\n累计生成拓扑 ${win.counters.patches} 块 · 块松弛 ${win.counters.patchRelax} · 簇松弛 ${win.counters.clusterRelax} · 丢弃 ${win.counters.evicted || 0}\n当前缓存 ${JSON.stringify(win.cached)}\n块间接缝 ${seam.toExponential(1)} · 翻折 ${st.flipped} · 面积比 ${st.min.toFixed(2)}–${st.max.toFixed(2)}${dual ? ` · 黑网 ${dual.faces.length} 面` : ''}\n疏密均匀度：面积 p10 ${den ? den.area.p10.toFixed(2) : '-'} / p50 ${den ? den.area.p50.toFixed(2) : '-'} / p90 ${den ? den.area.p90.toFixed(2) : '-'}（p90÷p10 ${den ? den.area.span.toFixed(2) : '-'}×、CV ${den ? den.area.cv.toFixed(3) : '-'}）· 边长 CV ${den ? den.edge.cv.toFixed(3) : '-'}\n块间 vs 块内：块均值 CV ${den ? den.between.toFixed(3) : '-'} / 块内平均 CV ${den ? den.within.toFixed(3) : '-'}（块间≈块内 → 看不出块边界）\n3 块一簇最终化一块需 ${cost.tri} 块拓扑；7 块一簇需 ${cost.hept} 块（×${cost.ratio.toFixed(2)}） · 本帧 ${ms.toFixed(0)} ms`;
  window.infStream = { focus: focus.slice(), finals: win.finals.length, raws: win.raws.length, quads: quads.length, counters: win.counters, cached: win.cached, seam, area: st, density: den, dualFaces: dual?.faces.length ?? 0, cost };
}
function drawBug() {
  const key = bugEl.value + '|' + areaEl.checked;
  if (!bugCache || bugCache.key !== key) {
    const bp = bugEl.value ? bugEl.value.split(',').map(Number) : [];
    const inf = buildInfinite({ N: 4, rings: 2, passes: 60, bugPatches: bp });
    const rep = verify(inf, 'blend');
    let pos = (v) => inf.versions.blend(v);
    if (areaEl.checked) { const P = restoreArea(inf.quads, pos); pos = (v) => P.get(v.id); }
    bugCache = { key, inf, rep, pos, bp, area: areaStats(inf.quads, pos) };
  }
  const { inf, rep, pos, bp, area } = bugCache;
  ctx.fillStyle = '#1f6f78'; ctx.fillRect(0, 0, W(), H());
  for (const qd of inf.quads) {
    const pts = qd.map((v) => toS(...pos(v)));
    let a = 0; for (let i = 0; i < 4; i++) a += pts[i][0] * pts[(i + 1) % 4][1] - pts[(i + 1) % 4][0] * pts[i][1];
    const a0 = Math.abs(qd.reduce((s, v, i) => s + v.x0 * qd[(i + 1) % 4].z0 - qd[(i + 1) % 4].x0 * v.z0, 0) / 2) * view.s * view.s, r = (a / 2) / a0;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath();
    ctx.fillStyle = r <= 0 ? 'rgba(5,15,20,.95)' : r > 2 ? 'rgba(255,230,120,.55)' : r > 1.5 ? 'rgba(255,230,120,.25)' : 'rgba(40,140,150,.35)'; ctx.fill();
    ctx.strokeStyle = r <= 0 ? '#050a0c' : 'rgba(10,30,35,.8)'; ctx.lineWidth = r <= 0 ? 2 : 1; ctx.stroke();
  }
  statEl.textContent = `19 块 · ${inf.quads.length} 格 · bug 块 ${bp.length ? bp.join(',') : '无'}${areaEl.checked ? ' · 面积回拉开' : ''}\n翻折 ${rep.flipped}（深色）· 拉伸>2× ${rep.stretched}（黄色）· 最大拉伸 ${rep.maxStretch.toFixed(2)}× · 最小 ${rep.minShrink.toFixed(2)}\n回拉后面积比 ${area.min.toFixed(2)}–${area.max.toFixed(2)} · 翻折 ${area.flipped} · 块接缝 ${rep.seam.toExponential(1)}`;
  window.infBug = { bug: bp, flipped: rep.flipped, stretched: rep.stretched, maxStretch: rep.maxStretch, minShrink: rep.minShrink, seam: rep.seam, area };
}
function draw() { dirty = false; (modeEl.value === 'bug' ? drawBug : drawStream)(); document.getElementById('bugrow').style.display = modeEl.value === 'bug' ? '' : 'none'; }
function resize() { cv.width = innerWidth; cv.height = innerHeight; view.s = Math.min(innerWidth, innerHeight) / (modeEl.value === 'bug' ? 46 : 44) * Number(q.get('zoom') || 1); dirty = true; }
addEventListener('resize', resize); resize();
for (const el of [modeEl, dualEl, areaEl, bugEl, radEl]) el.oninput = el.onchange = () => { resize(); if (modeEl.value === 'stream') view.cx = view.cz = 0; dirty = true; };
document.getElementById('auto').onclick = () => { auto = !auto; };
let drag = false;
cv.addEventListener('pointerdown', (e) => { drag = true; auto = false; move(e); });
cv.addEventListener('pointermove', (e) => { if (drag) move(e); });
addEventListener('pointerup', () => { drag = false; });
function move(e) { if (modeEl.value !== 'stream') return; focus = [view.cx + (e.clientX - W() / 2) / view.s, view.cz + (e.clientY - H() / 2) / view.s]; dirty = true; }
window.setFocus = (x, z) => { focus = [x, z]; view.cx = x; view.cz = z; auto = false; dirty = true; draw(); return window.infStream; };
let last = performance.now();
requestAnimationFrame(function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (auto && modeEl.value === 'stream') { tAuto += dt * .25; focus = [Math.cos(tAuto) * 14 + tAuto * 6, Math.sin(tAuto * 1.3) * 9]; view.cx = focus[0]; view.cz = focus[1]; dirty = true; }
  if (dirty) draw();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
