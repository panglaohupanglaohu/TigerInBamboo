<script type="module">
import {withRandomState,mirroredRandom,partSeed} from "./src/core/part-random.js";
import {playfulJitter} from "./src/core/playful-layout.js";
import {mountIconToolbar} from "./src/ui/icon-toolbar.js";
let iconToolbar=null, selectedTool="select";
let disposePopup=()=>{}, menuSeed=7;

/* ============================================================================================
 * 层级部件生成器（958371606350454784 "The beginnings of a portrait generator. It currently runs on 5 examples …
 *   but it's content agnostic"；958410200146497537 "The approach is versatile enough that I can use it for the ingame
 *   banners too"）。
 * 一个"部件"= 若干个变体（draw 函数）+ 若干个挂点（子部件放在哪、多大、要不要左右镜像）。
 * 生成 = 从根开始，每个槽随机挑一个变体，按挂点递归画子部件。系统本身不知道"脸"或"旗"是什么——
 * 换一棵部件树就换一种内容。
 * ========================================================================================== */
let seed=7, faceSeed=7, bannerSeed=7;
const partRandom={get state(){return seed},set state(value){seed=value}};
const rng = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const pick = (a) => a[(rng() * a.length) | 0];
const jit = (s) => (rng() - 0.5) * 2 * s;

function grow(ctx, part, x, y, s, ctxData) {
  const v = typeof part.variants === 'function' ? part.variants(ctxData) : pick(part.variants);
  const anchors = v.draw(ctx, x, y, s, ctxData) || {};
  for (const child of part.children || []) {
    const a = anchors[child.at];
    if (!a || (child.chance !== undefined && rng() > child.chance)) continue;
    const cs = s * (a.s ?? 1) * (1 + jit(child.scaleJit ?? 0.06));
    if (child.mirror) {
      // Explicit mirror requests replay the branch state; do not reset to the
      // unrelated head's mirrorSeed. Asymmetric non-mirrored parts stay as-is.
      mirroredRandom(partRandom,()=>{ctx.save();try{grow(ctx,child.part,x+a.x*s,y+a.y*s,cs,ctxData)}finally{ctx.restore()}},()=>{
        ctx.save();try{ctx.translate(x-a.x*s,0);ctx.scale(-1,1);ctx.translate(-(x-a.x*s),0);grow(ctx,child.part,x-a.x*s,y+a.y*s,cs,ctxData)}finally{ctx.restore()}
      });
    } else grow(ctx,child.part,x+a.x*s,y+a.y*s,cs,ctxData);
  }
}
const INK = '#1d1b1a';
function stroke(ctx, w = 3) { ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function blob(ctx, pts) {   // 闭合平滑曲线（中点二次贝塞尔）
  ctx.beginPath();
  const n = pts.length, m = (i) => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  ctx.moveTo(...m(0));
  for (let i = 1; i <= n; i++) ctx.quadraticCurveTo(...pts[i % n], ...m(i));
  ctx.closePath();
}

/* ---------- 脸的部件树 ---------- */
const SKIN = ['#f3e6d4', '#f1dcc6', '#ecd3b8', '#d9b894'];
const HAIR = ['#3a2f2a', '#5a4231', '#8a6a3a', '#2a2a2e', '#a8794a'];
const headVariants = [
  { name: '长脸', w: 0.72, h: 1.0 }, { name: '圆脸', w: 0.82, h: 0.9 }, { name: '蛋形', w: 0.75, h: 0.95, egg: true }, { name: '方脸', w: 0.8, h: 0.95, square: true }, { name: '窄脸', w: 0.66, h: 1.02 },
].map((v) => ({ draw(ctx, x, y, s, d) {
  const w = v.w * s * (1 + jit(0.06)), h = v.h * s * (1 + jit(0.04));
  const pts = [];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    let rx = Math.cos(a) * w * 0.5, ry = Math.sin(a) * h * 0.5;
    if (v.egg && ry > 0) rx *= 0.82;
    if (v.square) { rx = Math.sign(rx) * Math.min(Math.abs(rx) * 1.15, w * 0.5); }
    pts.push([x + rx, y + ry + (ry > 0 ? ry * 0.12 : 0)]);
  }
  d.skin=pick(SKIN);d.hair=pick(HAIR);
  blob(ctx, pts); ctx.fillStyle = d.skin; ctx.fill(); stroke(ctx, 3.2);
  d.headW = w; d.headH = h;
  return {
    ear: { x: w * 0.5 / s, y: 0.02, s: 1 }, eye: { x: 0.15, y: -0.02, s: 1 }, nose: { x: 0, y: 0.0, s: 1 },
    mouth: { x: 0, y: h * 0.33 / s, s: 1 }, hair: { x: 0, y: -h * 0.5 / s, s: 1 }, beard: { x: 0, y: h * 0.3 / s, s: 1 }, cheek: { x: 0.2, y: 0.12, s: 1 },
  };
} }));
const ear = { variants: [0, 1, 2].map((k) => ({ draw(ctx, x, y, s, d) {
  ctx.beginPath(); ctx.ellipse(x + s * 0.03, y, s * (0.07 + k * 0.015), s * (0.11 + k * 0.01), 0.2, -Math.PI * 0.6, Math.PI * 0.6); ctx.fillStyle = d.skin; ctx.fill(); stroke(ctx, 3);
  ctx.beginPath(); ctx.arc(x + s * 0.035, y, s * 0.035, -1, 1); stroke(ctx, 2);
} })) };
const eye = { variants: ['dot', 'tired', 'wide', 'squint', 'stare'].map((k) => ({ draw(ctx, x, y, s) {
  const r = s * (k === 'wide' ? 0.07 : 0.055);
  if (k !== 'squint') { ctx.beginPath(); ctx.ellipse(x, y, r * 1.2, r, 0, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); stroke(ctx, 2.2); }
  ctx.beginPath(); ctx.arc(x + (k === 'stare' ? r * 0.3 : 0), y + r * 0.1, r * 0.45, 0, 7); ctx.fillStyle = INK; ctx.fill();
  if (k === 'tired' || k === 'squint') { ctx.beginPath(); ctx.moveTo(x - r * 1.3, y - r * 0.2); ctx.lineTo(x + r * 1.3, y - r * 0.2); stroke(ctx, 2.6); }
  if (k === 'tired') { ctx.beginPath(); ctx.arc(x, y + r * 1.2, r * 1.1, 0.3, Math.PI - 0.3); ctx.strokeStyle = 'rgba(90,70,90,.35)'; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x - r * 1.4, y - r * (1.8 + jit(0.3))); ctx.lineTo(x + r * 1.2, y - r * (1.7 + jit(0.5))); stroke(ctx, 3);   // 眉毛
} })) };
const nose = { variants: ['long', 'hook', 'button', 'wide'].map((k) => ({ draw(ctx, x, y, s, d) {
  const L = s * (k === 'long' ? 0.24 : k === 'button' ? 0.12 : 0.19), W = s * (k === 'wide' ? 0.09 : 0.06);
  ctx.beginPath(); ctx.moveTo(x - W * 0.3, y - L * 0.6);
  if (k === 'hook') ctx.quadraticCurveTo(x + W * 1.6, y, x + W * 0.4, y + L * 0.45); else ctx.lineTo(x - W * 0.2, y + L * 0.3);
  ctx.quadraticCurveTo(x, y + L * 0.55, x + W, y + L * 0.35);
  ctx.lineTo(x + W * 0.4, y - L * 0.6); ctx.closePath();
  ctx.fillStyle = '#eba08a'; ctx.fill(); stroke(ctx, 2.6);
} })) };
const mouth = { variants: ['flat', 'frown', 'smirk', 'open'].map((k) => ({ draw(ctx, x, y, s) {
  const w = s * (0.1 + rng() * 0.05);
  ctx.beginPath();
  if (k === 'flat') { ctx.moveTo(x - w, y); ctx.lineTo(x + w, y + jit(2)); }
  else if (k === 'frown') { ctx.moveTo(x - w, y + 3); ctx.quadraticCurveTo(x, y - 5, x + w, y + 3); }
  else if (k === 'smirk') { ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x + w * 0.4, y + 3, x + w, y - 4); }
  else { ctx.ellipse(x, y, w * 0.55, w * 0.32, 0, 0, 7); ctx.fillStyle = '#5a2b2b'; ctx.fill(); }
  stroke(ctx, 2.8);
} })) };
const hair = { variants: ['bowl', 'side', 'mohawk', 'bald', 'cap', 'helmet', 'curl'].map((k) => ({ draw(ctx, x, y, s, d) {
  const w = d.headW, h = d.headH;
  if (k === 'bald') { ctx.beginPath(); ctx.arc(x + w * 0.15, y + h * 0.12, w * 0.07, Math.PI * 1.1, Math.PI * 1.6); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.stroke(); return; }
  if (k === 'helmet') {   // 尖顶盔 + 护鼻（1010979395719319552 第二张）
    ctx.beginPath(); ctx.moveTo(x - w * 0.55, y + h * 0.28); ctx.quadraticCurveTo(x - w * 0.55, y - h * 0.15, x, y - h * 0.32); ctx.quadraticCurveTo(x + w * 0.55, y - h * 0.15, x + w * 0.55, y + h * 0.28); ctx.closePath();
    ctx.fillStyle = '#c9ced3'; ctx.fill(); stroke(ctx, 3);
    ctx.beginPath(); ctx.rect(x - w * 0.05, y + h * 0.2, w * 0.1, h * 0.35); ctx.fillStyle = '#b3b9bf'; ctx.fill(); stroke(ctx, 2.4);
    ctx.beginPath(); ctx.moveTo(x - w * 0.56, y + h * 0.24); ctx.lineTo(x + w * 0.56, y + h * 0.24); stroke(ctx, 3); return;
  }
  ctx.fillStyle = k === 'cap' ? pick(['#8b7355', '#6b7f5a', '#7a5a4a']) : d.hair;
  ctx.beginPath();
  if (k === 'mohawk') { blob(ctx, [[x - w * 0.12, y + h * 0.15], [x - w * 0.2, y - h * 0.05], [x - w * 0.02, y - h * 0.16], [x + w * 0.2, y - h * 0.05], [x + w * 0.12, y + h * 0.15]]); }
  else if (k === 'curl') { for (let i = 0; i < 7; i++) { const a = Math.PI * (1.05 + i * 0.15); ctx.moveTo(x + Math.cos(a) * w * 0.48 + w * 0.12, y + h * 0.5 + Math.sin(a) * h * 0.5); ctx.arc(x + Math.cos(a) * w * 0.48, y + h * 0.5 + Math.sin(a) * h * 0.5, w * 0.12, 0, 7); } }
  else {
    const drop = k === 'bowl' ? 0.42 : k === 'cap' ? 0.3 : 0.35;
    ctx.moveTo(x - w * 0.53, y + h * drop);
    ctx.bezierCurveTo(x - w * 0.6, y - h * 0.12, x + w * 0.6, y - h * 0.12, x + w * 0.53, y + h * drop);
    if (k === 'side') ctx.quadraticCurveTo(x + w * 0.1, y + h * 0.15, x - w * 0.3, y + h * 0.32);
    else ctx.lineTo(x - w * 0.53, y + h * drop);
    ctx.closePath();
  }
  ctx.fill(); stroke(ctx, 3);
  if (k === 'bowl' || k === 'cap') for (let i = 0; i < 6; i++) { const t = (i + 0.5) / 6; ctx.beginPath(); ctx.moveTo(x - w * 0.45 + t * w * 0.9, y + h * 0.05); ctx.lineTo(x - w * 0.48 + t * w * 0.96, y + h * (k === 'cap' ? 0.28 : 0.38)); stroke(ctx, 1.6); }
} })) };
const beard = { variants: ['short', 'full', 'mustache'].map((k) => ({ draw(ctx, x, y, s, d) {
  const w = d.headW;
  ctx.fillStyle = d.hair; ctx.beginPath();
  if (k === 'mustache') { ctx.ellipse(x - w * 0.1, y - s * 0.03, w * 0.12, s * 0.035, 0.2, 0, 7); ctx.ellipse(x + w * 0.1, y - s * 0.03, w * 0.12, s * 0.035, -0.2, 0, 7); }
  else { ctx.moveTo(x - w * 0.4, y - s * 0.12); ctx.quadraticCurveTo(x, y + s * (k === 'full' ? 0.42 : 0.22), x + w * 0.4, y - s * 0.12); ctx.quadraticCurveTo(x, y + s * 0.05, x - w * 0.4, y - s * 0.12); }
  ctx.fill(); stroke(ctx, 2.6);
} })) };
const FACE = { variants: headVariants, children: [
  { at: 'ear', part: ear, mirror: true }, { at: 'hair', part: hair }, { at: 'eye', part: eye, mirror: true },
  { at: 'beard', part: beard, chance: 0.35 }, { at: 'mouth', part: mouth }, { at: 'nose', part: nose },
] };

function drawFace(ctx, x, y, s, framed) {
  if (framed) {   // 1010979395719319552：切角方框 + 红/蓝背景 + 小人剪影
    const r = s * 0.62, c = r * 0.28;
    const oct = () => { ctx.beginPath(); ctx.moveTo(x - r + c, y - r); ctx.lineTo(x + r - c, y - r); ctx.lineTo(x + r, y - r + c); ctx.lineTo(x + r, y + r - c); ctx.lineTo(x + r - c, y + r); ctx.lineTo(x - r + c, y + r); ctx.lineTo(x - r, y + r - c); ctx.lineTo(x - r, y - r + c); ctx.closePath(); };
    ctx.save(); oct(); ctx.fillStyle = pick(['#e2566a', '#3f72b8', '#d9655a', '#4a86c8']); ctx.fill(); ctx.clip();
    ctx.fillStyle = 'rgba(30,60,110,.55)'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(x - r + i * r * 0.65, y + r * 0.75, r * 0.2, r * 0.45, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#2a4a6a'; ctx.beginPath(); ctx.ellipse(x, y + r * 1.15, r * 0.75, r * 0.5, 0, 0, 7); ctx.fill(); stroke(ctx, 3);   // 肩
    grow(ctx, FACE, x, y - s * 0.02, s * 0.72, {});
    ctx.restore();
    oct(); ctx.lineWidth = s * 0.07; ctx.strokeStyle = '#e8e6e1'; ctx.stroke(); ctx.lineWidth = 2; ctx.strokeStyle = '#6a6862'; ctx.stroke();
  } else {
    ctx.fillStyle = '#2f4a78'; ctx.fillRect(x - s * 0.62, y - s * 0.62, s * 1.24, s * 1.24);
    grow(ctx, FACE, x, y, s * 0.85, {});
  }
}

/* ---------- 旗帜的部件树（同一个生成器） ---------- */
const BCOL = ['#7cc45a', '#8a6ee0', '#d65aa8', '#e0a43c', '#4aa0c8', '#d6503c'];
const SYMBOLS = {
  sun(ctx, x, y, s) { ctx.beginPath(); ctx.arc(x, y, s * 0.28, 0, 7); ctx.fill(); for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * s * 0.36, y + Math.sin(a) * s * 0.36); ctx.lineTo(x + Math.cos(a) * s * 0.46, y + Math.sin(a) * s * 0.46); ctx.lineWidth = s * 0.05; ctx.strokeStyle = '#fff'; ctx.stroke(); } },
  clover(ctx, x, y, s) { for (const a of [-1.9, -0.2, 1.5]) { ctx.beginPath(); ctx.arc(x + Math.cos(a) * s * 0.2, y + Math.sin(a) * s * 0.2, s * 0.2, 0, 7); ctx.fill(); } },
  tower(ctx, x, y, s) { ctx.fillRect(x - s * 0.14, y - s * 0.3, s * 0.28, s * 0.62); for (let i = 0; i < 3; i++) ctx.fillRect(x - s * 0.2 + i * s * 0.15, y - s * 0.42, s * 0.1, s * 0.14); ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x - s * 0.04, y - s * 0.15, s * 0.08, s * 0.14); ctx.restore(); },
  figure(ctx, x, y, s) { ctx.beginPath(); ctx.arc(x, y - s * 0.24, s * 0.1, 0, 7); ctx.fill(); ctx.beginPath(); ctx.roundRect(x - s * 0.13, y - s * 0.14, s * 0.26, s * 0.3, s * 0.08); ctx.fill(); ctx.fillRect(x - s * 0.1, y + s * 0.1, s * 0.07, s * 0.22); ctx.fillRect(x + s * 0.03, y + s * 0.1, s * 0.07, s * 0.22); ctx.fillRect(x - s * 0.2, y - s * 0.1, s * 0.06, s * 0.22); ctx.fillRect(x + s * 0.14, y - s * 0.1, s * 0.06, s * 0.22); },
  fleur(ctx, x, y, s) { ctx.beginPath(); ctx.moveTo(x, y - s * 0.38); ctx.quadraticCurveTo(x + s * 0.15, y - s * 0.1, x, y + s * 0.05); ctx.quadraticCurveTo(x - s * 0.15, y - s * 0.1, x, y - s * 0.38); ctx.fill(); for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + d * s * 0.35, y - s * 0.25, x + d * s * 0.22, y + s * 0.05); ctx.quadraticCurveTo(x + d * s * 0.12, y - s * 0.05, x, y + s * 0.05); ctx.fill(); } ctx.fillRect(x - s * 0.2, y + s * 0.05, s * 0.4, s * 0.06); ctx.fillRect(x - s * 0.04, y + s * 0.1, s * 0.08, s * 0.22); },
  dot(ctx, x, y, s) { ctx.beginPath(); ctx.arc(x, y, s * 0.06, 0, 7); ctx.fill(); },
  diamond(ctx, x, y, s) { ctx.beginPath(); ctx.moveTo(x, y - s * 0.09); ctx.lineTo(x + s * 0.06, y); ctx.lineTo(x, y + s * 0.09); ctx.lineTo(x - s * 0.06, y); ctx.fill(); },
};
const symbol = (names) => ({ variants: names.map((n) => ({ draw(ctx, x, y, s) { ctx.fillStyle = '#fff'; SYMBOLS[n](ctx, x, y, s); } })) });
const BIG = symbol(['sun', 'clover', 'tower', 'figure', 'fleur']), SMALL = symbol(['dot', 'diamond']);
const bannerShapes = ['point', 'notch', 'swallow', 'square'].map((k) => ({ draw(ctx, x, y, s, d) {
  const L = s * (k === 'swallow' ? 2.5 : 1.7), H = s * 0.8, x0 = x - s * 0.85, y0 = y - H / 2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + L * (k === 'square' ? 1 : 0.85), y0);
  if (k === 'point') ctx.lineTo(x0 + L, y);
  else if (k === 'notch') { ctx.lineTo(x0 + L * 0.85, y0 + H * 0.25); ctx.lineTo(x0 + L * 0.8, y0 + H * 0.25); ctx.lineTo(x0 + L * 0.8, y0 + H * 0.75); ctx.lineTo(x0 + L * 0.85, y0 + H * 0.75); }
  else if (k === 'swallow') { ctx.lineTo(x0 + L, y0 - H * 0.05); ctx.lineTo(x0 + L * 0.45, y); ctx.lineTo(x0 + L, y0 + H * 1.05); }
  ctx.lineTo(x0 + L * (k === 'square' ? 1 : 0.85), y0 + H); ctx.lineTo(x0, y0 + H); ctx.closePath();
  ctx.fillStyle = pick(BCOL); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(40,40,60,.85)'; ctx.stroke();
  const two = k !== 'point' || rng() < 0.4;
  return { a: { x: two ? -0.45 : -0.15, y: 0, s: 1 }, b: two ? { x: 0.15, y: 0, s: 0.9 } : null, c1: { x: -0.7, y: -0.26, s: 1 }, c2: { x: -0.7, y: 0.26, s: 1 }, c3: { x: two ? -0.15 : 0.3, y: -0.27, s: 1 }, c4: { x: two ? -0.15 : 0.3, y: 0.27, s: 1 } };
} }));
const BANNER = { variants: bannerShapes, children: [
  { at: 'a', part: BIG, scaleJit: 0 }, { at: 'b', part: BIG, scaleJit: 0, chance: 0.9 },
  { at: 'c1', part: SMALL, chance: 0.5 }, { at: 'c2', part: SMALL, chance: 0.5 }, { at: 'c3', part: SMALL, chance: 0.6 }, { at: 'c4', part: SMALL, chance: 0.6 },
] };

/* ---------- 画布页 ---------- */
function setupCanvas(cv, w, h) { const DPR = Math.min(2, devicePixelRatio); cv.width = w * DPR; cv.height = h * DPR; cv.style.width = w + 'px'; cv.style.height = h + 'px'; const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return c; }
function drawFaces() {
  const W = Math.min(760, innerWidth - 40), cols = W > 600 ? 4 : 3, cell = W / cols;
  const ctx = setupCanvas(document.getElementById('cface'), W, cell * 2 + 10);
  const base=seed,identities=[];
  for(let row=0;row<2;row++)for(let i=0;i<cols;i++){const id=row*4+i,localSeed=partSeed(base,id);identities.push([id,localSeed]);withRandomState(partRandom,localSeed,()=>drawFace(ctx,cell*(i+.5),cell*(row+.5)+(row?10:0),cell*.72,!!row));}
  document.getElementById('cface').dataset.partSeeds=JSON.stringify(identities);
}
function drawBanners() {
  const W = Math.min(760, innerWidth - 40), cols = W > 600 ? 3 : 2, cw = W / cols, ch = 110;
  const ctx = setupCanvas(document.getElementById('cbanner'), W, ch * 4);
  ctx.fillStyle = '#2f4a78'; ctx.fillRect(0, 0, W, ch * 4);
  const base=seed,identities=[];for(let j=0;j<4;j++)for(let i=0;i<cols;i++){const id=j*3+i,localSeed=partSeed(base,id);identities.push([id,localSeed]);withRandomState(partRandom,localSeed,()=>grow(ctx,BANNER,cw*i+cw*.42,ch*(j+.5),Math.min(70,cw*.32),{}));}
  document.getElementById('cbanner').dataset.partSeeds=JSON.stringify(identities);
}

/* ---------- 确认弹出（1016680972610359298） ---------- */
const ICON = {
  select: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6z"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
};
function buildPop() {
  // 1016680972610359298: "This is what the confirm popup looks like".
  // The source shows a horizontal row, not an arc. This remains a UI demo,
  // not a claim that Move/Swap is connected to the game's Battle controller.
  const box=document.getElementById('pop');box.innerHTML='';
  const abort=new AbortController(),timers=new Set();let alive=true,open=null;
  const later=(fn,ms)=>{const id=setTimeout(()=>{timers.delete(id);if(alive)fn();},ms);timers.add(id);};
  const cancel=()=>{for(const id of timers)clearTimeout(id);timers.clear();};
  const squads=[{x:box.clientWidth*.33,y:230,c:'#e9a93a',f:'🛡'},{x:box.clientWidth*.73,y:200,c:'#5a8fd6',f:'⚔'}];
  const btns=[['选择','select','#c08a4a'],['移动','move','#5a8fd6'],['交换','swap','#c08a4a']].map(([text,key,color])=>{
    const b=document.createElement('button');b.type='button';b.className='pbtn';b.style.background=color;b.innerHTML=ICON[key]+`<span>${text}</span>`;b.disabled=true;b.tabIndex=-1;b.setAttribute('aria-hidden','true');box.append(b);return b;
  });
  const close=()=>{cancel();for(const b of btns){b.classList.remove('show');b.disabled=true;b.tabIndex=-1;b.setAttribute('aria-hidden','true');}if(open){open.el.classList.remove('sel');open.el.setAttribute('aria-expanded','false');}open=null;};
  squads.forEach(s=>{const el=document.createElement('button');el.type='button';el.className='squad';el.setAttribute('aria-label',s.f==='🛡'?'盾队':'剑队');el.setAttribute('aria-expanded','false');el.style.left=s.x-32+'px';el.style.top=s.y-26+'px';el.style.background=`radial-gradient(circle at 50% 40%,${s.c},${s.c}aa 60%,transparent 72%)`;el.textContent=s.f;box.append(el);
    el.addEventListener('click',e=>{e.stopPropagation();if(open?.s===s){close();return}close();open={s,el};el.classList.add('sel');el.setAttribute('aria-expanded','true');const cx=Math.max(131,Math.min(box.clientWidth-131,s.x));
      btns.forEach((b,i)=>{b.style.left=cx+(i-1)*86+'px';b.style.top=Math.max(40,s.y-80)+'px';later(()=>{b.classList.add('show');b.disabled=false;b.tabIndex=0;b.setAttribute('aria-hidden','false');if(e.detail===0&&i===0)b.focus();},i*60);});
    },{signal:abort.signal});
  });
  for(const b of btns)b.addEventListener('click',e=>{e.stopPropagation();const selected=open;document.getElementById('ui-status').textContent=`本地演示：${b.textContent}，未发送游戏指令`;later(()=>{if(open===selected)close();},170);},{signal:abort.signal});
  box.addEventListener('click',close,{signal:abort.signal});
  box.addEventListener('keydown',e=>{if(e.key==='Escape'){const target=open?.el;close();target?.focus();e.preventDefault();}},{signal:abort.signal});
  later(()=>box.querySelector('.squad')?.click(),400);
  disposePopup=()=>{alive=false;close();abort.abort();disposePopup=()=>{};};
}

/* ---------- 斜按钮（1242824460325052417 "you can make a boring list of buttons playful by just tilting them slightly"） ---------- */
function buildMenu() {
  const m=document.getElementById('menu');m.innerHTML='';
  const rows=[[['新建','#cdeaa8','⌂']],[['打开','#cdeaa8','▤']],[['退出','#f2c0c0','✕']],[['存到剪贴板','#f4eec8','']],[['从剪贴板读','#f4eec8','']],[['撤销','#f2c0c0','↶'],['重做','#f2c0c0','↷']],[['网格','#cfe2f2','◐']]];
  for(const row of rows){const holder=row.length>1?Object.assign(document.createElement('div'),{className:'pair'}):m;
    for(const[text,color,icon]of row){const b=document.createElement('button');b.type='button';b.className='mb';b.dataset.key=text;const visual=document.createElement('span');visual.className='mb-look';visual.style.background=color;visual.innerHTML=`<span>${text}</span><span>${icon}</span>`;
      const j=playfulJitter(text,{seed:menuSeed,width:row.length>1?115:240,height:44,gap:10});visual.style.transform=`translate(${j.dx}px,${j.dy}px) rotate(${j.rot}deg)`;b.append(visual);b.onclick=()=>{document.getElementById('ui-status').textContent=`本地演示：${text}，未绑定游戏操作`;};holder.append(b);
    }if(holder!==m)m.append(holder);
  }
}

/* ---------- 图标（1201179450668441600 "Icons!"）：工具条，选中的图标歪一点、放大、旁边一个白色小三角 ---------- */
const TOOL_ICONS = [
  ['#b48fd6', '<svg viewBox="0 0 36 36"><path d="M6 6l20 8-8 3-3 8z" fill="#fff" stroke="#1d1b1a" stroke-width="2.4" stroke-linejoin="round"/></svg>'],
  ['#9fd6d0', '<svg viewBox="0 0 36 36"><path d="M8 26c4 0 6-2 6-5l10-12 3 3-12 10c0 3-2 5-7 4z" fill="#fff" stroke="#1d1b1a" stroke-width="2.4" stroke-linejoin="round"/></svg>'],
  ['#c9d68f', '<svg viewBox="0 0 36 36"><path d="M7 15l11-8 9 9-11 9z" fill="#fff" stroke="#1d1b1a" stroke-width="2.4" stroke-linejoin="round"/><path d="M27 18c2 3 2 5 0 6" stroke="#1d1b1a" stroke-width="2.4" fill="none"/></svg>'],
  ['#e6b08a', '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="10" fill="#fff" stroke="#1d1b1a" stroke-width="2.4"/><circle cx="18" cy="18" r="3" fill="#1d1b1a"/></svg>'],
  ['#8aa2c8', '<svg viewBox="0 0 36 36"><path d="M10 14h12a6 6 0 0 1 0 12h-6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M14 9l-5 5 5 5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'],
  ['#8aa2c8', '<svg viewBox="0 0 36 36"><path d="M26 14H14a6 6 0 0 0 0 12h6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M22 9l5 5-5 5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'],
  ['#8aa2c8', '<svg viewBox="0 0 36 36"><path d="M11 11l14 14M25 11L11 25" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>'],
];
function buildIcons() {
  const box=document.getElementById('icons');box.innerHTML='';
  box.setAttribute('aria-label','本地图标工具示例');
  const keys=['select','shape','paint','palette','undo','redo','quit'],labels=['选择','改形','涂色','配色','撤销（未接入）','重做（未接入）','退出（未接入）'];
  iconToolbar=mountIconToolbar(box,TOOL_ICONS.map(([color,svg],i)=>({key:keys[i],label:labels[i],color,disabled:i>=4,render:b=>{b.innerHTML=svg;}})),{value:selectedTool,onChange:key=>{selectedTool=key;document.getElementById('ui-status').textContent=`本地工具：${labels[keys.indexOf(key)]}，未发送游戏指令`;}});
}

const NOTES = {
  face: '958371606350454784 头像生成器 + 1010979395719319552 游戏里的头像。一个"内容无关"的层级部件生成器：头 → 耳（镜像）/ 头发 / 眼（镜像）/ 胡子 / 嘴 / 鼻，每个槽随机挑变体并带一点尺寸抖动。下排保留本地切角相框/背景/盔甲样例；显式种子使重绘/缩放保持身份，mirror分支只在声明时共享随机选择。原作图稿/完整接口未复现。',
  banner: '958410200146497537 "versatile enough that I can use it for the ingame banners too"：同一个生成器换一棵部件树——旗形（尖、缺口、燕尾、方）→ 1–2 个大徽记（太阳 / 三叶 / 塔 / 小人 / 百合）+ 小点缀。',
  pop: '1016680972610359298 确认弹出：点一队 → 三个按钮（选择 / 移动 / 交换）横排依次弹出；切队/切页取消旧定时器，Esc关闭并还焦点。仅本地UI演示，未绑定游戏指令。',
  menu: '1242824460325052417 "make a boring list of buttons playful by just tilting them slightly"：固定种子/按钮键确定轻微倾斜；只变视觉层，点击槽不旋转；AABB约束间距，键盘可用。',
  icons: '1201179450668441600 Icons!：粗黑描边的白色图形 + 彩色圆角底；选中标记与aria-pressed一致；方向键/Home/End跳过禁用项，切页保留选择。原作图稿/游戏指令仍待接。',
};
let tab = 'face';
function render() {
  disposePopup();iconToolbar?.dispose();iconToolbar=null;document.getElementById('ui-status').textContent='';
  document.getElementById('note').textContent = NOTES[tab];
  const seeded=tab==='face'||tab==='banner';document.getElementById('part-seed-row').hidden=!seeded;if(seeded)document.getElementById('part-seed').value=tab==='face'?faceSeed:bannerSeed;
  if(tab==='face')withRandomState(partRandom,faceSeed,drawFaces);else if(tab==='banner')withRandomState(partRandom,bannerSeed,drawBanners); else if (tab === 'pop') buildPop(); else if (tab === 'menu') buildMenu(); else buildIcons();
  document.getElementById('stage').style.paddingTop=innerWidth<=800?(document.getElementById('ui').getBoundingClientRect().bottom+18)+'px':'';
}
function setTab(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.id === 'p-' + t));
  render();
}
document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => setTab(b.dataset.t)));
document.getElementById('again').onclick = () => { seed = (seed * 7 + 13) % 2147483647 || 1; if(tab==='face')faceSeed=seed;else if(tab==='banner')bannerSeed=seed;else if(tab==='menu')menuSeed=seed;render(); };
addEventListener('resize', () => (tab === 'face' || tab === 'banner') && render());
function setPartSeed(value){if(!Number.isSafeInteger(value)||value<1||value>2147483646)throw new RangeError('种子需为1至2147483646的整数');if(tab==='face')faceSeed=value;else if(tab==='banner')bannerSeed=value;else throw new Error('请选择头像或旗帜');render()}
document.getElementById('part-seed').onchange=e=>{try{setPartSeed(+e.target.value);e.target.setCustomValidity('')}catch(error){e.target.setCustomValidity(error.message);e.target.reportValidity()}};
setTab(new URLSearchParams(location.search).get('t') || 'face');
window.uiLab = {setTab,setPartSeed, get toolbar(){return iconToolbar} };
