<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>墙板涂鸦 · REACode重构版</title><style>body{margin:24px;background:#edf4f0;color:#20343c;font:15px/1.6 system-ui}canvas{max-width:100%;border-radius:10px}input,button{font:inherit;margin:6px}a{color:#276e86}</style><h1>墙板 · 线稿 · 护墙板</h1><p>同种子同布局；图案逐板裁剪，护墙板保持留白。墨线覆盖率由透明笔画遮罩计算，底色不计入。场景预览将表面装饰接到现有World建筑外墙；弧顶与完整室内走廊尚未实现。</p><label>种子<input id="seed" type="number" value="7"></label><label><input id="gray" type="checkbox">单色版本</label><button id="draw">重新生成</button><div id="stats"></div><div id="wall"></div><p><a href="index.html?scene=town&on=doodlewall">真实建筑墙面预览</a> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/doodle-review.md">逐帧记录</a></p><script type="module">
import{makeDoodleWall}from'./src/build/doodle-wall.js';
function run(){const gray=document.querySelector('#gray').checked,seed=Number(document.querySelector('#seed').value),result=makeDoodleWall({gray,seed});document.querySelector('#wall').replaceChildren(result.canvas);document.querySelector('#stats').textContent=`${result.stats.panels}板 · 墨线遮罩覆盖${result.stats.inkPct.toFixed(2)}% · 护墙板${result.stats.wainscotPct}%`;window.doodleReview=result;}
document.querySelector('#gray').onchange=run;document.querySelector('#draw').onclick=run;run();
</script></html>
