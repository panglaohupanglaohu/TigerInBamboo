import*as THREE from'three';import{buildQuadGrid,buildMixedGrid}from'./src/core/grid.js';import{decorateCells}from'./src/core/spatial.js';import{World}from'./src/core/world.js';import{PALETTES}from'./src/core/palette.js';import{buildScene}from'./src/world/scenes.js';

const q=new URLSearchParams(location.search),kind=q.get('grid')==='mixed'?'mixed':'quad',partsOn=q.get('parts')!=='0';
const grid=decorateCells(kind==='mixed'?buildMixedGrid({radius:22,hexSize:.62}):buildQuadGrid({radius:14,hexSize:1})),world=new World(grid);world.palette=PALETTES.town;buildScene(world,q.get('scene')||'town',+(q.get('seed')||7));
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#c'),antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#8b97a9');scene.fog=new THREE.Fog('#8b97a9',14,40);
scene.add(new THREE.HemisphereLight('#f4f1ea','#5a6474',1.6));const sun=new THREE.DirectionalLight('#fff4e0',1.8);sun.position.set(4,9,3);scene.add(sun);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,200);
let group=null,layout=[],info={};
function build(mode){if(group){scene.remove(group);group.traverse(o=>o.geometry?.dispose());}group=new THREE.Group();scene.add(group);
 const ref=referenceCells(grid),used=usedSignatures(world);
 const specs=mode==='all'?allSignatures(grid).map(s=>({...s,count:used.get(s.sig)?.count??0})):[...used.values()].map(s=>({...s,cell:ref.get(s.n)?.id??s.cell}));
 layout=catalogLayout(specs,{spacing:1.7,perRow:mode==='all'?15:9});
 let tris=0,mismatch=0,pc={wall:0,roof:0,base:0};const mat=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
 for(const s of layout){const p=buildPiece(grid,s,{palette:world.palette,debugParts:partsOn});if(p.sigRebuilt!==s.sig)mismatch++;tris+=p.tris;for(const k of ['wall','roof','base'])pc[k]=Math.max(pc[k],p.parts[k]);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p.pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(p.col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.position.set(s.x,s.down?-.5:-.3,s.z);group.add(m);   // 这一层落到地面；悬空块留一截腿
  // 底下一块浅色托板：表示这块拼图占的格
  const c=grid.cells[s.cell],sh=new THREE.Shape(c.pts.map(pt=>new THREE.Vector2(pt.x-c.cx,-(pt.z-c.cz))));const pl=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:s.count?'#b9c3d1':'#a3adbb'}));pl.rotation.x=-Math.PI/2;pl.position.set(s.x,.002,s.z);group.add(pl);}
 const W=Math.max(...layout.map(s=>s.x))+3,D=Math.max(...layout.map(s=>s.z))+3,gh=new THREE.GridHelper(Math.max(W,D)*2+20,Math.round(Math.max(W,D)*2+20),'#5b6678','#667183');gh.position.set(W/2-1.5,.001,D/2-1.5);group.add(gh);const fl=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:'#7e8a9c'}));fl.rotation.x=-Math.PI/2;fl.position.y=-.002;group.add(fl);
 const dbg=buildBuildings(new MeshWriter(),world,{L:.5,debugModules:true,debugParts:partsOn});
 info={kind,mode,partsOn,pieces:layout.length,families:new Set(layout.map(s=>s.family)).size,usedInScene:used.size,sceneModulesStat:dbg.modules,scenePartColors:dbg.moduleParts,piecePartColors:pc,theoretical:allSignatures(grid).length,sigMismatch:mismatch,tris};
 document.querySelector('#report').textContent=JSON.stringify(info,null,1);window.r56cat={...info,layout:layout.map(s=>({sig:s.sig,n:s.n,up:s.up,down:s.down,edges:s.edges.join(''),count:s.count,x:s.x,z:s.z}))};}
build(q.get('mode')||'used');for(const r of document.querySelectorAll('[name=m]')){if(r.value===(q.get('mode')||'used'))r.checked=true;r.onchange=()=>build(r.value);}
if(q.get('clean')){document.querySelector('header').style.display='none';document.querySelector('#report').style.display='none';}
// 飞行巡览：沿目录的行之字形低空掠过（片子 0008–0110），之后拉高俯视（0201–0255）
function camAt(t){const W=Math.max(...layout.map(s=>s.x)),D=Math.max(...layout.map(s=>s.z)),T=22,u=(t%T)/T;
 if(u<.8){const v=u/.8,rows=Math.max(1,Math.ceil(D/3)),r=Math.min(rows-1,Math.floor(v*rows)),f=v*rows-r,x=(r%2?1-f:f)*W,z=r*3+.5;cam.position.set(x-1.6,2.7,z+4.4);cam.lookAt(x+.8,.5,z);}
 else{const v=(u-.8)/.2;cam.position.set(W/2,3+v*14,D+4+v*6);cam.lookAt(W/2,0,D/2);}}
const T0=performance.now(),tFix=q.get('t');function frame(){camAt(tFix!==null?+tFix:document.querySelector('#fly').checked?(performance.now()-T0)/1000:0);renderer.render(scene,cam);requestAnimationFrame(frame);}frame();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
