<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>树云转镜对照 · REACode 重构版</title><style>body{margin:0;font:14px/1.5 system-ui;background:#edf3f2;color:#203b42}header{padding:12px}label,button{margin:5px}iframe{width:100%;height:78vh;border:0}p{margin:5px}input[type=range]{max-width:35vw}</style><header><a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="atlas-live.html">GPU图集</a> · <b>树/云转镜 · 共享World</b><p>1849427564034498642 / 1852334860137849222：原片强调稳定转镜与树云共用技术。本地保留八张水平视图，修复旋转锚点和正交选图；未把“octagonal”直接等同八张图，原卡片几何/完整俯仰与云体层次仍有差距。</p><label>网格<select id="grid"><option value="mixed">混合</option><option value="quad">四边形</option></select></label><label><input type="checkbox" id="trees" checked>树用impostor</label><label><input type="checkbox" id="clouds" checked>云</label><label>转镜<input id="angle" type="range" min="0" max="360" value="50"></label><button id="near">近景</button><button id="all">全景</button><button id="cloudView">低机位看云</button><output id="status">加载…</output></header><iframe id="scene" title="共享树云转镜场景"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function load(){api=null;window.impostorReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}function sync(){if(!api)return;api.view.setDebug('impostor',$('#trees').checked);api.view.setDebug('clouds',$('#clouds').checked);api.view.yaw=+$('#angle').value*Math.PI/180;api.view.updateCamera()}
$('#scene').onload=()=>{const ready=()=>{api=$('#scene').contentWindow.rea;if(!api?.view?.vegetation?.impostorFields){setTimeout(ready,100);return}sync();window.impostorReview={api};$('#status').textContent='已接共享树/云材质与图集';};ready()};$('#grid').onchange=load;for(const id of ['trees','clouds','angle'])$('#'+id).oninput=sync;$('#near').onclick=()=>{if(api){api.view.distance*=.7;api.view.updateCamera()}};$('#all').onclick=()=>api?.view.frameTown();$('#cloudView').onclick=()=>{if(api){api.view.setDebug('moody',true);api.view.target.set(0,2,0);api.view.distance=25;api.view.pitch=.1;api.view.updateCamera()}};load();
</script></html>
