<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>导航图近似视线 · REACode重构版</title><style>body{margin:24px;background:#edf4f0;color:#20343c;font:15px/1.6 system-ui}canvas{background:#d5e3dc;max-width:100%;border-radius:12px}input,select{font:inherit;margin:6px}a{color:#276e86}</style><h1>沿导航门户采样近似视线</h1><p>点击格子移动观察点。红线逐边穿过真实多边形门户，白点是终点；绿色格子至少被一条采样射线穿过。角度间隙可能漏掉小区域，导航阻挡不等同于真实光学遮挡。</p><label><input id="mixed" type="checkbox" checked>混合网格</label><select id="mode"><option value="wall">封闭墙</option><option value="tunnel">同柱洞顶与下层通道</option></select><label>射线数<select id="rays"><option>24</option><option selected>96</option><option>192</option></select></label><div id="stats"></div><canvas width="1000" height="650"></canvas><p><a href="index.html?scene=terrain&on=visibility" target="_top">真实场景诊断</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/visibility-review.md">逐帧记录</a></p><script type="module">
import{buildMixedGrid,buildQuadGrid}from'./src/core/grid.js';import{World}from'./src/core/world.js';import{buildLayeredNav}from'./src/world/layerednav.js';import{castNavVisibility}from'./src/core/nav-visibility.js';
let world,nav,source,result,project;const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function draw(){result=castNavVisibility(nav,source,{rays:Number(document.querySelector('#rays').value),maxRange:8});const grid=world.grid,pts=grid.verts,minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minZ=Math.min(...pts.map(p=>p.z)),maxZ=Math.max(...pts.map(p=>p.z)),scale=Math.min(900/(maxX-minX),550/(maxZ-minZ));project=p=>[500+(p.x-(minX+maxX)/2)*scale,325+(p.z-(minZ+maxZ)/2)*scale];ctx.clearRect(0,0,1000,650);const seen=new Set(result.visibleNodes.map(id=>nav.nodes[id].cell.id));for(const c of world.cells){ctx.beginPath();c.pts.forEach((p,i)=>i?ctx.lineTo(...project(p)):ctx.moveTo(...project(p)));ctx.closePath();ctx.fillStyle=nav.at(c,1)<0?'#7c8c95':seen.has(c.id)?'#9fbea5':'#bdcdd0';ctx.fill();ctx.strokeStyle='#7b9794';ctx.stroke();}if(result.ok){const o=project(result.origin);for(const r of result.rays){ctx.strokeStyle='#c86c6188';ctx.beginPath();ctx.moveTo(...o);ctx.lineTo(...project(r));ctx.stroke();ctx.fillStyle='#fff7e7';ctx.beginPath();ctx.arc(...project(r),2,0,7);ctx.fill();}ctx.fillStyle='#af3d34';ctx.beginPath();ctx.arc(...o,6,0,7);ctx.fill();}document.querySelector('#stats').textContent=`${nav.nodes.length}节点 · ${result.visibleNodes.length}采样可见节点 · ${result.rays.length}射线 · ${result.stats.edgeTests}次边测试 / ${result.stats.portalCrossings}次过门`;window.visibilityReview={world,nav,source,result};}
function reset(){world=new World(document.querySelector('#mixed').checked?buildMixedGrid({radius:6,seed:5}):buildQuadGrid({radius:4,seed:5}));for(const c of world.cells){world.fill(c,1,{rock:true});if(Math.abs(c.cx)<.45&&Math.abs(c.cz)<1.5)world.setSolid(c,document.querySelector('#mode').value==='wall'?2:3,true,{rock:true});}nav=buildLayeredNav(world,{maxStep:0});source=nav.nodes.filter(n=>n.floor===1).reduce((a,b)=>Math.abs(b.x+1.5)+Math.abs(b.z)<Math.abs(a.x+1.5)+Math.abs(a.z)?b:a).id;draw();}
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*650/r.height;source=nav.nodes.filter(n=>n.floor===1).reduce((a,b)=>{const A=project(a),B=project(b);return Math.hypot(B[0]-x,B[1]-y)<Math.hypot(A[0]-x,A[1]-y)?b:a}).id;draw()};for(const id of ['mixed','mode'])document.querySelector('#'+id).onchange=reset;document.querySelector('#rays').onchange=draw;reset();
</script></html>
