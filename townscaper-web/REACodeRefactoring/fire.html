<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>火焰混合与收缩验收 · REACode重构版</title><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.5 system-ui}header{padding:12px 20px}input,button,select{font:inherit;margin:5px}iframe{width:100%;height:80vh;border:0}a{color:#276e86}</style><header><b>真实World · Max混合与快速收缩</b> · <a href="pipeline.html">管线</a><p>保留已有火焰主体，复核两段531帧；年龄现按各粒子实际寿命归一，出生即有尺寸。Points软圆近似方片，不声称原视频像素复刻或动态光照。</p><label><input id="mixed" type="checkbox">混合网格</label><label>混合<select id="blend"><option value="max">Max</option><option value="add">Add 对照</option></select></label><label>收缩<select id="shrink"><option value="2">快速（二次）</option><option value="1">线性对照</option></select></label><button id="reset">重置</button><span id="stats">加载中</span></header><iframe id="scene" title="真实场景火焰"></iframe><script type="module">
import {makeRng} from './src/core/noise.js';const frame=document.querySelector('#scene');let ready=false,generation=0;
function appearance(){if(ready)frame.contentWindow.rea.view.effects.setFireAppearance({blend:document.querySelector('#blend').value,shrink:Number(document.querySelector('#shrink').value)})}
function reset(){if(!ready)return;const r=frame.contentWindow.rea,w=r.world,c=w.cells.filter(c=>w.top(c)>0).reduce((a,b)=>Math.hypot(a.cx,a.cz)<Math.hypot(b.cx,b.cz)?a:b),e=r.view.effects;e.clearFire();e.random=makeRng(17);e.setFireSources([{x:c.cx,y:w.top(c)*r.view.levelHeight+.85,z:c.cz}]);e.showFire=true;appearance();window.fireReview={ready:true};document.querySelector('#stats').textContent='真实World火源 · 固定900粒子池'}
frame.onload=()=>{const version=generation;function check(){if(version!==generation)return;ready=!!frame.contentWindow.rea?.view.atmosphere.field;if(ready)reset();else requestAnimationFrame(check)}check()};for(const id of ['blend','shrink'])document.querySelector('#'+id).onchange=appearance;document.querySelector('#reset').onclick=reset;document.querySelector('#mixed').onchange=()=>{ready=false;window.fireReview={ready:false};load()};function load(){generation++;frame.src='index.html?scene=town&grid='+(document.querySelector('#mixed').checked?'mixed':'quad')}load();
</script></html>
