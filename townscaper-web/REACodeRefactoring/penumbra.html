<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三场半影 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:68vh;border:0}a{color:#26758a}label{margin-right:15px}canvas{vertical-align:middle;margin:6px}#maps{image-rendering:pixelated}</style><header><b>共享World · 三场水面半影与太阳控制</b> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/penumbra-review.md">学习证据</a><p>1305951750638231552：正常、向内收、大体素三次阴影。1313840428685447170：日照及太阳控制。拖动太阳盘改变方位/高度，实际渲染器与水面阴影同步。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边形</option></select></label><label>方位<input id="az" type="range" min="-180" max="180" value="35"></label><label>高度<input id="elev" type="range" min="8" max="85" value="38"></label><label><input id="enable" type="checkbox" checked>三场水面阴影</label><select id="mode"><option value="0">三场合成</option><option value="1">正常</option><option value="2">内收</option><option value="3">大体素</option></select><div><canvas id="gizmo" width="180" height="100" aria-label="太阳方位与高度拖动盘"></canvas><canvas id="maps" width="640" height="120"></canvas><span id="status">加载…</span></div><p>读取同一World的顶面高度，以世界尺度投影到水面；粗格保留最高遮挡。不是洞内/悬挑/形变表面的精确3D阴影，屋顶与建筑PCF仍保留。三场开关关闭时恢复原水面投影。</p></header><iframe id="scene" title="共享World实际阴影场景"></iframe><script type="module">
const $=s=>document.querySelector(s);let api,drawn;function load(){api=null;window.penumbraReview=null;$('#scene').src='index.html?scene=town&grid='+$('#grid').value}
function apply(){if(!api)return;api.view.setSunPosition(+$('#az').value,+$('#elev').value);api.view.setPenumbra($('#enable').checked);api.view.penumbra?.setMode(+$('#mode').value)}
$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh){setTimeout(ready,100);return}api=r;window.penumbraReview={api};apply()};ready()};$('#grid').onchange=load;for(const id of ['az','elev','enable','mode'])$('#'+id).oninput=apply;
const canvas=$('#gizmo');function point(e){const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));$('#az').value=Math.round(x*360-180);$('#elev').value=Math.round(85-y*77);apply()};canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);point(e)};canvas.onpointermove=e=>{if(canvas.hasPointerCapture(e.pointerId))point(e)};
function draw(){const ctx=canvas.getContext('2d'),x=(+$('#az').value+180)/360*180,y=(85-$('#elev').value)/77*100;ctx.fillStyle='#2f5867';ctx.fillRect(0,0,180,100);ctx.strokeStyle='#8cafb6';ctx.strokeRect(1,1,178,98);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,100);ctx.moveTo(0,y);ctx.lineTo(180,y);ctx.stroke();ctx.fillStyle='#ffd66b';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();const layer=api?.view.penumbra,f=layer?.field;if(f&&f!==drawn){drawn=f;const c=$('#maps'),cctx=c.getContext('2d');for(let k=0;k<4;k++){const a=[f.normal,f.pulled,f.big,f.alpha][k],off=document.createElement('canvas');off.width=f.nx;off.height=f.nz;const oc=off.getContext('2d'),im=oc.createImageData(f.nx,f.nz);for(let i=0;i<a.length;i++){const v=255*(1-a[i]);im.data.set([v,v,v,255],i*4)}oc.putImageData(im,0,0);cctx.drawImage(off,k*160,18,156,100);cctx.fillStyle='#20343c';cctx.fillText(['正常','内收','大体素','合成/陆地剔除'][k],k*160+5,12)}$('#status').textContent=`${f.nx}×${f.nz} · World ${f.version} · 方位${$('#az').value}° 高度${$('#elev').value}°`;}requestAnimationFrame(draw)}load();draw();
</script></html>
