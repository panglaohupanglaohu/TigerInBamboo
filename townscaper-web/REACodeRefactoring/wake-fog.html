<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 船迹与背景雾</title><style>body{margin:0;font:14px system-ui;background:#eef4f3;color:#20343c}header{padding:12px}iframe{width:100%;height:80vh;border:0}label,button{margin:5px}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>共享场景 · 船迹与背景雾</b><p>尾迹默认走 <b>corridor 档</b>（原片 901469409579061248 的形制：两条**恒定间距**的白边线 + 按航迹成排、排内跳格的泡沫，远端边线比泡沫拖得远）；<code>旧 V 档</code>只留作 A/B 对照。雾分两层：① 岛周<b>大圆盘</b>（内外缘都渐隐的环带）；② <b>贴水面的薄雾片</b>（12 片软边卡片，随风场平流、撞到世界体素就侧向绕行或停等、只在高度带以下；深度测试让岛体挡住它）。浓度与<b>流速</b>（0 冻结 / 1 原速 / 2 双倍）在右侧“雾参数”。仍是平面卡片，不是体积雾；原片是加速 gif，速度只取本地档位。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>尾迹<select id="wake"><option value="">corridor（原片形制）</option><option value="v">旧 Kelvin V（对照）</option></select></label><label><input type="checkbox" id="follow">跟随第一条船</label><button id="island">看岛屿全景</button><output id="status">加载…</output><output id="fogStats">雾读数…</output></header><iframe id="scene" title="真实船迹与雾"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function load(){api=null;window.wakeFog=null;$('#scene').src='index.html?scene=fusion&grid='+$('#grid').value+($('#wake').value?'&wake='+$('#wake').value:'');}$('#scene').onload=()=>{const ready=()=>{api=$('#scene').contentWindow.rea;if(!api?.view.boats.boats.length){setTimeout(ready,100);return}api.view.setDebug('fog',true);api.view.setDebug('boats',true);window.wakeFog={api};window.atmosphereFog=()=>api.view.atmosphere.fogStats();$('#status').textContent='船迹 '+api.view.boats.mode+' 档 · 雾浓度默认0.35';const tick=()=>{if(!api)return;const f=api.view.atmosphere.fogStats();$('#fogStats').textContent='雾片 '+f.count+' 片 · 高度 '+f.minY.toFixed(2)+'–'+f.maxY.toFixed(2)+' · band '+f.band+' · 绕行 '+f.detours+' / 停等 '+f.blocked+' / 回卷 '+f.wraps+' · 体内 '+f.insolid+' · 浓度 '+f.opacity+' 流速 '+f.speed+' · 实例 '+f.instanceCount;requestAnimationFrame(tick);};tick();};ready();};function follow(){if(api&&$('#follow').checked){const b=api.view.boats.boats[0];if(b){api.view.target.copy(b.mesh.position);api.view.distance=7;api.view.pitch=1;api.view.updateCamera();}}requestAnimationFrame(follow);}$('#island').onclick=()=>{if(api){$('#follow').checked=false;api.view.frameTown();}};$('#grid').onchange=load;$('#wake').onchange=load;load();follow();
</script></html>
