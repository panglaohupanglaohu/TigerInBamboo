<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 船迹与背景雾</title><style>body{margin:0;font:14px system-ui;background:#eef4f3;color:#20343c}header{padding:12px}iframe{width:100%;height:80vh;border:0}label,button{margin:5px}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>共享场景 · 船迹与背景雾</b><p>现有绕岛船的V形带状尾迹，新增按时间连续采样；原片靠岸船的断续泡沫/舷侧喷溅仍待补。雾是淡色圆盘近似，外缘渐隐；浓度和相对流速可在右侧“雾参数”调整，未复现体积雾或原片真实速度。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label><input type="checkbox" id="follow">跟随第一条船</label><button id="island">看岛屿全景</button><output id="status">加载…</output></header><iframe id="scene" title="真实船迹与雾"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function load(){api=null;window.wakeFog=null;$('#scene').src='index.html?scene=fusion&grid='+$('#grid').value;}$('#scene').onload=()=>{const ready=()=>{api=$('#scene').contentWindow.rea;if(!api?.view.boats.boats.length){setTimeout(ready,100);return}api.view.setDebug('fog',true);api.view.setDebug('boats',true);window.wakeFog={api};$('#status').textContent='船迹连续采样 · 雾浓度默认0.35';};ready();};function follow(){if(api&&$('#follow').checked){const b=api.view.boats.boats[0];if(b){api.view.target.copy(b.mesh.position);api.view.distance=7;api.view.pitch=1;api.view.updateCamera();}}requestAnimationFrame(follow);}$('#island').onclick=()=>{if(api){$('#follow').checked=false;api.view.frameTown();}};$('#grid').onchange=load;load();follow();
</script></html>
