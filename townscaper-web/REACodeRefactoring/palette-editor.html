<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 四角色盘实景编辑</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:12px}main{display:flex}iframe{width:75%;height:82vh;border:0}aside{width:25%;padding:12px;box-sizing:border-box}canvas{width:100%;max-width:300px}label{margin-right:12px}</style><header><a href="pipeline.html">← 管线</a> · <b>四角色盘：实景顶面编辑</b><p>sRGB插值已接共享View；下方白色三角仅为取样预览。视频中的OkHsl/OkLab、自由拖点与完整导出接口仍待补。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label><input id="enabled" type="checkbox" checked>应用到顶面</label><span id="status"></span></header><main><iframe id="scene" title="实际四角色盘"></iframe><aside><label>左上<input id="c0" type="color" value="#60885b"></label><label>右上<input id="c1" type="color" value="#dfad58"></label><label>左下<input id="c2" type="color" value="#448a99"></label><label>右下<input id="c3" type="color" value="#aa637c"></label><canvas id="patch" width="300" height="400"></canvas></aside></main><script type="module">
import{makePalettePatch,samplePalettePatch}from'./src/core/palette-patch.js';const $=s=>document.querySelector(s);let api;const rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);function apply(){const colors=makePalettePatch([0,1,2,3].map(i=>rgb($('#c'+i).value))),ctx=$('#patch').getContext('2d'),im=ctx.createImageData(300,400);for(let y=0;y<400;y++)for(let x=0;x<300;x++){let u=x/299,v=y/299,w=0;if(y>=300){w=(y-300)/99;if(Math.abs(u-.5)>(1-w)*.5+1/600)continue;u=(u-.5)/Math.max(1e-6,1-w)+.5;v=1;}const c=samplePalettePatch(colors,Math.max(0,Math.min(1,u)),v,w);im.data.set([...c.map(v=>Math.round(v*255)),255],(y*300+x)*4)}ctx.putImageData(im,0,0);if(api){api.view.setGroundPalettePatch($('#enabled').checked?colors:null);$('#status').textContent='World '+api.world.version+' · 仅着色参数'}return colors}
function load(){api=null;window.paletteEditor=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.paletteEditor={api,apply};apply()};ready()};$('#grid').onchange=load;for(const id of['c0','c1','c2','c3','enabled'])$('#'+id).oninput=apply;load();
</script></html>
