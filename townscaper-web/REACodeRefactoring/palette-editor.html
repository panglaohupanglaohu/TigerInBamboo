<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 四角色盘实景编辑</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:12px}main{display:flex}iframe{width:75%;height:82vh;border:0}aside{width:25%;padding:12px;box-sizing:border-box}canvas{width:100%;max-width:300px}label{margin-right:12px}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>四角色盘：实景顶面编辑</b><p>sRGB插值已接共享View；下方白色三角仅为取样预览。第 56 批：页底新增节点式调色图（自由拖点、右键新建、OkHsl/OkLab/Srgb、导出，可贴实景顶面）。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label><input id="enabled" type="checkbox" checked>应用到顶面</label><span id="status"></span></header><main><iframe id="scene" title="实际四角色盘"></iframe><aside><label>左上<input id="c0" type="color" value="#60885b"></label><label>右上<input id="c1" type="color" value="#dfad58"></label><label>左下<input id="c2" type="color" value="#448a99"></label><label>右下<input id="c3" type="color" value="#aa637c"></label><canvas id="patch" width="300" height="400"></canvas></aside></main><script type="module">
import{makePalettePatch,samplePalettePatch}from'./src/core/palette-patch.js';const $=s=>document.querySelector(s);let api;const rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);function apply(){const colors=makePalettePatch([0,1,2,3].map(i=>rgb($('#c'+i).value))),ctx=$('#patch').getContext('2d'),im=ctx.createImageData(300,400);for(let y=0;y<400;y++)for(let x=0;x<300;x++){let u=x/299,v=y/299,w=0;if(y>=300){w=(y-300)/99;if(Math.abs(u-.5)>(1-w)*.5+1/600)continue;u=(u-.5)/Math.max(1e-6,1-w)+.5;v=1;}const c=samplePalettePatch(colors,Math.max(0,Math.min(1,u)),v,w);im.data.set([...c.map(v=>Math.round(v*255)),255],(y*300+x)*4)}ctx.putImageData(im,0,0);if(api){api.view.setGroundPalettePatch($('#enabled').checked?colors:null);$('#status').textContent='World '+api.world.version+' · 仅着色参数'}return colors}
function load(){api=null;window.paletteEditor=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.paletteEditor={api,apply};apply()};ready()};$('#grid').onchange=load;for(const id of['c0','c1','c2','c3','enabled'])$('#'+id).oninput=apply;load();
</script>
<!-- 第 56 批 C11：1712088611934371876 节点式调色图（追加；上面原四角编辑保留不动） -->
<style>#pg{display:flex;gap:16px;padding:12px;background:#2f2f2f;color:#ddd;font:13px system-ui}#pg canvas{background:#333;cursor:crosshair;max-width:none}#pgSide{width:300px}#pgSide b{color:#fff}#pgMenu{position:fixed;display:none;background:#f2f2f2;color:#111;border:1px solid #888;box-shadow:2px 2px 6px #0006;z-index:9;min-width:130px}#pgMenu div{padding:4px 14px;cursor:default}#pgMenu div:hover{background:#9fc6f0}#pgNode .row{display:flex;align-items:center;gap:6px;margin:3px 0}#pgNode .row input[type=range]{flex:1}#pgNode .row span{width:54px;font:12px monospace}.pgTab{background:#555;color:#ddd;border:0;padding:3px 8px;margin-right:2px}.pgTab.on{background:#888;color:#fff}#pgStrip{height:18px;width:100%;image-rendering:pixelated;margin-top:6px}#pg select,#pg button{font:12px system-ui}</style>
<section id="pg"><canvas id="pgCanvas" width="440" height="520" title="拖动节点；右键：New node / New gradient / New triangle"></canvas>
<div id="pgSide"><b>节点式调色图（第 56 批）</b><p>拖节点改形；右键菜单新建节点 / 色带 / 三角；矩形和三角离散成小三角面片平涂。选中节点用 RGB / LAB / HSL（OkHsl）滑条取色。</p>
<div id="pgNode"><div><button class="pgTab on" data-m="rgb">RGB</button><button class="pgTab" data-m="lab">LAB</button><button class="pgTab" data-m="hsl">HSL</button> <span id="pgSel">未选节点</span></div><div id="pgSliders"></div></div>
<p>色带空间 <select id="pgGradSpace"><option value="okhsl">OkHsl</option><option value="oklab">OkLab</option><option value="srgb">Srgb</option></select>　面片空间 <select id="pgFacetSpace"><option value="okhsl">OkHsl</option><option value="oklab" selected>OkLab</option><option value="srgb">Srgb</option></select></p>
<p>细分 <input id="pgDiv" type="number" min="1" max="16" value="8" style="width:48px"> <label><input id="pgApply" type="checkbox">应用到实景顶面（离散面片取色）</label></p>
<p><button id="pgExport">导出 JSON + 调色板</button> <button id="pgImport">导入</button></p><canvas id="pgStrip" width="1" height="1"></canvas><textarea id="pgJson" rows="4" style="width:100%;font:11px monospace"></textarea><div id="pgStat"></div></div></section>
<div id="pgMenu"><div data-a="node">New node</div><div data-a="gradient">New gradient</div><div data-a="triangle">New triangle</div></div>
<script type="module">
import*as PG from'./src/core/palette-graph.js';import{srgbToOklab,oklabToSrgb}from'./src/core/oklab.js';import{srgbToOkhsl,okhslToSrgb}from'./src/core/okhsl.js';
const $=s=>document.querySelector(s),cv=$('#pgCanvas'),ctx=cv.getContext('2d');let g=PG.defaultPaletteGraph({div:8}),sel=null,picked=[],drag=null,mode='rgb',menuAt=null,gpm=null;
const X0=-.25,Y0=-.12,S=150,toPx=(x,y)=>[(x-X0)*S+20,(y-Y0)*S+10],toG=(px,py)=>[(px-20)/S+X0,(py-10)/S+Y0];
const css=c=>`rgb(${c.map(v=>Math.round(Math.max(0,Math.min(1,v))*255)).join(',')})`;
function draw(){ctx.fillStyle='#333';ctx.fillRect(0,0,cv.width,cv.height);for(const f of PG.facets(g)){ctx.beginPath();f.pts.forEach(([x,y],i)=>{const[p,q]=toPx(x,y);ctx[i?'lineTo':'moveTo'](p,q)});ctx.closePath();ctx.fillStyle=ctx.strokeStyle=css(f.rgb);ctx.lineWidth=.6;ctx.fill();ctx.stroke()}
 for(const r of g.gradients){const cols=PG.gradientColors(g,r),[a,b]=r.nodes.map(id=>PG.nodeById(g,id)),[ax,ay]=toPx(a.x,a.y),[bx,by]=toPx(b.x,b.y),n=cols.length;for(let k=0;k<n;k++){ctx.fillStyle=css(cols[k]);const t0=k/n,t1=(k+1)/n;ctx.save();ctx.translate(ax+(bx-ax)*t0,ay+(by-ay)*t0);ctx.rotate(Math.atan2(by-ay,bx-ax));ctx.fillRect(0,-6,Math.hypot(bx-ax,by-ay)/n+.6,12);ctx.restore()}}
 for(const n of g.nodes){const[p,q]=toPx(n.x,n.y);ctx.fillStyle=css(n.rgb);ctx.fillRect(p-8,q-8,16,16);ctx.strokeStyle=n.id===sel?'#fff':picked.includes(n.id)?'#ff0':'#111';ctx.lineWidth=n.id===sel?2.5:1.2;ctx.strokeRect(p-8,q-8,16,16)}
 const st=PG.paletteStrip(g),sc=$('#pgStrip');sc.width=st.width;sc.height=1;sc.getContext('2d').putImageData(new ImageData(st.data,st.width,1),0,0);$('#pgStat').textContent=`${g.nodes.length} 节点 · ${g.quads.length} 矩形 · ${g.tris.length} 三角 · ${g.gradients.length} 色带 · ${PG.facets(g).length} 面片 · 调色板 ${st.width} 色`;window.paletteGraph={g,PG,applyWorld,stats:()=>({nodes:g.nodes.length,facets:PG.facets(g).length,palette:st.width,gpm:gpm?.stats??null})};}
function hitNode(px,py){for(const n of[...g.nodes].reverse()){const[p,q]=toPx(n.x,n.y);if(Math.abs(px-p)<10&&Math.abs(py-q)<10)return n}return null}
function sliders(){const box=$('#pgSliders');box.innerHTML='';if(sel==null){$('#pgSel').textContent='未选节点';return}const n=PG.nodeById(g,sel);$('#pgSel').textContent='节点 '+sel;
 const conv={rgb:[c=>c,c=>c,[[0,1],[0,1],[0,1]]],lab:[c=>srgbToOklab(...c),v=>oklabToSrgb(...v).map(x=>Math.max(0,Math.min(1,x))),[[0,1],[-.4,.4],[-.4,.4]]],hsl:[c=>srgbToOkhsl(...c),v=>okhslToSrgb(...v),[[0,1],[0,1],[0,1]]]}[mode];
 const vals=conv[0](n.rgb);vals.forEach((v,i)=>{const row=document.createElement('div');row.className='row';const r=document.createElement('input');r.type='range';r.min=conv[2][i][0];r.max=conv[2][i][1];r.step=.001;r.value=v;const s=document.createElement('span');s.textContent=(+v).toFixed(4);r.oninput=()=>{vals[i]=+r.value;s.textContent=vals[i].toFixed(4);PG.setNodeColor(g,sel,conv[1](vals));draw();applyWorld()};row.append(mode.toUpperCase()[i]??'',r,s);box.append(row)})}
document.querySelectorAll('.pgTab').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.pgTab').forEach(x=>x.classList.toggle('on',x===b));sliders()});
cv.onmousedown=e=>{if(e.button!==0)return;$('#pgMenu').style.display='none';const n=hitNode(e.offsetX,e.offsetY);if(n){sel=n.id;if(e.shiftKey){picked=picked.includes(n.id)?picked.filter(i=>i!==n.id):[...picked,n.id].slice(-3)}drag=n.id;sliders();draw()}};
cv.onmousemove=e=>{if(drag==null)return;const[x,y]=toG(e.offsetX,e.offsetY);PG.moveNode(g,drag,x,y);draw()};window.addEventListener('mouseup',()=>{if(drag!=null){drag=null;applyWorld()}});
cv.oncontextmenu=e=>{e.preventDefault();menuAt=toG(e.offsetX,e.offsetY);const m=$('#pgMenu');m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';m.style.display='block'};
$('#pgMenu').onclick=e=>{const a=e.target.dataset.a;if(!a)return;$('#pgMenu').style.display='none';const[x,y]=menuAt,sp=$('#pgGradSpace').value;
 if(a==='node'){sel=PG.addNode(g,{x,y,rgb:[1,1,1]});}
 else if(a==='gradient'){const a0=PG.addNode(g,{x:x-.3,y,rgb:[.69,.38,.35]}),a1=PG.addNode(g,{x:x+.3,y,rgb:[.54,.38,.78]});PG.addGradient(g,a0,a1,{steps:12,space:sp});sel=a1;}
 else if(a==='triangle'){// 片中 New triangle：以选中的两个节点（shift 点选；默认矩形底边两角）+ 右键处新白节点
  const q=g.quads[0],pair=picked.length>=2?picked.slice(-2):[q.nodes[2],q.nodes[3]],w=PG.addNode(g,{x,y,rgb:[1,1,1]});PG.addTriangle(g,[...pair,w],{div:Math.max(1,(+$('#pgDiv').value)>>1),space:$('#pgFacetSpace').value});sel=w;}
 picked=[];sliders();draw();applyWorld()};
$('#pgGradSpace').onchange=()=>{for(const r of g.gradients)PG.setSpace(g,r.id,$('#pgGradSpace').value);draw()};
$('#pgFacetSpace').onchange=()=>{for(const p of[...g.quads,...g.tris])PG.setSpace(g,p.id,$('#pgFacetSpace').value);draw();applyWorld()};
$('#pgDiv').onchange=()=>{const d=Math.max(1,Math.min(16,Math.round(+$('#pgDiv').value)));for(const q of g.quads)q.div=d;for(const t of g.tris)t.div=Math.max(1,d>>1);draw();applyWorld()};
$('#pgExport').onclick=()=>{const j=PG.exportGraph(g);$('#pgJson').value=j;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='palette-graph.json';a.click()};
$('#pgImport').onclick=()=>{try{g=PG.importGraph($('#pgJson').value);sel=null;sliders();draw();applyWorld()}catch(e){$('#pgStat').textContent='导入失败：'+e.message}};
async function applyWorld(){const on=$('#pgApply').checked,api=window.paletteEditor?.api;if(!api)return;
 if(!gpm){const w=$('#scene').contentWindow;gpm=(await w.Function('return import("./src/world/ground-palette-map.js")')()).attachGroundPaletteMap(api.view)}
 if(on){$('#enabled').checked=false;api.view.setGroundPalettePatch(null);const r=PG.colorWorldByGraph(api.world,g);gpm.setCellColors({top:r.rgb});gpm.stats.facetsUsed=r.facetsUsed}gpm.set(on)}
$('#pgApply').onchange=applyWorld;$('#scene').addEventListener('load',()=>{gpm=null;const wait=()=>{if(!window.paletteEditor?.api)return setTimeout(wait,150);if($('#pgApply').checked)applyWorld()};wait()});
if(new URLSearchParams(location.search).get('graph')==='1')$('#pgApply').checked=true;
sel=g.nodes[0].id;sliders();draw();
</script></html>
