<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 旋涡笔触与可变密度</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:14px}label{margin-right:15px}iframe{width:100%;height:calc(100vh - 160px);border:0}p{margin:8px 0}</style><header><a href="pipeline.html" target="_top">← 重构管线</a> · <b>实际地形：旋涡笔触与可变密度</b><p>保留旧噪声作对照；新模式采用局部角度场与独立低频密度场。原作atlas、受控跨崖采样、配色及反射尚未复现。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>模式 <select id="mode"><option value="0">旧三档</option><option value="1">旋涡＋柔边</option><option value="2" selected>旋涡＋可变密度</option></select></label><label>旋涡 <input id="swirl" type="range" min="0" max="6" step=".1" value="2.3"></label><label>密度变化 <input id="density" type="range" min="0" max="1" step=".05" value=".55"></label><label><input id="segments" type="checkbox" checked>浅层理</label><span id="status">加载…</span></header><iframe id="scene" title="共享地形笔触"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function apply(){if(!api)return;const m=+$('#mode').value;api.view.setDebug('blotch',true);api.view.setBlotchStyle({mode:m?1:0,swirl:+$('#swirl').value,density:m===2?+$('#density').value:0});api.view.setStrataStyle({mode:$('#segments').checked?1:0,strength:.2});$('#status').textContent=`World ${api.world.version} · 仅更新着色参数`;}function load(){api=null;window.blotchReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.blotchReview={api,apply};apply()};ready()};$('#grid').onchange=load;for(const id of ['mode','swirl','density','segments'])$('#'+id).oninput=apply;load();
</script></html>
