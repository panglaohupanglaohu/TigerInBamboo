<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 笔触图集 / 受控跨崖渗漏 / 旋涡笔触</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:14px}label{margin-right:15px}iframe{width:100%;height:calc(100vh - 210px);border:0}p{margin:8px 0}code{background:#dfe9e8;padding:0 3px;border-radius:3px}</style><header><a href="pipeline.html" target="_top">← 重构管线</a> · <b>实际地形：笔触图集 + 受控跨崖渗漏 + 旋涡笔触</b><p>两路着色：<b>图集笔触</b>（<code>?shade=blotchatlas</code> · 128² 可平铺图集 + 共享 World 崖肩距离场 + 崖面渗漏到等深线收口 + 崖肩收边）与<b>旧噪声</b>（旋涡 + 独立低频密度场）。<b>翻崖舌头</b>把顶面色块沿崖边翻过崖肩、垂到 <code>depth×图集强度</code> 的世界深度，并带一圈细深描边。图集/距离场/渗漏深度都是运行时可调。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>模式 <select id="mode"><option value="0">旧三档</option><option value="1">旋涡＋柔边</option><option value="2" selected>旋涡＋可变密度</option><option value="3">柔和颜料斑（1480635131614355459）</option></select></label><label>旋涡 <input id="swirl" type="range" min="0" max="6" step=".1" value="2.3"></label><label>密度变化 <input id="density" type="range" min="0" max="1" step=".05" value=".55"></label><label><input id="segments" type="checkbox" checked>浅层理</label><label><input id="atlas" type="checkbox">图集笔触＋受控渗漏</label><label><input id="tongue" type="checkbox">翻崖舌头</label><label>渗漏深度 <input id="bleed" type="range" min="0" max=".5" step=".01" value=".14" style="width:90px"></label><label>笔触尺度 <input id="scale" type="range" min=".03" max=".2" step=".005" value=".09" style="width:90px"></label><label>强度 <input id="strength" type="range" min="0" max="1" step=".05" value="1" style="width:80px"></label><span id="status">加载…</span><br><span id="atlasOut">图集未开</span></header><iframe id="scene" title="共享地形笔触"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;const P=()=>api?.view?.shading?.blotchParams?.();
function apply(){if(!api)return;
  const atlas=$('#atlas').checked, tongue=$('#tongue').checked;
  // 旧噪声档（blotch-pattern.js）保留作对照
  api.view.setDebug('blotch',!atlas);
  const m=+$('#mode').value;api.view.setBlotchStyle({mode:m===3?2:(m===0?0:1),swirl:+$('#swirl').value,density:m===2?+$('#density').value:0,strength:1});
  api.view.setStrataStyle({mode:$('#segments').checked?1:0,strength:.2});
  api.view.setDebug('blotchatlas',atlas);
  if(atlas)api.view.shading.setBlotchRim({bleed:+$('#bleed').value,scale:+$('#scale').value,strength:+$('#strength').value,swirl:+$('#swirl').value,density:m===2?+$('#density').value:.55,segments:$('#segments').checked?.12:0});
  api.view.shading.setBlotchTongue(atlas&&tongue,{depth:.55,mix:.85,lobe:2.2,topReach:.32});
  const q=P();
  $('#status').textContent=`World ${api.world.version} · ${atlas?'图集笔触':'旧噪声'}`;
  $('#atlasOut').textContent=q?.on?`图集 ${q.atlasSize}² · 崖肩 ${q.rimCells} 格 / 场 ${q.rimRes}² · 渗漏 ${q.bleed.toFixed(2)} 世界单位 · 笔触 1/${(1/q.scale).toFixed(1)} 单位 · 强度 ${q.strength.toFixed(2)} · 舌头 ${q.tongue.on?'开（垂深 '+q.tongue.depth+'×强度, 顶带 '+q.tongue.topReach+' 格, '+q.tongue.color+'）':'关'}`:'图集未开（旧噪声档）';
}
function load(){api=null;window.blotchReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}
$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh?.geometry?.attributes?.aField?.count){setTimeout(ready,100);return}api=r;window.blotchReview={get api(){return api},apply,params:P,view:()=>api.view,world:()=>api.world};apply()};ready()};
$('#grid').onchange=load;for(const id of ['mode','swirl','density','segments','atlas','tongue','bleed','scale','strength'])$('#'+id).oninput=apply;load();
</script></html>
