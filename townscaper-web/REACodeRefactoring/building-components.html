<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 悬空房屋装饰分组</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 155px)}button{margin-right:12px}</style><header><b>悬空房屋 · 窗型分组</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/building-components-review.md">逐帧证据</a><p><button id="quad">四边网格</button><button id="mixed">混合网格</button><label><input id="surface" type="checkbox">约束求解门窗层</label><label><input id="facade" type="checkbox">六类墙饰（局部墙段）</label><button id="sample">悬空双塔示例</button><button id="bridge">连接 / 移除顶层桥</button> <span id="stats"></span></p><small>默认场景已使用实际建筑连通分组，悬空楼层不再共享空身份。保留已有钢架/门窗几何；六类装饰可选接同一墙段；拱门为表面图案，跨格整墙/真实拱洞与钢架WFC仍待迁移。</small></header><iframe id="scene" src="index.html?scene=town&grid=quad"></iframe><script>
const f=document.querySelector('#scene');let fixture=null;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.buildingReview=null;fixture=null;f.src='index.html?scene=town&grid='+kind;};
document.querySelector('#facade').onchange=()=>{if(document.querySelector('#facade').checked)document.querySelector('#surface').checked=true;};document.querySelector('#sample').onclick=()=>{const r=buildingReview,w=r.world;w.reset();const a=w.cells.find(c=>c.n===4&&Math.hypot(c.cx,c.cz)<.8),b=w.neighbor(a,0),c=b.edgeNeighbors.map(id=>w.cells[id]).find(c=>c&&c.id!==a.id&&!a.edgeNeighbors.includes(c.id));if(!c)throw Error('No three-cell chain');for(const cell of [a,b,c])w.fill(cell,1);for(const cell of [a,c]){w.setSolid(cell,5,true);w.setSolid(cell,6,true);w.color[cell.id]=cell.id%8;}fixture={a:a.id,b:b.id,c:c.id,on:false};r.view.worldMesh.invalidate();window.buildingFixture=fixture;};
document.querySelector('#bridge').onclick=()=>{if(!fixture)return;fixture.on=!fixture.on;buildingReview.world.setSolid(buildingReview.world.cells[fixture.b],6,fixture.on);buildingReview.view.worldMesh.invalidate();};
const timer=setInterval(()=>{const r=f.contentWindow.rea;if(!r?.view?.worldMesh)return;window.buildingReview=r;const facade=document.querySelector('#facade').checked;if(!!r.world.surfaceFacade!==facade){r.world.surfaceFacade=facade;r.view.worldMesh.invalidate();}const on=document.querySelector('#surface').checked;if(!!r.world.surfaceWFC!==on){r.world.surfaceWFC=on;r.view.worldMesh.invalidate();}document.querySelector('#stats').textContent='装饰组 '+(r.view.worldMesh.buildStats?.decorationGroups??'…');},150);addEventListener('pagehide',()=>clearInterval(timer));</script></html>
