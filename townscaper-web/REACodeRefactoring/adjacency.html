<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>几何邻接 · REACode重构版</title><style>body{margin:24px;background:#edf4f0;color:#20343c;font:15px/1.6 system-ui}button,select{font:inherit;padding:6px;margin:6px}canvas{max-width:100%;background:#d4e5e0;border-radius:12px}a{color:#276e86}</style><h1>从网格抽邻接 · 查询边候选</h1><p>点击边选择接口。黄色为当前边，绿色为库中平行、等长的边候选；灰色三角化内部边不参与查询。允许平移，不自动旋转。完整面轮廓与实体碰撞尚待建筑模块接入。</p><label><input id="mixed" type="checkbox" checked>混合网格</label><button id="corrupt">模拟边界邻接声明错误</button><div id="stats"></div><canvas width="1000" height="400"></canvas><p><a href="wfc.html">共享网格WFC</a> · <a href="index.html">首页</a> · <a href="pipeline.html">管线</a> · <a href="artifacts/coverage/adjacency-review.md">逐帧记录</a></p><script type="module">
import{buildFitTable,whichFits,selfCheck}from'./src/core/adjacency.js';import{buildMixedGrid,buildQuadGrid}from'./src/core/grid.js';import{World}from'./src/core/world.js';
const modules=[{name:'方形墙片',verts:[{x:0,z:0},{x:1,z:0},{x:1,z:1},{x:0,z:1}],tris:[[0,1,2],[0,2,3]]},{name:'三角墙片',verts:[{x:0,z:0},{x:1,z:0},{x:0,z:1}],tris:[[0,1,2]]},{name:'反向斜边',verts:[{x:0,z:1},{x:1,z:0},{x:1,z:1}],tris:[[0,1,2]]}],fit=buildFitTable(modules),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let world,selected={module:0,edge:'0|1'},segments=[];
const P=(p,m)=>[90+m*310+p[0]*160,90+p[2]*160];
function draw(){const matches=whichFits(fit,selected.module,selected.edge),audit=selfCheck(world.grid??{cells:world.cells},world);segments=[];ctx.clearRect(0,0,1000,400);fit.table.forEach((m,mi)=>{ctx.fillStyle='#20343c';ctx.fillText(m.name,90+mi*310,40);for(const[k,e]of m.edges){const a=P([m.merged[e.a].x,m.merged[e.a].y,m.merged[e.a].z],mi),b=P([m.merged[e.b].x,m.merged[e.b].y,m.merged[e.b].z],mi),boundary=m.boundary.includes(k),chosen=mi===selected.module&&k===selected.edge,match=matches.some(s=>s.module===mi&&s.edge===k);ctx.strokeStyle=chosen?'#b38000':match?'#178a59':'#8a9c9c';ctx.lineWidth=chosen||match?6:2;ctx.setLineDash(boundary?[]:[5,5]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();if(boundary)segments.push({a,b,module:mi,edge:k});}ctx.setLineDash([]);});document.querySelector('#stats').textContent=`共享World：${audit.cells}格 / ${audit.edgesChecked}条半边 / 声明不符${audit.mismatched} · 选边${selected.module}:${selected.edge} · 候选${matches.length} · 内部边不参与`;window.adjacencyReview={world,fit,selected,matches,audit};}
function reset(){world=new World(document.querySelector('#mixed').checked?buildMixedGrid({radius:6,seed:5}):buildQuadGrid({radius:4,seed:5}));draw()}
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),p=[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];let best=15,found;for(const s of segments){const d=s.b.map((v,i)=>v-s.a[i]),t=Math.max(0,Math.min(1,d.reduce((n,v,i)=>n+(p[i]-s.a[i])*v,0)/d.reduce((n,v)=>n+v*v,0))),dist=Math.hypot(...p.map((v,i)=>v-s.a[i]-t*d[i]));if(dist<best){best=dist;found=s;}}if(found){selected={module:found.module,edge:found.edge};draw()}};
document.querySelector('#mixed').onchange=reset;document.querySelector('#corrupt').onclick=()=>{const c=world.cells.find(c=>c.edgeNeighbors.includes(-1));c.edgeNeighbors[c.edgeNeighbors.indexOf(-1)]=123456;draw()};reset();
</script></html>
