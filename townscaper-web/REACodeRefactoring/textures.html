<script type="module">
import { TEXEL_SKIP_GLSL } from "./src/core/texel-skip.js";
/* ------------------------------------------------------------ 小工具：全屏片元着色器 */
const gl = document.getElementById('gl').getContext('webgl2', { antialias: false });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize() { DPR = Math.min(2, devicePixelRatio); W = innerWidth; H = innerHeight; for (const c of [gl.canvas, cv]) { c.width = W * DPR; c.height = H * DPR; } }
addEventListener('resize', () => { resize(); });
resize();
const VS = `#version 300 es
in vec2 p; out vec2 vP; void main() { vP = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const progs = {};
function prog(name, fs) {
  if (progs[name]) return progs[name];
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;\nin vec2 vP; out vec4 o;\nuniform vec2 uRes; uniform float uTime; uniform float uZoom; uniform float uMode; uniform sampler2D uTex;\n' + fs));
  gl.linkProgram(p); progs[name] = p; return p;
}
function draw(name, fs, extra = () => {}) {
  const p = prog(name, fs);
  gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
  gl.useProgram(p);
  const loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(p, 'uRes'), gl.canvas.width, gl.canvas.height);
  gl.uniform1f(gl.getUniformLocation(p, 'uTime'), performance.now() / 1000);
  gl.uniform1f(gl.getUniformLocation(p, 'uZoom'), zoom);
  gl.uniform1f(gl.getUniformLocation(p, 'uMode'), mode);
  extra(p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
let zoom = 1, mode = 0, tab = 'fwidth', anim = true;
addEventListener('wheel', (e) => { zoom *= e.deltaY > 0 ? 1.1 : 0.9; zoom = Math.min(40, Math.max(0.05, zoom)); }, { passive: true });

/* ------------------------------------------------------------ 1 抗锯齿线 */
const FS_FWIDTH = `
// 978211952504852480 "use fwidth, ddx and ddy to create crisp, pixel perfect, zoom independent, antialiased lines"
void main() {
  vec2 px = gl_FragCoord.xy;
  float z = uZoom * (0.6 + 0.4 * sin(uTime * 0.4));
  vec2 uv = (px - uRes * 0.5) / (60.0 * z) ;
  vec2 g = abs(fract(uv - 0.5) - 0.5);
  float d = min(g.x, g.y);
  float line;
  if (px.x < uRes.x * 0.5) {
    line = step(d, 0.03);                         // 左：固定宽度的 step —— 远处断线、近处变粗、锯齿
  } else {
    vec2 w = fwidth(uv);                          // 右：一个像素对应多少 uv
    vec2 a = 1.0 - smoothstep(vec2(0.0), w * 1.0, g);
    line = max(a.x, a.y);                         // 永远 1 像素宽、抗锯齿、和缩放无关
  }
  vec3 c = mix(vec3(0.93, 0.92, 0.88), vec3(0.16, 0.2, 0.24), line);
  if (abs(px.x - uRes.x * 0.5) < 1.0) c = vec3(0.85, 0.3, 0.25);
  o = vec4(c, 1.0);
}`;

/* ------------------------------------------------------------ 2 隔像素一条线 */
// 1241096929490149376 "I make the UVs speed past every 2nd pixel before sampling. It's core to my art style and what lets me get
// away with one 128² texture and crisp antialiased lines"：贴图里每隔一个像素是"线像素"；采样前把 UV 重新映射，
// 放大时让线的积分宽度约1屏幕像素，线性过滤保留亚像素过渡；缩小仍需mipmap。
let pixTex = null;
function makePixTex() {
  const N = 128, d = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = (y * N + x) * 4;
    const lineX = x % 2 === 1, lineY = y % 2 === 1;
    // 内容像素：4×4 个"砖"一组，组边界那条线像素画深色，组内的线像素和内容同色（隐形）
    const bx = Math.floor(x / 8), by = Math.floor(y / 8);
    const brick = ((bx * 37 + by * 91) % 5) / 5;
    let c = [210 - brick * 40, 190 - brick * 30, 160 - brick * 50];
    const edgeX = lineX && x % 8 === 7, edgeY = lineY && y % 8 === 7;
    if (edgeX || edgeY) c = [50, 45, 55];
    d.set([...c, 255], k);
  }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return t;
}
const FS_PIXEL = `
${TEXEL_SKIP_GLSL}
void main() {
  vec2 px = gl_FragCoord.xy;
  float z = uZoom * (1.0 + 7.0 * (0.5 + 0.5 * sin(uTime * 0.35)));
  vec2 t = (px - uRes * 0.5) / z + 64.0;
  vec3 c;
  if (px.x < uRes.x * 0.5) c = texture(uTex, (floor(t) + 0.5) / 128.0).rgb;   // 左：直接最近邻 —— 线跟着放大变粗
  else { vec2 w = fwidth(t); c = texture(uTex, vec2(skipTexel(t.x, w.x), skipTexel(t.y, w.y)) / 128.0).rgb; }
  if (abs(px.x - uRes.x * 0.5) < 1.0) c = vec3(0.85, 0.3, 0.25);
  o = vec4(c, 1.0);
}`;

/* ------------------------------------------------------------ 3 反差线（三角形上的迭代模拟） */
// 1482011744843223042：从程序化法线贴图的"反差"生成一像素细线；1482346496460828674 "a dedicated contrast texture system
// for the lines: an iterative simulation on the triangles that starts random and then tries to make contrasted edges
// different, and non-contrasted edges similar. A byproduct is a beautiful color gradient that help express connectivity"
import { buildMixedGrid } from './src/core/grid.js';
import { fbm } from './src/core/noise.js';
let contrast = null;
function initContrast() {
  const g = buildMixedGrid({ radius: 9, hexSize: 1, mergeRate: 0, seed: 11 });
  // "该有反差的边"：两侧高度档位不同（台地边、崖边）
  const lvl = g.cells.map((c) => Math.round(fbm(c.cx * 0.12 + 3, c.cz * 0.12, { octaves: 3, freq: 1.3, seed: 4 }) * 4));
  const val = g.cells.map(() => [Math.random(), Math.random(), Math.random()]);
  contrast = { g, lvl, val, it: 0 };
}
function stepContrast(n = 4) {
  // 有反差的边：把自己往"远离邻居"的方向推（权重 1）；没反差的边：往邻居拉（权重 4）。
  // 实测（Node，300 次迭代）：80 条该有反差的边全部画出，误画 2 条。
  const { g, lvl } = contrast;
  for (let k = 0; k < n; k++) {
    const val = contrast.val, nv = val.map((v) => v.slice());
    for (const c of g.cells) {
      const v = val[c.id], acc = [0, 0, 0];
      let wsum = 0;
      for (const id of c.edgeNeighbors) {
        if (id < 0) continue;
        const o = val[id];
        if (lvl[id] !== lvl[c.id]) { for (let a = 0; a < 3; a++) acc[a] += v[a] + Math.sign(v[a] - o[a] + 1e-6) * 0.5; wsum += 1; }
        else { for (let a = 0; a < 3; a++) acc[a] += o[a] * 4; wsum += 4; }
      }
      if (wsum) for (let a = 0; a < 3; a++) nv[c.id][a] = Math.min(1, Math.max(0, v[a] * 0.3 + (acc[a] / wsum) * 0.7));
    }
    contrast.val = nv; contrast.it++;
  }
}

/* ------------------------------------------------------------ 4 地面笔触 */
// 1480635131614355459 大块颜料斑（藏住多边形）；1703750394164199473 旋涡状团块、有点潮湿；
// 1704246032626762189 疏密变化 + 帮助阅读的高度分段线；1696864977171189980 大色块不渗过重要的边；1714613599035863191 抽象田地
const FS_SQUIG = `
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float box(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float circ(vec2 p, float r) { return length(p) - r; }
// 1104771432440049664 原文：单张距离场贴图、镜像UV，边框/中心独立cutoff。
// 下方保留的是程序SDF+噪声近似；时间扭曲不是该视频已证实的原作机制。
void main() {
  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / (uRes.y * 0.42 * uZoom);
  float t = floor(uTime * 6.0) / 6.0;                     // 逐格（6fps）换一次噪声 → 定格动画的"抖"
  float amp = uMode < 0.5 ? 0.0 : 0.018;
  vec2 w = vec2(n(uv * 9.0 + t * 3.1), n(uv * 9.0 + 17.0 - t * 2.7)) - 0.5;
  vec2 p = uv + w * amp * 2.0;
  float d;
  if (uMode > 2.5) {
    // 1105131621391495176 "now with animation" + 1024679338292256769 UI flair：镜像 UV（abs）上的一组形状 = 对称纹饰；
    // 动画就是改阈值：一个从中心往外长的半径把场"切开"，纹饰长出来、停一会儿、再缩回去。
    vec2 q = abs(p);
    float orn = box(q - vec2(0.0, 0.0), vec2(0.36, 0.09), 0.04);                                    // 中间的名牌
    orn = min(orn, abs(circ(q - vec2(0.5, 0.0), 0.11)) - 0.025);                                   // 两侧圆环
    orn = min(orn, abs(circ(q - vec2(0.62, 0.17), 0.09)) - 0.022);                                  // 卷须
    orn = min(orn, circ(q - vec2(0.78, 0.0), 0.04));
    orn = min(orn, box(q - vec2(0.0, 0.22), vec2(0.07, 0.11), 0.06));                                // 上下的冠
    orn = min(orn, abs(circ(q - vec2(0.2, 0.25), 0.07)) - 0.02);
    orn = min(orn, circ(q - vec2(0.3, 0.36), 0.03));
    float cyc = fract(uTime / 4.0);
    float R = smoothstep(0.0, 0.35, cyc) * (1.0 - smoothstep(0.75, 1.0, cyc)) * 1.1;              // 长出 → 停 → 缩回
    d = max(orn, length(p * vec2(0.8, 1.6)) - R);                                                   // 阈值动画
  } else {
    d = box(p - vec2(-0.55, 0.0), vec2(0.42, 0.26), 0.08);
    d = min(d, circ(p - vec2(0.55, 0.12), 0.22));
    d = min(d, box(p - vec2(0.55, -0.32), vec2(0.30, 0.07), 0.07));
  }
  float aa = fwidth(d);
  vec3 bg = vec3(0.23, 0.25, 0.27);
  vec3 col = bg;
  if (uMode > 1.5) { float glow = exp(-max(d, 0.0) * 18.0) * 0.5; col += vec3(0.95, 0.80, 0.45) * glow; }
  col = mix(col, vec3(0.97, 0.94, 0.86), 1.0 - smoothstep(-aa, aa, d));          // 填充
  col = mix(col, vec3(0.16, 0.14, 0.12), 1.0 - smoothstep(0.012 - aa, 0.012 + aa, abs(d + 0.006)));   // 描边
  if (uMode > 1.5) { float inner = abs(d + 0.05); col = mix(col, vec3(0.80, 0.55, 0.30), 1.0 - smoothstep(0.004 - aa, 0.004 + aa, inner)); }
  o = vec4(col, 1.0);
}`;
const FS_BLOTCH = `
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * n(p); p = p * 2.03 + 7.1; a *= 0.5; } return s; }
void main() {
  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / (uRes.y * 0.35 * uZoom);
  // 地形高度（同一个场）：用来分台阶（"重要的边"）和画等高线
  float height = fbm(uv * 0.8 + 3.0);
  float level = floor(height * 6.0);
  // 旋涡：域扭曲
  vec2 q = vec2(fbm(uv * 1.4 + level * 1.7), fbm(uv * 1.4 + 5.2 - level));
  float b = fbm(uv * 2.2 + q * 2.5 + level * 3.1);   // + level：每一级台阶自己一套色块 → 不跨台阶边渗色
  vec3 grassA = vec3(0.56, 0.68, 0.36), grassB = vec3(0.44, 0.58, 0.31), grassC = vec3(0.70, 0.74, 0.44);
  vec3 c;
  if (uMode < 0.5) {
    // 大色块：量化成 3 档（一笔是一笔）
    c = b < 0.42 ? grassB : b < 0.58 ? grassA : grassC;
  } else if (uMode < 1.5) {
    // 疏密变化的细笔触：密度场决定点的多少
    float dens = smoothstep(0.3, 0.7, fbm(uv * 0.9 + 9.0));
    float dots = step(1.0 - dens * 0.55, h(floor(uv * 90.0 + q * 6.0)));
    c = mix(grassA, grassB * 0.85, dots);
  } else {
    // 抽象田地：每块地一个条纹方向
    float cell = h(vec2(level, floor(b * 5.0)));
    float ang = cell * 3.14;
    float stripe = step(0.5, fract(dot(uv, vec2(cos(ang), sin(ang))) * 22.0));
    c = mix(grassA, grassC, stripe * 0.6 + cell * 0.3);
  }
  // 高度分段线（等高线）：在台阶边上，用 fwidth 保持 1 像素
  float e = fract(height * 6.0); float w = fwidth(height * 6.0);
  float contour = 1.0 - smoothstep(0.0, w * 1.2, min(e, 1.0 - e));
  c = mix(c, c * 0.55, contour);
  o = vec4(c, 1.0);
}`;

/* ------------------------------------------------------------ 5 径向排序 */
// 1478114309263839244 "I quite like how the radial (instead of directional) size-sorting looks … that big coherent chunk in the middle"
function drawRadial() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#e9e4d6'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2 + (W > 800 ? 190 : 0), cy = H / 2, R = Math.min(W, H) * 0.42;
  const blobs = [];
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 260; i++) blobs.push({ r: 4 + Math.pow(rnd(), 3) * 46, hue: 90 + rnd() * 40 });
  blobs.sort((a, b) => b.r - a.r);   // 大的先放
  const placed = [];
  for (const b of blobs) {
    // 从中心往外螺旋找第一个不重叠的位置：大的自然挤在中间
    for (let t = 0; t < 4000; t += 1) {
      const a = t * 0.31, d = t * 0.12;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
      if (Math.hypot(x - cx, y - cy) + b.r > R) break;
      if (placed.every((p) => Math.hypot(p.x - x, p.y - y) > p.r + b.r + 2)) { placed.push({ ...b, x, y }); break; }
    }
  }
  for (const p of placed) {
    ctx.fillStyle = `hsl(${p.hue}, 32%, ${44 + (p.r % 7) * 2}%)`;
    ctx.beginPath();
    for (let k = 0; k <= 18; k++) { const a = (k / 18) * Math.PI * 2, rr = p.r * (0.86 + 0.14 * Math.sin(a * 3 + p.r)); k ? ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr) : ctx.moveTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); }
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  return placed.length;
}

/* ------------------------------------------------------------ 6 调色板（颜色体积） */
// 1710031224838771027 "author color volumes … properly define the whole color possibility space for each feature"
// 1712088611934371876 "Another take on a palette authoring tool"：画面里是一个四角取色的渐变方块，下面一个往白色收的三角
const pal = { corners: [[0.29, 0.62, 0.66], [0.85, 0.66, 0.36], [0.30, 0.55, 0.62], [0.70, 0.40, 0.52]], tip: [0.97, 0.96, 0.92] };
function drawPalette() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#2a3238'; ctx.fillRect(0, 0, W, H);
  const x0 = W > 800 ? 470 : 30, y0 = 60, S = Math.min(W - x0 - 40, H - 260, 420);
  const img = ctx.createImageData(S, S), tri = Math.round(S * 0.45);
  const bil = (u, v) => [0, 1, 2].map((k) => (pal.corners[0][k] * (1 - u) + pal.corners[1][k] * u) * (1 - v) + (pal.corners[2][k] * (1 - u) + pal.corners[3][k] * u) * v);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const c = bil(x / (S - 1), y / (S - 1)), k = (y * S + x) * 4; img.data.set([c[0] * 255, c[1] * 255, c[2] * 255, 255], k); }
  ctx.putImageData(img, x0 * DPR / DPR, y0);
  // 三角：底边 = 方块最下一行，往下收到白色尖
  for (let y = 0; y < tri; y++) { const t = y / tri, half = (1 - t) * S / 2; for (let x = -half; x < half; x += 2) { const u = (x + S / 2) / S, c = bil(u, 1).map((v, k) => v * (1 - t) + pal.tip[k] * t); ctx.fillStyle = `rgb(${c.map((v) => v * 255 | 0)})`; ctx.fillRect(x0 + S / 2 + x, y0 + S + y, 2.5, 1.5); } }
  // 角点把手
  [[0, 0], [S, 0], [0, S], [S, S]].forEach(([x, y], i) => { ctx.fillStyle = `rgb(${pal.corners[i].map((v) => v * 255 | 0)})`; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.fillRect(x0 + x - 9, y0 + y - 9, 18, 18); ctx.strokeRect(x0 + x - 9, y0 + y - 9, 18, 18); });
  // 采样出的一套 15 色（墙色调色板用的就是 15 个色槽）
  const sw = []; for (let i = 0; i < 15; i++) { const u = (i % 5) / 4, v = Math.floor(i / 5) / 2; sw.push(bil(u, v * 0.85)); }
  sw.forEach((c, i) => { ctx.fillStyle = `rgb(${c.map((v) => v * 255 | 0)})`; ctx.fillRect(x0 + i * (S / 15), y0 + S + tri + 18, S / 15 - 3, 26); });
  pal.rect = { x0, y0, S };
}
cv.addEventListener('pointerdown', (e) => {
  if (tab !== 'palette' || !pal.rect) return;
  const { x0, y0, S } = pal.rect;
  const i = [[0, 0], [S, 0], [0, S], [S, S]].findIndex(([x, y]) => Math.hypot(e.clientX - x0 - x, e.clientY - y0 - y) < 14);
  if (i >= 0) { pal.corners[i] = [Math.random(), Math.random(), Math.random()].map((v) => 0.25 + v * 0.65); drawPalette(); }
});

/* ------------------------------------------------------------ 7 UI 装饰 */
// 1061221291137605633 "A single texture can be oriented 8 different ways and mirrors around the center to work in any size"
// 1061229717582475264 "you can break up that repetition by using a few different ones with different settings (all still using the same texture)"
// 1061227418961219585 "if you stretch it too far, you will start to notice the repetition"
function decoTile(seed) {
  const c = document.createElement('canvas'); c.width = c.height = 48;
  const g = c.getContext('2d'); g.strokeStyle = '#e8e3d4'; g.lineWidth = 2;
  let s = seed; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let k = 0; k < 7; k++) { g.beginPath(); const x = r() * 48, y = r() * 48; g.moveTo(x, y); g.lineTo(x + (r() > 0.5 ? 14 : 0), y + (r() > 0.5 ? 14 : 0)); g.stroke(); g.strokeRect((r() * 40) | 0, (r() * 40) | 0, 6, 6); }
  g.strokeRect(1, 1, 46, 46);
  return c;
}
function drawDeco() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#3a4045'; ctx.fillRect(0, 0, W, H);
  const tile = decoTile(mode === 0 ? 3 : 3);
  const x0 = W > 800 ? 440 : 20, y0 = 40, cols = Math.floor((W - x0 - 20) / 48), rows = Math.floor((H - 60) / 48);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    // 以中心为对称：左右上下镜像 + 8 种朝向（旋转 0/90/180/270 × 镜像）
    const mx = i < cols / 2 ? 1 : -1, my = j < rows / 2 ? 1 : -1;
    const rot = mode >= 1 ? ((i * 7 + j * 13) % 4) : 0;
    const variant = mode >= 2 ? (i * 3 + j * 5) % 3 : 0;   // 几种不同设置打破重复（同一张贴图）
    ctx.save();
    ctx.translate(x0 + i * 48 + 24, y0 + j * 48 + 24);
    ctx.scale(mx, my); ctx.rotate((rot * Math.PI) / 2);
    if (variant === 1) ctx.scale(-1, 1);
    if (variant === 2) ctx.globalAlpha = 0.55;
    ctx.drawImage(tile, -24, -24);
    ctx.restore();
  }
}

/* ------------------------------------------------------------ 调度 */
const NOTES = {
  fwidth: '978211952504852480 "use fwidth, ddx and ddy to create crisp, pixel perfect, zoom independent, antialiased lines"。左边：固定宽度的 step（远处断、近处粗、锯齿）；右边：宽度 = fwidth(uv)，永远 1 像素、抗锯齿。滚轮缩放。',
  pixel: '1241096929490149376 "I make the UVs speed past every 2nd pixel before sampling … one 128² texture and crisp antialiased lines"。贴图里每隔一个像素是"线像素"。左边是直接最近邻采样，放大后线跟着变粗；右边先重映射 UV，放大时线的积分宽度约1屏幕像素，线性采样抗锯齿；缩小时仍需mipmap。',
  contrast: '1482346496460828674是后来的专用反差迭代，本页保留该旧近似。1482011744843223042更早：由程序化法线map反差生成细线，不能用三角值迭代代替；共享法线场局部近似见normal-contrast.html。',
  blotch: '1480635131614355459 大块颜料斑；1703750394164199473 旋涡团块；1704246032626762189 疏密 + 高度分段线；1696864977171189980 色块不跨重要的边（每级台阶一套色块）；1714613599035863191 抽象田地。主场景面板里勾「地面笔触」可套到地形顶面上。',
  radial: '1478114309263839244 "the radial (instead of directional) size-sorting … that big coherent chunk in the middle"：原片是UV不规则图块/三角网和棋盘格模型对照；本页圆块螺旋只表示大小布局意图，不能代表原UV分片/参数化/无重叠打包。',
  palette: '1710031224838771027 给每种地物定义完整的颜色空间；1712088611934371876 调色板编辑器：四角取色的渐变方块 + 往白色收的三角。点四个角换颜色，下面是从方块里采样的 15 色（墙色的 15 个色槽）。',
  squiggly: '1104771432440049664 原文为单张距离场贴图+镜像UV，边框/中心可独立调cutoff；本页保留程序SDF/噪声近似，单贴图复用和独立控制尚待接入。第 4 个：1105131621391495176 带动画——镜像 UV 上的对称纹饰，用一个从中心长出的半径做阈值动画（1024679338292256769 UI flair 的展开）。',
  deco: '1061221291137605633 一张贴图 8 种朝向 + 以中心镜像，任意尺寸都能用；1061227418961219585 拉太长会看出重复；1061229717582475264 用同一张贴图的几种不同设置打破重复。',
};
const SUBS = { pixel: ['放大看'], blotch: ['大色块', '疏密 + 等高线', '抽象田地'], deco: ['只镜像', '+ 8 向', '+ 几种设置'], contrast: ['迭代'], squiggly: ['静止', '扭动', '+ 内线 + 发光', '镜像纹饰 + 展开动画'] };
function setTab(t) {
  tab = t; mode = 0;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  const s = document.getElementById('sub'); s.innerHTML = '';
  (SUBS[t] || []).forEach((l, i) => { const b = document.createElement('button'); b.textContent = l; b.classList.toggle('on', i === 0); b.onclick = () => { mode = i; s.querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === i)); if (t === 'contrast') { stepContrast(20); } }; s.appendChild(b); });
  document.getElementById('note').textContent = NOTES[t];
  const glOn = ['fwidth', 'pixel', 'blotch', 'squiggly'].includes(t);
  gl.canvas.style.display = glOn ? 'block' : 'none'; cv.style.display = glOn ? 'none' : 'block';
  document.getElementById('tagL').textContent = t === 'fwidth' ? '固定宽度 step' : t === 'pixel' ? '最近邻（线变粗）' : '';
  document.getElementById('tagR').textContent = t === 'fwidth' ? 'fwidth 抗锯齿' : t === 'pixel' ? '连续重映射 + 线性采样（放大验收）' : '';
  document.getElementById('tagL').style.display = document.getElementById('tagR').style.display = (t === 'fwidth' || t === 'pixel') ? 'block' : 'none';
  if (t === 'contrast' && !contrast) initContrast();
  if (t === 'radial') document.getElementById('stat').textContent = `放下 ${drawRadial()} 个笔触`;
  else if (t === 'palette') drawPalette();
  else if (t === 'deco') drawDeco();
  else document.getElementById('stat').textContent = '';
}
document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => setTab(b.dataset.t)));
function frame() {
  if (tab === 'fwidth') draw('fwidth', FS_FWIDTH);
  else if (tab === 'pixel') { if (!pixTex) pixTex = makePixTex(); draw('pixel', FS_PIXEL, () => { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pixTex); }); }
  else if (tab === 'blotch') draw('blotch', FS_BLOTCH);
  else if (tab === 'squiggly') draw('squiggly', FS_SQUIG);
  else if (tab === 'deco') drawDeco();
  else if (tab === 'contrast') {
    if (contrast.it < 300) stepContrast(3);
    const { g, val, lvl } = contrast;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#20262a'; ctx.fillRect(0, 0, W, H);
    const xs = g.verts.map((v) => v.x), zs = g.verts.map((v) => v.z);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
    const s = Math.min((W - (W > 800 ? 440 : 40)) / (maxX - minX), (H - 40) / (maxZ - minZ));
    const ox = (W > 800 ? 420 : 20) - minX * s, oz = 20 - minZ * s;
    for (const c of g.cells) {
      const v = val[c.id];
      ctx.fillStyle = `rgb(${(80 + v[0] * 150) | 0},${(110 + v[1] * 120) | 0},${(90 + v[2] * 120) | 0})`;
      ctx.beginPath(); c.pts.forEach((p, i) => (i ? ctx.lineTo(ox + p.x * s, oz + p.z * s) : ctx.moveTo(ox + p.x * s, oz + p.z * s))); ctx.closePath(); ctx.fill();
    }
    // 线：两侧值差大的边（一像素）
    ctx.strokeStyle = '#1b1f22'; ctx.lineWidth = 1; ctx.beginPath(); let n = 0;
    for (const c of g.cells) for (let i = 0; i < c.n; i++) {
      const id = c.edgeNeighbors[i]; if (id < c.id) continue;
      const a = val[c.id], b = val[id], d = Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
      if (d > 0.5) { const p = c.pts[i], q = c.pts[(i + 1) % c.n]; ctx.moveTo(ox + p.x * s, oz + p.z * s); ctx.lineTo(ox + q.x * s, oz + q.z * s); n++; }
    }
    ctx.stroke();
    let want = 0; for (const c of g.cells) for (const id of c.edgeNeighbors) if (id > c.id && lvl[id] !== lvl[c.id]) want++;
    document.getElementById('stat').textContent = `迭代 ${contrast.it} 次 · 画出 ${n} 条线（"该有反差"的边 ${want} 条）`;
  }
  requestAnimationFrame(frame);
}
setTab(new URLSearchParams(location.search).get('t') || 'fwidth');
frame();
window.texLab = { setTab, get contrast() { return contrast; } };
</script>
