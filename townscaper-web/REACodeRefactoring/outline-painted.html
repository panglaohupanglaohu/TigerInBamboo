<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>笔触法线 → 屏幕细线 · 重构验证</title><style>body{margin:0;background:#edf2ef;color:#213c42;font:14px system-ui}header{padding:12px}p{margin:6px 0}iframe{width:100%;height:78vh;border:0}label{margin-right:15px}a{color:#287f75}</style><header><b>程序笔触法线接入描边 pass</b><p>1482011744843223042 的法线反差细线，接入 1481661852887265288 已重构的笔触法线生成器。只对共享 World 主网格写入法线缓冲，不改体素、顶点或原材质。保留现有几何法线模式；投影接缝/远景混叠与原片精确美术仍有差距。</p><p><a href="index.html">首页</a> · <a href="src/world/outline-pass.js">重构描边代码</a> · <a href="src/core/paint-normal.js">笔触法线代码</a> · <a href="mip-ground.html">自定义 mip 重构</a></p><label>网格<select id="grid"><option value="quad">四边形</option><option value="mixed">混合</option></select></label><label><input id="paint" type="checkbox" checked>使用笔触法线线源</label><label><input id="depth" type="checkbox">叠加深度边</label><label>线宽<input id="width" type="range" min=".5" max="3" step=".5" value="1"></label><output id="status">加载中</output></header><iframe id="scene" title="共享World笔触法线描边"></iframe><script type="module">
const $=id=>document.getElementById(id);let api;
function sync(){if(!api)return;api.view.postExtras.set('outline',true);api.view.postExtras.set('outlinepaint',$('paint').checked);const pass=api.view.postExtras.outlinePass;pass.uniforms.uDepthMix.value=$('depth').checked?1:0;pass.setThickness(+$('width').value);$('status').textContent=$('paint').checked?'共享笔触法线 → 法线缓冲 → 屏幕细线':'几何法线 → 原描边模式';}
function load(){api=null;window.outlineReview=null;$('scene').src='index.html?scene=terrain&grid='+$('grid').value;}
$('scene').onload=()=>{const poll=()=>{api=$('scene').contentWindow.rea;if(!api?.view?.postExtras){setTimeout(poll,100);return;}sync();window.outlineReview={api,sync};};poll();};$('grid').onchange=load;for(const id of ['paint','depth','width'])$(id).onchange=sync;load();
</script></html>
