<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 地表纹理阴影</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:14px}label{margin-right:16px}iframe{width:100%;height:calc(100vh - 160px);border:0}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>地表阴影：投射资格 / 深度偏置对照</b><p>实际World顶面高度场的局部近似。投射资格按局部凸起判断，深度偏置单独用于射线比较；屋檐、纹理浮凸、洞内和形变精确贴附尚未覆盖。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>投射门槛 <input id="cast" type="range" min="0" max="1" step=".02" value=".15"></label><label>深度偏置 <input id="bias" type="range" min="0" max="1" step=".02" value=".02"></label><label>强度 <input id="strength" type="range" min="0" max=".8" step=".05" value=".3"></label><span id="status">加载…</span></header><iframe id="scene" title="实际地表阴影"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;function apply(){if(!api)return;const shadow=api.view.groundSurfaceShadow;shadow.set({strength:+$('#strength').value,castHeight:+$('#cast').value,zBias:+$('#bias').value});shadow.refresh();$('#status').textContent=`World ${api.world.version} · ${shadow.stats?.hits||0} 阴影像素，${shadow.stats?.eligible||0} 投射候选`;}function load(){api=null;window.surfaceShadowReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.surfaceShadowReview={api,apply};apply()};ready()};$('#grid').onchange=load;for(const id of ['cast','bias','strength'])$('#'+id).oninput=apply;load();
</script></html>
