<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 地表纹理阴影</title><style>body{margin:0;background:#eef4f3;color:#20343c;font:14px system-ui}header{padding:14px}label{margin-right:16px}iframe{width:100%;height:calc(100vh - 190px);border:0}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>地表阴影：投射资格 / 深度偏置 / 落点对照</b><p>实际World顶面高度场的局部近似。投射资格按局部凸起判断（1704218784028905984 那版"太3D"=门槛 0），深度偏置只参与射线比较；瓦檐由 roofRise 抬高投射体、洞内/悬挑地面由第二张体素射线图接收（接收面选"顶面＋洞内"）。仍未覆盖：纹理浮凸（World 柱顶不含细节法线）与 UV 接缝（本仓只有测量，不伪造）。</p><label>网格 <select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>投射门槛 <input id="cast" type="range" min="0" max="1" step=".02" value=".15"></label><label>深度偏置 <input id="bias" type="range" min="0" max="1" step=".02" value=".02"></label><label>瓦檐抬升 <input id="roof" type="range" min="0" max="1" step=".05" value=".35"></label><label>接收面 <select id="recv"><option value="top">顶面</option><option value="all">顶面＋洞内</option></select></label><label>强度 <input id="strength" type="range" min="0" max=".8" step=".05" value=".3"></label><span id="status">加载…</span><div id="land" style="margin-top:6px;color:#38555f"></div></header><iframe id="scene" title="实际地表阴影"></iframe><script type="module">
const $=s=>document.querySelector(s);let api;
function apply(){if(!api)return;const shadow=api.view.groundSurfaceShadow;
  shadow.set({strength:+$('#strength').value,castHeight:+$('#cast').value,zBias:+$('#bias').value,roofRise:+$('#roof').value,receivers:$('#recv').value});shadow.refresh();
  const st=shadow.stats||{};
  $('#status').textContent=`World ${api.world.version} · ${st.res||0}² · ${st.hits||0} 阴影像素 / ${st.eligible||0} 投射候选 · 覆盖 ${(st.coveragePct||0).toFixed(2)}%`;
  $('#land').textContent=`落点：崖缘 ${(100*(st.edgeShare||0)).toFixed(1)}% · 檐下 ${(100*(st.roofShare||0)).toFixed(1)}% · 别处 ${st.elsewhere||0} 像素 · 洞内地面 ${st.holeShadowed||0} 像素`;
  window.surfaceShadowReview.landing={edgeShare:st.edgeShare||0,roofShare:st.roofShare||0,elsewhere:st.elsewhere||0,holeShadowed:st.holeShadowed??null,coveragePct:st.coveragePct||0,hits:st.hits||0,receivers:st.receivers};}
function load(){api=null;window.surfaceShadowReview=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}
$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh.geometry.attributes.aField?.count){setTimeout(ready,100);return}api=r;window.surfaceShadowReview={api,apply};apply()};ready()};
$('#grid').onchange=load;for(const id of ['cast','bias','roof','strength'])$('#'+id).oninput=apply;$('#recv').onchange=apply;load();
</script></html>
