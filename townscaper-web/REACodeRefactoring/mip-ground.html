<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>自定义 mip · 重构验证</title><style>body{margin:20px;background:#1d282e;color:#dce6e3;font:15px system-ui}a{color:#9bd8c2}#views{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:15px}canvas{width:100%;image-rendering:pixelated}section{background:#28373c;padding:12px}select,button{font:inherit;margin:8px}p{max-width:1000px}</style><h1>自定义 mipmap · 原版代码重构</h1><p>777596437534240768：同一源纹理、同一透视映射，对比过滤生成与采样。复用共享 mip-chain；采用真实二维导数、IEC sRGB 和重复寻址，不声称是原作者精确内核。</p><p><a href="textures.html">贴图实验室</a> · <a href="../REACode/src/mipfilter.js">原版源码</a> · <a href="src/light/mip-ground.js">重构源码</a></p><label>过滤<select id="filter"><option>box</option><option selected>linear</option><option>kaiser</option><option>sharp</option></select></label><label>缩放<input id="zoom" type="range" min=".5" max="2" step=".1" value="1"></label><button id="measure">测量四分之一texel偏移</button><p id="metrics"></p><div id="views"></div><script type="module">
import {compareFilters,shimmerReport,paint} from './src/light/mip-ground.js';
const filter=document.getElementById('filter'),zoom=document.getElementById('zoom'),views=document.getElementById('views'),measure=document.getElementById('measure'),metrics=document.getElementById('metrics');
const draw=()=>{const result=compareFilters({filters:[filter.value],zoom:+zoom.value});views.replaceChildren();for(const r of result.rows){const section=document.createElement('section'),h=document.createElement('h2'),canvas=document.createElement('canvas'),p=document.createElement('p');h.textContent=r.mode;canvas.width=r.image.w;canvas.height=r.image.h;paint(canvas.getContext('2d'),r.image);p.textContent=`${r.levels}级 · LOD ${r.image.lodRange.map(v=>v.toFixed(2)).join('–')} · 远景能量 ${r.farEnergy.toFixed(2)}`;section.append(h,canvas,p);views.append(section);}window.mipResult=result;};
filter.onchange=draw;zoom.onchange=draw;measure.onclick=()=>{const r=shimmerReport({filters:[filter.value],zoom:+zoom.value});metrics.textContent=r.rows.map(x=>`${x.mode}: ${x.meanAbsDelta.toFixed(3)}`).join(' · ');window.shimmer=r;};draw();
</script></html>
