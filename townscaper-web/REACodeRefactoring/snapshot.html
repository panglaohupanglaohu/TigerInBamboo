<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>真实World快照 · REACode重构版</title><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.5 system-ui}header{padding:12px 20px}button,input{font:inherit;margin:4px}iframe{width:100%;height:54vh;border:0}.previews{display:flex;gap:20px;padding:12px 20px;flex-wrap:wrap}canvas{width:320px;height:320px;background:#739ca5}a{color:#276e86}figure{margin:0}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><header><b>共享World真实几何 → 64²截图 → 双线性 / 导数阈值</b> · <a href="pipeline.html">管线</a> · <a href="campaign.html">战役</a><p>截图使用当前场景真实WorldMesh几何和烘焙顶点色，不再用随机圆块替代。此处是能力验收；现有战役图标尚未全部切换。阈值只能收紧轮廓，不能恢复贴图丢失的细节，也未复现原作通道编码/内轮廓。</p><label><input id="mixed" type="checkbox" checked>混合网格</label><button id="capture" disabled>重新截图</button><label>放大尺寸 <input id="scale" type="range" min="64" max="512" value="320" step="16"></label><div id="stats">加载真实场景…</div></header><iframe id="scene" title="真实共享World北境场景"></iframe><div class="previews"><figure><figcaption>双线性</figcaption><canvas id="linear"></canvas></figure><figure><figcaption>fwidth阈值抗锯齿</figcaption><canvas id="crisp"></canvas></figure></div><script type="module">
import * as THREE from 'three';import{createIslandSnapshot,snapshotMaterial,snapshotTexture}from'./src/world/island-snapshot.js';
const frame=document.querySelector('#scene');let capture,texture,ready=false;
const previews=['linear','crisp'].map((id,i)=>{const renderer=new THREE.WebGLRenderer({canvas:document.getElementById(id),alpha:true}),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;const material=snapshotMaterial(null,{crisp:i===1}),geometry=new THREE.PlaneGeometry(2,2);scene.add(new THREE.Mesh(geometry,material));return{renderer,scene,camera,material,geometry}});
function draw(){const size=+document.querySelector('#scale').value;for(const p of previews){p.renderer.setSize(size,size,false);p.renderer.domElement.style.width=size+'px';p.renderer.domElement.style.height=size+'px';p.material.uniforms.map.value=texture;p.renderer.render(p.scene,p.camera)}}
function shoot(){if(!ready)return;const{world,view}=frame.contentWindow.rea,version=world.version,geometry=view.worldMesh.geometry;geometry.computeBoundingBox();const box=geometry.boundingBox,center=box.getCenter(new THREE.Vector3()),half=Math.max(box.max.x-box.min.x,box.max.z-box.min.z)*.56;const scene=new THREE.Scene(),material=new THREE.MeshBasicMaterial({vertexColors:true}),mesh=new THREE.Mesh(geometry,material);scene.add(mesh);
try{const result=capture.capture(scene,{center,half,height:40});texture?.dispose();texture=snapshotTexture(result);let occupied=0;for(let i=3;i<result.pixels.length;i+=4)if(result.pixels[i])occupied++;draw();window.snapshotReview={ready:true,size:result.size,occupied,versionBefore:version,versionAfter:world.version,vertices:geometry.attributes.position.count,capture,previews,texture};document.querySelector('#stats').textContent=`64×64 · 有内容像素 ${occupied}/4096 · 真实顶点 ${geometry.attributes.position.count} · World版本 ${version}→${world.version}`;}finally{material.dispose()}}
function load(){ready=false;window.snapshotReview={ready:false};capture?.dispose();capture=null;document.querySelector('#capture').disabled=true;frame.src='index.html?scene=badnorth&grid='+(document.querySelector('#mixed').checked?'mixed':'quad')}
frame.onload=()=>{if(!frame.contentWindow.rea)return;capture=createIslandSnapshot(frame.contentWindow.rea.view.renderer);ready=true;document.querySelector('#capture').disabled=false;shoot()};document.querySelector('#mixed').onchange=load;document.querySelector('#capture').onclick=shoot;document.querySelector('#scale').oninput=()=>{if(texture)draw()};window.addEventListener('pagehide',()=>{capture?.dispose();texture?.dispose();for(const p of previews){p.material.dispose();p.geometry.dispose();p.renderer.dispose()}});load();
</script></html>
