<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>球面叶片 · REACode重构版</title><link rel="icon" href="data:,"><style>body{margin:0;background:#edf4f0;color:#20343c;font:14px/1.6 system-ui}header{padding:12px 22px}iframe{width:100%;height:74vh;border:0}a{color:#26758a}label{margin-right:18px}canvas{width:128px;height:128px;image-rendering:pixelated;float:right;background:#ddd}</style><header><canvas id="atlas" width="128" height="128"></canvas><b>共享植被 · 球面叶片与视角透明度</b> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/leaf-surface-review.md">逐帧证据</a><p>1241046107125399552：植物读全城128²贴图的右下32²角落——图集纹理为全场景共享单例（灌木/树冠/所有Vegetation实例同一纹理对象），TownSkin开启时与建筑同读TownColor；1205420678859632640：球面叶纹调制视角alpha。本地程序叶纹，原作手绘素材仍缺（程序近似，非原资产）。</p><label>网格<select id="grid"><option value="mixed">三角＋四边</option><option value="quad">四边形</option></select></label><label>对照<select id="mode"><option value="atlas">球面贴图＋视角alpha</option><option value="legacy">保留旧三维噪声</option><option value="solid">完整团块</option></select></label><label>俯仰 <input id="pitch" type="range" min="0.55" max="1.35" step="0.01" value="0.95"></label><label><input id="wire" type="checkbox">线框（片中 0250 起）</label><span id="status">加载…</span></header><iframe id="scene" title="实际共享植被"></iframe><script type="module">
const $=s=>document.querySelector(s);let api,wireOn=false,savedMats=null;
// 视角 alpha 的机制只有在**换视角**时才看得见，所以页面必须能改俯仰；线框档对应片中 0249→0250
// 一帧内开启并保留到结尾的三角网调试视图。
function apply(){if(!api)return;const v=api.view.vegetation,m=$('#mode').value;v.leafyOn=m!=='solid';v.leafAtlasOn=m==='atlas';const a=v.leafSurface.atlas;$('#atlas').getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(a.data),128,128),0,0);
 const p=+$('#pitch').value;if(Math.abs((api.view.pitch||0)-p)>1e-6){api.view.pitch=p;api.view.updateCamera();}
 api.view.render(0);
 $('#status').textContent=`World ${api.world.version} · 32²植物角落 · 共享纹理单例 ${v.leafSurface.shared?'✓':'✗'} · 俯仰 ${p.toFixed(2)} · 线框 ${wireOn?'开':'关'}`;}
function setWire(on){if(!api)return;if(on&&!savedMats){savedMats=[];api.view.scene.traverse(o=>{if((o.isMesh||o.isInstancedMesh)&&o.material&&'wireframe' in o.material){savedMats.push([o.material,o.material.wireframe]);o.material.wireframe=true;o.material.needsUpdate=true;}});}else if(!on&&savedMats){for(const [mat,old] of savedMats){mat.wireframe=old;mat.needsUpdate=true;}savedMats=null;}wireOn=on;api.view.render(0);}
function load(){api=null;window.leafReview=null;savedMats=null;$('#scene').src='index.html?scene=terrain&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;
  // 逐级判空：rea 可能先到、view.vegetation 后到；旧写法在 vegetation 还没建时会抛 TypeError，
  // 一次性把重试循环打断，页面从此永远停在「加载…」（本轮实测撞到）。
  if(!r?.view?.vegetation?.leafSurface){setTimeout(ready,100);return}api=r;window.leafReview={api};apply()};ready()};$('#grid').onchange=load;$('#mode').onchange=apply;$('#pitch').oninput=apply;$('#wire').onchange=e=>setWire(e.target.checked);
window.leafReviewSet={setWire,pitch:v=>{$('#pitch').value=v;apply()}};
load();
</script></html>
