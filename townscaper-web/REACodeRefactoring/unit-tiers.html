<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 单位等级外观</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:15px system-ui}header{padding:12px}iframe{border:0;width:100%;height:calc(100vh - 155px)}button,label{margin-right:12px}</style><header><b>单位等级外观 · 实际北境战斗</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/unit-tiers-review.md">逐帧证据</a><p><label>外观<select id="tier"><option value="">原有外观</option><option value="1">一级 · 蓝灰</option><option value="2">二级 · 银白</option><option value="3">三级 · 金色</option></select></label><button id="quad">四边网格</button><button id="mixed">混合网格</button><span id="stat"></span></p><small>本地头盔/盾牌色阶提示，仅作用于守军3D实例；不修改生命、兵种、体型、导航和伤势。原片雕饰盾、旗徽、盔形及完整升级玩法仍缺。</small></header><iframe id="scene" src="index.html?scene=badnorth&grid=quad"></iframe><script type="module">
import {setUnitAppearanceTier} from './src/core/unit-tier.js';
const f=document.querySelector('#scene'),select=document.querySelector('#tier');
function sync(){const r=f.contentWindow.rea;if(!r?.battle?.running)return;const b=r.battle,t=select.value===''?null:Number(select.value);for(const u of b.units)if(u.team===0)setUnitAppearanceTier(u,t);document.querySelector('#stat').textContent=`守军 ${b.units.filter(u=>u.team===0).length} · ${t===null?'原有外观':t+'级外观'}`;window.unitTierReview={rea:r,setUnitAppearanceTier};}
select.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.unitTierReview=null;f.src='index.html?scene=badnorth&grid='+kind;};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
