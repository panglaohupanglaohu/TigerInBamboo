<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 弹道代价</title><style>body{margin:0;background:#edf4f3;color:#20343c;font:14px system-ui}header{padding:10px}iframe{border:0;width:100%;height:calc(100vh - 270px)}canvas{background:#314d70;vertical-align:middle;margin:6px}button,label{margin-right:12px}</style><header><b>弹道代价 · 真实Battle共享查表</b> <a href="index.html" target="_top">首页</a> · <a href="pipeline.html" target="_top">管线</a> · <a href="artifacts/coverage/ballistic-table-review.md">逐帧证据</a><p><label>落角惩罚<select id="weight"><option value=".6">原参数0.6</option><option value="0">0 · 优先短时间</option><option value="4">4 · 优先接近45°落角</option></select></label><button id="quad">四边网格</button><button id="mixed">混合网格</button></p><canvas id="plot" width="420" height="120"></canvas><span id="stat"></span><p>保留现有无阻力弹道：g=6、速度≤9、水平0.05–6、高差±3。只开放本地代价权重；没有复现原Inspector表达式/阻力/Validity语言。图示为同一个实际查表接口对目标(3.17,0.33)的结果。</p></header><iframe id="scene" src="index.html?scene=badnorth&grid=quad"></iframe><script>
const f=document.querySelector('#scene'),weight=document.querySelector('#weight');function sync(){const r=f.contentWindow.rea;if(!r?.battle?.running)return;const b=r.battle;b.setProjectileImpactWeight(Number(weight.value));const shot=b.projectileTable.lookup(3.17,.33),ctx=document.querySelector('#plot').getContext('2d');ctx.clearRect(0,0,420,120);ctx.strokeStyle='#89e5db';ctx.beginPath();for(let i=0;i<=60;i++){const t=shot.time*i/60,x=shot.v*Math.cos(shot.th)*t,y=shot.v*Math.sin(shot.th)*t-3*t*t;ctx[i?'lineTo':'moveTo'](12+x*115,102-y*38);}ctx.stroke();document.querySelector('#stat').textContent=`角度${(shot.th*180/Math.PI).toFixed(1)}° · 时间${shot.time.toFixed(3)}s · 速度${shot.v.toFixed(3)}`;window.ballisticReview={rea:r,shot};}
weight.onchange=sync;for(const kind of ['quad','mixed'])document.querySelector('#'+kind).onclick=()=>{window.ballisticReview=null;f.src='index.html?scene=badnorth&grid='+kind;};const timer=setInterval(sync,250);addEventListener('pagehide',()=>clearInterval(timer));
</script></html>
