<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 墙色槽编辑</title><style>body{margin:0;background:#eef4f3;font:14px system-ui;color:#20343c}header{padding:12px;line-height:2}iframe{border:0;width:100%;height:76vh}input{width:40px}input[type=url]{width:220px;font:12px monospace}label{margin-right:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#pngPreview{width:128px;height:16px;image-rendering:pixelated;border:1px solid #9fb3b8;background:#fff}.strip{display:flex;gap:1px;height:12px;margin:1px 0}.strip i{display:block;width:11px;height:12px;border:1px solid #0002}.strip.on{outline:2px solid #2a7f8f;outline-offset:1px}#pngRows{display:flex;flex-direction:column;gap:2px}code{font:12px monospace;color:#41626b}</style><header><a href="pipeline.html" target="_top">← 管线</a> · <b>实际小镇墙色槽</b><p>本页临时编辑独立色槽并应用到共享World；预设保留。已有：① 初始配色→所选预设的 HSL 过渡；② <b>Palette.png 热更新</b>（外部改图保存即换墙色，下行 = 色槽）；③ <b>常用配色存档</b>（localStorage，刷新自动恢复，坏存档一律拒绝）；④ 导出 16×2 PNG 给外部编辑器；⑤ <b>多行贴图</b>：Palette.png 的两行都能当墙色槽（片中上行 = 参考色、下行 = 被涂改的墙色），行号会透传成 <code>&amp;paletteRow=</code>，两行色块在本页直接画出来对照。</p><div class="row"><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>初始→预设<select id="preset"><option value="pastel">粉彩</option><option value="dusk">暮色</option><option value="town">小镇</option></select></label><label>过渡<input id="blend" type="range" min="0" max="1" step=".01" value="0" style="width:140px"></label><span id="slots"></span><button id="restore">恢复本页原配色</button></div><div class="row"><label><input type="checkbox" id="pngOn" style="width:auto">PNG 热更新</label><input id="pngUrl" type="url" value="palettes/Palette.png"><label>墙色取<select id="pngRow"><option value="0">上行（参考）</option><option value="1" selected>下行（墙色）</option></select></label><span id="pngRows" title="Palette.png 的两行色块（上图 = 行 1，下图 = 行 2）"></span><span id="pngInfo">热更新：关</span><button id="exportPng">导出 PNG</button><img id="pngPreview" alt="导出预览" title="导出的 16×2 墙色图"></div>
<div class="row"><span id="pngRowInfo">行数：—</span></div><div class="row"><button id="forget">清除常用配色存档</button><span id="storeInfo">存档：无</span><span id="status"></span></div></header><iframe id="scene" title="实际墙色编辑"></iframe><script type="module">
import{PALETTES,blendWallPalettes}from'./src/core/palette.js';
import{encodePaletteRecord,decodePaletteRecord,STORE_KEY}from'./src/core/palette-store.js';
import{exportPalettePng}from'./src/world/palette-png.js';
const $=s=>document.querySelector(s),BASE=PALETTES.town;
let api,initial,stored=null,png=null,poll=null,lastRows=null;
function readStore(){try{const raw=localStorage.getItem(STORE_KEY);return{rec:decodePaletteRecord(raw,BASE),raw}}catch(e){return{rec:null,raw:null,err:String(e.message??e)}}}
function writeStore(colors){try{localStorage.setItem(STORE_KEY,JSON.stringify(encodePaletteRecord(colors,{base:BASE,grid:$('#grid').value,savedAt:Date.now()})))}catch(e){$('#storeInfo').textContent='存档失败：'+(e.message??e)}}
function slotValues(){return[...$('#slots').children].map(x=>x.value)}
function setSlots(colors){[...$('#slots').children].forEach((x,i)=>{if(colors[i])x.value=colors[i]})}
function storeInfo(){const got=readStore();if(got.err)return $('#storeInfo').textContent='存档被拒：'+got.err;if(!got.rec)return $('#storeInfo').textContent='存档：无';$('#storeInfo').textContent=`存档：${got.rec.colors.length} 槽 · ${got.rec.grid??'—'} · ${got.raw.length}B`}
function apply(){if(!api)return;const colors=slotValues();api.setWallPalette(colors);writeStore(colors);storeInfo();$('#status').textContent='World '+api.world.version+' · 墙色已应用'}
function blend(){if(!api)return;const colors=blendWallPalettes({colors:initial},PALETTES[$('#preset').value],+$('#blend').value).colors;setSlots(colors);apply()}
function rowIndex(){return Math.max(0,Math.min(1,+$('#pngRow').value||0))}
function renderRows(rows,chosen){const box=$('#pngRows');if(!rows?.length){box.replaceChildren();$('#pngRowInfo').textContent='行数：—（未读到图）';return}const pick=Math.min(chosen,rows.length-1);box.replaceChildren(...rows.map((r,y)=>{const s=document.createElement('span');s.className='strip'+(y===pick?' on':'');s.title='行 '+(y+1)+(y===pick?'（当前墙色槽）':'');s.dataset.row=String(y);s.replaceChildren(...r.slice(0,16).map(h=>{const i=document.createElement('i');i.style.background=h;i.title=h;return i}));return s}));$('#pngRowInfo').textContent=`行数：${rows.length} · 墙色取第 ${pick+1} 行 · 每行 ${rows[0].length} 格`}
function pngState(){return $('#scene').contentWindow.rea?.palettePng?.state??null}
function syncFromWorld(){const w=$('#scene').contentWindow.rea;if(!w?.world?.palette?.colors||!api)return;const live=w.world.palette.colors,cur=slotValues();if(live.some((c,i)=>c.toLowerCase()!==(cur[i]||'').toLowerCase())){setSlots(live);writeStore(live);storeInfo();$('#status').textContent='World '+w.world.version+' · PNG 换色'}const s=pngState();if(s){$('#pngInfo').textContent=`热更新：v${s.version} · ${s.polls} 次轮询 · ${s.errors?('错 '+s.errors+'（'+s.lastError+'）'):'无错'}${s.lastChanged.length?(' · 改槽 '+s.lastChanged.join(',')):''}`;lastRows=s.rows;renderRows(s.rows,rowIndex())}}
function setPng(on,url){png=on?url:null;load()}
function load(){if(poll){clearInterval(poll);poll=null}api=null;window.wallPalette=null;$('#scene').src='index.html?scene=town&grid='+$('#grid').value+(png?('&palettePng='+encodeURIComponent(png)+'&paletteRow='+rowIndex()):'')}
$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view?.worldMesh?.geometry?.attributes?.color?.count){setTimeout(ready,100);return}api=r;initial=[...r.world.palette.colors];$('#slots').replaceChildren(...initial.map((c,i)=>{const x=document.createElement('input');x.type='color';x.value=c;x.title='墙色 '+(i+1);x.oninput=apply;return x}));if(stored&&stored.length===initial.length){setSlots(stored);api.setWallPalette(stored);$('#status').textContent='World '+api.world.version+' · 已恢复存档配色'}if(png){clearInterval(poll);poll=setInterval(syncFromWorld,250);syncFromWorld()}storeInfo();window.wallPalette={api,apply,blend,get initial(){return initial},get png(){return png},slotValues,setSlots,storeRaw:()=>{try{return localStorage.getItem(STORE_KEY)}catch{return null}},decodeStored:raw=>decodePaletteRecord(raw,BASE),pngState,get pngRows(){return pngState()?.rows??null},rowIndex,setPngRow:n=>{$('#pngRow').value=String(Math.max(0,Math.min(1,+n||0)));if(png)load()},setPng,syncFromWorld,exportPng:async()=>{const blob=await exportPalettePng({colors:slotValues()}),url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});$('#pngPreview').src=url;return{url,bytes:blob.size,w:16,h:2}}};};ready()};
$('#blend').oninput=blend;$('#preset').onchange=blend;
$('#restore').onclick=()=>{if(!api)return;$('#blend').value=0;setSlots(initial);api.setWallPalette(initial);try{localStorage.removeItem(STORE_KEY)}catch{}storeInfo();$('#status').textContent='World '+api.world.version+' · 已恢复原配色并清空存档'};
$('#forget').onclick=()=>{try{localStorage.removeItem(STORE_KEY)}catch{}storeInfo();$('#status').textContent='已清除常用配色存档'};
$('#exportPng').onclick=async()=>{if(!api)return;const r=await window.wallPalette.exportPng();$('#status').textContent=`已导出 ${r.w}×${r.h} PNG · ${r.bytes}B · data URL ${r.url.length} 字符`};
$('#pngOn').onchange=()=>setPng($('#pngOn').checked,$('#pngUrl').value||'palettes/Palette.png');
$('#pngRow').onchange=()=>{renderRows(lastRows,rowIndex());if(png)load()};
$('#pngUrl').onchange=()=>{if($('#pngOn').checked)setPng(true,$('#pngUrl').value)};
$('#grid').onchange=load;
{const got=readStore();if(got.rec)stored=got.rec.colors;else if(got.err)$('#storeInfo').textContent='存档被拒：'+got.err}
storeInfo();load();
</script></html>
