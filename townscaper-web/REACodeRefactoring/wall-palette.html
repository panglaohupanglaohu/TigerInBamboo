<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>重构 · 墙色槽编辑</title><style>body{margin:0;background:#eef4f3;font:14px system-ui;color:#20343c}header{padding:12px}iframe{border:0;width:100%;height:82vh}input{width:40px}label{margin-right:10px}</style><header><a href="pipeline.html">← 管线</a> · <b>实际小镇墙色槽</b><p>本页临时编辑独立色槽并应用到共享World；预设保留，尚未写入工程存档。新增初始配色到所选预设的HSL过渡；PNG热更新及配色存档尚未实现。</p><label>网格<select id="grid"><option value="mixed">三角＋方格</option><option value="quad">四边格</option></select></label><label>初始→预设<select id="preset"><option value="pastel">粉彩</option><option value="dusk">暮色</option><option value="town">小镇</option></select></label><label>过渡<input id="blend" type="range" min="0" max="1" step=".01" value="0" style="width:140px"></label><span id="slots"></span><button id="restore">恢复本页原配色</button><span id="status"></span></header><iframe id="scene" title="实际墙色编辑"></iframe><script type="module">
import{PALETTES,blendWallPalettes}from'./src/core/palette.js';
const $=s=>document.querySelector(s);let api,initial;function apply(){api.setWallPalette([...$('#slots').children].map(x=>x.value));$('#status').textContent='World '+api.world.version+' · 墙色已应用'}function blend(){if(!api)return;const colors=blendWallPalettes({colors:initial},PALETTES[$('#preset').value],+$('#blend').value).colors;[...$('#slots').children].forEach((x,i)=>x.value=colors[i]);apply()}function load(){api=null;window.wallPalette=null;$('#scene').src='index.html?scene=town&grid='+$('#grid').value}$('#scene').onload=()=>{const ready=()=>{const r=$('#scene').contentWindow.rea;if(!r?.view.worldMesh.geometry.attributes.color?.count){setTimeout(ready,100);return}api=r;initial=[...r.world.palette.colors];$('#slots').replaceChildren(...initial.map((c,i)=>{const x=document.createElement('input');x.type='color';x.value=c;x.title='墙色 '+(i+1);x.oninput=apply;return x}));window.wallPalette={api,apply,blend};};ready()};$('#blend').oninput=blend;$('#preset').onchange=blend;$('#restore').onclick=()=>{if(!api)return;$('#blend').value=0;[...$('#slots').children].forEach((x,i)=>x.value=initial[i]);apply()};$('#grid').onchange=load;load();
</script></html>
