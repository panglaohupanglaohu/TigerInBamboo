<script type="module">

import { rockScene, capUndersideArea } from './src/terrain/rockforms-c09.js';
import { rockTopology } from './src/core/rock-topology.js';
const q = new URLSearchParams(location.search), kind = q.get('kind') === 'dolmen' ? 'dolmen' : 'ridge', grid = q.get('grid') === 'mixed' ? 'mixed' : 'quad';
const f = document.querySelector('#scene'); f.src = 'index.html?scene=terrain&grid=' + grid;
async function apply() {
  const r = f.contentWindow.rea, w = r.world, v = r.view;
  const rep = rockScene(w, { kind, s: 1, seed: +(q.get('seed') || 1) });
  w.softTops = q.get('soft') !== '0';

  const cam = q.get('cam') || 'orbit';
  v.target.set(0, kind === 'ridge' ? 1.6 : 1.4, 0);
  v.distance = +(q.get('dist') || (cam === 'low' ? 13 : 19));
  v.yaw = +(q.get('yaw') || (kind === 'ridge' ? 0.75 : -0.5));

  await new Promise((ok) => setTimeout(ok, 1500));
  const shape = v.worldMesh.shape ?? null, topo = rockTopology(w);
  const stats = { kind, grid, soft: w.softTops, parts: rep.parts, houses: rep.houses.length, voidCells: rep.voidCells,
    rock: { voxels: topo.rockVoxels, undersides: topo.undersides, cavityColumns: topo.cavityColumns, unsupported: topo.unsupported },
    capArea: shape ? (({ cells, ratio, minRatio }) => ({ cells, ratio: +ratio.toFixed(3), minRatio: +minRatio.toFixed(3) }))(capUndersideArea(w, shape)) : null,
    guardedSlices: shape?.guard?.guardedSlices ?? null };
  window.__c09rock = stats; document.querySelector('#stats').textContent = JSON.stringify(stats);
  if (q.get('spin') === '1') { const t0 = performance.now(), y0 = v.yaw; const tick = () => { v.yaw = y0 + (performance.now() - t0) / 4000; v.updateCamera(); requestAnimationFrame(tick); }; tick(); }
}
