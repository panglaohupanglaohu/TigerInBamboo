<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>{{title}} · 封面</title>
  <link rel="stylesheet" href="../../layouts/edena.css" />
</head>
<body>
  <article class="book-page cover">
    <div class="cover-hero">
      <div class="cover-frame">
        <img src="../shots/{{shotId}}.png" alt="{{title}}" />
      </div>
      <div class="cover-title-band">
        <h1>{{title}}</h1>
        <p class="subtitle">{{subtitle}}</p>
        <p class="cover-caption">{{caption}}</p>
      </div>
    </div>
    <footer class="page-footer">
      <span>画面来源：TigerMessenger 游戏截屏</span>
      <span>{{chapterId}}</span>
    </footer>
  </article>
</body>
</html>
