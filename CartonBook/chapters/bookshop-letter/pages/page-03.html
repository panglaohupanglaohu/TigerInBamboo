<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>书店镇 · 一封要送出的信 · 启程</title>
<link rel="stylesheet" href="../../layouts/edena.css" />
</head>
<body>
<article class="book-page story">
  <div class="panel-grid tpl-edena-banner-pair journey-depart">
<figure class="panel role-turn">
  <div class="panel-frame">
    <div class="strip-title-bar"><span class="strip-title">启程</span><span class="strip-byline">Edena · 3/3</span></div>
    <img src="../shots/s08.png" alt="转身中景" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s08.png'}))" />
    <div class="dialog-balloon"><span class="speaker">信使</span>日落前到岔口。</div>
  </div>
  
</figure>
<figure class="panel role-path">
  <div class="panel-frame">
    
    <img src="../shots/s09.png" alt="路径宽景" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s09.png'}))" />
    
  </div>
  <div class="caption-bar">路弯向港与塔。</div>
</figure>
<figure class="panel role-farewell">
  <div class="panel-frame">
    
    <img src="../shots/s10.png" alt="风景里的微小身影" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s10.png'}))" />
    
  </div>
  <div class="caption-bar">镇矮下去。风把纸声送远。</div>
</figure>
  </div>
  <footer class="page-footer">
    <span>竖条横幅 · 大留白 · 少字</span>
    <span>page-03</span>
  </footer>
</article>
</body>
</html>
