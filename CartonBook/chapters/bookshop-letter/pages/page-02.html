<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>书店镇 · 一封要送出的信 · 取信</title>
<link rel="stylesheet" href="../../layouts/edena.css" />
</head>
<body>
<article class="book-page story">
  <div class="panel-grid tpl-edena-close-insert">
<figure class="panel role-env">
  <div class="panel-frame">
    <div class="strip-title-bar"><span class="strip-title">取信</span><span class="strip-byline">Edena · 2/3</span></div>
    <img src="../shots/s04.png" alt="环境静场" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s04.png'}))" />
    
  </div>
  <div class="caption-bar">廊道认得每一个来取信的人。</div>
</figure>
<figure class="panel role-interact">
  <div class="panel-frame">
    
    <img src="../shots/s05.png" alt="交互中景" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s05.png'}))" />
    <div class="dialog-balloon"><span class="speaker">店主</span>边境那封。潮气重。</div>
  </div>
  
</figure>
<figure class="panel role-insert">
  <div class="panel-frame">
    
    <img src="../shots/s06.png" alt="近景插入：门/招牌" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s06.png'}))" />
    
  </div>
  <div class="caption-bar">木纹里嵌着旧铜钉。</div>
</figure>
<figure class="panel role-pull">
  <div class="panel-frame">
    
    <img src="../shots/s07.png" alt="再拉开：信在路上" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'panel-missing',textContent:'缺少截屏：s07.png'}))" />
    
  </div>
  <div class="caption-bar">信封比预想的轻。</div>
</figure>
  </div>
  <footer class="page-footer">
    <span>竖条横幅 · 大留白 · 少字</span>
    <span>page-02</span>
  </footer>
</article>
</body>
</html>
